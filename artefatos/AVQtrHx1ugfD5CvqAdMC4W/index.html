<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Serpente Neon 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Chakra+Petch:wght@400;600&display=swap">
<style>
  /* Layout: tela cheia 3D com HUD flutuante no topo e um cartão central para início, pausa e fim de jogo */
  :root {
    color-scheme: dark;
    --bg: #070b1a;
    --panel: rgba(12, 18, 42, 0.78);
    --line: rgba(62, 240, 255, 0.28);
    --fg: #e6ecff;
    --muted: #8d98c6;
    --cyan: #3ef0ff;
    --violet: #9b6bff;
    --food: #ff5c8a;
    --display: 'Orbitron', 'Segoe UI', system-ui, sans-serif;
    --ui: 'Chakra Petch', 'Segoe UI', system-ui, sans-serif;
  }
  html, body { height: 100%; }
  body {
    margin: 0; overflow: hidden; touch-action: none;
    background: var(--bg); color: var(--fg); font-family: var(--ui);
  }
  canvas { position: fixed; inset: 0; display: block; }

  #hud {
    position: fixed; z-index: 2; pointer-events: none;
    top: calc(env(safe-area-inset-top, 0px) + 16px); left: 16px; right: 16px;
    display: flex; justify-content: space-between; gap: 16px;
  }
  .stat { display: grid; gap: 2px; }
  .stat:last-child { text-align: right; }
  .stat span {
    font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--muted);
  }
  .stat b {
    font: 800 clamp(24px, 5vw, 36px)/1 var(--display);
    font-variant-numeric: tabular-nums; color: var(--cyan);
    text-shadow: 0 0 18px rgba(62, 240, 255, 0.55);
  }
  .stat:last-child b { color: var(--violet); text-shadow: 0 0 18px rgba(155, 107, 255, 0.55); }

  #overlay {
    position: fixed; inset: 0; z-index: 3; padding: 16px;
    display: grid; place-items: center;
    background: radial-gradient(ellipse at center, rgba(7, 11, 26, 0.35), rgba(7, 11, 26, 0.85));
  }
  .card {
    width: min(420px, 100%); box-sizing: border-box; padding: 28px 24px;
    display: grid; gap: 14px; justify-items: center; text-align: center;
    background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
    backdrop-filter: blur(8px);
  }
  .card h1 {
    margin: 0; font: 800 clamp(26px, 6vw, 38px)/1.1 var(--display); letter-spacing: 0.04em;
    text-wrap: balance;
    background: linear-gradient(90deg, var(--cyan), var(--violet));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .card p { margin: 0; color: var(--muted); font-size: 15px; line-height: 1.5; }
  .card p strong { color: var(--food); font-weight: 600; }
  kbd {
    font: 600 12px var(--ui); color: var(--fg); padding: 1px 6px;
    border: 1px solid var(--line); border-radius: 4px;
  }
  button {
    margin-top: 6px; padding: 12px 28px; cursor: pointer;
    font: 600 15px var(--display); letter-spacing: 0.1em; text-transform: uppercase;
    color: var(--bg); background: var(--cyan); border: 0; border-radius: 999px;
    box-shadow: 0 0 24px rgba(62, 240, 255, 0.45);
    transition: transform 0.15s, box-shadow 0.15s;
  }
  button:hover { transform: translateY(-1px); box-shadow: 0 0 34px rgba(62, 240, 255, 0.7); }
  button:focus-visible { outline: 2px solid var(--fg); outline-offset: 3px; }
  @media (prefers-reduced-motion: reduce) { button { transition: none; } }
</style>

<div id="hud">
  <div class="stat"><span>Pontos</span><b id="score">0</b></div>
  <div class="stat"><span>Recorde</span><b id="best">0</b></div>
</div>

<div id="overlay">
  <div class="card">
    <h1 id="ov-title">Serpente Neon</h1>
    <p id="ov-text">Use <kbd>↑</kbd> <kbd>↓</kbd> <kbd>←</kbd> <kbd>→</kbd> ou <kbd>WASD</kbd> para mover e <kbd>Espaço</kbd> para pausar. No celular, deslize o dedo.</p>
    <button id="ov-btn" type="button">Jogar</button>
  </div>
</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

const N = 20, HALF = N / 2;
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const $ = id => document.getElementById(id);

// ---------- Cena, luzes e pós-processamento ----------
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x070b1a);
scene.fog = new THREE.Fog(0x070b1a, 26, 55);
const camera = new THREE.PerspectiveCamera(50, 1, 0.1, 100);

scene.add(new THREE.HemisphereLight(0x8fb4ff, 0x140a26, 0.7));
const sun = new THREE.DirectionalLight(0xffffff, 1.3);
sun.position.set(6, 14, 8);
scene.add(sun);

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
composer.addPass(new UnrealBloomPass(new THREE.Vector2(1, 1), 0.9, 0.5, 0.72));
composer.addPass(new OutputPass());

// ---------- Tabuleiro ----------
const floor = new THREE.Mesh(
  new THREE.BoxGeometry(N + 0.6, 0.4, N + 0.6),
  new THREE.MeshStandardMaterial({ color: 0x0d1330, roughness: 0.85, metalness: 0.2 })
);
floor.position.y = -0.7;
scene.add(floor);
const grid = new THREE.GridHelper(N, N, 0x2a3a7a, 0x16204a);
grid.position.y = -0.49;
scene.add(grid);
const border = new THREE.LineSegments(
  new THREE.EdgesGeometry(new THREE.BoxGeometry(N, 0.02, N)),
  new THREE.LineBasicMaterial({ color: 0x3ef0ff })
);
border.position.y = -0.49;
scene.add(border);

// ---------- Cobra: um InstancedMesh, cor por segmento também no brilho ----------
const segMat = new THREE.MeshStandardMaterial({
  color: 0xffffff, emissive: 0xffffff, emissiveIntensity: 0.55, roughness: 0.3, metalness: 0.1,
});
segMat.onBeforeCompile = s => {
  s.fragmentShader = s.fragmentShader.replace(
    '#include <emissivemap_fragment>',
    '#include <emissivemap_fragment>\ntotalEmissiveRadiance *= vColor.rgb;'
  );
};
const segs = new THREE.InstancedMesh(new RoundedBoxGeometry(0.9, 0.9, 0.9, 3, 0.2), segMat, N * N);
const HEAD = new THREE.Color(0x3ef0ff), TAIL = new THREE.Color(0x9b6bff), tmpColor = new THREE.Color();
for (let i = 0; i < N * N; i++) segs.setColorAt(i, HEAD);
scene.add(segs);

const eyes = new THREE.Group();
const eyeGeo = new THREE.SphereGeometry(0.11, 12, 12);
const eyeMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
for (const x of [-0.22, 0.22]) {
  const eye = new THREE.Mesh(eyeGeo, eyeMat);
  eye.position.set(x, 0.22, 0.4);
  eyes.add(eye);
}
scene.add(eyes);

// ---------- Comida ----------
const FOOD = 0xff5c8a;
const foodMesh = new THREE.Mesh(
  new THREE.IcosahedronGeometry(0.38, 1),
  new THREE.MeshStandardMaterial({ color: FOOD, emissive: FOOD, emissiveIntensity: 2.2, flatShading: true })
);
foodMesh.add(new THREE.PointLight(FOOD, 6, 6));
scene.add(foodMesh);

// ---------- Estado do jogo ----------
let snake, prev, dir, queue, food, score, step, acc, pop = 0, shake = 0, state = 'ready';
let best = 0;
try { best = Number(localStorage.getItem('serpente-best')) || 0; } catch {}
$('best').textContent = best;

const toWorld = (c, v) => v.set(c.x - HALF + 0.5, 0, c.z - HALF + 0.5);
const same = (a, b) => a.x === b.x && a.z === b.z;

function reset() {
  snake = [{ x: 9, z: 10 }, { x: 8, z: 10 }, { x: 7, z: 10 }];
  prev = snake.map(p => ({ ...p }));
  dir = { x: 1, z: 0 };
  queue = [];
  score = 0; step = 0.14; acc = 0;
  $('score').textContent = 0;
  placeFood();
}

function placeFood() {
  do food = { x: Math.floor(Math.random() * N), z: Math.floor(Math.random() * N) };
  while (snake.some(s => same(s, food)));
}

function tick() {
  if (queue.length) dir = queue.shift();
  const head = { x: snake[0].x + dir.x, z: snake[0].z + dir.z };
  const eats = same(head, food);
  const body = eats ? snake : snake.slice(0, -1);
  if (head.x < 0 || head.z < 0 || head.x >= N || head.z >= N || body.some(s => same(s, head))) {
    return gameOver();
  }
  prev = snake.map(p => ({ ...p }));
  snake.unshift(head);
  if (eats) {
    prev.push({ ...prev[prev.length - 1] });
    $('score').textContent = ++score;
    step = Math.max(0.06, step * 0.97);
    pop = 1;
    placeFood();
  } else {
    snake.pop();
  }
}

// ---------- Telas e controles ----------
function showOverlay(title, html, label) {
  $('ov-title').textContent = title;
  $('ov-text').innerHTML = html;
  $('ov-btn').textContent = label;
  $('overlay').hidden = false;
  $('ov-btn').focus();
}

function start() {
  if (state !== 'pause') reset();
  state = 'play';
  $('overlay').hidden = true;
}

function pause() {
  state = 'pause';
  showOverlay('Pausado', 'Aperte <kbd>Espaço</kbd> ou o botão para continuar.', 'Continuar');
}

function gameOver() {
  state = 'over';
  shake = 1;
  const record = score > best;
  if (record) {
    best = score;
    $('best').textContent = best;
    try { localStorage.setItem('serpente-best', best); } catch {}
  }
  showOverlay(
    'Fim de jogo',
    `Você fez ${score} ${score === 1 ? 'ponto' : 'pontos'}.` + (record && score > 0 ? ' <strong>Novo recorde!</strong>' : ''),
    'Jogar de novo'
  );
}

function turn(x, z) {
  if (state !== 'play') return;
  const last = queue.at(-1) || dir;
  if ((last.x === -x && last.z === -z) || (last.x === x && last.z === z) || queue.length >= 3) return;
  queue.push({ x, z });
}

const KEYS = {
  ArrowUp: [0, -1], KeyW: [0, -1], ArrowDown: [0, 1], KeyS: [0, 1],
  ArrowLeft: [-1, 0], KeyA: [-1, 0], ArrowRight: [1, 0], KeyD: [1, 0],
};
addEventListener('keydown', e => {
  if (KEYS[e.code]) { e.preventDefault(); turn(...KEYS[e.code]); }
  else if (e.code === 'Space' || e.code === 'Enter') {
    e.preventDefault();
    if (state === 'play') pause(); else start();
  }
});
$('ov-btn').addEventListener('click', start);

let touch = null;
addEventListener('touchstart', e => { touch = e.touches[0]; }, { passive: true });
addEventListener('touchend', e => {
  if (!touch) return;
  const dx = e.changedTouches[0].clientX - touch.clientX, dy = e.changedTouches[0].clientY - touch.clientY;
  touch = null;
  if (Math.max(Math.abs(dx), Math.abs(dy)) < 24) return;
  Math.abs(dx) > Math.abs(dy) ? turn(Math.sign(dx), 0) : turn(0, Math.sign(dy));
});

// ---------- Renderização ----------
const m = new THREE.Matrix4(), q = new THREE.Quaternion(), s3 = new THREE.Vector3();
const a = new THREE.Vector3(), b = new THREE.Vector3(), camTarget = new THREE.Vector3();

function draw(time, dt) {
  const t = state === 'play' ? Math.min(acc / step, 1) : 1;
  const len = snake.length;
  pop = Math.max(0, pop - dt * 4);

  for (let i = 0; i < len; i++) {
    toWorld(prev[i], a).lerp(toWorld(snake[i], b), t);
    if (!reduceMotion) a.y = Math.sin(time * 5 - i * 0.6) * 0.06;
    const k = i === 0 ? 1.08 + pop * 0.3 : 1 - (i / len) * 0.25;
    m.compose(a, q, s3.setScalar(k));
    segs.setMatrixAt(i, m);
    segs.setColorAt(i, tmpColor.lerpColors(HEAD, TAIL, len > 1 ? i / (len - 1) : 0));
    if (i === 0) {
      eyes.position.copy(a);
      eyes.rotation.y = Math.atan2(dir.x, dir.z);
      eyes.scale.setScalar(k);
    }
  }
  segs.count = len;
  segs.instanceMatrix.needsUpdate = true;
  segs.instanceColor.needsUpdate = true;

  toWorld(food, foodMesh.position);
  foodMesh.position.y = reduceMotion ? 0 : Math.sin(time * 3) * 0.12;
  foodMesh.rotation.set(time * 0.7, time, 0);
  foodMesh.scale.setScalar(1 + Math.sin(time * 6) * 0.12);

  // Câmera acompanha a cabeça de leve e se afasta em telas estreitas
  const far = Math.max(1, 1.1 / camera.aspect);
  camTarget.copy(eyes.position).multiplyScalar(0.35);
  camera.position.lerp(a.set(camTarget.x, 17 * far, camTarget.z + 12 * far), 1 - Math.exp(-dt * 3));
  if (shake > 0 && !reduceMotion) {
    camera.position.x += (Math.random() - 0.5) * shake * 0.6;
    camera.position.y += (Math.random() - 0.5) * shake * 0.6;
  }
  shake = Math.max(0, shake - dt * 2);
  camera.lookAt(camTarget);
}

function resize() {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  composer.setPixelRatio(renderer.getPixelRatio());
  composer.setSize(innerWidth, innerHeight);
}
addEventListener('resize', resize);
resize();
reset();
camera.position.set(0, 20, 16);

const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.1);
  if (state === 'play') {
    acc += dt;
    while (acc >= step && state === 'play') { acc -= step; tick(); }
  }
  draw(clock.elapsedTime, dt);
  composer.render();
});
</script>

</body></html>
