<style>
:root{--verde:#1f3a2c;--cinza:#e5e7eb;--borda:#e5e7eb;--txt:#1f2937;--sub:#6b7280;--azul:#7dd3f5;--azulc:#e0f4fc;--ok:#16a34a;--okc:#dcfce7;--erro:#dc2626;--erroc:#fee2e2}
*{box-sizing:border-box}body{margin:0;font-family:Lato,system-ui,sans-serif;color:var(--txt);background:#f3f4f6}
header{background:#fff;border-top:6px solid var(--verde);box-shadow:0 1px 3px rgba(0,0,0,.08);position:sticky;top:0;z-index:5}
.hd{max-width:860px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{font-weight:900;color:var(--verde);font-size:17px;flex:1;min-width:180px}
.brand small{display:block;font-weight:400;color:var(--sub);font-size:12px}
.tabs{display:flex;gap:6px}
.tab{border:1px solid var(--borda);background:#fff;border-radius:999px;padding:8px 14px;font:700 14px Lato,system-ui,sans-serif;color:var(--txt);cursor:pointer}
.tab.on{background:var(--verde);color:#fff;border-color:var(--verde)}
.bar{height:4px;background:var(--cinza)}.bar i{display:block;height:100%;background:var(--verde);width:0;transition:width .3s}
main{max-width:860px;margin:0 auto;padding:16px}
.score{display:flex;justify-content:space-between;align-items:center;background:#fff;border:1px solid var(--borda);border-radius:8px;padding:10px 14px;margin-bottom:14px;font-size:14px;color:var(--sub)}
.score b{color:var(--txt)}
.reset{border:1px solid var(--borda);background:#fff;border-radius:6px;padding:6px 10px;font:700 13px Lato;cursor:pointer;color:var(--txt)}
.q{background:#fff;border:1px solid var(--borda);border-radius:8px;padding:20px 18px;margin-bottom:16px}
.qt{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.qt h2{font-size:18px;margin:0}
.pts{background:var(--cinza);font-size:12px;font-weight:700;padding:3px 8px;border-radius:3px}
.tema{font-size:12px;color:var(--sub);font-style:italic;margin-bottom:12px}
.q p{font-size:15px;line-height:1.6;margin:0 0 12px;text-align:justify}
.q p.b{font-weight:700}@media(max-width:600px){.q p{text-align:left}}
.alts{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.alt{display:flex;border:2px solid var(--borda);border-radius:6px;overflow:hidden;background:#fff;cursor:pointer;text-align:left;font:inherit;color:inherit;padding:0;width:100%}
.alt:hover:not(:disabled){border-color:var(--azul)}
.alt .l{width:52px;flex:none;background:var(--cinza);display:flex;align-items:center;justify-content:center;font-weight:700;color:#374151}
.alt .t{padding:14px 14px;font-size:15px;line-height:1.5}
.alt:disabled{cursor:default}
.alt.ok{border-color:var(--ok);background:var(--okc)}.alt.ok .l{background:var(--ok);color:#fff}
.alt.no{border-color:var(--erro);background:var(--erroc)}.alt.no .l{background:var(--erro);color:#fff}
.com{display:none;margin-top:14px;background:#f9fafb;border-left:4px solid var(--verde);padding:12px 14px;border-radius:0 6px 6px 0;font-size:14px;line-height:1.6}
.com.show{display:block}.com strong{display:block;margin-bottom:4px}
.fim{display:none;background:#fff;border:2px solid var(--verde);border-radius:8px;padding:20px;text-align:center}
.fim.show{display:block}.fim .n{font-size:40px;font-weight:900;color:var(--verde)}
.erradas{text-align:left;font-size:14px;margin-top:10px;color:var(--sub)}
</style></head><body>

<script>
const DATA={"anatomia":{"nome":"Anatomia Humana","qs":[{"tema":"Primeiros conceitos — posição anatômica e termos de relação","enun":["Para que a descrição do corpo humano seja a mesma em qualquer livro ou laboratório, a anatomia adota uma posição de referência, a posição anatômica: corpo ereto, face voltada para a frente, olhar no horizonte, membros superiores ao lado do tronco com as palmas das mãos voltadas para a frente e pés apoiados no chão. Todos os termos de relação (medial, lateral, proximal, distal etc.) são aplicados a partir dela, mesmo que a pessoa esteja deitada ou de costas.","Com base na posição anatômica, assinale a alternativa CORRETA:"],"alts":["O dedo mínimo é lateral ao polegar.","O cotovelo é distal em relação ao punho.","O esterno é posterior à coluna vertebral.","O polegar é lateral ao dedo mínimo.","O nariz é lateral aos olhos."],"gab":"D","com":"Na posição anatômica as palmas ficam voltadas para a frente, o que coloca o polegar do lado de fora, mais longe do plano mediano: lateral. Por isso A está invertida. Em B, o cotovelo fica mais perto da raiz do membro que o punho, logo é proximal. Em C, o esterno está na face anterior do tórax e a coluna na posterior. Em E, o nariz está no plano mediano, portanto é medial aos olhos. A pegadinha clássica é responder pensando numa pessoa com as palmas voltadas para o corpo, o que inverte medial e lateral no antebraço e na mão."},{"tema":"Primeiros conceitos — planos de secção","enun":["Um paciente realiza uma tomografia computadorizada do crânio. As imagens mostram o encéfalo em fatias horizontais sucessivas, como se a cabeça tivesse sido cortada em \"andares\", do topo em direção ao pescoço.","O plano de secção que corresponde a essas imagens, e as partes em que ele divide o corpo, são:"],"alts":["Plano sagital mediano, que divide o corpo em metades direita e esquerda.","Plano transversal (horizontal), que divide o corpo em partes superior e inferior.","Plano frontal (coronal), que divide o corpo em partes anterior e posterior.","Plano sagital paramediano, que divide o corpo em partes anterior e posterior.","Plano frontal (coronal), que divide o corpo em partes superior e inferior."],"gab":"B","com":"Cortes \"em andares\" são os cortes axiais da tomografia, feitos no plano transversal, que separa uma parte superior (cranial) de uma inferior (caudal). O plano sagital (mediano ou paramediano) separa direita e esquerda, e não anterior e posterior, o que derruba D. O plano frontal separa anterior e posterior, o que torna C correta como definição, mas não corresponde às imagens descritas; E mistura o plano frontal com a divisão do transversal."},{"tema":"Tecidos e sistema tegumentar — camadas da pele","enun":["A pele é o maior órgão do corpo e se organiza em camadas. A epiderme é a camada mais externa, formada por células que se renovam continuamente e produzem queratina. Abaixo dela está a derme, rica em fibras colágenas e elásticas, vasos sanguíneos, terminações nervosas, folículos pilosos e glândulas.","Analise as asserções a seguir:","I. A epiderme é uma camada avascular, que recebe nutrientes por difusão a partir dos vasos da derme","PORQUE","II. a epiderme é formada por tecido conjuntivo denso, cujas fibras colágenas impedem a passagem de vasos sanguíneos.","Acerca dessas asserções, assinale a opção correta:"],"alts":["As asserções I e II são proposições verdadeiras, e a II é uma justificativa correta da I.","As asserções I e II são proposições verdadeiras, mas a II não é uma justificativa correta da I.","A asserção I é uma proposição verdadeira, e a II é uma proposição falsa.","As asserções I e II são proposições falsas.","A asserção I é uma proposição falsa, e a II é uma proposição verdadeira."],"gab":"C","com":"A asserção I está correta: todo tecido epitelial é avascular e se nutre por difusão a partir do conjuntivo subjacente; por isso um arranhão superficial não sangra. A asserção II é falsa porque a epiderme é tecido epitelial (estratificado pavimentoso queratinizado). Tecido conjuntivo denso é o que forma a derme, que, ao contrário do que a II sugere, é vascularizada. Método para asserção-razão: julgue cada frase isoladamente; só depois, se ambas forem verdadeiras, pergunte se a II explica a I."},{"tema":"Tecidos — os quatro tecidos fundamentais","enun":["O corpo humano é formado por quatro tecidos fundamentais: epitelial, conjuntivo, muscular e nervoso. Cada um tem células e matriz extracelular com características próprias, que explicam a função que desempenha nos órgãos.","Assinale a alternativa INCORRETA:"],"alts":["O tecido epitelial reveste superfícies e cavidades e forma glândulas, com células muito unidas e pouca matriz extracelular.","O tecido conjuntivo tem abundante matriz extracelular e inclui variedades como o tecido ósseo, o cartilaginoso, o adiposo e o sangue.","O tecido muscular é formado por células alongadas capazes de contração, o que permite o movimento do corpo e das vísceras.","O tecido nervoso é formado por neurônios, que recebem e conduzem impulsos, e por células da glia, que dão suporte, nutrição e proteção aos neurônios.","As células da glia são as responsáveis pela condução do impulso nervoso, enquanto os neurônios têm função apenas de sustentação."],"gab":"E","com":"A alternativa E inverte as funções: quem gera e conduz o impulso nervoso é o neurônio; a glia (astrócitos, oligodendrócitos, micróglia, células de Schwann) sustenta, nutre, forma a bainha de mielina e defende. As demais estão corretas. Note em B que o sangue é classificado como tecido conjuntivo especializado, de matriz líquida (plasma), ponto que costuma cair em prova justamente por soar estranho."},{"tema":"Sistema esquelético — esqueleto axial e apendicular","enun":["O esqueleto do adulto tem, em geral, 206 ossos, divididos em dois grandes grupos. O esqueleto axial forma o eixo central do corpo e protege órgãos vitais; o esqueleto apendicular compreende os ossos dos membros e os cíngulos (cinturas) que os prendem ao eixo.","Assinale a alternativa que apresenta APENAS ossos do esqueleto apendicular:"],"alts":["Clavícula, escápula, úmero e fêmur.","Esterno, costelas, clavícula e úmero.","Vértebras, sacro, fêmur e tíbia.","Osso hioide, escápula, rádio e ulna.","Crânio, mandíbula, patela e fíbula."],"gab":"A","com":"Clavícula e escápula formam o cíngulo do membro superior; úmero e fêmur são ossos dos membros. Todos são apendiculares. Nas outras alternativas aparece sempre ao menos um osso axial: esterno e costelas (B), vértebras e sacro (C), hioide (D), crânio e mandíbula (E). O sacro confunde porque se articula com o quadril, mas faz parte da coluna; o osso do quadril é que pertence ao cíngulo do membro inferior."},{"tema":"Sistema esquelético — classificação dos ossos pela forma","enun":["Os ossos são classificados segundo a forma em longos, curtos, planos, irregulares, pneumáticos e sesamoides. A classificação considera a relação entre comprimento, largura e espessura, além de características como cavidades com ar ou desenvolvimento dentro de tendões.","Assinale a alternativa em que a correspondência entre osso e classificação está CORRETA:"],"alts":["Fêmur: osso curto.","Vértebra: osso plano.","Ossos do carpo: ossos longos.","Patela: osso sesamoide.","Parietal: osso irregular."],"gab":"D","com":"A patela se desenvolve dentro do tendão do músculo quadríceps femoral, que é a definição de osso sesamoide; é o maior sesamoide do corpo. O fêmur é o exemplo típico de osso longo (comprimento maior que largura e espessura, com diáfise e epífises). A vértebra é irregular, os ossos do carpo são curtos e o parietal é plano. Ossos pneumáticos, que não aparecem nas alternativas, são os que têm seios com ar, como frontal, maxila, etmoide, esfenoide e temporal."},{"tema":"Articulações — classificação estrutural","enun":["Ao examinar um crânio adulto no laboratório, o estudante observa que os ossos parietais, o frontal e o occipital estão unidos por linhas finas e sinuosas, sem cavidade entre eles e praticamente sem mobilidade. O professor explica que, no recém-nascido, essas uniões ainda são membranosas e formam as fontanelas (\"moleiras\").","A articulação observada é classificada como:"],"alts":["Cartilagínea do tipo sínfise, ligeiramente móvel.","Fibrosa do tipo sutura, considerada sinartrose.","Sinovial do tipo plana, considerada diartrose.","Cartilagínea do tipo sincondrose, de grande mobilidade.","Sinovial do tipo gínglimo, com movimento em um único eixo."],"gab":"B","com":"Suturas são articulações fibrosas, exclusivas do crânio, unidas por tecido conjuntivo denso e sem cavidade articular; funcionalmente são sinartroses (imóveis no adulto). A sínfise (A) é cartilagínea e tem pouca mobilidade, como a sínfise púbica e os discos intervertebrais. C e E descrevem articulações sinoviais, que têm cavidade com líquido sinovial. D erra duas vezes: sincondrose é cartilagínea, mas quase imóvel. As fontanelas citadas no enunciado são a pista de que a união é fibrosa."},{"tema":"Articulações — articulação sinovial","enun":["As articulações sinoviais são as mais numerosas e as de maior mobilidade do corpo, como o joelho, o ombro e o quadril. Sua estrutura é adaptada para permitir o deslizamento das superfícies ósseas com pouco atrito e desgaste.","Sobre a articulação sinovial, assinale a alternativa CORRETA:"],"alts":["As superfícies ósseas são unidas diretamente por tecido fibroso, sem cavidade entre elas.","As extremidades ósseas são recobertas por fibrocartilagem, que produz o líquido sinovial.","O líquido sinovial é produzido pela cartilagem articular e serve apenas para nutrir o osso.","O ombro é uma articulação sinovial do tipo gínglimo, com movimento em um único eixo.","A membrana sinovial reveste internamente a cápsula articular e produz o líquido sinovial, que lubrifica e nutre a cartilagem."],"gab":"E","com":"Os elementos típicos da sinovial são: cartilagem articular (hialina) nas extremidades ósseas, cápsula articular fibrosa, membrana sinovial forrando a cápsula por dentro e cavidade com líquido sinovial. Quem produz o líquido é a membrana sinovial, e ele lubrifica e nutre a cartilagem, que é avascular. A descreve uma articulação fibrosa. B e C atribuem a produção à cartilagem, e B ainda troca cartilagem hialina por fibrocartilagem. D erra o tipo: o ombro é esferóidea (enartrose), a de maior amplitude, com movimento em três eixos; gínglimo é o cotovelo (umeroulnar)."},{"tema":"Sistema muscular — tipos de tecido muscular","enun":["Há três tipos de tecido muscular, que se distinguem pela presença de estrias, pelo número e posição dos núcleos e pelo tipo de controle da contração. Essa diferença explica, por exemplo, por que conseguimos mover o braço quando queremos, mas não conseguimos parar o coração ou o intestino por vontade própria.","Assinale a alternativa que associa CORRETAMENTE o tipo de músculo às suas características:"],"alts":["Músculo liso: estriado, multinucleado, de contração voluntária, presente nas paredes das vísceras.","Músculo estriado cardíaco: sem estrias, de contração voluntária, com células fusiformes.","Músculo estriado esquelético: fibras longas e multinucleadas, com núcleos periféricos e contração voluntária.","Músculo estriado esquelético: células fusiformes com núcleo central único e contração involuntária.","Músculo liso: estriado, com discos intercalares e contração involuntária, exclusivo do coração."],"gab":"C","com":"O músculo esquelético tem fibras longas, cilíndricas, multinucleadas, com núcleos na periferia, estrias transversais e controle voluntário. O liso não tem estrias, suas células são fusiformes com um núcleo central e a contração é involuntária (vísceras, vasos, pupila). O cardíaco é estriado, involuntário, com um ou dois núcleos centrais e discos intercalares, que permitem a contração sincronizada do coração. A, B, D e E misturam características desses três tipos."},{"tema":"Sistema muscular — ação muscular","enun":["Ao levar um copo de água à boca, uma pessoa flexiona o cotovelo. Para que esse movimento seja preciso, alguns músculos se contraem para realizá-lo, enquanto outros relaxam de forma controlada no lado oposto da articulação.","Nesse movimento de flexão do cotovelo, os papéis dos músculos são:"],"alts":["O bíceps braquial atua como agonista, e o tríceps braquial como antagonista.","O tríceps braquial atua como agonista, e o bíceps braquial como antagonista.","O bíceps braquial e o tríceps braquial atuam ambos como agonistas.","O deltoide atua como agonista, e o bíceps braquial como antagonista.","O tríceps braquial atua como sinergista, e o deltoide como antagonista."],"gab":"A","com":"Agonista é o músculo que realiza o movimento; antagonista é o que faz o movimento oposto e, por isso, precisa relaxar para que o agonista atue. Na flexão do cotovelo, o bíceps braquial (com o braquial) é o agonista e o tríceps braquial, extensor do cotovelo, é o antagonista. Na extensão os papéis se invertem, o que torna B correta só para o movimento contrário. O deltoide age sobre o ombro, não sobre o cotovelo."},{"tema":"Sistema cardiovascular — circulação pulmonar e sistêmica","enun":["O coração funciona como duas bombas acopladas. O lado direito envia sangue aos pulmões (circulação pulmonar, ou pequena circulação); o lado esquerdo envia sangue a todo o corpo (circulação sistêmica, ou grande circulação).","Analise as asserções a seguir:","I. As artérias pulmonares transportam sangue pobre em oxigênio, do ventrículo direito aos pulmões","PORQUE","II. em anatomia, artéria é todo vaso que leva sangue do coração para os tecidos ou órgãos, independentemente de o sangue ser rico ou pobre em oxigênio.","Acerca dessas asserções, assinale a opção correta:"],"alts":["As asserções I e II são proposições verdadeiras, e a II é uma justificativa correta da I.","As asserções I e II são proposições verdadeiras, mas a II não é uma justificativa correta da I.","A asserção I é uma proposição verdadeira, e a II é uma proposição falsa.","As asserções I e II são proposições falsas.","A asserção I é uma proposição falsa, e a II é uma proposição verdadeira."],"gab":"A","com":"As duas frases estão certas e a II explica a I. O critério anatômico para chamar um vaso de artéria é a direção do fluxo (sai do coração), e não o teor de oxigênio. Por isso o tronco pulmonar e as artérias pulmonares levam sangue venoso aos pulmões, e as veias pulmonares trazem sangue arterial ao átrio esquerdo. O erro comum é decorar \"artéria leva sangue oxigenado\", regra que só vale para a circulação sistêmica."},{"tema":"Sistema cardiovascular — sistema de condução cardíaco","enun":["Em situações de ansiedade ou medo, é comum a pessoa perceber o coração \"disparar\". Isso acontece porque o sistema nervoso autônomo simpático acelera a frequência com que o próprio coração gera seus impulsos. Esse ritmo, porém, nasce no próprio músculo cardíaco, em uma estrutura especializada que funciona como marca-passo natural.","A estrutura que funciona como marca-passo natural do coração e sua localização são:"],"alts":["Nó atrioventricular, localizado no ápice do ventrículo esquerdo.","Valva tricúspide, localizada entre o átrio e o ventrículo esquerdos.","Feixe de His, localizado na parede do átrio esquerdo.","Nó sinoatrial, localizado na parede do átrio direito, próximo à desembocadura da veia cava superior.","Miocárdio do ventrículo esquerdo, por ser a parede mais espessa do coração."],"gab":"D","com":"O nó sinoatrial (sinusal), na parede do átrio direito junto à veia cava superior, gera os impulsos com maior frequência e por isso comanda o ritmo cardíaco. O impulso passa ao nó atrioventricular (no septo interatrial, não no ápice), depois ao feixe de His (no septo interventricular) e às fibras de Purkinje. B confunde condução com valva, e a tricúspide fica do lado direito; a do lado esquerdo é a mitral (bicúspide). A espessura do ventrículo esquerdo (E) tem relação com a força de bombeamento para a circulação sistêmica, não com o ritmo. Conexão com a Psicologia: o simpático acelera e o parassimpático (nervo vago) desacelera o nó sinoatrial."},{"tema":"Sistema respiratório — porção condutora e respiratória","enun":["O sistema respiratório é dividido em uma porção condutora, que leva o ar até os pulmões e o filtra, aquece e umedece, e uma porção respiratória, onde ocorre a troca de gases entre o ar e o sangue, chamada hematose.","A hematose ocorre principalmente:"],"alts":["Na traqueia, por meio de seus anéis cartilagíneos.","Nos alvéolos pulmonares, através de sua parede fina em contato com os capilares sanguíneos.","Nos brônquios principais, que se dividem dentro de cada pulmão.","Na laringe, onde ficam as pregas vocais.","Na cavidade nasal, onde o ar é aquecido e umedecido."],"gab":"B","com":"A troca de oxigênio e gás carbônico depende de uma barreira muito fina e de grande área de contato com o sangue, condição que só existe nos alvéolos, envoltos por uma rede de capilares. Cavidade nasal, laringe, traqueia e brônquios fazem parte da porção condutora: conduzem, filtram, aquecem e umedecem o ar, mas não fazem trocas gasosas. Os anéis cartilagíneos da traqueia, citados em A, servem para manter o tubo aberto."},{"tema":"Sistema respiratório — pulmões e músculos da respiração","enun":["Os pulmões ficam na cavidade torácica, envolvidos pela pleura, e não são simétricos. A ventilação depende da ação de músculos que alteram o volume do tórax, sendo um deles o principal responsável pela inspiração em repouso.","Assinale a alternativa CORRETA:"],"alts":["O pulmão esquerdo tem três lobos e o direito tem dois, por causa da posição do fígado.","Na inspiração, o diafragma relaxa e sobe, aumentando o volume da cavidade torácica.","A pleura visceral reveste a parede interna do tórax, e a parietal reveste a superfície do pulmão.","A expiração em repouso exige a contração forte dos músculos abdominais.","O pulmão direito tem três lobos e o esquerdo tem dois; na inspiração, o diafragma se contrai e desce, aumentando o volume do tórax."],"gab":"E","com":"O pulmão direito tem três lobos (superior, médio e inferior) e o esquerdo dois, porque cede espaço ao coração (incisura cardíaca); A inverte isso e atribui a diferença ao fígado. Na inspiração, o diafragma, principal músculo inspiratório, contrai, achata e desce, aumentando o volume torácico; B descreve a expiração. Em C as pleuras estão trocadas: a visceral adere ao pulmão e a parietal forra a parede. Em repouso a expiração é passiva, pela retração elástica do pulmão; os abdominais entram só na expiração forçada."},{"tema":"Sistema digestório — intestino grosso e retocolite ulcerativa","enun":["A retocolite ulcerativa é uma doença inflamatória intestinal crônica que atinge a mucosa e começa no reto, podendo se estender de forma contínua pelo restante do colo. É frequentemente estudada no campo das doenças psicossomáticas, porque o estresse emocional está associado à piora das crises.","Considerando a anatomia do tubo digestório, o segmento acometido por essa doença e sua organização são:"],"alts":["Intestino delgado, formado por duodeno, jejuno e íleo.","Estômago, dividido em cárdia, fundo, corpo e piloro.","Intestino grosso, formado por ceco, colos ascendente, transverso, descendente e sigmoide, reto e canal anal.","Esôfago, que liga a faringe ao estômago.","Duodeno, onde desembocam os ductos do fígado e do pâncreas."],"gab":"C","com":"Reto e colo pertencem ao intestino grosso, cuja sequência é ceco (com o apêndice vermiforme), colo ascendente, transverso, descendente e sigmoide, reto e canal anal. Duodeno, jejuno e íleo formam o intestino delgado, sede principal da absorção graças às vilosidades. Para não confundir: a doença de Crohn, outra doença inflamatória intestinal, pode atingir qualquer segmento da boca ao ânus, de forma descontínua e em toda a espessura da parede, ao passo que a retocolite fica restrita à mucosa do colo e do reto."},{"tema":"Sistema digestório — glândulas anexas","enun":["Além do tubo digestório, a digestão depende de glândulas anexas, que lançam suas secreções no interior do tubo: as glândulas salivares, o fígado e o pâncreas. A vesícula biliar, embora associada ao fígado, tem função própria.","Assinale a alternativa INCORRETA:"],"alts":["As glândulas salivares maiores são as parótidas, as submandibulares e as sublinguais.","A bile é produzida pela vesícula biliar e armazenada no fígado até ser lançada no duodeno.","O fígado é a maior glândula do corpo e fica no quadrante superior direito do abdome, abaixo do diafragma.","O pâncreas tem função exócrina, produzindo suco pancreático, e endócrina, produzindo hormônios como insulina e glucagon.","A bile e o suco pancreático chegam ao duodeno, a primeira porção do intestino delgado."],"gab":"B","com":"A alternativa B inverte os papéis: a bile é produzida pelo fígado (pelos hepatócitos) e armazenada e concentrada na vesícula biliar, que a libera no duodeno após as refeições gordurosas. As demais estão corretas. Em D, a parte endócrina do pâncreas corresponde às ilhotas pancreáticas (de Langerhans); em E, o ponto de chegada comum é a papila maior do duodeno."},{"tema": "Enade 2025 · Conceitos básicos — situação-problema", "enun": ["Um paciente é encaminhado para avaliação neuropsicológica com um laudo de ressonância magnética que diz: \"lesão no lobo frontal esquerdo, bem visualizada nos cortes coronais\". O estagiário de Psicologia precisa entender o laudo para discutir o caso com a equipe.", "Assinale a alternativa correta."], "alts": ["Os cortes coronais são feitos no plano transversal, que divide o corpo em partes superior e inferior.", "Os cortes coronais são feitos no plano frontal, que divide o corpo em partes anterior e posterior; \"esquerdo\" refere-se ao lado do paciente, e não ao do observador.", "\"Esquerdo\" refere-se ao lado esquerdo de quem olha a imagem, por isso a lesão está no hemisfério direito do paciente.", "Os cortes coronais equivalem aos sagitais, que dividem o corpo em partes anterior e posterior.", "O lobo frontal é posterior ao lobo occipital na posição anatômica."], "gab": "B", "com": "Gabarito B. Coronal é sinônimo de frontal, e os termos de lado se referem sempre ao paciente em posição anatômica. Nas imagens radiológicas, aliás, o lado esquerdo do paciente costuma aparecer à direita de quem olha, o que torna essa regra indispensável. Sobre as demais: A) Quem separa superior e inferior é o plano transversal (cortes axiais). C) Direita e esquerda são sempre do paciente. Confundir isso inverte a localização da lesão. D) O plano sagital divide o corpo em direita e esquerda, e não é sinônimo de coronal. E) O lobo frontal é anterior; o occipital fica na parte posterior do encéfalo.", "bl": "Aplicar — pede usar a terminologia anatômica para ler um documento clínico", "cp": "II.4 · Avaliação, diagnóstico e intervenção: atuação em equipe inter e multiprofissional", "ob": "VIII · Bases biológicas do comportamento"}, {"tema": "Enade 2025 · Sistema tegumentar — asserção-razão", "enun": ["Uma paciente com dermatite atópica relata piora das lesões em períodos de provas e é acompanhada em conjunto por dermatologista e psicóloga. Na primeira consulta, a psicóloga explica a ela a estrutura da pele.", "I. A pele é um órgão de interface entre o organismo e o ambiente, com receptores nervosos, concentrados sobretudo na derme, que participam do tato, da dor e da percepção de temperatura", "PORQUE", "II. a epiderme, por ser ricamente vascularizada, é a camada responsável pela termorregulação por meio da dilatação e da constrição dos vasos.", "A respeito dessas asserções, assinale a opção correta."], "alts": ["As asserções I e II são proposições verdadeiras, e a II é uma justificativa correta da I.", "As asserções I e II são proposições verdadeiras, mas a II não é uma justificativa correta da I.", "A asserção I é uma proposição falsa, e a II é uma proposição verdadeira.", "A asserção I é uma proposição verdadeira, e a II é uma proposição falsa.", "As asserções I e II são proposições falsas."], "gab": "D", "com": "Gabarito D. A I é verdadeira: a derme concentra terminações e receptores nervosos, e a pele faz a fronteira com o meio. A II é falsa: a epiderme é avascular; os vasos que participam da termorregulação estão na derme, com as glândulas sudoríparas. A I descreve corretamente a função sensorial da pele. A II erra a camada: quem tem vasos é a derme. Sobre as demais: A) A II é falsa. B) A II é falsa. C) A I é verdadeira; a II é falsa. E) A I é verdadeira.", "bl": "Analisar — pede julgar duas proposições sobre estrutura e função e a relação entre elas", "cp": "II.4 · Avaliação, diagnóstico e intervenção: atuação em equipe inter e multiprofissional", "ob": "VIII · Bases biológicas do comportamento; XIX · Atenção e promoção da saúde"}, {"tema": "Enade 2025 · Sistema esquelético — situação-problema com afirmativas", "enun": ["Numa UBS, uma mulher de 72 anos com osteoporose conta à psicóloga que deixou de sair de casa depois de uma queda, por medo de \"quebrar o fêmur\". A equipe discute o caso em reunião.", "Avalie as afirmações a seguir.", "I. O tecido ósseo armazena cálcio e é remodelado continuamente; quando a reabsorção supera a formação, há perda de massa óssea.", "II. O colo do fêmur, osso do esqueleto apendicular, é local frequente de fratura em idosos após quedas.", "III. O medo de cair que leva ao isolamento é uma questão exclusivamente ortopédica, sem papel para a Psicologia.", "É correto o que se afirma em"], "alts": ["I e II, apenas.", "I, apenas.", "III, apenas.", "II e III, apenas.", "I, II e III."], "gab": "A", "com": "Gabarito A. I verdadeira: é o mecanismo de base da osteoporose; II verdadeira: a fratura do colo do fêmur é uma das mais associadas a quedas na velhice, e o fêmur pertence ao membro inferior; III falsa: o medo de cair produz restrição de atividades e isolamento, o que pede cuidado psicológico e trabalho em equipe. A questão junta a base biológica (remodelação óssea, esqueleto apendicular) e a consequência psicossocial (medo e isolamento). Sobre as demais: B) Deixa de fora a II, que é verdadeira. C) Deixa de fora a I, que é verdadeira; deixa de fora a II, que é verdadeira; inclui a III, que é falsa (o medo de cair produz restrição de atividades e isolamento, o que pede cuidado psicológico e trabalho em equipe). D) Deixa de fora a I, que é verdadeira; inclui a III, que é falsa (o medo de cair produz restrição de atividades e isolamento, o que pede cuidado psicológico e trabalho em equipe). E) Inclui a III, que é falsa (o medo de cair produz restrição de atividades e isolamento, o que pede cuidado psicológico e trabalho em equipe).", "bl": "Analisar — relaciona estrutura óssea, risco clínico e consequência psicológica", "cp": "II.4 · Avaliação, diagnóstico e intervenção: atuação em equipe inter e multiprofissional; II.2 · Avaliação, diagnóstico e intervenção: prevenção e promoção da saúde", "ob": "VIII · Bases biológicas do comportamento; IX · Desenvolvimento humano; XIX · Atenção e promoção da saúde"}, {"tema": "Enade 2025 · Sistema muscular — situação-problema", "enun": ["No relaxamento muscular progressivo, técnica usada no manejo da ansiedade, a pessoa contrai e depois relaxa, em sequência, grupos musculares como os da mão, do braço e dos ombros. Um usuário pergunta por que a técnica trabalha com esses músculos e não pede para \"relaxar o coração\" ou \"relaxar o estômago\".", "A explicação correta é:"], "alts": ["O músculo liso das vísceras é voluntário, mas leva mais tempo para responder, por isso fica para o fim da técnica.", "O músculo cardíaco é estriado e, por isso, pode ser contraído e relaxado à vontade, como o esquelético.", "A técnica atua sobre o músculo estriado esquelético, que está sob controle voluntário; o músculo cardíaco e o liso são involuntários e só se alteram indiretamente, pela redução da ativação do sistema nervoso autônomo.", "A técnica age sobre os tendões, que são as partes do músculo que se contraem.", "A técnica contrai agonista e antagonista ao mesmo tempo para produzir movimento amplo."], "gab": "C", "com": "Gabarito C. Só o esquelético obedece ao comando voluntário. O efeito sobre o coração e as vísceras vem depois, pela queda da ativação simpática. Sobre as demais: A) O músculo liso é involuntário. B) O cardíaco é estriado, mas involuntário; estriação não define controle voluntário. D) Quem contrai é o ventre muscular; o tendão é tecido conjuntivo que prende o músculo ao osso. E) Agonista e antagonista fazem movimentos opostos; contraí-los juntos estabiliza a articulação, não produz movimento amplo, e não é isso que a técnica pede.", "bl": "Aplicar — pede usar os tipos de músculo para explicar uma técnica de intervenção", "cp": "II.2 · Avaliação, diagnóstico e intervenção: prevenção e promoção da saúde", "ob": "VIII · Bases biológicas do comportamento; XIX · Atenção e promoção da saúde"}, {"tema": "Enade 2025 · Articulações — asserção-razão", "enun": ["Um paciente com bruxismo (apertar e ranger os dentes), associado por ele a períodos de estresse, é encaminhado pelo dentista à Psicologia. Ele se queixa de dor e estalos ao abrir a boca.", "I. A articulação temporomandibular é uma diartrose, ou seja, uma articulação de ampla mobilidade", "PORQUE", "II. ela é uma articulação sinovial, com cápsula, cavidade articular com líquido sinovial e um disco articular entre as superfícies ósseas.", "A respeito dessas asserções, assinale a opção correta."], "alts": ["As asserções I e II são proposições verdadeiras, mas a II não é uma justificativa correta da I.", "A asserção I é uma proposição verdadeira, e a II é uma proposição falsa.", "A asserção I é uma proposição falsa, e a II é uma proposição verdadeira.", "As asserções I e II são proposições falsas.", "As asserções I e II são proposições verdadeiras, e a II é uma justificativa correta da I."], "gab": "E", "com": "Gabarito E. A I é verdadeira: a ATM permite abrir, fechar e deslizar a mandíbula. A II é verdadeira: a presença de cavidade e líquido sinovial é o que caracteriza as diartroses. A II explica a I: é a estrutura sinovial que dá à ATM sua mobilidade. Não confunda com as suturas do crânio, que são fibrosas e imóveis. Sobre as demais: A) A II explica a I. B) A II é verdadeira. C) A I é verdadeira. D) A I é verdadeira; a II é verdadeira.", "bl": "Analisar — pede relacionar estrutura e mobilidade da articulação", "cp": "II.4 · Avaliação, diagnóstico e intervenção: atuação em equipe inter e multiprofissional", "ob": "VIII · Bases biológicas do comportamento"}, {"tema": "Enade 2025 · Sistema urinário — situação-problema com afirmativas", "enun": ["Uma menina de 7 anos, que já tinha controle urinário noturno, volta a molhar a cama depois do nascimento do irmão. Os pais procuram a psicóloga da unidade de saúde.", "Avalie as afirmações a seguir.", "I. Como a urina é produzida na bexiga, a perda noturna se explica apenas por uma bexiga de pequena capacidade.", "II. Antes de atribuir o sintoma a fatores emocionais, é preciso, com a equipe de saúde, descartar causas orgânicas, como infecção urinária.", "III. O controle voluntário da micção depende do esfíncter externo da uretra, formado por músculo esquelético.", "É correto o que se afirma em"], "alts": ["I, apenas.", "II e III, apenas.", "II, apenas.", "I e III, apenas.", "I, II e III."], "gab": "B", "com": "Gabarito B. I falsa: a urina é produzida nos rins; a bexiga apenas armazena; II verdadeira: infecções e outras alterações do trato urinário podem produzir o mesmo sintoma; III verdadeira: o esfíncter externo é estriado e voluntário, ao contrário do interno. A questão cobra a anatomia do trato urinário e a conduta de investigar o orgânico antes de concluir pelo emocional. Sobre as demais: A) Inclui a I, que é falsa (a urina é produzida nos rins; a bexiga apenas armazena); deixa de fora a II, que é verdadeira; deixa de fora a III, que é verdadeira. C) Deixa de fora a III, que é verdadeira. D) Inclui a I, que é falsa (a urina é produzida nos rins; a bexiga apenas armazena); deixa de fora a II, que é verdadeira. E) Inclui a I, que é falsa (a urina é produzida nos rins; a bexiga apenas armazena).", "bl": "Analisar — relaciona anatomia, hipótese clínica e conduta", "cp": "II.4 · Avaliação, diagnóstico e intervenção: atuação em equipe inter e multiprofissional; II.3 · Avaliação, diagnóstico e intervenção: avaliação, psicodiagnóstico e intervenção clínica", "ob": "VIII · Bases biológicas do comportamento; IX · Desenvolvimento humano"}, {"tema": "Enade 2025 · Sistema digestório — situação-problema com afirmativas", "enun": ["Um bancário com gastrite, que relaciona as crises à pressão por metas, é atendido em conjunto pelo médico do trabalho e pela psicóloga da empresa. Ele quer entender o que acontece no seu sistema digestório.", "Avalie as afirmações a seguir.", "I. A digestão química das proteínas começa no estômago, em ambiente ácido.", "II. A digestão do amido começa na boca, pela ação da amilase salivar.", "III. O estresse crônico pode agravar sintomas digestivos, por ação do sistema nervoso autônomo, sem que por isso seja a única causa da gastrite.", "É correto o que se afirma em"], "alts": ["I, apenas.", "II, apenas.", "I e II, apenas.", "I, II e III.", "II e III, apenas."], "gab": "D", "com": "Gabarito D. I verdadeira: é no estômago que a pepsina inicia a digestão das proteínas; II verdadeira: a amilase salivar (ptialina) inicia a quebra do amido; III verdadeira: a gastrite tem causas orgânicas frequentes, como a bactéria H. pylori e o uso de anti-inflamatórios, e o estresse pode agravar o quadro. A III é a que exige mais cuidado: reconhecer a influência do estresse sem transformá-lo em causa única, o que dispensaria indevidamente a avaliação médica. Sobre as demais: A) Deixa de fora a II, que é verdadeira; deixa de fora a III, que é verdadeira. B) Deixa de fora a I, que é verdadeira; deixa de fora a III, que é verdadeira. C) Deixa de fora a III, que é verdadeira. E) Deixa de fora a I, que é verdadeira.", "bl": "Analisar — pede julgar afirmações que relacionam fisiologia digestiva e trabalho", "cp": "II.4 · Avaliação, diagnóstico e intervenção: atuação em equipe inter e multiprofissional", "ob": "VIII · Bases biológicas do comportamento; XVIII · Saúde do trabalhador"}, {"tema": "Enade 2025 · Sistema cardiovascular — asserção-razão", "enun": ["Uma jovem chega ao pronto-socorro com o coração disparado, falta de ar e medo de morrer, num quadro compatível com crise de pânico. A psicóloga do plantão é chamada depois que a equipe médica descarta causas cardíacas.", "I. Na crise de pânico, a taquicardia pode resultar da ativação do sistema nervoso simpático sobre o nó sinoatrial", "PORQUE", "II. o nó sinoatrial, localizado no ventrículo esquerdo, é acelerado pelo nervo vago.", "A respeito dessas asserções, assinale a opção correta."], "alts": ["A asserção I é uma proposição verdadeira, e a II é uma proposição falsa.", "As asserções I e II são proposições verdadeiras, e a II é uma justificativa correta da I.", "As asserções I e II são proposições verdadeiras, mas a II não é uma justificativa correta da I.", "A asserção I é uma proposição falsa, e a II é uma proposição verdadeira.", "As asserções I e II são proposições falsas."], "gab": "A", "com": "Gabarito A. A I é verdadeira: o simpático aumenta a frequência de disparo do nó sinoatrial, o marca-passo natural. A II é falsa: o nó sinoatrial fica no átrio direito, e o vago (parassimpático) desacelera, não acelera, o coração. Repare também na ordem do atendimento: a hipótese de pânico só entra depois que a equipe descarta causa cardíaca. Sobre as demais: B) A II é falsa. C) A II é falsa. D) A I é verdadeira; a II é falsa. E) A I é verdadeira.", "bl": "Analisar — pede julgar proposições sobre controle autonômico do coração", "cp": "II.4 · Avaliação, diagnóstico e intervenção: atuação em equipe inter e multiprofissional", "ob": "VIII · Bases biológicas do comportamento; XI · Processos psicopatológicos"}]},"historia":{"nome":"História da Psicologia","qs":[{"tema":"Surgimento da psicologia científica — Wundt","enun":["Até o século XIX, as questões sobre a mente humana eram tratadas sobretudo pela filosofia. A psicologia só passou a ser reconhecida como ciência independente quando adotou métodos experimentais e um espaço próprio de pesquisa.","O marco tradicionalmente aceito para o nascimento da psicologia científica é:"],"alts":["A publicação de A interpretação dos sonhos, por Freud, em Viena, em 1900.","O manifesto behaviorista de Watson, nos Estados Unidos, em 1913.","A criação do primeiro laboratório de psicologia experimental por Wilhelm Wundt, em Leipzig, na Alemanha, em 1879.","A fundação da Associação Americana de Psicologia Humanista, em 1963.","A regulamentação da profissão de psicólogo no Brasil, em 1962."],"gab":"C","com":"O laboratório de Wundt em Leipzig, em 1879, é o marco porque levou o estudo da consciência para o controle experimental, separando a psicologia da filosofia. Wundt estudava os elementos da experiência consciente por introspecção controlada. As demais alternativas são marcos verdadeiros, mas de momentos posteriores: a psicanálise (1900), o behaviorismo (1913), a psicologia humanista (1963) e a profissão no Brasil (1962). Erro comum: escolher Freud por ser o nome mais conhecido."},{"tema":"Escolas do final do século XIX — funcionalismo","enun":["No final do século XIX, duas escolas disputavam como estudar a consciência. Uma, liderada por Titchener, queria decompô-la em seus elementos básicos. A outra, desenvolvida nos Estados Unidos e influenciada pela teoria da evolução de Darwin, perguntava para que serve a consciência.","A escola que se interessava pela utilidade da consciência na adaptação do indivíduo ao ambiente, e um de seus principais nomes, são:"],"alts":["Funcionalismo, com William James.","Estruturalismo, com Titchener.","Gestalt, com Wertheimer.","Behaviorismo, com Skinner.","Psicanálise, com Freud."],"gab":"A","com":"O funcionalismo, com William James (e depois Dewey e Angell), estudava a consciência pela sua função adaptativa, na linha de Darwin: perguntava o que ela faz e para que serve. O estruturalismo de Titchener perguntava do que ela é feita, decompondo-a em sensações, imagens e sentimentos. A dupla estrutura x função é a forma mais segura de não confundir as duas escolas. O funcionalismo abriu caminho para a psicologia aplicada e para o behaviorismo americano."},{"tema":"Escolas do final do século XIX — Gestalt","enun":["Na Alemanha, Wertheimer, Köhler e Koffka criticaram a ideia de que a experiência consciente pudesse ser entendida dividindo-a em elementos isolados. Para eles, percebemos totalidades organizadas, e o significado depende da relação entre as partes. O exemplo clássico é a imagem que pode ser vista ora como uma taça, ora como dois rostos de perfil.","A escola descrita e o princípio que ela defende são:"],"alts":["Estruturalismo: a consciência deve ser decomposta em elementos simples.","Behaviorismo: só o comportamento observável é objeto da psicologia.","Funcionalismo: a consciência deve ser estudada por sua utilidade adaptativa.","Psicanálise: o comportamento é determinado por conteúdos inconscientes.","Gestalt: o todo é mais do que a soma das partes."],"gab":"E","com":"A psicologia da Gestalt (palavra alemã para forma ou configuração) afirma que o todo é mais do que a soma das partes. A imagem da taça e dos rostos ilustra o princípio de figura e fundo: o mesmo estímulo muda de sentido conforme o que se destaca. A Gestalt surgiu justamente como crítica ao estruturalismo, citado em A. Não confunda a psicologia da Gestalt (percepção, início do século XX) com a Gestalt-terapia de Fritz Perls, que veio depois e se inspira nela."},{"tema":"Comportamentalismo — Watson","enun":["Em 1913, John B. Watson publicou um texto que ficou conhecido como o manifesto behaviorista. Nele, propôs uma ruptura com a psicologia da consciência praticada até então.","A proposta central de Watson era:"],"alts":["Estudar a mente por meio da introspecção controlada, como fazia Wundt.","Tomar como objeto da psicologia apenas o comportamento observável e mensurável, entendido como relação entre estímulo e resposta.","Investigar o inconsciente pela interpretação dos sonhos.","Considerar pensamentos e emoções como comportamentos a serem estudados.","Valorizar a liberdade e o protagonismo da pessoa na busca da autorrealização."],"gab":"B","com":"Watson fundou o behaviorismo metodológico: como pensamentos e emoções não podem ser observados nem medidos diretamente, ficariam fora da psicologia científica, que deveria estudar estímulos e respostas. Seu experimento mais famoso é o do Pequeno Albert (1920), com condicionamento de medo em um bebê. A alternativa D descreve o behaviorismo radical de Skinner, e essa é a diferença entre os dois que mais cai em prova."},{"tema":"Comportamentalismo — Pavlov","enun":["Em seus experimentos com cães, Ivan Pavlov tocava uma campainha pouco antes de oferecer comida. Depois de repetir a associação várias vezes, os cães passaram a salivar ao ouvir apenas a campainha, sem a presença do alimento.","Nesse experimento, a campainha, após o aprendizado, é chamada de:"],"alts":["Estímulo incondicionado.","Resposta incondicionada.","Reforço positivo.","Estímulo condicionado.","Punição negativa."],"gab":"D","com":"No condicionamento clássico (respondente), a comida é o estímulo incondicionado, porque provoca salivação naturalmente; a salivação diante dela é a resposta incondicionada. A campainha começa como estímulo neutro e, depois da associação repetida, vira estímulo condicionado, que produz a resposta condicionada (salivar ao som). Reforço e punição pertencem ao condicionamento operante de Skinner, em que o comportamento é controlado pelas consequências, e não pela associação entre estímulos."},{"tema":"Comportamentalismo — Skinner e o reforço negativo","enun":["Para Skinner, o comportamento é modelado por suas consequências. Consequências que aumentam a probabilidade de um comportamento se repetir são chamadas de reforço, que pode ser positivo (acrescenta algo) ou negativo (retira algo aversivo).","Uma pessoa com dor de cabeça toma um analgésico, e a dor passa. Desde então, sempre que sente dor de cabeça, ela toma o mesmo remédio. O comportamento de tomar o analgésico foi mantido por:"],"alts":["Reforço positivo, porque a pessoa ganhou um medicamento.","Reforço negativo, porque o comportamento retirou um estímulo aversivo, a dor.","Punição positiva, porque a pessoa sofreu com a dor.","Punição negativa, porque a pessoa perdeu a dor.","Condicionamento clássico, porque o remédio foi associado à dor."],"gab":"B","com":"Negativo, em Skinner, não significa ruim: significa que algo foi retirado. O comportamento de tomar o remédio retira a dor (aversiva) e, por isso, passa a se repetir. Isso é reforço negativo, e reforço sempre aumenta o comportamento. A punição, positiva ou negativa, diminui o comportamento, o que não ocorre aqui. Erro clássico: achar que reforço negativo é castigo. Compare com o exemplo da aula: a criança que chora e ganha chocolate recebe reforço positivo, porque algo foi acrescentado."},{"tema":"Desenvolvimento humano — estágios de Piaget","enun":["Jean Piaget descreveu o desenvolvimento cognitivo em quatro estágios: sensório-motor, pré-operatório, operatório concreto e operatório formal. Em cada um, a criança passa a pensar de uma forma qualitativamente diferente.","Uma criança observa a mesma quantidade de suco ser passada de um copo largo para um copo alto e fino e afirma que \"agora tem mais suco\", porque o nível subiu. Segundo Piaget, essa criança ainda não adquiriu a noção de conservação, o que é típico do estágio:"],"alts":["Operatório formal, aproximadamente a partir dos 12 anos.","Operatório concreto, aproximadamente dos 7 aos 11 anos.","Sensório-motor, aproximadamente do nascimento aos 2 anos.","Pré-operatório, aproximadamente dos 2 aos 7 anos.","Pós-formal, na idade adulta."],"gab":"D","com":"No estágio pré-operatório, o pensamento é centrado em um único aspecto do problema (aqui, a altura do líquido) e é irreversível: a criança não consegue imaginar o suco voltando ao copo original. Por isso não conserva a quantidade. A conservação aparece no estágio operatório concreto. No sensório-motor a criança ainda não domina a linguagem a ponto de responder à pergunta, e o pensamento abstrato e hipotético é marca do operatório formal. O \"pós-formal\" não faz parte dos quatro estágios de Piaget."},{"tema":"Comportamentalismo — behaviorismo radical","enun":["Burrhus F. Skinner é considerado o principal nome do behaviorismo radical, que se diferencia do behaviorismo metodológico de Watson.","Analise as asserções a seguir:","I. Para o behaviorismo radical, pensamentos e sentimentos podem ser objeto de estudo da psicologia","PORQUE","II. Skinner considera pensamentos e sentimentos como comportamentos encobertos (eventos privados), sujeitos às mesmas leis que regem o comportamento observável.","Acerca dessas asserções, assinale a opção correta:"],"alts":["As asserções I e II são proposições verdadeiras, e a II é uma justificativa correta da I.","As asserções I e II são proposições verdadeiras, mas a II não é uma justificativa correta da I.","A asserção I é uma proposição verdadeira, e a II é uma proposição falsa.","As asserções I e II são proposições falsas.","A asserção I é uma proposição falsa, e a II é uma proposição verdadeira."],"gab":"A","com":"As duas estão corretas e a II explica a I. O \"radical\" de Skinner não quer dizer extremista, mas que vai à raiz: tudo o que o organismo faz é comportamento, inclusive pensar e sentir, que são eventos privados, acessíveis só a quem os vive, mas explicáveis pelas mesmas contingências. Watson, ao contrário, deixava pensamentos e emoções fora da ciência por não serem observáveis."},{"tema":"TCC — níveis de cognição","enun":["A terapia cognitivo-comportamental, desenvolvida a partir dos trabalhos de Aaron Beck e Albert Ellis, entende que a forma como interpretamos as situações influencia nossas emoções e comportamentos. Beck descreveu três níveis de cognição.","Um paciente recusa um convite para dar uma palestra. Diante do convite, pensou: \"vou travar na frente de todos\". Na terapia, descobre que por trás desse pensamento há uma ideia rígida, formada na infância, de que \"sou incapaz\". Essa ideia rígida corresponde a:"],"alts":["Um pensamento automático.","Uma crença intermediária.","Um reforço negativo.","Um mecanismo de defesa.","Uma crença nuclear (esquema)."],"gab":"E","com":"Os três níveis de Beck vão do mais superficial ao mais profundo: pensamentos automáticos (\"vou travar na frente de todos\", que surgem diante da situação), crenças intermediárias (regras e pressupostos, como \"se eu não for perfeito, serei rejeitado\") e crenças nucleares ou esquemas (ideias globais e rígidas sobre si, os outros e o mundo, como \"sou incapaz\"). O exemplo é o da aula. Mecanismo de defesa é conceito psicanalítico, não da TCC."},{"tema":"As três forças da psicologia","enun":["Ao longo do século XX, costuma-se falar em três grandes forças da psicologia. A primeira foi a psicanálise e a segunda, o behaviorismo. A terceira surgiu nos Estados Unidos, nos anos 1950, como reação ao determinismo das duas anteriores, e enfatiza a liberdade, a experiência subjetiva e o potencial de crescimento do ser humano.","A terceira força e dois de seus principais representantes são:"],"alts":["Psicologia cognitiva, com Beck e Ellis.","Gestalt, com Wertheimer e Köhler.","Psicologia humanista, com Carl Rogers e Abraham Maslow.","Funcionalismo, com William James e John Dewey.","Psicologia analítica, com Jung e Adler."],"gab":"C","com":"A psicologia humanista é a terceira força: rejeita a ideia de que o ser humano seria determinado só pelo inconsciente (psicanálise) ou só pelo ambiente (behaviorismo), e aposta na liberdade de escolha e na tendência à autorrealização. Rogers e Maslow são seus nomes centrais. Beck e Ellis (A) são da terapia cognitiva; Wertheimer e Köhler (B), da Gestalt; James e Dewey (D), do funcionalismo. Jung e Adler (E) foram dissidentes da psicanálise."},{"tema":"Psicologia humanista — abordagem centrada na pessoa","enun":["Carl Rogers desenvolveu a abordagem centrada na pessoa, em que a relação terapêutica é o principal fator de mudança. O vídeo do atendimento a Gloria, gravado nos anos 1960, é frequentemente usado para ilustrar sua forma de conduzir a sessão.","Na abordagem de Rogers, a postura esperada do terapeuta é:"],"alts":["Interpretar os conteúdos inconscientes trazidos pelo paciente por meio da associação livre.","Identificar e modificar as contingências de reforço que mantêm o comportamento problema.","Dizer ao paciente o que é certo e errado, orientando suas escolhas.","Oferecer empatia, aceitação positiva incondicional e congruência, acolhendo sem julgar.","Aplicar testes padronizados para classificar a personalidade do paciente."],"gab":"D","com":"Rogers descreveu três condições para a mudança terapêutica: empatia (compreender o mundo do paciente como ele o vive), aceitação positiva incondicional (acolher sem julgar) e congruência (o terapeuta ser autêntico). O terapeuta não dirige nem impõe certo e errado, o que derruba C; a confiança está na capacidade da própria pessoa de crescer. A descreve a psicanálise, e B, a análise do comportamento."},{"tema":"Existencialismo — Sartre","enun":["A psicologia humanista e as abordagens existenciais dialogam com a filosofia de Jean-Paul Sartre, para quem o ser humano está \"condenado a ser livre\" e é responsável pelo que faz de si.","A frase de Sartre que resume essa visão e seu significado são:"],"alts":["\"A existência precede a essência\": ninguém nasce com um destino ou natureza definidos; a pessoa se constrói por suas escolhas.","\"Penso, logo existo\": a certeza da própria existência vem do pensamento.","\"O todo é mais do que a soma das partes\": a percepção organiza totalidades.","\"Onde estava o id, o ego deve advir\": o objetivo da análise é ampliar o eu.","\"A essência precede a existência\": cada pessoa nasce com uma natureza que define o que ela será."],"gab":"A","com":"Para Sartre, primeiro existimos e só depois, pelas escolhas, nos definimos: não há uma essência dada de antemão. Daí a responsabilidade total pelas escolhas feitas e pelas não feitas, ideia trabalhada em aula com o tema do protagonismo. E inverte a frase. \"Penso, logo existo\" é de Descartes; \"o todo é mais do que a soma das partes\" é o lema da Gestalt; e a frase sobre id e ego é de Freud."},{"tema":"Logoterapia — Viktor Frankl","enun":["Psiquiatra austríaco, sobrevivente de campos de concentração nazistas, Viktor Frankl observou que as pessoas que encontravam algum sentido para o sofrimento tinham mais chance de resistir. A partir disso, desenvolveu uma abordagem terapêutica própria.","A abordagem de Frankl e seu foco principal são:"],"alts":["Psicanálise, com foco na interpretação dos sonhos.","Gestalt-terapia, com foco no fechamento de gestalts abertas.","Terapia cognitivo-comportamental, com foco na reestruturação de crenças.","Análise do comportamento, com foco nas contingências de reforço.","Logoterapia, com foco na busca de sentido para a vida."],"gab":"E","com":"A logoterapia (de logos, que aqui quer dizer sentido) entende que a principal motivação humana é encontrar sentido, e que cada pessoa tem o seu, mesmo diante de sofrimento inevitável. A experiência de Frankl nos campos está no livro Em busca de sentido. Costuma ser chamada de terceira escola vienense de psicoterapia, depois da psicanálise de Freud e da psicologia individual de Adler."},{"tema":"Psicologia no Brasil — regulamentação","enun":["Os primeiros trabalhos de psicologia no Brasil foram feitos por médicos, e a aplicação de testes psicológicos vindos da Europa e dos Estados Unidos contribuiu para acelerar o reconhecimento da área. A profissão de psicólogo, porém, só foi regulamentada por lei na segunda metade do século XX.","A lei que regulamentou a profissão de psicólogo e os cursos de formação no Brasil é:"],"alts":["A Lei 5.766/1971, que criou o Conselho Federal de Psicologia.","A Lei 4.119, de 27 de agosto de 1962.","A Constituição Federal de 1988.","A Lei de Diretrizes e Bases da Educação, de 1996.","O Código de Ética Profissional do Psicólogo, de 2005."],"gab":"B","com":"A Lei 4.119, de 27 de agosto de 1962, regulamentou a profissão e os cursos de psicologia; por isso 27 de agosto é o Dia do Psicólogo no Brasil. A Lei 5.766/1971 é real, mas criou o Conselho Federal e os Conselhos Regionais, que fiscalizam a profissão, e não a regulamentou. O Código de Ética em vigor é de 2005 (Resolução CFP 10/2005), mas é uma norma do Conselho, não a lei da profissão. O professor avisou que a história da psicologia no Brasil pode cair na avaliação integrada."},{"tema":"Psicanálise — principais nomes","enun":["A psicanálise foi criada por Sigmund Freud no final do século XIX e, ao longo do século XX, se desenvolveu em várias escolas, com autores que ampliaram ou reformularam suas ideias, especialmente sobre o inconsciente e as primeiras relações da criança.","Assinale a alternativa que apresenta um autor que NÃO pertence à tradição psicanalítica:"],"alts":["Melanie Klein.","Donald Winnicott.","B. F. Skinner.","Jacques Lacan.","Wilfred Bion."],"gab":"C","com":"Skinner é o principal nome do behaviorismo radical, que rejeita o inconsciente como explicação do comportamento. Klein (relações de objeto, mundo interno do bebê), Winnicott (ambiente suficientemente bom, objeto transicional), Lacan (retorno a Freud, o inconsciente estruturado como linguagem) e Bion (pensamento, continente e contido) são autores centrais da psicanálise depois de Freud."},{"tema":"Conceito de subjetividade","enun":["A subjetividade é um dos conceitos centrais da psicologia. Refere-se ao mundo interno de cada pessoa, ao seu modo singular de sentir, pensar e agir, formado ao longo da história de vida, nas relações com os outros e com a cultura.","Analise as asserções a seguir:","I. A subjetividade é inata e permanece igual ao longo de toda a vida da pessoa","PORQUE","II. a subjetividade é determinada exclusivamente pela herança genética, sem influência das relações sociais e da cultura.","Acerca dessas asserções, assinale a opção correta:"],"alts":["As asserções I e II são proposições verdadeiras, e a II é uma justificativa correta da I.","As asserções I e II são proposições verdadeiras, mas a II não é uma justificativa correta da I.","A asserção I é uma proposição verdadeira, e a II é uma proposição falsa.","As asserções I e II são proposições falsas.","A asserção I é uma proposição falsa, e a II é uma proposição verdadeira."],"gab":"D","com":"As duas asserções são falsas. A subjetividade não é inata nem fixa: constrói-se e se transforma ao longo da vida, nas relações sociais, na cultura e na história de cada um. A biologia oferece condições, mas não a determina sozinha, o que torna a II falsa também. Note que o próprio enunciado já define a subjetividade como \"formada ao longo da história de vida\", uma pista que contradiz as duas asserções."},{"tema": "Enade 2025 · Psicologia como ciência — situação-problema com afirmativas", "enun": ["Uma estudante de Psicologia quer provar, num trabalho de iniciação científica, a eficácia de uma técnica de \"reprogramação emocional\" divulgada nas redes sociais. Seu plano é reunir depoimentos de clientes satisfeitos publicados no perfil do criador da técnica.", "Avalie as afirmações a seguir.", "I. Depoimentos escolhidos pelo próprio divulgador não permitem verificar a validade da técnica, porque não foram obtidos de forma sistemática e controlada.", "II. Um desenho mais adequado definiria antes os critérios de resultado e compararia quem recebeu a técnica com um grupo de comparação.", "III. O Código de Ética Profissional do Psicólogo (Resolução CFP nº 10/2005, art. 1º, alínea c) prevê como dever prestar serviços com técnicas reconhecidamente fundamentadas na ciência psicológica.", "É correto o que se afirma em"], "alts": ["I, apenas.", "II, apenas.", "I e II, apenas.", "I, II e III.", "II e III, apenas."], "gab": "D", "com": "Gabarito D. I verdadeira: a ciência exige conhecimento obtido de forma programada, sistemática e controlada, e depoimentos selecionados não cumprem isso; II verdadeira: critérios definidos de antemão e comparação permitem separar o efeito da técnica de outros fatores; III verdadeira: é o texto do art. 1º, c, do Código de Ética. A questão junta a definição de ciência vista na disciplina com o desenho de pesquisa e a ética profissional. Sobre as demais: A) Deixa de fora a II, que é verdadeira; deixa de fora a III, que é verdadeira. B) Deixa de fora a I, que é verdadeira; deixa de fora a III, que é verdadeira. C) Deixa de fora a III, que é verdadeira. E) Deixa de fora a I, que é verdadeira.", "bl": "Avaliar — pede julgar a validade de um plano de pesquisa e sua adequação ética", "cp": "I.3 · Pesquisa e produção de conhecimento: planejar e conduzir pesquisa científica; I.1 · Pesquisa e produção de conhecimento: dominar fundamentos teóricos, metodológicos e epistemológicos", "ob": "I · Bases epistemológicas e históricas; II · Métodos e técnicas de pesquisa; III · Ética profissional"}, {"tema": "Enade 2025 · Processo saúde-doença — situação-problema", "enun": ["A família de um homem com diagnóstico de esquizofrenia, que faz acompanhamento num CAPS e está estável, pede à psicóloga que ajude a interná-lo \"por tempo indeterminado\" num hospital psiquiátrico, porque \"lá é o lugar dele\". Pela história da Psicologia, essa ideia lembra o modelo asilar, em que isolar a pessoa era o próprio tratamento.", "À luz da Lei nº 10.216/2001, que trata da proteção e dos direitos das pessoas com transtornos mentais, a orientação correta é:"], "alts": ["A internação só é indicada quando os recursos extra-hospitalares se mostrarem insuficientes, e o tratamento deve visar, como finalidade permanente, à reinserção social da pessoa em seu meio.", "A família pode decidir a internação involuntária sem laudo médico, desde que o paciente more com ela.", "O isolamento prolongado continua sendo a forma preferencial de tratamento, porque protege a família e a comunidade.", "O CAPS só pode atender a pessoa depois de uma internação hospitalar prévia.", "A internação por tempo indeterminado é obrigatória para quem tem diagnóstico de esquizofrenia."], "gab": "A", "com": "Gabarito A. É o que dizem o art. 4º, caput e § 1º, da Lei 10.216/2001: internação só quando os recursos extra-hospitalares forem insuficientes, e reinserção social como finalidade permanente. Sobre as demais: B) A lei exige laudo médico circunstanciado para qualquer internação (art. 6º), e a involuntária deve ser comunicada ao Ministério Público em até 72 horas (art. 8º, § 1º). C) É justamente o modelo asilar que a lei e a Reforma Psiquiátrica superam. D) O CAPS é serviço de base comunitária e porta de entrada da rede; não exige internação prévia. E) Nenhum diagnóstico, por si, obriga a internação; o caso descrito, aliás, está estável.", "bl": "Aplicar — pede aplicar a legislação de saúde mental a um caso concreto", "cp": "II.1 · Avaliação, diagnóstico e intervenção: processos psicossociais e populações vulneráveis", "ob": "V · Políticas públicas; IV · Direitos humanos; I · Bases epistemológicas e históricas"}, {"tema": "Enade 2025 · Escolas da Psicologia — situação-problema com afirmativas", "enun": ["Três projetos de pesquisa estudam como motoristas reagem às placas de trânsito.", "Projeto A: participantes treinados descrevem as sensações elementares (cor, brilho, forma) que experimentam ao ver a placa.\nProjeto B: investiga por que a placa é percebida como uma forma organizada, cujo sentido depende do conjunto e não das partes isoladas.\nProjeto C: mede apenas o tempo entre o aparecimento da placa e o pé no freio, sem coletar nenhum relato dos participantes.", "Avalie as afirmações a seguir.", "I. O projeto A se aproxima do estruturalismo de Wundt e Titchener, que decompunha a experiência consciente em elementos por meio da introspecção.", "II. O projeto B se aproxima da Gestalt, para a qual o todo percebido é mais do que a soma das partes.", "III. O projeto C se aproxima do funcionalismo de William James, que recusava o estudo da consciência.", "É correto o que se afirma em"], "alts": ["I, apenas.", "III, apenas.", "I e II, apenas.", "II e III, apenas.", "I, II e III."], "gab": "C", "com": "Gabarito C. I verdadeira: decompor em sensações elementares por introspecção treinada é o método estruturalista; II verdadeira: é o princípio central da Gestalt; III falsa: James estudava justamente a consciência e sua função adaptativa; medir só a resposta observável, sem relato, é a proposta do behaviorismo de Watson. A questão cobra a pergunta que cada escola fazia e o método que usava, não só os nomes. Sobre as demais: A) Deixa de fora a II, que é verdadeira. B) Deixa de fora a I, que é verdadeira; deixa de fora a II, que é verdadeira; inclui a III, que é falsa (James estudava justamente a consciência e sua função adaptativa; medir só a resposta observável, sem relato, é a proposta do behaviorismo de Watson). D) Deixa de fora a I, que é verdadeira; inclui a III, que é falsa (James estudava justamente a consciência e sua função adaptativa; medir só a resposta observável, sem relato, é a proposta do behaviorismo de Watson). E) Inclui a III, que é falsa (James estudava justamente a consciência e sua função adaptativa; medir só a resposta observável, sem relato, é a proposta do behaviorismo de Watson).", "bl": "Analisar — exige relacionar desenhos de pesquisa às escolas e seus métodos", "cp": "I.1 · Pesquisa e produção de conhecimento: dominar fundamentos teóricos, metodológicos e epistemológicos", "ob": "I · Bases epistemológicas e históricas; II · Métodos e técnicas de pesquisa"}, {"tema": "Enade 2025 · Psicanálise — situação-problema com afirmativas", "enun": ["Uma paciente em psicoterapia de orientação psicanalítica conta, sem dar importância, que já \"esqueceu\" três vezes o retorno ao médico que vai lhe entregar o resultado de uma biópsia. Diz que é \"só cabeça cheia\".", "Avalie as afirmações a seguir.", "I. Para a psicanálise, esses esquecimentos são falhas de memória sem sentido psíquico, explicadas pelo cansaço.", "II. Se houver aí uma defesa contra a angústia, ela opera de forma inconsciente, pelo ego, o que explica por que a paciente não percebe a relação.", "III. A interpretação deve levar em conta o vínculo e o momento da análise; comunicá-la de forma prematura, sem que a paciente possa elaborá-la, tende a reforçar a resistência.", "É correto o que se afirma em"], "alts": ["I, apenas.", "II, apenas.", "I e III, apenas.", "I, II e III.", "II e III, apenas."], "gab": "E", "com": "Gabarito E. I falsa: Freud tratou os esquecimentos e atos falhos como formações do inconsciente, com sentido; II verdadeira: os mecanismos de defesa são processos inconscientes do ego; III verdadeira: é a crítica de Freud à chamada psicanálise \"selvagem\", em texto de 1910. Além de reconhecer o ato falho e a defesa, a questão pede um juízo sobre o manejo clínico. Sobre as demais: A) Inclui a I, que é falsa (Freud tratou os esquecimentos e atos falhos como formações do inconsciente, com sentido); deixa de fora a II, que é verdadeira; deixa de fora a III, que é verdadeira. B) Deixa de fora a III, que é verdadeira. C) Inclui a I, que é falsa (Freud tratou os esquecimentos e atos falhos como formações do inconsciente, com sentido); deixa de fora a II, que é verdadeira. D) Inclui a I, que é falsa (Freud tratou os esquecimentos e atos falhos como formações do inconsciente, com sentido).", "bl": "Avaliar — pede julgar a leitura e o manejo de um fenômeno clínico", "cp": "II.3 · Avaliação, diagnóstico e intervenção: avaliação, psicodiagnóstico e intervenção clínica", "ob": "XIV · Processos clínicos; I · Bases epistemológicas e históricas"}, {"tema": "Enade 2025 · Behaviorismo — situação-problema", "enun": ["Numa sala do 1º ano, um menino faz birra sempre que recebe uma atividade de escrita. A professora, então, senta-se ao lado dele, conversa e o acalma até que ele comece. A psicóloga escolar faz a análise funcional do comportamento.", "A conclusão e a intervenção mais adequadas, segundo a análise do comportamento, são:"], "alts": ["A atenção da professora é um reforço negativo, porque é desagradável para a criança, e por isso deve ser mantida.", "A atenção da professora pode estar funcionando como reforço positivo da birra; a intervenção é deixar de reforçar a birra e reforçar comportamentos alternativos, como pedir ajuda.", "A birra é um reflexo inato, sem relação com as consequências, e só pode ser tratada com medicação.", "A melhor intervenção é a punição física moderada, por ser a forma mais rápida de reduzir o comportamento.", "O caso é de condicionamento clássico, porque a atividade foi pareada com a birra."], "gab": "B", "com": "Gabarito B. A birra é seguida de algo acrescentado (atenção), e o comportamento se mantém: reforço positivo. Retirar o reforço da birra (extinção) e reforçar um comportamento alternativo é a intervenção típica. Espere uma piora inicial, a explosão da extinção. Sobre as demais: A) Reforço negativo é a retirada de algo aversivo. Aqui algo é acrescentado. C) O padrão de repetição ligado à consequência indica comportamento operante, não reflexo. D) Além de produzir efeitos colaterais conhecidos, o castigo físico é vedado pelo ECA (art. 18-A, incluído pela Lei nº 13.010/2014). E) O comportamento é mantido pela consequência que o segue, o que caracteriza o condicionamento operante.", "bl": "Aplicar — pede aplicar a análise funcional a um caso escolar e escolher a intervenção", "cp": "II.5 · Avaliação, diagnóstico e intervenção: processos educativos", "ob": "XV · Ensino e aprendizagem; X · Processos psicológicos básicos; IV · Direitos humanos"}, {"tema": "Enade 2025 · Teorias do desenvolvimento — asserção-razão", "enun": ["Numa turma do 2º ano, a professora organiza duplas com crianças em níveis diferentes de leitura para atividades guiadas, em que a mais experiente lê junto com a outra e a ajuda a decifrar as palavras novas.", "I. A estratégia da professora tem fundamento na teoria de Vygotsky", "PORQUE", "II. o que a criança consegue fazer com a ajuda de um parceiro mais experiente indica funções em processo de amadurecimento, ou seja, a zona de desenvolvimento proximal.", "A respeito dessas asserções, assinale a opção correta."], "alts": ["As asserções I e II são proposições verdadeiras, mas a II não é uma justificativa correta da I.", "A asserção I é uma proposição verdadeira, e a II é uma proposição falsa.", "A asserção I é uma proposição falsa, e a II é uma proposição verdadeira.", "As asserções I e II são proposições verdadeiras, e a II é uma justificativa correta da I.", "As asserções I e II são proposições falsas."], "gab": "D", "com": "Gabarito D. A I é verdadeira: a interação com um parceiro mais experiente é central na perspectiva sociointeracionista. A II é verdadeira: é a definição da zona de desenvolvimento proximal. A II explica a I: a estratégia funciona porque atua na distância entre o que a criança faz sozinha e o que faz com ajuda. Sobre as demais: A) A II explica a I. B) A II é verdadeira. C) A I é verdadeira. E) A I é verdadeira; a II é verdadeira.", "bl": "Analisar — pede julgar duas proposições e a relação causal entre elas", "cp": "II.5 · Avaliação, diagnóstico e intervenção: processos educativos", "ob": "IX · Desenvolvimento humano; XV · Ensino e aprendizagem"}]}};
const L=['A','B','C','D','E'];let cur='anatomia';const st={anatomia:{},historia:{}};
function esc(s){return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
function para(t){const m=t.match(/^(I{1,2}\.)\s(.*)$/);if(m)return '<p><b>'+m[1]+'</b> '+esc(m[2])+'</p>';
 const b=t==='PORQUE'||(t.endsWith(':')&&t.length<220);return '<p'+(b?' class="b"':'')+'>'+esc(t)+'</p>'}
function render(){
 document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on',b.dataset.k===cur));
 const d=DATA[cur],s=st[cur];
 document.getElementById('lista').innerHTML=d.qs.map((q,i)=>{const r=s[i];
  return '<section class="q" id="q'+i+'"><div class="qt"><h2>Título da questão '+(i+1)+'</h2><span class="pts">5 PONTOS</span></div>'+
  '<div class="tema">'+esc(q.tema)+'</div>'+q.enun.map(para).join('')+'<div class="alts">'+
  q.alts.map((a,j)=>{let c='';if(r!==undefined){if(L[j]===q.gab)c=' ok';else if(j===r)c=' no'}
   return '<button class="alt'+c+'" data-i="'+i+'" data-j="'+j+'"'+(r!==undefined?' disabled':'')+'><span class="l">'+L[j]+'</span><span class="t">'+esc(a)+'</span></button>'}).join('')+
  '</div><div class="com'+(r!==undefined?' show':'')+'"><strong>'+(r===undefined?'':(L[r]===q.gab?'Acertou! Gabarito: '+q.gab:'Gabarito: '+q.gab+' (você marcou '+L[r]+')'))+'</strong>'+esc(q.com)+(q.bl?'<div style="margin-top:10px;padding-top:8px;border-top:1px dashed #d1d5db;font-size:13px;color:#374151"><b>Bloom:</b> '+esc(q.bl)+'<br><b>Competência avaliada (art. 5º):</b> '+esc(q.cp)+'<br><b>Objeto de conhecimento (art. 6º):</b> '+esc(q.ob)+'</div>':'')+'</div></section>'}).join('');
 upd()}
function upd(){const d=DATA[cur],s=st[cur],n=Object.keys(s).length,ac=Object.entries(s).filter(([i,j])=>L[j]===d.qs[i].gab).length;
 document.getElementById('sc').innerHTML='<b>'+d.nome+'</b> · '+n+'/'+d.qs.length+' respondidas · '+ac+' acertos ('+ac*5+' pts)';
 document.getElementById('bar').style.width=(n/d.qs.length*100)+'%';
 const f=document.getElementById('fim');
 if(n===d.qs.length){const er=d.qs.map((q,i)=>L[s[i]]!==q.gab?(i+1)+'. '+q.tema:null).filter(Boolean);
  f.innerHTML='<div>Resultado final</div><div class="n">'+ac+'/'+d.qs.length+'</div><div>'+ac*5+' de '+d.qs.length*5+' pontos</div>'+
  (er.length?'<div class="erradas"><b>Revisar:</b><br>'+er.map(esc).join('<br>')+'</div>':'<div class="erradas">Gabaritou tudo.</div>');f.classList.add('show')}
 else f.classList.remove('show')}
document.getElementById('lista').addEventListener('click',e=>{const b=e.target.closest('.alt');if(!b||b.disabled)return;
 const i=+b.dataset.i,j=+b.dataset.j;st[cur][i]=j;const y=window.scrollY;render();window.scrollTo(0,y);
 const sec=document.getElementById('q'+i);sec.querySelector('.com').scrollIntoView({behavior:'smooth',block:'nearest'})});
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{location.hash=b.dataset.k});
document.getElementById('reset').onclick=()=>{st[cur]={};render();window.scrollTo(0,0)};
function route(){const h=location.hash.slice(1);cur=DATA[h]?h:'anatomia';render();window.scrollTo(0,0)}
window.addEventListener('hashchange',route);route();
</script></body></html>
