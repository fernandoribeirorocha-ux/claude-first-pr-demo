<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Carteira de Jogos</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Conceito: carteira de bilhetes. Cada loteria é uma aba com a sua tinta; cada jogo é um mini volante
   com a mesma grade do volante de papel, e o resultado sorteado se sobrepõe aos jogos. */
:root {
  --bg: #F2F3F8;
  --surface: #FFFFFF;
  --surface-2: #E8EBF4;
  --ink: #12172B;
  --ink-2: #565D7C;
  --line: #D5D9E8;
  --cell: #8A90A8;
  --hit: #E5A100;
  --hit-ink: #2A1C00;
  --ok: #11804A;
  --font: 'Bricolage Grotesque', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --mono: 'DM Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
  --g: #8E24AA; --g-ink: #FFFFFF;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0B0F1F; --surface: #141A31; --surface-2: #1C2442; --ink: #EDEFFA; --ink-2: #98A2C9; --line: #283058; --cell: #5A6490;
    --hit: #F4B72C; --hit-ink: #2A1C00; --ok: #4FC48B; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0B0F1F; --surface: #141A31; --surface-2: #1C2442; --ink: #EDEFFA; --ink-2: #98A2C9; --line: #283058; --cell: #5A6490;
  --hit: #F4B72C; --hit-ink: #2A1C00; --ok: #4FC48B; color-scheme: dark;
}
.g-lotofacil { --g: #8E24AA; --g-ink: #fff; }
.g-megasena { --g: #0B7A40; --g-ink: #fff; }
.g-quina { --g: #1F6FD1; --g-ink: #fff; }
.g-duplasena { --g: #C62833; --g-ink: #fff; }
.g-diadesorte { --g: #D99A00; --g-ink: #1D1400; }
.g-timemania { --g: #007A6F; --g-ink: #fff; }
.g-lotomania { --g: #B8450A; --g-ink: #fff; }
.g-supersete { --g: #8CB800; --g-ink: #142006; }
.g-maismilionaria { --g: #3C3FB8; --g-ink: #fff; }

* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 15px; line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 22px 56px;
}
a { color: inherit; }
button, input { font: inherit; color: inherit; }
.wrap { max-width: 1180px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }
.mono, .num { font-family: var(--mono); font-variant-numeric: tabular-nums; }

/* cabeçalho e abas */
.top { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.brand { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.brand h1 { margin: 0; font-size: 1.45rem; font-weight: 750; letter-spacing: -0.02em; font-variation-settings: 'opsz' 48; }
.brand p { margin: 0; color: var(--ink-2); font-size: .85rem; }
.tabs { display: flex; gap: 6px; overflow-x: auto; padding: 2px 0 8px; scrollbar-width: thin; border-bottom: 1px solid var(--line); }
.tab {
  flex: 0 0 auto; display: inline-flex; align-items: center; gap: 8px; text-decoration: none; white-space: nowrap;
  min-height: 44px; padding: 8px 13px; border-radius: 999px; font-weight: 560; font-size: .9rem; color: var(--ink-2);
  border: 1px solid transparent;
}
.tab:hover { color: var(--ink); background: var(--surface-2); }
.tab[aria-current="page"] { color: var(--ink); background: var(--surface); border-color: var(--line); box-shadow: 0 1px 0 var(--line); }
.tab i { width: 10px; height: 10px; border-radius: 3px; background: var(--g); flex: none; }
.tab:focus-visible, .seg a:focus-visible, button:focus-visible, input:focus-visible, summary:focus-visible { outline: 2px solid var(--hit); outline-offset: 2px; }

/* resumo */
.lede { margin: 0; max-width: 62ch; color: var(--ink-2); font-size: 1rem; }
.lot { display: flex; flex-direction: column; gap: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.lot-h { display: flex; align-items: center; gap: 10px; padding: 12px 16px; background: var(--surface-2); font-weight: 680; letter-spacing: -0.01em; }
.lot-h i { width: 12px; height: 12px; border-radius: 3px; background: var(--g); }
.lot-h span { color: var(--ink-2); font-weight: 450; font-size: .85rem; margin-left: auto; }
.rowp {
  display: grid; grid-template-columns: minmax(150px, 1.2fr) 70px 100px minmax(160px, 2fr) 130px; gap: 14px; align-items: center;
  padding: 12px 16px; text-decoration: none; border-top: 1px solid var(--line);
}
.rowp:hover { background: var(--surface-2); }
.rowp .nm { font-weight: 600; min-width: 0; }
.rowp .nm small { display: block; color: var(--ink-2); font-weight: 400; font-size: .78rem; }
.rowp .c { text-align: right; font-size: .88rem; }
.bar { display: flex; align-items: center; gap: 10px; min-width: 0; }
.bar > b { flex: 1 1 auto; height: 8px; border-radius: 4px; background: var(--surface-2); position: relative; overflow: hidden; min-width: 40px; }
.bar > b > u { position: absolute; inset: 0 auto 0 0; background: var(--g); border-radius: 4px; text-decoration: none; }
.bar > span { font-family: var(--mono); font-size: .85rem; min-width: 56px; text-align: right; }
.colh { display: grid; grid-template-columns: minmax(150px, 1.2fr) 70px 100px minmax(160px, 2fr) 130px; gap: 14px; padding: 0 16px; color: var(--ink-2); font-size: .74rem; letter-spacing: .06em; text-transform: uppercase; }
.colh span:nth-child(2), .colh span:nth-child(3), .colh span:nth-child(5) { text-align: right; }
.legend { margin: 0; color: var(--ink-2); font-size: .82rem; max-width: 80ch; }

/* pacote */
.head { display: flex; flex-direction: column; gap: 6px; }
.eyebrow { display: inline-flex; align-items: center; gap: 8px; margin: 0; font-size: .78rem; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2); font-weight: 600; }
.eyebrow i { width: 10px; height: 10px; border-radius: 3px; background: var(--g); }
.head h2 { margin: 0; font-size: clamp(1.7rem, 4.6vw, 2.5rem); line-height: 1.05; letter-spacing: -0.03em; font-weight: 760; font-variation-settings: 'opsz' 72; text-wrap: balance; }
.head p.sub { margin: 0; color: var(--ink-2); max-width: 70ch; }
.seg { display: flex; flex-wrap: wrap; gap: 6px; }
.seg a { display: inline-flex; align-items: center; min-height: 44px; text-decoration: none; padding: 7px 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); font-weight: 560; font-size: .88rem; color: var(--ink-2); }
.seg a[aria-current="page"] { background: var(--g); color: var(--g-ink); border-color: transparent; }
.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); margin: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; }
.facts > div { padding: 14px 18px; display: flex; flex-direction: column; gap: 2px; min-width: 0; border-left: 1px solid var(--line); }
.facts > div:first-child { border-left: 0; }
.facts dt { font-size: .74rem; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-2); font-weight: 600; }
.facts dd { margin: 0; font-size: clamp(1.25rem, 5.2vw, 1.55rem); font-weight: 720; letter-spacing: -0.02em; font-family: var(--mono); font-variant-numeric: tabular-nums; }
.facts dd .pre { font-family: var(--font); font-size: .82rem; font-weight: 500; color: var(--ink-2); letter-spacing: 0; }
.facts dd small { display: block; font-size: .78rem; font-weight: 400; color: var(--ink-2); font-family: var(--font); letter-spacing: 0; }
@media (max-width: 640px) { .facts > div { border-left: 0; border-top: 1px solid var(--line); } .facts > div:first-child { border-top: 0; } }
.check { display: flex; flex-direction: column; gap: 10px; padding: 16px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; }
.check h3 { margin: 0; font-size: 1rem; font-weight: 680; }
.check .inputs { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.check label { font-size: .8rem; color: var(--ink-2); font-weight: 560; display: flex; flex-direction: column; gap: 4px; flex: 1 1 260px; min-width: 0; }
.check input[type=text] { width: 100%; padding: 10px 12px; border-radius: 9px; border: 1px solid var(--line); background: var(--bg); font-family: var(--mono); font-size: .95rem; letter-spacing: .02em; }
.btn { min-height: 44px; padding: 9px 14px; border-radius: 9px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-weight: 560; font-size: .86rem; }
.btn:hover { background: var(--surface-2); }
.btn.pri { background: var(--g); color: var(--g-ink); border-color: transparent; }
.summary { margin: 0; font-size: .92rem; min-height: 1.4em; color: var(--ink-2); }
.summary b { color: var(--ink); }
.toolbar { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; justify-content: space-between; }
.toolbar .l { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.prog { font-family: var(--mono); font-size: .85rem; color: var(--ink-2); }
.sw { display: inline-flex; align-items: center; gap: 8px; font-size: .86rem; color: var(--ink-2); cursor: pointer; min-height: 44px; }
.sw input { accent-color: var(--g); width: 20px; height: 20px; }

/* bilhetes */
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(var(--minw, 230px), 1fr)); gap: 16px; }
.ticket { position: relative; display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; min-width: 0; }
.ticket.done { opacity: .62; }
.ticket.win { border-color: var(--hit); box-shadow: 0 0 0 1px var(--hit); }
.t-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 12px 14px 6px; }
.t-top .n { font-family: var(--mono); font-size: .78rem; color: var(--ink-2); letter-spacing: .04em; }
.badge { font-family: var(--mono); font-size: .76rem; padding: 3px 8px; border-radius: 999px; background: var(--surface-2); color: var(--ink-2); font-weight: 500; white-space: nowrap; }
.badge.prize { background: var(--hit); color: var(--hit-ink); font-weight: 600; }
.volante { display: grid; gap: 3px; padding: 4px 14px 12px; }
.volante .c {
  aspect-ratio: 1 / 1; display: grid; place-items: center; border-radius: 4px; border: 1px solid var(--cell);
  font-family: var(--mono); font-size: var(--fs, .69rem); color: var(--ink-2); line-height: 1; min-width: 0; overflow: hidden;
}
.volante .c.on { background: var(--g); color: var(--g-ink); border-color: transparent; font-weight: 600; }
.volante .c.hit { background: var(--g); color: var(--g-ink); border-color: transparent; font-weight: 700; box-shadow: 0 0 0 1.5px var(--surface), 0 0 0 3.5px var(--hit); position: relative; z-index: 1; }
.volante .c.miss { border: 1.5px dashed var(--hit); color: var(--ink); }
.volante .c.blank { border: 0; }
.sub-l { padding: 0 14px 10px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: .76rem; color: var(--ink-2); }
.minirow { display: grid; gap: 3px; flex: 1 1 auto; }
.minirow .c { aspect-ratio: 1/1; display: grid; place-items: center; border-radius: 4px; border: 1px solid var(--cell); font-family: var(--mono); font-size: .69rem; }
.minirow .c.on { background: var(--g); color: var(--g-ink); border-color: transparent; font-weight: 600; }
.stub { margin-top: auto; border-top: 2px dashed var(--line); padding: 10px 14px 12px; display: flex; flex-direction: column; gap: 8px; position: relative; }
.stub::before, .stub::after { content: ""; position: absolute; top: -9px; width: 16px; height: 16px; border-radius: 50%; background: var(--bg); border: 1px solid var(--line); }
.stub::before { left: -9px; clip-path: inset(0 0 0 50%); border-left: 0; }
.stub::after { right: -9px; clip-path: inset(0 50% 0 0); border-right: 0; }
.stub .nums { font-family: var(--mono); font-size: .8rem; letter-spacing: .02em; word-spacing: .15em; overflow-wrap: anywhere; }
.stub details summary { cursor: pointer; font-size: .8rem; color: var(--ink-2); }
.stub .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.stub .row label { display: inline-flex; gap: 9px; align-items: center; font-size: .88rem; cursor: pointer; min-height: 44px; padding-right: 8px; }
.stub .row input { accent-color: var(--g); width: 20px; height: 20px; }
.mini { font-size: .82rem; padding: 6px 12px; min-height: 40px; }
.extra { font-size: .78rem; background: var(--surface-2); padding: 3px 8px; border-radius: 6px; color: var(--ink); font-weight: 560; }

.more { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
.bet { display: block; }
.betcard { max-width: 480px; margin: 0 auto; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 6px 4px 14px; display: flex; flex-direction: column; gap: 10px; }
.bethead { display: flex; justify-content: space-between; align-items: center; padding: 10px 14px 0; }
.bethead .n { font-family: var(--mono); font-size: .9rem; letter-spacing: .04em; font-weight: 500; }
.betbar { height: 6px; margin: 0 14px; border-radius: 3px; background: var(--surface-2); overflow: hidden; }
.betbar u { display: block; height: 100%; background: var(--g); text-decoration: none; }
.bet .volante { gap: 4px; }
.bet .volante .c { font-size: clamp(.8rem, 3.3vw, 1.05rem); border-radius: 6px; }
.betnums { font-family: var(--mono); font-size: 1.05rem; letter-spacing: .03em; word-spacing: .2em; padding: 0 14px; overflow-wrap: anywhere; font-weight: 500; }
.betact { display: grid; grid-template-columns: 1fr 1fr 2fr; gap: 8px; padding: 0 14px; }
.betact .btn { min-height: 52px; font-size: .95rem; }
.betact2 { display: flex; justify-content: space-between; gap: 8px; padding: 0 14px; }
.betdone { max-width: 480px; margin: 0 auto; text-align: center; padding: 28px 16px; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; display: flex; flex-direction: column; gap: 14px; align-items: center; }
.betdone h3 { margin: 0; font-size: 1.1rem; text-wrap: balance; }
.spend { margin: 0; padding: 12px 16px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; font-size: .92rem; max-width: 80ch; }
.det { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 4px 16px; }
.det summary { cursor: pointer; padding: 12px 0; font-weight: 640; }
.tbl { width: 100%; border-collapse: collapse; margin: 0 0 12px; font-size: .9rem; }
.tblw { overflow-x: auto; }
.tbl th, .tbl td { text-align: right; padding: 8px 10px; border-top: 1px solid var(--line); font-family: var(--mono); font-variant-numeric: tabular-nums; }
.tbl th:first-child, .tbl td:first-child { text-align: left; font-family: var(--font); }
.tbl th { font-family: var(--font); font-size: .74rem; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-2); font-weight: 600; border-top: 0; }
.notes { margin: 0; padding-left: 18px; color: var(--ink-2); font-size: .86rem; display: flex; flex-direction: column; gap: 4px; max-width: 80ch; }
.foot { margin: 0; color: var(--ink-2); font-size: .8rem; max-width: 80ch; }
.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 9px 16px; border-radius: 999px; font-size: .86rem; font-weight: 560; z-index: 20; }

@media (max-width: 760px) {
  .tabs { flex-wrap: wrap; overflow: visible; }
  .colh { display: none; }
  .rowp { grid-template-columns: 1fr auto; gap: 6px 12px; }
  .rowp .c.k, .rowp .c.cs { display: none; }
  .rowp .bar { grid-column: 1 / -1; order: 3; }
  .rowp .c.tp { order: 2; }
  .rowp .nm small::after { content: ""; }
}
@media (prefers-reduced-motion: no-preference) { .tab, .btn, .rowp { transition: background-color .15s, color .15s; } }
</style>

      var tm = /time #(\d+)/.exec(x);
      if (tm) h = '<div class="sub-l"><span>Time do Coração</span><span class="extra">sugestão nº ' + tm[1] + '</span><span>varie entre os jogos</span></div>';
    }
    return h;
  }
  function numsText(j, g) { return D.jogos[j].tipo === 'colunas' ? g.n.join(' ') : g.n.map(pad).join(' '); }
  function ticket(p, g, i, info) {
    var j = p.jogo, m = D.jogos[j], dr = info.dr;
    var hh = hitsOf(j, g, dr), win = hh && prized(j, hh.h);
    var done = !!(S.done[p.chave] && S.done[p.chave][i]);
    var badge = hh ? '<span class="badge' + (win ? ' prize' : '') + '">' + hh.h + (m.tipo === 'colunas' ? ' col.' : ' ac.') + '</span>' : '';
    var nums = numsText(j, g);
    var long = g.n.length > 20;
    var h = '<article class="ticket' + (done ? ' done' : '') + (win ? ' win' : '') + '" data-i="' + i + '">' +
      '<div class="t-top"><span class="n">JOGO ' + pad(i + 1) + '</span>' + badge + '</div>' + volante(j, g, dr) + extras(j, g) +
      '<div class="stub">' + (long ? '<details><summary>ver ' + g.n.length + ' dezenas</summary><div class="nums">' + nums + '</div></details>' : '<div class="nums">' + nums + '</div>') +
      '<div class="row"><label><input type="checkbox" data-done="' + i + '"' + (done ? ' checked' : '') + '> Apostado</label>' +
      '<button class="btn mini" type="button" data-copy="' + i + '">Copiar</button></div></div></article>';
    return h;
  }

  /* ---------- pacote ---------- */
  function minw(j) { var m = D.jogos[j]; return m.cols === 5 ? 200 : m.cols === 7 ? 230 : 290; }
  function pkgView(p) {
    var j = p.jogo, m = D.jogos[j], a = algum(p), sibs = pkgsOf(j);
    var h = '<div class="g-' + j + '" style="display:contents">';
    h += '<section class="head g-' + j + '"><p class="eyebrow"><i></i>' + esc(m.nome) + '</p><h2>' + esc(p.titulo) + '</h2><p class="sub">' + esc(p.descricao) + '</p></section>';
    h += '<nav class="seg g-' + j + '" aria-label="Pacotes">' + sibs.map(function (s) { return '<a href="#' + s.id + '"' + (s.id === p.id ? ' aria-current="page"' : '') + '>' + esc(s.titulo) + '</a>'; }).join('') + '</nav>';
    h += '<dl class="facts g-' + j + '"><div><dt>Apostas</dt><dd>' + p.k + '</dd></div><div><dt>Investimento</dt><dd>' + brl(p.custo) + '</dd></div>' +
      '<div><dt>Algum prêmio</dt><dd>' + pct(a.pac) + '<small>' + esc(m.faixa) + ' ou mais</small></dd></div>' +
      '<div><dt>Prêmio máximo</dt><dd><span class="pre">1 em</span> ' + Math.round(p.topo).toLocaleString('pt-BR') + '<small>com todos os jogos</small></dd></div></dl>';
    h += '<section class="check g-' + j + '"><h3>Conferir resultado</h3><div class="inputs">';
    if (m.sorteios === 2) {
      h += '<label for="res0">1º sorteio<input type="text" id="res0" inputmode="numeric" autocomplete="off" placeholder="' + m.draw + ' dezenas"></label><label for="res1">2º sorteio<input type="text" id="res1" inputmode="numeric" autocomplete="off" placeholder="' + m.draw + ' dezenas"></label>';
    } else {
      h += '<label for="res0">' + (m.tipo === 'colunas' ? 'Dígitos sorteados (7 colunas)' : 'Dezenas sorteadas') + '<input type="text" id="res0" inputmode="numeric" autocomplete="off" placeholder="' + (m.tipo === 'colunas' ? 'ex.: 3 1 4 0 5 2 7' : 'informe ' + m.draw + ' dezenas') + '"></label>';
    }
    h += '<button class="btn" type="button" id="clr">Limpar</button></div><p class="summary" id="sumry" aria-live="polite"></p></section>';
    h += '<div class="toolbar g-' + j + '"><div class="l"><span class="prog" id="prog"></span></div><div class="l"><label class="sw"><input type="checkbox" id="ord"> Ordenar por acertos</label><button class="btn" type="button" id="cpall">Copiar todos</button><button class="btn pri" type="button" id="betstart">Modo aposta</button></div></div>';
    h += '<div class="cards g-' + j + '" id="cards" style="--minw:' + minw(j) + 'px"></div><div class="more" id="more"></div>';
    h += '<details class="det g-' + j + '"><summary>Chances por faixa</summary><div class="tblw"><table class="tbl"><thead><tr><th>Faixa</th><th>Este pacote</th><th>Jogos aleatórios (aprox.)</th></tr></thead><tbody>' +
      p.chances.map(function (c) { return '<tr><td>' + c.m + (m.tipo === 'colunas' ? ' colunas' : ' acertos') + ' ou mais' + (c.exato ? ' *' : '') + '</td><td>' + pct(c.pac) + '</td><td>' + (c.ale == null ? '—' : pct(c.ale)) + '</td></tr>'; }).join('') +
      '</tbody></table></div><p class="foot">* valor exato (na Lotofácil, contagem de todos os 3.268.760 sorteios). Os demais vêm de simulação de 400.000 concursos, conferida contra limites matemáticos.</p></details>';
    h += '<ul class="notes">' + [p.retorno ? 'Retorno esperado: ' + p.retorno + '.' : ''].concat(p.notas || []).filter(Boolean).map(function (n) { return '<li>' + esc(n) + '</li>'; }).join('') + '</ul>';
    h += '<p class="foot">Pacote nº ' + p.pid + ', gerado por ' + esc(p.programa) + '. Preços e prêmios a confirmar na Caixa. O retorno esperado não depende dos jogos escolhidos; o pacote só melhora a distribuição das chances entre as faixas.</p></div>';
    return h;
  }
  function drawCards(p) {
    var j = p.jogo, dr = draws(j), valid = dr.some(function (d) { return d.ok; });
    var idx = p.jogos.map(function (g, i) { return i; });
    var info = { dr: dr };
    var ordCk = $('#ord');
    if (valid && ordCk && ordCk.checked) {
      idx.sort(function (a, b) { var x = hitsOf(j, p.jogos[a], dr), y = hitsOf(j, p.jogos[b], dr); return (y ? y.h : -1) - (x ? x.h : -1) || a - b; });
    }
    if (bet) { drawBet(p); return; }
    var box = $('#cards'); box.className = 'cards g-' + j;
    var total = idx.length; idx = idx.slice(0, shown);
    box.innerHTML = idx.map(function (i) { return ticket(p, p.jogos[i], i, info); }).join('');
    $('#more').innerHTML = total > shown ? '<button class="btn" type="button" id="more12">Mostrar mais ' + Math.min(12, total - shown) + '</button><button class="btn" type="button" id="moreall">Mostrar todos (' + total + ')</button>' : '';
    var d = S.done[p.chave] || {}, c = 0; for (var k in d) if (d[k]) c++;
    $('#prog').textContent = c + ' de ' + p.k + ' apostados';
    var s = $('#sumry');
    var msg = '';
    if (!dr.some(function (x) { return x.got > 0; })) msg = 'Informe o resultado para destacar os acertos em cada bilhete.';
    else if (!valid) msg = 'Leitura incompleta: ' + dr[0].got + ' de ' + D.jogos[j].draw + (D.jogos[j].tipo === 'colunas' ? ' dígitos.' : ' dezenas válidas.');
    else {
      var best = -1, bi = 0, nw = 0;
      p.jogos.forEach(function (g, i) { var h = hitsOf(j, g, dr); if (h) { if (h.h > best) { best = h.h; bi = i; } if (prized(j, h.h)) nw++; } });
      msg = '<b>Melhor jogo: ' + best + (D.jogos[j].tipo === 'colunas' ? ' colunas' : ' acertos') + '</b> (jogo ' + pad(bi + 1) + ') · ' + nw + (nw === 1 ? ' jogo' : ' jogos') + ' na faixa premiada (' + D.jogos[j].faixa + ' ou mais).';
    }
    s.innerHTML = msg;
  }
  function nextUndone(p, from) { var d = S.done[p.chave] || {}; for (var s = 0; s < p.k; s++) { var i = (from + s) % p.k; if (!d[i]) return i; } return -1; }
  function drawBet(p) {
    var j = p.jogo, dr = draws(j), d = S.done[p.chave] || {}, c = 0; for (var k in d) if (d[k]) c++;
    var box = $('#cards'); box.className = 'bet g-' + j; $('#more').innerHTML = '';
    $('#prog').textContent = c + ' de ' + p.k + ' apostados';
    if (bet.i < 0) { box.innerHTML = '<div class="betdone"><h3>Todos os ' + p.k + ' jogos estão marcados como apostados.</h3><button class="btn" type="button" id="betexit">Voltar à lista</button></div>'; return; }
    var g = p.jogos[bet.i];
    box.innerHTML = '<div class="betcard"><div class="bethead"><span class="n">JOGO ' + pad(bet.i + 1) + ' DE ' + p.k + '</span><span class="badge">' + c + ' apostados</span></div>' +
      '<div class="betbar"><u style="width:' + (100 * c / p.k) + '%"></u></div>' + volante(j, g, dr) + extras(j, g) +
      '<div class="betnums">' + numsText(j, g) + '</div>' +
      '<div class="betact"><button class="btn" type="button" id="betprev">Anterior</button><button class="btn" type="button" id="betskip">Pular</button><button class="btn pri" type="button" id="betok">' + (d[bet.i] ? 'Já apostado, próximo' : 'Apostado, próximo') + '</button></div>' +
      '<div class="betact2"><button class="btn mini" type="button" data-copy="' + bet.i + '">Copiar dezenas</button><button class="btn mini" type="button" id="betexit">Sair do modo aposta</button></div></div>';
  }
  function $(s) { return document.querySelector(s); }
  function toast(t) { var el = $('#toast'); el.textContent = t; el.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(function () { el.hidden = true; }, 1600); }
  function copy(text) {
    function fb() { var ta = document.createElement('textarea'); ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.appendChild(ta); ta.select(); var ok = false; try { ok = document.execCommand('copy'); } catch (e) {} document.body.removeChild(ta); toast(ok ? 'Copiado' : 'Selecione e copie manualmente'); }
    try { navigator.clipboard.writeText(text).then(function () { toast('Copiado'); }, fb); } catch (e) { fb(); }
  }

  /* ---------- render ---------- */
  var curPkg = null, bet = null, shown = 12;
  function render() {
    var r = route(), app = $('#app'), p = byId[r];
    if (!p) { curPkg = null; app.innerHTML = shell('resumo', resumo()); document.title = 'Carteira de Jogos'; window.scrollTo(0, 0); return; }
    curPkg = p; bet = null; shown = 12; S.last[p.jogo] = p.id; save();
    app.innerHTML = shell(p.id, pkgView(p));
    document.title = 'Carteira de Jogos';
    var res = S.res[p.jogo] || ['', ''];
    var i0 = $('#res0'), i1 = $('#res1'); if (i0) i0.value = res[0] || ''; if (i1) i1.value = res[1] || '';
    drawCards(p);
    window.scrollTo(0, 0);
  }
  document.addEventListener('input', function (e) {
    if (!curPkg) return;
    if (e.target.id === 'res0' || e.target.id === 'res1') {
      S.res[curPkg.jogo] = [($('#res0') || {}).value || '', ($('#res1') || {}).value || '']; save(); drawCards(curPkg);
    }
  });
  document.addEventListener('change', function (e) {
    if (!curPkg) return;
    if (e.target.id === 'ord') { drawCards(curPkg); return; }
    if (e.target.hasAttribute && e.target.hasAttribute('data-done')) {
      var i = e.target.getAttribute('data-done'); S.done[curPkg.chave] = S.done[curPkg.chave] || {}; S.done[curPkg.chave][i] = e.target.checked; save();
      var art = e.target.closest('.ticket'); if (art) art.classList.toggle('done', e.target.checked);
      var c = 0, d = S.done[curPkg.chave]; for (var k in d) if (d[k]) c++; $('#prog').textContent = c + ' de ' + curPkg.k + ' apostados';
    }
  });
  document.addEventListener('click', function (e) {
    var t = e.target.closest ? e.target.closest('button') : null; if (!t || !curPkg) return;
    if (t.hasAttribute('data-copy')) { var g = curPkg.jogos[+t.getAttribute('data-copy')]; copy(numsText(curPkg.jogo, g)); }
    else if (t.id === 'cpall') { copy(curPkg.jogos.map(function (g, i) { return 'Jogo ' + pad(i + 1) + ': ' + numsText(curPkg.jogo, g); }).join('\n')); }
    else if (t.id === 'more12') { shown += 12; drawCards(curPkg); }
    else if (t.id === 'moreall') { shown = curPkg.k; drawCards(curPkg); }
    else if (t.id === 'betstart') { bet = { i: nextUndone(curPkg, 0) }; drawCards(curPkg); $('#cards').scrollIntoView({ block: 'start' }); }
    else if (t.id === 'betexit') { bet = null; drawCards(curPkg); }
    else if (t.id === 'betok') { S.done[curPkg.chave] = S.done[curPkg.chave] || {}; S.done[curPkg.chave][bet.i] = true; save(); bet.i = nextUndone(curPkg, bet.i + 1); drawCards(curPkg); }
    else if (t.id === 'betskip') { bet.i = (bet.i + 1) % curPkg.k; drawCards(curPkg); }
    else if (t.id === 'betprev') { bet.i = (bet.i - 1 + curPkg.k) % curPkg.k; drawCards(curPkg); }
    else if (t.id === 'clr') { S.res[curPkg.jogo] = ['', '']; save(); $('#res0').value = ''; if ($('#res1')) $('#res1').value = ''; drawCards(curPkg); }
  });
  window.addEventListener('hashchange', render);
  render();
})();
</script>

</body></html>
