o (fundado em 1966)","url":"https://www.erikson.edu"}},"kohut":{"bio":"Heinz Kohut nasceu em Viena em 3 de maio de 1913 e morreu em Chicago em 8 de outubro de 1981. Formou-se em medicina pela Universidade de Viena, emigrou para os Estados Unidos em 1940 e fez a formação psicanalítica no Chicago Institute for Psychoanalysis, chegando a presidir a American Psychoanalytic Association. Fundou a psicologia do self, que pôs a empatia e as necessidades narcísicas no centro da teoria e da clínica.","conceitos":[{"termo":"Self","def":"Centro da iniciativa e da experiência psíquica, cuja coesão e vitalidade dependem das respostas do ambiente."},{"termo":"Selfobjeto (objeto do self)","def":"Outra pessoa vivida como parte do self, que cumpre funções de espelhamento, idealização ou gemelaridade."},{"termo":"Transferência especular","def":"Transferência em que o paciente busca no analista a confirmação admirativa da sua grandiosidade."},{"termo":"Transferência idealizadora","def":"Transferência em que o paciente se apoia num analista idealizado para obter calma e força."},{"termo":"Internalização transmutadora","def":"Processo em que frustrações toleráveis do selfobjeto levam o sujeito a assumir como próprias as funções dele."},{"termo":"Empatia (introspecção vicária)","def":"Modo de observação psicanalítica em que o analista se coloca na experiência interna do paciente."}],"obras":[{"titulo":"Análise do self","ano":1971,"edicao":"Rio de Janeiro: Imago, 1988; tradutor não confirmado","edicao_br":true,"nivel":"avançado","ed":{"editora":"Imago","local":"Rio de Janeiro","ano":"1988","volume":"","tradutor":"","isbn":""},"verif":{"status":"conferida","fonte":"http://www.revistacontemporanea.org.br/revistacontemporaneaanterior/site/wp-content/artigos/artigo85.pdf","nota":"Fonte fraca: é uma referência bibliográfica num artigo (Contemporânea, 2007), 'Análise do Self. Rio de Janeiro, Imago Editora, 1971/1988'. Não há catálogo nem página de livraria aberta. Outra citação (RBP 2014, vista só na busca) dá Imago 1974, trad. P. R. Sauberman. Tradutor divergente entre fontes. O título talvez seja 'A análise do self' (forma usada pela FEBRAPSI); conferir a folha de rosto."}},{"titulo":"A restauração do self","ano":1977,"edicao":"Rio de Janeiro: Imago, 1988; tradutor não confirmado","edicao_br":true,"nivel":"avançado","ed":{"editora":"Imago","local":"Rio de Janeiro","ano":"1988","volume":"","tradutor":"Carlos Alberto Pavanelli","isbn":""},"verif":{"status":"conferida","fonte":"https://en.wikipedia.org/wiki/The_Restoration_of_the_Self","nota":"Wikipedia (seção de traduções): 'A restauração do self. Tr. Carlos Alberto Pavanelli. Rio de Janeiro: Imago Editora, 1988.' Fonte secundária; ISBN não localizado."}},{"titulo":"Self e narcisismo (coletânea organizada por Paul Ornstein; inclui 'Formas e transformações do narcisismo', 1966)","ano":1966,"edicao":"Rio de Janeiro: Zahar, 1994 (ano conforme citação em artigo; tradutor não confirmado)","edicao_br":true,"nivel":"introdutório","ed":{"editora":"Zahar","local":"Rio de Janeiro","ano":"1984","volume":"","tradutor":"","isbn":""},"verif":{"status":"conferida","fonte":"https://www.skoob.com.br/pt/book/406334","nota":"Skoob: Zahar Editores, 1984, 158 p., sem ISBN. Confirma 1984 e corrige o 1994 do arquivo. Tradutor (P. H. B. Rondon, segundo citação vista só na busca), local e organização por Ornstein não conferidos."}},{"titulo":"Como cura a psicanálise?","ano":1984,"edicao":"Edição original: University of Chicago Press; edição brasileira não localizada (há edição em espanhol, Paidós, 1986)","edicao_br":false,"nivel":"avançado","confirmado":false,"verif":{"status":"a confirmar","fonte":"https://books.google.com.br/books?vid=ISBN8573071389&redir_esc=y","nota":"Existe edição brasileira, ao contrário do que diz o app. Google Books: 'Como Cura A Psicanálise?', Artmed, 250 p., ISBN 8573071389 / 9788573071382, com José Octavio de Aguiar Abreu como coautor (é o tradutor). Falta o ano: Porto Alegre, Artes Médicas, 1989, segundo citações vistas só na busca; a página da Amazon não abriu."},"ed":{"editora":"Artmed","tradutor":"José Octavio de Aguiar Abreu","isbn":"9788573071382"}}],"dicionarios":[{"titulo":"Uma introdução à psicologia psicanalítica do self: a teoria de Heinz Kohut desde as suas origens em Sigmund Freud","autor":"Maria Beatriz Breves Ramos","edicao":"Rio de Janeiro: Mauad X, 2009, 92 p. (ISBN 9788574780504)","ed":{"editora":"Mauad X","local":"Rio de Janeiro","ano":"2009","volume":"","tradutor":"","isbn":"9788574780504"},"verif":{"status":"conferida","fonte":"https://www.martinsfontespaulista.com.br/uma-introducao-a-psicologia-psicanalitica-do-self--a-teoria-de-heinz-kohut-desde-as-suas-origens-em--132268/p","nota":"Martins Fontes Paulista: 1ª ed. 2009, 92 p., ISBN 9788574780504. O campo editora aparece truncado na página; Mauad X e local mantidos do arquivo, sem verificação."},"autor_abnt":"RAMOS, Maria Beatriz Breves"}],"artigos":[{"titulo":"Convergências e divergências nas teorias do narcisismo de Kohut e de Lacan","autores":"Luciana Gageiro Coutinho","revista":"Revista Latinoamericana de Psicopatologia Fundamental","ano":1999,"url":"https://www.scielo.br/scielo.php?script=sci_arttext&pid=S1415-47141999000200037&lng=pt&tlng=pt"},{"titulo":"Relações precarizadas, mundo traumatizado: uma retomada de Heinz Kohut e sua importância para a atualidade","autores":"Maicon Pereira da Cunha","revista":"Ágora: Estudos em Teoria Psicanalítica","ano":2021,"url":"https://www.scielo.br/scielo.php?script=sci_arttext&pid=S1516-14982021000200088&tlng=pt"}],"instituicao":{"nome":"International Association for Psychoanalytic Self Psychology (IAPSP)","url":"https://iapsp.org"}},"green":{"bio":"André Green nasceu no Cairo em 12 de março de 1927 e morreu em Paris em 22 de janeiro de 2012. Estudou no Liceu Francês do Cairo, fez medicina e psiquiatria em Paris, acompanhou por sete anos o seminário de Lacan e foi membro e presidente da Société Psychanalytique de Paris. Desenvolveu uma metapsicologia contemporânea dos estados-limite, articulando Freud, Winnicott e Bion em torno do trabalho do negativo e do narcisismo de morte.","conceitos":[{"termo":"Trabalho do negativo","def":"Conjunto de operações psíquicas (recalque, recusa, foraclusão, negação) que podem estruturar o psiquismo ou, no extremo, desligá-lo."},{"termo":"Complexo da mãe morta","def":"Efeito psíquico de uma mãe fisicamente presente mas afetivamente ausente por luto ou depressão, que deixa um vazio na criança."},{"termo":"Narcisismo negativo (de morte)","def":"Forma de narcisismo ligada à pulsão de morte, que busca o nível zero de excitação e o apagamento do eu."},{"termo":"Função desobjetalizante","def":"Tendência da pulsão de morte a desinvestir os objetos e a própria atividade de ligação psíquica."},{"termo":"Estados-limite (casos-limite)","def":"Organizações entre neurose e psicose, marcadas por angústias de separação e intrusão e por falhas de simbolização."},{"termo":"Enquadre interno do analista","def":"Dispositivo psíquico que o analista internalizou e que sustenta a escuta mesmo quando o enquadre externo precisa mudar."}],"obras":[{"titulo":"Narcisismo de vida, narcisismo de morte","ano":1983,"edicao":"São Paulo: Escuta, 1988 (ISBN 9788571370036); tradutor não confirmado","edicao_br":true,"nivel":"avançado","ed":{"editora":"Escuta","local":"São Paulo","ano":"1988","volume":"","tradutor":"","isbn":"9788571370036"},"verif":{"status":"conferida","fonte":"https://www.travessa.com.br/narcisismo-de-vida-narcisismo-de-morte/artigo/de61a733-83c5-4d45-a01a-7f22b6c99778","nota":"Travessa: Escuta, 1988, 1ª ed., 312 p., ISBN 9788571370036. Tradutor não consta."}},{"titulo":"A loucura privada: psicanálise de casos-limite","ano":1986,"edicao":"Rio de Janeiro: Imago, 1988; tradutor não confirmado","edicao_br":true,"nivel":"avançado","ed":{"editora":"Escuta","local":"São Paulo","ano":"2017","volume":"","tradutor":"Martha Gambini","isbn":"9788571374119"},"verif":{"status":"conferida","fonte":"https://www.travessa.com.br/a-loucura-privada-psicanalise-de-casos-limite/artigo/4d0a684b-5291-4350-aee3-52eac525f1ff","nota":"CORREÇÃO: não se achou 'Sobre a loucura pessoal' (Imago, 1988). A edição brasileira localizada é 'A loucura privada: psicanálise de casos-limite' (orig. La folie privée), Escuta, col. Pathos, 2017, 374 p., trad. Martha Gambini. O inglês On Private Madness é de 1986."}},{"titulo":"O trabalho do negativo","ano":1993,"edicao":"Porto Alegre: Artmed, 2010; tradutor não confirmado","edicao_br":true,"nivel":"avançado","ed":{"editora":"Artmed","local":"Porto Alegre","ano":"2010","volume":"","tradutor":"Fátima Murad","isbn":"9788536321899"},"verif":{"status":"conferida","fonte":"https://www.travessa.com.br/o-trabalho-do-negativo-1-ed-2010/artigo/dc9b8428-9cc0-44e1-a752-18572f6ec6c6","nota":"Travessa: Artmed, 2010, 1ª ed., 316 p., trad. Fatima Murad."}},{"titulo":"Orientações para uma psicanálise contemporânea","ano":2002,"edicao":"Rio de Janeiro: Imago / SBPSP, 2008, 376 p.; tradução organizada por Paulo César Sandler","edicao_br":true,"nivel":"avançado","ed":{"editora":"Imago","local":"Rio de Janeiro","ano":"2008","volume":"","tradutor":"Ana Maria Rocca Rivarola; Beatriz da Motta Pacheco Tupinambá; Claudio Castelo Filho; Giselle Groeninga; Ilana Waingort Novinsky; Ligia Todescan Lessa Mattos; Vasco Moscovici da Cruz","isbn":"9788531210235"},"verif":{"status":"conferida","fonte":"https://www.travessa.com.br/orientacoes-para-uma-psicanalise-contemporanea-desconhecimento-e-reconhecimento-do-inconsciente/artigo/2fca48f6-4ebc-40c2-a58d-ce8a3051b47d","nota":"Travessa: subtítulo 'desconhecimento e reconhecimento do inconsciente', Imago, 2008, 374 p. (arquivo dizia 376 p.). A coordenação de Paulo Cesar Sandler não aparece na ficha."}},{"titulo":"Por que as pulsões de destruição ou de morte?","ano":2007,"edicao":"São Paulo: Blucher, 2022 (ISBN 9786555060829); tradutor não confirmado","edicao_br":true,"nivel":"avançado","ed":{"editora":"Blucher","local":"São Paulo","ano":"2022","volume":"","tradutor":"Vanise Pereira Dresch","isbn":"9786555060829"},"verif":{"status":"conferida","fonte":"https://storage.blucher.com.br/book/pdf_preview/9786555060829-amostra.pdf","nota":"Ficha catalográfica da amostra: 1. ed., 170 p.; e-book ISBN 978-65-5506-077-5."}}],"dicionarios":[{"titulo":"Do pensamento clínico ao paradigma contemporâneo (entrevistas, 1991-2011)","autor":"André Green e Fernando Urribarri","edicao":"São Paulo: Blucher, 2019, col. Psicanálise Contemporânea (ISBN 9788521213406)","ed":{"editora":"Blucher","local":"São Paulo","ano":"2019","volume":"","tradutor":"Paulo Sérgio de Souza Jr.","isbn":"9788521213406"},"verif":{"status":"conferida","fonte":"https://storage.blucher.com.br/book/pdf_preview/9788521213406-amostra.pdf","nota":"Ficha catalográfica: título 'Do pensamento clínico ao paradigma contemporâneo: diálogos', 200 p.; orig. Dialoguer avec André Green (2013); e-book 978-85-212-1341-3. Entrada principal: Urribarri."},"autor_abnt":"URRIBARRI, Fernando; GREEN, André"}],"artigos":[{"titulo":"André Green e o trabalho do negativo","autores":"Elisa Maria de Ulhôa Cintra","revista":"Percurso","ano":2013,"url":"https://percurso.openjournalsolutions.com.br/index.php/ojs/article/view/1324"},{"titulo":"Os destinos do trabalho do negativo nas patologias limítrofes","autores":"Luiza da Costa Mendes; Claudia Amorim Garcia","revista":"Psicologia em Revista (PUC Minas)","ano":2012,"url":"http://periodicos.pucminas.br/index.php/psicologiaemrevista/article/download/P.1678-9563.2012v18n2p277/4690"},{"titulo":"André Green: biografia","autores":"Instituto Sedes Sapientiae (Percurso)","revista":"Percurso","ano":2013,"url":"https://percurso.openjournalsolutions.com.br/index.php/ojs/article/view/1317"}],"instituicao":{"nome":"Société Psychanalytique de Paris (SPP), da qual Green foi presidente","url":"https://www.spp.asso.fr"}},"dolto":{"bio":"Françoise Dolto (nascida Marette) nasceu em Paris em 6 de novembro de 1908 e morreu em Paris em 25 de agosto de 1988. Médica e pediatra, fez análise com René Laforgue e participou, ao lado de Lacan, da fundação da Société Française de Psychanalyse e da École Freudienne de Paris; em 1979 criou a Maison Verte, espaço de acolhimento de pais e bebês. É referência na psicanálise de crianças, com a ideia de que a criança é desde cedo sujeito de linguagem e de desejo, e com o conceito de imagem inconsciente do corpo.","conceitos":[{"termo":"Imagem inconsciente do corpo","def":"Síntese viva das experiências emocionais e relacionais do sujeito, distinta do esquema corporal anatômico e estruturada pela comunicação com o outro."},{"termo":"Esquema corporal","def":"Representação do corpo como organismo, comum aos indivíduos da espécie, que a imagem do corpo vem investir de sentido."},{"termo":"Imagens de base, funcional e erógena","def":"Três componentes da imagem do corpo: a sensação de existir, a dinâmica do desejo em busca de satisfação e o lugar do prazer na relação com o outro."},{"termo":"Castrações simbolígenas","def":"Interdições ditas à criança em cada fase (desmame, controle anal, Édipo) que, quando falada com respeito, promovem a simbolização."},{"termo":"Criança como sujeito de linguagem","def":"Princípio de que, desde o nascimento, a criança entende o que lhe é dito sobre sua história e deve receber palavras verdadeiras."},{"termo":"Pagamento simbólico","def":"Objeto pequeno (pedrinha, selo) que a criança traz à sessão para marcar que o tratamento é dela e que ela deseja continuar."}],"obras":[{"titulo":"Psicanálise e pediatria","ano":1939,"edicao":"Rio de Janeiro: Guanabara Koogan, 1988 (4ª ed.); trad. A. Cabral","edicao_br":true,"nivel":"introdutório","ed":{"editora":"Guanabara Koogan","local":"Rio de Janeiro","ano":"1988","volume":"","tradutor":"A. Cabral","isbn":""},"verif":{"status":"conferida","fonte":"https://revistas.usp.br/estic/article/download/49646/53749/61004","nota":"Referência em Estilos da Clínica (2012): 'Psicanálise e pediatria (A. Cabral, trad., 4a ed.). Rio de Janeiro: Guanabara-Koogan', 1988. Prenome do tradutor não informado na fonte."}},{"titulo":"O caso Dominique","ano":1971,"edicao":"Rio de Janeiro: Zahar, 1981 (2ª ed.); trad. A. Cabral","edicao_br":true,"nivel":"introdutório","ed":{"editora":"Zahar","local":"Rio de Janeiro","ano":"1981","volume":"","tradutor":"A. Cabral","isbn":""},"verif":{"status":"conferida","fonte":"https://revistas.usp.br/estic/article/download/49646/53749/61004","nota":"Referência acadêmica: O caso Dominique (A. Cabral, trad., 2a ed.). Rio de Janeiro: Zahar, 1981."}},{"titulo":"No jogo do desejo","ano":1981,"edicao":"São Paulo: Ática, 1996 (2ª ed.); trad. V. Ribeiro","edicao_br":true,"nivel":"avançado","ed":{"editora":"Ática","local":"São Paulo","ano":"1996","volume":"","tradutor":"V. Ribeiro","isbn":""},"verif":{"status":"conferida","fonte":"https://revistas.usp.br/estic/article/download/49646/53749/61004","nota":"Referência acadêmica: No jogo do desejo (V. Ribeiro, trad., 2a ed.). São Paulo: Ática, 1996."}},{"titulo":"A imagem inconsciente do corpo","ano":1984,"edicao":"São Paulo: Perspectiva, 1992; tradutor não confirmado","edicao_br":true,"nivel":"avançado","ed":{"editora":"Perspectiva","local":"São Paulo","ano":"2020","volume":"","tradutor":"Noemi Moritz Kon; Marise Levy","isbn":"9788527302449"},"verif":{"status":"conferida","fonte":"https://editoraperspectiva.com.br/produtos/imagem-inconsciente-do-corpo-a/","nota":"Site da Perspectiva: col. Estudos E.109, 328 p., trad. Noemi Moritz Kon e Marise Levy. Ano 2020 = reedição (Travessa/Amazon); a edição de 1992 do arquivo não foi conferida."}},{"titulo":"A criança do espelho (com J.-D. Nasio)","ano":1987,"edicao":"Porto Alegre: Artes Médicas, 1991; reed. Rio de Janeiro: Zahar, 2008, trad. A. Telles","edicao_br":true,"nivel":"introdutório","ed":{"editora":"Zahar","local":"Rio de Janeiro","ano":"2008","volume":"","tradutor":"A. Telles","isbn":"9788537800492"},"verif":{"status":"conferida","fonte":"https://www.companhiadasletras.com.br/livro/9788537800492/a-crianca-do-espelho","nota":"Companhia das Letras/Zahar: 96 p., lançamento 15/01/2008. Tradutor 'A. Telles' conforme referência em https://revistas.usp.br/estic/article/download/49646/53749/61004. Edição Artes Médicas 1991 não conferida."}}],"dicionarios":[{"titulo":"Seguindo os passos de Françoise Dolto","autor":"Mireille Cifali (org.)","edicao":"Campinas: Papirus, 1989; trad. B. Sidou","ed":{"editora":"Papirus","local":"Campinas","ano":"1989","volume":"","tradutor":"B. Sidou","isbn":""},"verif":{"status":"conferida","fonte":"https://revistas.usp.br/estic/article/download/49646/53749/61004","nota":"Referência acadêmica: Seguindo os passos de Françoise Dolto (B. Sidou, trad.). Campinas, SP: Papirus, 1989."},"autor_abnt":"CIFALI, Mireille (org.)"}],"artigos":[{"titulo":"A prática psicanalítica de Françoise Dolto a partir de seus casos clínicos","autores":"Vanessa Tramontin da Soler; Leda Mariza Fischer Bernardino","revista":"Estilos da Clínica","ano":2012,"url":"https://www.revistas.usp.br/estic/article/view/49646"},{"titulo":"Dolto, 30 anos depois: a atualidade de sua teoria e a noção de sujeito desejante","autores":"Roberta Mazzilli; Fernanda Lima Fonseca","revista":"Estilos da Clínica","ano":2020,"url":"https://www.revistas.usp.br/estic/article/view/163269"},{"titulo":"Françoise Dolto, médica de educação","autores":"Maria Cristina Machado Kupfer","revista":"Revista Subjetividades","ano":2006,"url":"https://ojs.unifor.br/rmes/article/view/1567"}],"instituicao":{"nome":"Archives Françoise Dolto (Association Archives et Documentation)","url":"https://www.dolto.fr"}},"ogden":{"bio":"Thomas H. Ogden nasceu em 4 de dezembro de 1946, está vivo e vive e trabalha em San Francisco, Califórnia. Formou-se no Amherst College, fez medicina e residência em psiquiatria em Yale, trabalhou um ano na Tavistock Clinic, em Londres, e fez a formação no San Francisco Psychoanalytic Institute. Sua obra relê Klein, Winnicott e Bion a partir da intersubjetividade e propõe conceitos como o terceiro analítico e a rêverie do analista; também escreve ficção.","conceitos":[{"termo":"Terceiro analítico (intersubjetivo)","def":"Subjetividade criada em conjunto por analista e analisando, que não pertence a nenhum dos dois e se expressa nas experiências da sessão."},{"termo":"Rêverie","def":"Devaneios, sensações e pensamentos aparentemente soltos do analista, usados como via de acesso ao que acontece no campo analítico."},{"termo":"Posição autista-contígua","def":"Modo primitivo de gerar experiência, baseado em sensações de superfície, ritmo e contato, que Ogden soma às posições kleinianas."},{"termo":"Identificação projetiva (como processo intersubjetivo)","def":"Processo em que partes do self são projetadas e vividas pelo outro, induzindo nele estados que podem ser pensados e devolvidos."},{"termo":"Sonhar sonhos não sonhados","def":"Tarefa analítica de ajudar o paciente a transformar em experiência psíquica o que ele não conseguiu elaborar."},{"termo":"Sentir-se vivo (vitalidade) na análise","def":"Critério clínico que avalia se a sessão está viva ou morta, usado para orientar a escuta e a interpretação."}],"obras":[{"titulo":"A matriz da mente: relações objetais e o diálogo psicanalítico","ano":1986,"edicao":"São Paulo: Blucher, 2017 (ISBN 9788521211082); trad. Giovanna Del Grande da Silva","edicao_br":true,"nivel":"avançado","ed":{"editora":"Blucher","local":"São Paulo","ano":"2017","volume":"","tradutor":"Giovanna Del Grande da Silva","isbn":"9788521211082"},"verif":{"status":"conferida","fonte":"https://storage.blucher.com.br/book/pdf_preview/9788521211082-amostra.pdf","nota":"Ficha catalográfica: 278 p.; revisão da tradução Vasco Moscovici da Cruz."}},{"titulo":"Os sujeitos da psicanálise","ano":1994,"edicao":"São Paulo: Casa do Psicólogo, 1996; trad. C. Berliner","edicao_br":true,"nivel":"avançado","ed":{"editora":"Casa do Psicólogo","local":"São Paulo","ano":"1996","volume":"","tradutor":"C. Berliner","isbn":""},"verif":{"status":"conferida","fonte":"https://repositorio.usp.br/bitstreams/8244d5d5-882f-4d3f-90df-467ef349d00b","nota":"Referência em documento USP: 'Ogden, T. H., & Berliner, C. (1996). Os sujeitos da psicanálise. Casa do psicólogo.' Prenome do tradutor e ISBN não localizados."}},{"titulo":"Reverie e interpretação","ano":1997,"edicao":"São Paulo: Escuta, 2013; tradutor não confirmado","edicao_br":true,"nivel":"avançado","ed":{"editora":"Escuta","local":"São Paulo","ano":"2013","volume":"","tradutor":"","isbn":"9788571373402"},"verif":{"status":"conferida","fonte":"https://travessa.com.br/reverie-e-interpretacao-captando-algo-humano-1-ed-2013/artigo/615bd8ad-8191-45fa-9a64-1d9a2eb35981","nota":"Travessa: subtítulo 'captando algo humano', 1ª ed. 2013, 256 p. Tradutor não consta."},"tecnica":true},{"titulo":"Esta arte da psicanálise: sonhando sonhos não sonhados e gritos interrompidos","ano":2005,"edicao":"Porto Alegre: Artmed, 2010; trad. Daniel Bueno","edicao_br":true,"nivel":"introdutório","ed":{"editora":"Artmed","local":"Porto Alegre","ano":"2009","volume":"","tradutor":"Daniel Bueno","isbn":"9788536322339"},"verif":{"status":"conferida","fonte":"https://www.travessa.com.br/esta-arte-da-psicanalise-sonhando-sonhos-nao-sonhados-e-gritos-interrompidos/artigo/957055c8-4356-400e-a8fb-cfbfc3139a16","nota":"Travessa: 2009, 1ª ed., 168 p. A loja do Grupo A dá 2010 e revisão técnica de Anette Blaya Luz. O arquivo dizia 2010."}},{"titulo":"Leituras criativas: ensaios sobre obras analíticas seminais","ano":2012,"edicao":"São Paulo: Escuta, 2014; tradutor não confirmado","edicao_br":true,"nivel":"introdutório","ed":{"editora":"Escuta","local":"São Paulo","ano":"2014","volume":"","tradutor":"Tania Mara Zalcberg","isbn":"9788571373532"},"verif":{"status":"conferida","fonte":"https://www.travessa.com.br/leituras-criativas-ensaios-sobre-obras-analiticas-seminais/artigo/dc80c3ef-596f-48e7-a52b-6ba9160e0711","nota":"Travessa: col. Kultur, 1ª ed. 2014, 272 p."}}],"dicionarios":[],"artigos":[{"titulo":"A importância do pensamento de Thomas Ogden para a psicanálise contemporânea","autores":"Fabio Brinholli; Nelson Ernesto Coelho Junior","revista":"Psicologia USP","ano":2020,"url":"https://www.scielo.br/scielo.php?script=sci_arttext&pid=S0103-65642020000100222&tlng=pt"},{"titulo":"Da identificação projetiva ao conceito de terceiro analítico de Thomas Ogden: um pensamento psicanalítico em busca de um autor","autores":"Marina Ferreira da Rosa Ribeiro","revista":"Ágora: Estudos em Teoria Psicanalítica","ano":2020,"url":"https://www.scielo.br/scielo.php?script=sci_arttext&pid=S1516-14982020000100057&tlng=pt"}],"instituicao":null}},"GLOSSARIO_DE":[["Trieb","pulsão","instinto","A literatura psicanalítica brasileira usa sobretudo pulsão. Algumas traduções usam instinto, como a Edição Standard brasileira e a tradução de Paulo César de Souza; Freud reserva Instinkt para o instinto animal."],["Verdrängung","recalque","repressão, recalcamento","Recalque é o termo corrente na clínica; repressão aparece em várias traduções e pode confundir com a repressão consciente."],["das Unbewusste","o inconsciente","","Substantivo do sistema (primeira tópica); como adjetivo, qualifica conteúdos não conscientes."],["Ich, Es, Über-Ich","eu, isso (id), supereu","ego, id, superego","Ego, id e superego vêm da tradução inglesa; eu, isso e supereu ficam mais perto do alemão cotidiano que Freud usava."],["Besetzung","investimento","catexia, carga","Catexia é o termo da tradução inglesa (cathexis); investimento é o mais usado hoje."],["Nachträglichkeit","a posteriori, só-depois","posterioridade, ação diferida","O sentido de uma experiência se constitui depois, numa retranscrição."],["Angst","angústia","ansiedade, medo","Em português, angústia é o termo corrente na psicanálise; ansiedade aparece em traduções vindas do inglês (anxiety)."],["Wunsch","desejo","anseio","Desejo inconsciente, como no sonho como realização de desejo."],["Übertragung","transferência","","Sem variação relevante entre as traduções."],["Verleugnung","recusa","desmentido, renegação","Recusa da percepção de uma realidade, como a castração; Ferenczi usa a mesma palavra em outro sentido, traduzido como desmentido."],["Spaltung (Ichspaltung)","clivagem do eu","cisão do eu","Em Klein, splitting costuma ser traduzido como cisão."],["Durcharbeiten","elaboração","perlaboração, trabalho de elaboração","O trabalho, na análise, de vencer as resistências depois da interpretação."]],"QUADRO":[["Como o psiquismo se forma",{"freud":"Pela história das pulsões e de seus destinos, organizada em torno do complexo de Édipo.","klein":"Por fantasias inconscientes presentes desde o início, entre a posição esquizoparanoide e a depressiva.","winnicott":"Num processo de amadurecimento que depende de um ambiente suficientemente bom.","lacan":"Pela entrada na linguagem: o sujeito se constitui no campo do Outro, do espelho ao significante.","bion":"Pela capacidade de transformar experiências emocionais em pensamento, graças à relação continente-contido."}],["A angústia",{"freud":"Na segunda teoria (Inibição, sintoma e angústia, 1926), é um sinal de perigo emitido pelo eu diante da ameaça de desamparo.","klein":"Persecutória, o medo de ser destruído, ou depressiva, o medo de ter destruído o objeto amado.","winnicott":"No começo, angústias impensáveis, como despedaçar-se ou cair para sempre, quando o holding falha.","lacan":"No Seminário 10, a angústia não é sem objeto: surge quando a falta vem a faltar.","bion":"Terror sem nome, quando a angústia projetada não encontra um continente que a transforme."}],["O que muda numa análise",{"freud":"Tornar consciente o inconsciente: onde era isso, o eu deve advir; recordar, repetir e elaborar.","klein":"Interpretar a transferência e as angústias mais primitivas, favorecendo a integração e a reparação.","winnicott":"Um ambiente que sustenta, onde o paciente pode regredir, brincar e passar a se sentir real.","lacan":"Que o sujeito se implique no próprio desejo; a interpretação visa o equívoco do significante mais do que o sentido.","bion":"Ampliar a capacidade de pensar e de suportar a verdade emocional (o vínculo K)."}],["O lugar do analista",{"freud":"Atenção flutuante e abstinência; a transferência é o campo do trabalho.","klein":"Intérprete da fantasia inconsciente, incluindo a transferência negativa, desde o início.","winnicott":"Como um ambiente: sustenta, sobrevive aos ataques e não retalia.","lacan":"Suposto saber pelo paciente, sem encarnar esse saber; sustenta o lugar de causa do desejo.","bion":"Em rêverie, sem memória e sem desejo, recebendo o que o paciente ainda não consegue pensar."}],["Conceito para começar",{"freud":"Inconsciente","klein":"Posição depressiva","winnicott":"Objeto transicional","lacan":"Estádio do espelho","bion":"Continente-contido"}]],"TRILHAS":{"freud":{"antes":"Nenhum: é o ponto de partida.","passos":[["Conferências introdutórias","Freud apresenta a psicanálise a um público leigo: atos falhos, sonhos e a teoria das neuroses. Boa porta de entrada."],["Três ensaios","Sexualidade infantil e pulsão: a base de quase tudo o que vem depois."],["A interpretação dos sonhos","O livro fundador. Leia com calma o capítulo 7, sobre o aparelho psíquico."],["Introdução ao narcisismo","O eu como objeto de investimento libidinal; prepara Klein, Lacan e Kohut."],["Artigos sobre técnica","Atenção flutuante e transferência: o começo da clínica."],["Recordar, repetir","Repetir em vez de recordar: a transferência como campo de trabalho."],["Luto e melancolia","Perda, identificação e o embrião do supereu; essencial antes de Klein."],["Além do princípio","Compulsão à repetição e pulsão de morte."],["O eu e o id","A segunda tópica: isso, eu e supereu."],["Inibição, sintoma","A segunda teoria da angústia: a angústia como sinal."],["O mal-estar","A psicanálise pensando a cultura."]]},"klein":{"antes":"Freud: Luto e melancolia e Introdução ao narcisismo.","passos":[["Introdução à obra","Panorama claro de Hanna Segal antes dos textos da própria Klein."],["Amor, culpa e reparação","Textos de 1921 a 1945: análise de crianças, posição depressiva e reparação."],["Notas sobre alguns","A posição esquizoparanoide e a identificação projetiva."],["Inveja e gratidão","A obra tardia: inveja, gratidão e os textos de 1946 a 1963."]]},"winnicott":{"antes":"Freud: Introdução ao narcisismo; Klein: noções das duas posições.","passos":[["Bebês e suas mães","Textos curtos e acessíveis sobre a relação inicial."],["Da pediatria","Inclui Desenvolvimento emocional primitivo (1945), base da teoria."],["O ódio na contratransferência","Um clássico sobre o que o analista sente."],["O brincar","Objeto transicional, espaço potencial e o uso do objeto."]]},"lacan":{"antes":"Freud: A interpretação dos sonhos e Introdução ao narcisismo.","passos":[["O estádio do espelho","O texto curto que funda o registro imaginário."],["Função e campo","O Discurso de Roma: a virada para a fala e a linguagem."],["O Seminário, livro 1","Lacan lê os escritos técnicos de Freud."],["O Seminário, livro 11","Inconsciente, repetição, transferência e pulsão: os quatro conceitos."]]},"bion":{"antes":"Klein: Notas sobre alguns mecanismos esquizoides (identificação projetiva).","passos":[["Experiências com grupos","Os supostos básicos: o Bion dos grupos."],["Estudos psicanalíticos revisados","Inclui Uma teoria sobre o processo de pensar (1962), curto e central."],["Aprender da experiência","Função alfa, elementos beta e continente-contido."],["Atenção e interpretação","Sem memória e sem desejo: o analista diante do desconhecido."]]}},"VIDEOS":[{"id":"sh8Af0NIvsU","autor":"freud","tecnica":true,"tema":"Transferência","conceitos":["Transferência"],"nivel":1,"titulo":"O que é a transferência? (Falando nIsso 30)","canal":"Christian Dunker","guia":{"resumo":"A aula responde o que é a transferência e se ela ocorre fora da análise. O professor a define como uma forma de amor que repete padrões antigos e argumenta que, embora seja um fenômeno universal, só no tratamento ela é usada para curar e conduzida à sua dissolução.","capitulos":[[5,"Transferência como amor e repetição"],[76,"Miniatura das neuroses e fala autêntica"],[144,"Uso clínico e formas selvagens"],[208,"Autoridade, admiração e dependência"],[243,"A dissolução da transferência na análise"]],"pontos":["Para Freud, a transferência é amor: a reatualização da história dos nossos amores nos novos encontros, resistindo a reconhecer o outro como alguém inédito.","A transferência funciona como uma miniatura das nossas neuroses, concentrando numa única relação os padrões repetitivos de cada um.","Ela não é exclusiva da psicanálise; aparece com chefes, professores, médicos e líderes, que podem usá-la para manipular e fazer regredir a massa.","O que Freud teria descoberto é um modo de operar com a transferência para tratar sintomas e descobrir a verdade do desejo.","No tratamento, a transferência deve caminhar para sua dissolução; eternizar a análise seria um recuo diante dessa tarefa ética do analista."]}},{"id":"0-9MS2Dssig","autor":"freud","tecnica":true,"tema":"Transferência","conceitos":["Transferência"],"nivel":1,"titulo":"A transferência: Glossário Freud (Falando daquilo 12)","canal":"Christian Dunker","guia":{"resumo":"A aula apresenta o conceito freudiano de transferência como verbete de um glossário. O professor a define como a reatualização, na relação com o analista, de relações e identificações da história do paciente, e mostra que ela é ao mesmo tempo motor e obstáculo do tratamento.","capitulos":[[0,"Apresentação do conceito"],[31,"Transferência como caso de repetição"],[61,"Variantes da transferência"],[94,"Motor e obstáculo do tratamento"],[125,"Sintomas atualizados na transferência"]],"pontos":["O conceito surge quando Freud se separa do método catártico e passa a fundamentar a ação clínica.","A transferência é um caso específico do princípio de repetição: repetimos com o outro aquilo que nos formou.","Fala-se em transferência positiva quando se repete o modo de amar, negativa quando se repete o de odiar, erotizada e narcísica em outros casos.","Como forma de amor, ela também ocorre fora da análise, em relações marcadas por admiração ou autoridade, como com professores e médicos.","O que se trata não é o sintoma em bruto, mas o sintoma atualizado e vivido dentro da relação de transferência com o analista."]}},{"id":"Y8atafKdAMc","autor":"freud","tecnica":true,"tema":"Associação livre","conceitos":[],"nivel":1,"titulo":"Associação livre: Conceitos fundamentais da Psicanálise (aula 1)","canal":"Travessia Psicanalítica · Profa. Dra. Renata Wirthmann","guia":{"resumo":"Primeira aula de uma série sobre conceitos fundamentais da psicanálise, dedicada à associação livre. A professora retoma a passagem da hipnose e do método catártico ao método psicanalítico e, com citações de Freud e Lacan, sustenta que a associação livre é a regra fundamental: abstinência, transferência, escuta e interpretação existem para viabilizá-la.","capitulos":[[156,"Roteiro dos conceitos fundamentais"],[466,"Abandono da hipnose e da catarse"],[801,"Resistência e a regra fundamental"],[955,"Regra da abstinência e uso da transferência"],[1170,"Atenção flutuante e interpretação"],[1783,"Associação livre segundo Freud"],[2738,"Lacan: cortar as amarras com o outro"],[3296,"Associar sem ligação com o outro"]],"pontos":["A psicanálise nasce do abandono da hipnose e do método catártico, métodos de sugestão em que o sujeito não responde pelo que diz e que produziam resistência maciça.","A associação livre é a regra fundamental, a regra de ouro; transferência, escuta, divã, dinheiro e intervenções servem para viabilizá-la, nunca para interrompê-la.","A regra da abstinência, que Lacan trata como ética, sustenta a associação livre: quem escuta não julga, não se identifica e não decide nem deseja pelo sujeito.","A atenção flutuante é uma disciplina construída com estudo, análise pessoal e supervisão; interpretar acontece na cabeça do analista, e o difícil é transmitir considerando a transferência.","Para Lacan, associar livremente é cortar as amarras de cortesia e obediência ao outro, suspendendo a lei da não contradição, já que se supõe um sujeito dividido.","A associação livre é uma fala metonímica, que desliza de significante em significante, e deve escapar daquilo que o paciente trouxe pronto para contar."]}},{"id":"oi3UsV8s11o","autor":"freud","tecnica":true,"tema":"Atenção flutuante","conceitos":[],"nivel":1,"titulo":"Atenção flutuante (26)","canal":"Escola de Psicanálise de Curitiba","guia":{"resumo":"A aula trata da atenção flutuante como regra básica do setting analítico. O professor argumenta que, assim como o analisando associa livremente, o analista precisa escutar livremente, deixando de lado os próprios pensamentos para acolher o conteúdo trazido.","capitulos":[[0,"O que é atenção flutuante"],[92,"Par com a associação livre"],[154,"Exercitar a atenção"],[214,"Leituras lacaniana e freudiana"],[246,"Atos falhos e o que escapa"]],"pontos":["Atenção flutuante significa silenciar os próprios pensamentos para ficar conectado à história e ao material que o analisando traz.","Ela complementa a associação livre: o analisando fala sem julgamentos e o analista precisa escutar livremente do outro lado.","É impossível manter a atenção total o tempo todo, mas ela deve ser exercitada, inclusive na escuta das pessoas no dia a dia.","Numa linha lacaniana, a escuta tem ênfase linguística; numa linha freudiana, busca-se compreender e montar a história do analisando.","A atenção sustentada permite perceber atos falhos e conteúdos que o ego não consegue segurar, abrindo caminho para a interpretação."]}},{"id":"GZMuY73W5Oc","autor":"freud","tecnica":true,"tema":"Contratransferência","conceitos":["Contratransferência"],"nivel":1,"titulo":"O que é contratransferência em psicanálise?","canal":"Psicanálise em Humanês · Lucas Nápoli","guia":{"resumo":"A aula discute o conceito de contratransferência, cuja definição varia entre autores. O professor propõe entendê-la como tudo o que vem do analista no tratamento e contrapõe duas posições: dominá-la ou usá-la como instrumento para compreender o paciente.","capitulos":[[0,"Apresentação da aula"],[66,"A dificuldade de definir contratransferência"],[157,"Definição ampla: o que vem do analista"],[315,"Primeira posição: dominar a contratransferência"],[468,"Segunda posição: instrumento de pesquisa"],[563,"A virada após a Segunda Guerra"]],"pontos":["Freud não deu uma definição precisa; ela pode ser vista como as reações do analista ou como a transferência que o analista faz ao paciente.","O professor propõe uma definição ampla: contratransferência é tudo o que, no tratamento, vem do analista e não do paciente.","A primeira posição exige que o analista domine seus afetos e idealiza um analista impassível, como um espelho, chegando a falar em purificação.","A segunda posição admite que é impossível dominá-la e vê nas reações induzidas pelo paciente uma via para entender aspectos inconscientes dele.","Até cerca de 1940 predominou a visão de domínio; depois da Segunda Guerra, a contratransferência tornou-se um conceito fundamental muito tematizado."]}},{"id":"mMb2UvNdXXw","autor":"freud","tecnica":true,"tema":"Manejo da transferência","conceitos":["Transferência"],"nivel":2,"titulo":"O manejo da transferência em psicanálise","canal":"Instituto GAIO","guia":{"resumo":"A aula, em formato de transmissão ao vivo com perguntas, trata do manejo da transferência na clínica psicanalítica com base em Freud e Lacan. O professor sustenta que a transferência, descoberta e não inventada pela psicanálise, é ao mesmo tempo motor e resistência do tratamento, e que cabe ao analista reconhecer o lugar em que é colocado sem responder a partir dele.","capitulos":[[436,"Transferência: descoberta, não invenção"],[787,"Motor da análise e resistência"],[849,"Afetos ternos e hostis de antigas fantasias"],[1039,"Fazer semblante sem responder desse lugar"],[1413,"O analista no lugar de objeto"],[1508,"Como reconhecer a transferência"],[3240,"Sedução, presentes e manejo"],[4448,"Paixão pelo analista: as três saídas"]],"pontos":["A transferência não é criada pela psicanálise: é um modo inconsciente de se relacionar presente em todas as relações, que pode começar antes do primeiro encontro.","O analisante dirige ao analista afetos ternos e hostis que não se justificam na relação real e vêm de antigas fantasias, muitas ligadas às relações edípicas.","A transferência é motor e também resistência; o analista precisa identificar o lugar em que é colocado e fazer semblante sem responder desse lugar.","Na análise o único sujeito é o analisante; o analista ocupa o lugar de objeto, não satisfaz demandas e provoca a falta para evitar dependência.","Elogios, presentes e declarações iniciais podem ser tentativas de seduzir o analista e só indicam transferência quando se compreende a história que os sustenta.","Diante da paixão do paciente, o professor defende, com Freud, analisar esse amor, que se dirige ao que o analista representa, apoiado em análise pessoal e supervisão."]}},{"id":"ztscB-r-NtA","autor":"freud","conceitos":["Inconsciente"],"nivel":1,"titulo":"O conceito de inconsciente: Freud e a base da psicanálise","canal":"Casa do Saber · Daniel Omar Perez","guia":null},{"id":"gVPw5slKCLM","autor":"freud","conceitos":["Inconsciente"],"nivel":1,"titulo":"Introdução à psicanálise: 1ª tópica de Freud, conceito do inconsciente (vídeo 1)","canal":"Egolab","guia":{"resumo":"A aula introduz a primeira tópica de Freud, que divide o psiquismo em consciente, pré-consciente e inconsciente, a partir do estudo das histéricas. O argumento central é que o inconsciente, formado na primeira infância e mantido pelo recalque, é a principal fonte de energia psíquica e encontra saídas parciais em sonhos, atos falhos, sintomas e sublimação.","capitulos":[[30,"Freud, as histéricas e a origem"],[219,"Primeira tópica: a divisão da mente"],[279,"Consciente e pré-consciente"],[399,"Inconsciente: formação, energia e recalque"],[618,"Sonhos, condensação e deslocamento"],[991,"Pontos de vista e analogias do inconsciente"]],"pontos":["Freud percebeu que os sintomas das histéricas não eram fingimento nem problema fisiológico, mas questões mentais, e daí nasceu a psicanálise.","A primeira tópica aparece em A Interpretação dos Sonhos (1900); a segunda tópica, com id, ego e superego, complementou a primeira sem substituí-la.","O pré-consciente guarda conteúdos com palavra que podem chegar à consciência; o inconsciente, formado até cerca dos cinco anos, guarda registros em imagens, sem palavra.","O recalque impede que a energia inconsciente se descarregue por completo, o que protege a vida; a descarga absoluta nunca é alcançada.","Condensação e deslocamento são formas de o psiquismo liberar energia; sonhos, atos falhos e sintomas são satisfações parciais e deformadas do inconsciente.","O inconsciente é atemporal: o que se formou na infância continua ativo e se manifesta como repetição ao longo da vida."],"nota":"Compare com a Base de estudo: a aula simplifica alguns pontos de Freud. A busca de descarga total da tensão e a pulsão de vida pertencem à teoria de 1920 (Além do princípio do prazer), posterior à primeira tópica; e, em Freud, o desprazer corresponde ao aumento de tensão, e o prazer, à descarga."}},{"id":"Uwdgnuh83SA","autor":"klein","conceitos":["Inveja"],"nivel":1,"titulo":"Aula de Psicanálise: Melanie Klein, parte 1 (inveja e gratidão)","canal":"Escola Paulista de Psicanálise","guia":{"resumo":"A aula apresenta os conceitos de inveja e gratidão em Melanie Klein, a partir da relação primitiva do bebê com o seio. O argumento central é que a inveja é destrutiva por definição, representa a pulsão de morte e ataca justamente o que é bom, enquanto a gratidão funciona como seu contraponto e fortalece o vínculo.","capitulos":[[1,"Inveja e gratidão nas relações objetais"],[93,"Inveja como destruição e pulsão de morte"],[190,"Voracidade, inveja e ciúme"],[379,"A gratidão como contraponto"],[440,"A inveja ataca o que é bom"],[657,"Inveja, ansiedade persecutória e defesas"]],"pontos":["Para Klein, invejar é querer destruir a capacidade do seio de ser e de produzir o leite ao mesmo tempo; não existe inveja boa.","Klein iguala à pulsão de morte a destruição, não o ódio, e a inveja seria seu grande representante.","A voracidade se liga à introjeção, danificando o objeto ao incorporá-lo; a inveja se liga à projeção; o ciúme envolve três elementos e costuma ser edípico.","A gratidão permite ao bebê usufruir do que o seio tem de bom, une bebê e mãe e diminui a inveja.","Como a inveja se dirige ao que é bom, a mãe ou o analista percebidos como bons sofrem ataques, e depreciar o que é bom é sinal de inveja.","A inveja gera ansiedade e defesas; pela lei de talião, quem ataca teme ser atacado, e inveja e ansiedade persecutória se alimentam mutuamente."]}},{"id":"KIwOTzwAmLc","autor":"klein","conceitos":["Posição depressiva","Reparação"],"nivel":1,"titulo":"Klein: posição depressiva (culpa, reparação e maturidade)","canal":"PSI Explica","guia":{"resumo":"A aula explica a posição depressiva de Melanie Klein como um amadurecimento em relação à posição esquizoparanoide. O argumento central é que, ao perceber a mãe como pessoa inteira, o bebê passa a viver a ambivalência, e a culpa que daí nasce é construtiva, pois move o desejo de reparar.","capitulos":[[0,"Introdução à posição depressiva"],[32,"A posição esquizoparanoide e a cisão"],[96,"Integração: a mãe como pessoa inteira"],[189,"Ambivalência e ansiedade depressiva"],[221,"Culpa construtiva e reparação"],[283,"Ganhos para a personalidade"]],"pontos":["Na posição esquizoparanoide, seio bom e seio mau são vividos como separados, e a cisão protege o objeto idealizado da agressividade do próprio bebê.","Na posição depressiva, o bebê descobre que a mãe que satisfaz e a que frustra são a mesma pessoa, e passa a vê-la inteira.","A ambivalência, amar e sentir raiva da mesma pessoa sem que um sentimento destrua o outro, é apresentada como marco da maturidade.","A ansiedade central dessa posição é o medo de que o próprio ódio destrua a pessoa amada.","A culpa depressiva não paralisa: é preocupação genuína com o outro e impulso de reparar o dano feito em fantasia.","Elaborar a posição depressiva fortalece o ego, estabiliza o mundo interno e sustenta criatividade, empatia, lida com a perda e pensamento simbólico."]}},{"id":"9WdVqCy1kjc","autor":"klein","conceitos":["Posição esquizoparanoide"],"nivel":2,"titulo":"Os mecanismos que sustentam a teoria das posições de Melanie Klein, parte 1: posição esquizoparanoide","canal":"Depois Do Divã","guia":{"resumo":"A aula apresenta os mecanismos que sustentam a posição esquizoparanoide na teoria das posições de Melanie Klein. A professora mostra que um mecanismo leva ao outro, numa sequência que vai da cisão ao abafamento das emoções e mantém o sujeito nessa posição.","capitulos":[[0,"Apresentação e origem da sistematização"],[95,"O que são os mecanismos"],[129,"Cisão: o bom e o mau"],[225,"Negação e projeção"],[287,"Idealização, onipotência e onisciência"],[506,"Abafamento das emoções e clínica"]],"pontos":["Os mecanismos estão espalhados pela obra de Klein e foram reunidos numa sequência pelo professor Renato Dias Martino, citado pela professora.","Na cisão, a realidade se divide em algo totalmente bom e totalmente mau, como o seio bom e o seio mau ou os contos de fadas.","À cisão seguem-se a negação de uma das partes e sua projeção no outro, que passa a ser visto como quem ataca e prejudica.","A idealização, comum na paixão, sustenta a onipotência e a onisciência: o sujeito acredita poder e saber tudo, sem reconhecer que precisa do outro.","Por fim, há um abafamento das emoções, diferente da repressão; na clínica, a fala esquizoparanoide tende a ser mais acelerada e eufórica."]}},{"id":"s-oUwtbx90s","autor":"klein","conceitos":["Identificação projetiva"],"nivel":2,"titulo":"Identificação projetiva na escola de Melanie Klein","canal":"Instituto GAIO","guia":{"resumo":"A aula apresenta a identificação projetiva na escola de Melanie Klein a partir do livro O sentimento de solidão. O professor percorre a onipotência do bebê, o seio bom e o seio mau e as posições esquizoparanoide e depressiva para sustentar que as identificações dependem de a criança introjetar tanto o seio bom quanto o mau.","capitulos":[[534,"Das fases de Freud às posições"],[692,"A onipotência do bebê"],[912,"Seio bom e seio mau"],[1004,"Posição depressiva e inveja primitiva"],[1065,"O que é identificação projetiva"],[1852,"Introjetar o seio bom e o mau"],[1913,"O personagem Fabian e as identificações"],[2478,"Figura materna e arranjos familiares"]],"pontos":["O bebê vive-se onipotente, como se ele mesmo saciasse a fome; o seio que vem é sentido como bom, e o que falta, como mau e ameaçador.","Bom e mau são construções psíquicas da criança, não escolhas da mãe; o seio representa uma figura materna que pode assumir várias formas e arranjos familiares.","Ao perceber que o seio pertence a outra pessoa, o bebê passa da posição esquizoparanoide à depressiva, marcada pela inveja primitiva e pelo desejo de devorar o que é bom.","Na identificação projetiva, o sujeito vê no outro algo que é seu e pode repelir esse outro para não se expor; a aula a trata também como defesa do ego.","A criança precisa introjetar tanto o seio bom quanto o mau, pois essa dupla internalização sustenta as identificações e a distinção entre bom e mau.","Com o personagem Fabian, de um romance analisado por Klein, a aula mostra a falha dessas introjeções levando o sujeito a buscar identificações tomando outras pessoas para dentro de si."],"nota":"Compare com a Base de estudo: em Klein, a identificação projetiva é a fantasia de pôr partes do próprio self dentro do outro (para controlá-lo, livrar-se delas ou comunicá-las), mais do que ver no outro algo seu; e a inveja primitiva costuma ser situada já na posição esquizoparanoide, e não como marca da depressiva."}},{"id":"QJaC18AckcE","autor":"winnicott","conceitos":[],"nivel":1,"titulo":"Winnicott: noções introdutórias","canal":"Psicanálise em Humanês · Lucas Nápoli","guia":{"resumo":"A aula apresenta noções introdutórias de Winnicott, psicanalista e pediatra que trabalhou com bebês e suas mães. O argumento central é que a tendência inata para a integração só se realiza num ambiente suficientemente bom; quando o ambiente falha, o bebê precisa reagir a ele e desenvolve um falso self.","capitulos":[[0,"Winnicott, psicanalista e pediatra"],[63,"Tendência inata para a integração"],[93,"O ambiente suficientemente bom"],[187,"Falhas ambientais: negligência e intrusão"],[307,"Reação ao ambiente e falso self"]],"pontos":["A experiência clínica com bebês e mães deu a Winnicott elementos que Freud não teve, e sua teoria é vista por uns como complemento e por outros como revolução.","Para Winnicott, há em nós uma tendência natural e espontânea ao crescimento e à integração como pessoa.","Essa tendência só se concretiza num ambiente suficientemente bom, que não precisa ser perfeito, mas deve acolher e sustentar os processos de maturação.","O ambiente falha por negligência, quando deixa de cuidar, ou por intrusão, quando cuida fora do ritmo da criança, como alimentar no horário decidido pela mãe.","Diante da falha, o bebê abandona seu caminho natural para reagir ao ambiente e cria um falso self, uma espécie de carapaça defensiva.","Nos primeiros meses, o ideal é que o bebê se desenvolva sem nem perceber a existência do ambiente."]}},{"id":"Z2LzINVUANM","autor":"winnicott","conceitos":[],"nivel":1,"titulo":"Aula de Psicanálise: D. W. Winnicott, parte 1","canal":"Escola Paulista de Psicanálise","guia":{"resumo":"A aula estuda o artigo Desenvolvimento emocional primitivo (1945), de Winnicott, que trata de um período anterior até à posição esquizoparanoide de Klein. O argumento central é que, no início, bebê e cuidado materno formam uma unidade, e que a experiência de self depende de três processos: integração, personalização e apreciação da realidade.","capitulos":[[0,"Desenvolvimento emocional primitivo (1945)"],[63,"Bebê e cuidado materno como unidade"],[248,"Diferença entre self e ego"],[309,"Integração"],[436,"Personalização"],[529,"Apreciação da realidade"]],"pontos":["Winnicott tinha reservas em relação à posição esquizoparanoide, que se tornaram discordância, e descreve um estágio ainda mais primitivo, próximo ao nascimento.","Nesse período não se pode falar em duas pessoas: não existe bebê sem cuidado materno, e essa unidade é o que Winnicott chama de bebê.","O self é a experiência de ser alguém ao longo do tempo, diferente do ego, que é uma instância psíquica ao lado do id e do superego.","O bebê começa não integrado, e não desintegrado; o cuidado materno e as experiências de satisfação promovem a integração, condição para a experiência de si.","A personalização é a localização do self no corpo, uma dimensão espacial da experiência de si.","A apreciação da realidade é a descoberta, ou criação, do outro, já que não existe um eu sem um outro."]}},{"id":"FOzq1efXjK8","autor":"winnicott","conceitos":[],"nivel":2,"titulo":"Winnicott: a psicanálise como uma cura pela experiência de ser (XV Encontro Winnicott)","canal":"Conferência de Leopoldo Fulgencio (IPUSP)","guia":{"resumo":"A conferência propõe entender a psicanálise como cura pela experiência de ser, a partir da introdução da noção de ser por Winnicott. O argumento central é que as experiências de ser vividas no desenvolvimento emocional reaparecem no tratamento, onde podem ser realizadas ou reparadas e ganhar sentido, articulando a cura pela experiência à cura pela palavra.","capitulos":[[205,"A psicanálise como cura pela experiência"],[435,"O estado de ser e sua continuidade"],[494,"A analogia da bolha e a intrusão"],[631,"Do não-ser ao ser"],[932,"A solidão essencial"],[1399,"Ser só sendo com o outro"],[1529,"O indivíduo saudável"],[1952,"Os tipos de experiência de ser"]],"pontos":["A psicanálise pode ser vista como método de cura pela experimentação e reparação das possibilidades de ser-no-mundo, articulada à cura pela palavra.","Winnicott postula um estado de ser que pertence ao próprio bebê, e a continuidade desse ser equivale à saúde.","Na analogia da bolha, quando a pressão externa não se ajusta à interna, o ser é interrompido e substituído pela reação à intrusão.","A vida é descrita como passagem do não-ser ao ser, da não integração às integrações e da dependência absoluta à independência relativa.","No início há uma solidão essencial, que só existe sob dependência máxima de um ambiente que se adapta sem que o bebê saiba dele.","As experiências de ser se desdobram em sou, sou-com, sou-diferente-de, sou-predicável e sou-finito, esta presente em todas como marca da natureza humana."],"nota":"A transcrição desta conferência cobre só parte da fala, sobretudo o texto dos slides. O resumo, os capítulos e os pontos-chave tratam só desses trechos."}},{"id":"n6t5KMUKnCI","autor":"lacan","conceitos":["Estádio do espelho"],"nivel":1,"titulo":"3. Estádio do espelho","canal":"Christian Dunker · série Conceitos fundamentais de Lacan","guia":{"resumo":"A aula apresenta o estádio do espelho de Lacan como resposta ao problema do narcisismo e da constituição do eu. O professor descreve os três tempos da criança diante do espelho e argumenta que o reconhecimento de si só ocorre quando a imagem é integrada à ordem simbólica.","capitulos":[[22,"Sujeito, crise e psicose"],[146,"O particular e a identificação"],[209,"O estádio do espelho"],[273,"Três tempos diante do espelho"],[431,"Valor simbólico e reconhecimento"],[684,"Frase-síntese do estádio do espelho"]],"pontos":["Entre o universal e o singular há a dimensão do particular, em que o sujeito se apreende como parte de um grupo; ela envolve a identificação e o eu.","No primeiro tempo, a criança reage à imagem no espelho como a um outro, assim como fazem os animais.","No segundo tempo, ela se confunde com a imagem; o transitivismo mostra a indeterminação entre quem é agente e quem sofre o ato.","No terceiro tempo, a criança se reconhece porque a imagem ganha valor simbólico ao ser integrada ao grande Outro, a ordem simbólica.","A palavra-chave é reconhecimento: a linguagem é o universal pelo qual cada um encontra sua diferença, e falhas nessa passagem afetam essa gramática."]}},{"id":"q2oxGruWxpU","autor":"lacan","conceitos":["Significante"],"nivel":2,"titulo":"11. Linguagem","canal":"Christian Dunker · série Conceitos fundamentais de Lacan","guia":{"resumo":"O trecho de aula discute a teoria lacaniana do desejo e sua relação com a história e o tempo. O argumento central é que o desejo não visa um objeto positivo conhecido, mas é desejo de outra coisa, herdado dos desejos que nos antecederam, e que a clínica freudiana da histeria fez da rememoração dessa história um uso terapêutico.","capitulos":[[3,"Desejo, tempo e objeto"],[187,"Desejo herdado e sistema de ideais"],[313,"O real e a história"],[376,"A histeria antes de Freud"],[502,"Reminiscências e cura pela lembrança"],[630,"Uma teoria do sujeito e do tempo"]],"pontos":["Desde Platão, o desejo é associado ao futuro; Lacan critica a ideia de que o desejo antecipa um objeto empírico que se sabe qual é.","O desejo desconhece o que deseja no objeto, e por isso não se satura e permanece em atividade contínua, sendo sempre desejo de outra coisa.","O desejo que nos habita nos precede: vem dos pais, pelo eu ideal e pelo ideal do eu, e também da cultura e da linguagem.","Na resposta a uma pergunta, o professor afirma que o real é a história, um núcleo de resíduos que não se consegue lembrar por inteiro.","Contra as leituras da histeria como problema moral ou orgânico, Freud concluiu que as histéricas sofrem de reminiscências, lembranças que não se sabem lembranças.","Diante do sintoma, trata-se de lembrar a história esquecida pelo recalque e reconhecer nela um desejo; daí a necessidade de uma teoria do sujeito e do tempo."],"nota":"Na leitura corrente de Lacan, o real é o que resiste à simbolização, o impossível de dizer por inteiro. \"O real é a história\" é uma formulação do professor nesta aula, não uma definição canônica."}},{"id":"Ea7g0XICEkI","autor":"bion","conceitos":["Continente-contido"],"nivel":1,"titulo":"Continente e conteúdo: Wilfred Bion","canal":"Escola Paulista de Psicanálise","guia":{"resumo":"A aula expõe o conceito de continente e conteúdo de Bion, tal como aparece no livro Aprender com a experiência. O professor argumenta que, apesar de representado por dois pequenos símbolos, esse modelo é amplo e central para a função alfa e para o aprender com a experiência.","capitulos":[[0,"Bion e a reorganização dos conceitos"],[65,"Continente, conteúdo e função alfa"],[126,"O modelo da relação mãe-bebê"],[254,"Quando a continência falha"],[406,"Tolerar a frustração e o não saber"],[633,"K, menos K e inveja"]],"pontos":["Bion reorganiza constantemente sua teoria, e um conceito novo não invalida os anteriores; continente e conteúdo é um dos fatores da função alfa.","Na relação mãe-bebê, a mãe percebe a emoção que o bebê não sabe significar e, como continente, a devolve transformada.","Se a mãe não tem esse elemento ou ele está danificado, a criança fica com emoções não processadas, que tendem à evacuação pelo corpo.","Tolerar a frustração e o não saber é condição para ser um continente aberto; sem isso, cria-se um falso conteúdo para aplacar a ansiedade.","A curiosidade, ilustrada pela espátula de Winnicott, corresponde ao fator K; menos K, ligado à inveja, impede de conhecer o outro."]}},{"id":"a83QCziunWw","autor":"bion","conceitos":["Função alfa"],"nivel":2,"titulo":"Uma reflexão sobre a teoria das funções de Wilfred R. Bion","canal":"Prof. Renato Dias Martino","guia":{"resumo":"A aula apresenta uma reflexão sobre a teoria das funções de Wilfred Bion, insistindo que a psicanálise trabalha com analogias e modelos, e não com dados sensoriais. O argumento central é que a função alfa, exercida primeiro pela mãe em rêverie e depois pelo analista, transforma elementos beta em elementos alfa, tornando a experiência emocional pensável e sonhável.","capitulos":[[0,"A psicanálise trabalha com analogias"],[186,"Elementos de psicanálise e continente-contido"],[341,"Funções, fatores e função alfa"],[683,"Rêverie e terror sem nome"],[777,"Invariâncias e transformações"],[994,"Barreira de contato e tela beta"]],"pontos":["Diferente de exames médicos, a psicanálise lida com o não sensorial e opera por analogias, que têm semelhanças e diferenças com o que descrevem.","Em Elementos de psicanálise (1963), o primeiro elemento é a relação dinâmica entre continente e contido, que o professor associa à transferência.","Bion amplia a identificação projetiva de Klein, vista por ela como defesa da posição esquizoparanoide, como a forma mais primitiva de comunicação humana.","A função alfa transforma elementos beta, impressões sensoriais caóticas que só servem à identificação projetiva ou à atuação, em elementos alfa, que podem ser sonhados e pensados.","Pela rêverie, a mãe acolhe o que o bebê projeta e o devolve transformado; se falha, o bebê recebe de volta um terror sem nome.","Os elementos alfa formam a barreira de contato, que distingue interno e externo, sonho e vigília; quando a função alfa falha, forma-se a tela beta."]}}],"TEMAS_BIB":[{"id":"transferencia","tema":"Transferência","porque":"O laço do paciente com o analista, que repete relações antigas e é, ao mesmo tempo, resistência e motor do tratamento.","itens":[{"autor":"freud","titulo":"Artigos sobre técnica: Recomendações ao médico que pratica a psicanálise e A dinâmica da transferência","nota":"Em A dinâmica da transferência, por que ela surge em toda análise e como se torna resistência."},{"autor":"freud","titulo":"Observações sobre o amor de transferência","nota":"O amor dirigido ao analista e a regra de abstinência."},{"autor":"ferenczi","titulo":"Transferência e introjeção","nota":"A transferência como caso particular da introjeção: o paciente inclui o médico no seu mundo afetivo."},{"autor":"klein","titulo":"As origens da transferência","nota":"A transferência como revivência de situações totais e das relações de objeto mais precoces."},{"autor":"lacan","titulo":"O Seminário, livro 11: Os quatro conceitos fundamentais da psicanálise","nota":"A transferência como um dos quatro conceitos, ligada ao sujeito suposto saber."}]},{"id":"contratransferencia","tema":"Contratransferência e reverie","porque":"O que o analista sente e pensa na sessão: de obstáculo a ser analisado a instrumento de escuta.","itens":[{"autor":"winnicott","titulo":"O ódio na contratransferência (em Da pediatria à psicanálise)","nota":"O ódio objetivo do analista e por que reconhecê-lo protege o tratamento."},{"autor":"ferenczi","titulo":"Elasticidade da técnica psicanalítica","nota":"O tato e a sensibilidade do analista como parte da técnica."},{"autor":"ferenczi","titulo":"Confusão de língua entre os adultos e a criança","nota":"A hipocrisia profissional e a sinceridade do analista diante do paciente traumatizado."},{"autor":"bion","titulo":"Aprender da experiência","nota":"Continente e contido, função alfa e a reverie da mãe como modelo da mente do analista."},{"autor":"ogden","titulo":"Reverie e interpretação","nota":"Como as reveries do analista, devaneios aparentemente soltos, viram material para interpretar."}]},{"id":"luto","tema":"Luto, melancolia e depressão","porque":"A perda de objeto e o que a separa da depressão clínica, tema frequente no consultório.","itens":[{"autor":"freud","titulo":"Luto e melancolia","nota":"A comparação de base: no luto o mundo fica vazio, na melancolia é o próprio eu."},{"autor":"klein","titulo":"Amor, culpa e reparação e outros trabalhos (1921-1945)","nota":"Inclui os textos sobre a posição depressiva e sobre o luto e os estados maníaco-depressivos."},{"autor":"green","titulo":"Narcisismo de vida, narcisismo de morte","nota":"Inclui A mãe morta: o luto branco da criança diante de uma mãe deprimida."}]},{"id":"narcisismo","tema":"Narcisismo e self","porque":"Como o eu se forma e se ama, e como as falhas nesse processo aparecem na transferência.","itens":[{"autor":"freud","titulo":"Introdução ao narcisismo e ensaios de metapsicologia","nota":"Narcisismo primário e secundário, ideal do eu e escolha de objeto."},{"autor":"lacan","titulo":"O estádio do espelho como formador da função do eu","nota":"O eu nasce de uma imagem, numa identificação imaginária."},{"autor":"kohut","titulo":"Análise do self","nota":"As transferências narcísicas, especular e idealizadora, como via de tratamento."},{"autor":"green","titulo":"Narcisismo de vida, narcisismo de morte","nota":"O narcisismo negativo, que tende ao apagamento do eu."}]},{"id":"sonho","tema":"Sonho e pensamento","porque":"Do sonho como via régia ao inconsciente ao sonhar como trabalho psíquico que a análise ajuda a fazer.","itens":[{"autor":"freud","titulo":"A interpretação dos sonhos","nota":"O trabalho do sonho: condensação, deslocamento e realização de desejo."},{"autor":"bion","titulo":"Aprender da experiência","nota":"A função alfa transforma experiência bruta em elementos que podem ser sonhados e pensados."},{"autor":"ogden","titulo":"Esta arte da psicanálise: sonhando sonhos não sonhados e gritos interrompidos","nota":"A análise como lugar para sonhar o que o paciente não conseguiu sonhar sozinho."}]},{"id":"crianca","tema":"A criança na análise","porque":"As escolas divergem sobre como analisar crianças: educar, interpretar o brincar ou escutar a fala da criança.","itens":[{"autor":"annafreud","titulo":"Tratamento psicanalítico de crianças","nota":"A posição de Anna Freud: fase preparatória e cuidado com o papel dos pais."},{"autor":"klein","titulo":"A psicanálise de crianças","nota":"A técnica do brincar, interpretado como a associação livre do adulto."},{"autor":"winnicott","titulo":"O brincar e a realidade","nota":"Objetos e fenômenos transicionais; a análise como sobreposição de duas áreas de brincar."},{"autor":"dolto","titulo":"A imagem inconsciente do corpo","nota":"A imagem do corpo como lugar da história do desejo da criança."}]},{"id":"escuta","tema":"Escuta, enquadre e direção do tratamento","porque":"Como o analista escuta e onde se posiciona, do começo da análise ao manejo das sessões.","itens":[{"autor":"freud","titulo":"O início do tratamento","nota":"Entrevistas iniciais, tempo, pagamento e o uso do divã."},{"autor":"freud","titulo":"Artigos sobre técnica: Recomendações ao médico que pratica a psicanálise e A dinâmica da transferência","nota":"Nas Recomendações, a atenção uniformemente suspensa como contraparte da associação livre."},{"autor":"lacan","titulo":"A direção do tratamento e os princípios de seu poder","nota":"O analista dirige o tratamento, não o paciente."},{"autor":"bion","titulo":"Notas sobre memória e desejo","nota":"Escutar sem memória e sem desejo para estar aberto ao que surge na sessão."}]}],"DIAGRAMAS":{"freud":{"titulo":"O aparelho psíquico: as duas tópicas","w":400,"h":362,"sub":"À esquerda, a primeira tópica (A interpretação dos sonhos, 1900); à direita, a segunda (O eu e o id, 1923).","extra":"<text x=\"105\" y=\"26\" text-anchor=\"middle\" class=\"dg-cab\">1ª tópica · 1900</text><text x=\"305\" y=\"26\" text-anchor=\"middle\" class=\"dg-cab\">2ª tópica · 1923</text><line x1=\"12\" y1=\"180\" x2=\"198\" y2=\"180\" class=\"dg-barreira\"/>","nos":[{"id":"cs","x":20,"y":38,"w":170,"h":44,"rot":"Consciente"},{"id":"pcs","x":20,"y":98,"w":170,"h":44,"rot":"Pré-consciente"},{"id":"rec","x":40,"y":168,"w":130,"h":24,"rot":"censura · recalque","p":1,"termo":"Recalque"},{"id":"ics","x":20,"y":204,"w":170,"h":62,"rot":"Inconsciente\nrepresentações recalcadas","termo":"Inconsciente"},{"id":"ret","x":20,"y":290,"w":170,"h":56,"rot":"Retorno do recalcado:\nsonho, ato falho, sintoma","p":1},{"id":"sup","x":235,"y":38,"w":140,"h":44,"rot":"Supereu","termo":"Id, eu e supereu"},{"id":"eu","x":215,"y":112,"w":180,"h":56,"rot":"Eu\nmedia as exigências","termo":"Id, eu e supereu"},{"id":"id","x":215,"y":198,"w":180,"h":62,"rot":"Isso (id)\nreservatório das pulsões","termo":"Pulsão (Trieb)"},{"id":"inc2","x":215,"y":290,"w":180,"h":56,"rot":"Boa parte do eu e do\nsupereu é inconsciente","p":1}],"arestas":[{"de":"ics","para":"ret","d":"M105 266 L105 288"},{"de":"ret","para":"cs","d":"M20 318 L9 318 L9 60 L18 60","tracejada":1},{"de":"sup","para":"eu","d":"M305 82 L305 110"},{"de":"id","para":"eu","d":"M305 198 L305 170"}],"passos":[{"nos":["cs","pcs","ics"],"txt":"Na primeira tópica, Freud divide o aparelho psíquico em três sistemas: Consciente, Pré-consciente e Inconsciente. O que está no pré-consciente pode chegar à consciência; o inconsciente, não diretamente."},{"nos":["pcs","rec","ics"],"txt":"Entre o pré-consciente e o inconsciente atua a censura. O recalque mantém fora da consciência representações ligadas a moções pulsionais que causariam desprazer."},{"nos":["ics","ret","cs"],"txt":"O recalcado não fica quieto: retorna disfarçado, por condensação e deslocamento, em sonhos, atos falhos, chistes e sintomas. É por esses retornos que a análise chega ao inconsciente."},{"nos":["sup","eu","id"],"txt":"Em 1923, Freud propõe três instâncias. O isso é o reservatório das pulsões; o eu media entre o isso, o supereu e a realidade; o supereu, herdeiro do complexo de Édipo, julga e proíbe."},{"nos":["eu","sup","inc2","ics"],"txt":"As duas tópicas não se sobrepõem: inconsciente não é sinônimo de isso. Boa parte do eu, como as defesas, e do supereu também funciona sem que saibamos."}]},"klein":{"titulo":"As posições em Melanie Klein","w":400,"h":400,"sub":"Posições, não fases: modos de relação com os objetos, as angústias e as defesas, que se alternam ao longo da vida.","extra":"<text x=\"200\" y=\"196\" text-anchor=\"middle\" class=\"dg-cab\">oscila</text>","nos":[{"id":"ep","forma":"circ","x":100,"y":200,"r":88,"tx":100,"ty":160,"rot":"Posição\nesquizoparanoide","termo":"Posição esquizoparanoide"},{"id":"d","forma":"circ","x":300,"y":200,"r":88,"tx":300,"ty":160,"rot":"Posição\ndepressiva","termo":"Posição depressiva"},{"id":"fant","x":110,"y":10,"w":180,"h":44,"rot":"Fantasia inconsciente","termo":"Fantasia inconsciente"},{"id":"cisao","x":42,"y":204,"w":116,"h":44,"rot":"cisão:\nseio bom | seio mau","p":1},{"id":"total","x":242,"y":204,"w":116,"h":44,"rot":"objeto total:\namor e culpa","p":1},{"id":"ip","x":15,"y":304,"w":170,"h":40,"rot":"Identificação projetiva","termo":"Identificação projetiva"},{"id":"inveja","x":15,"y":352,"w":170,"h":36,"rot":"Inveja","termo":"Inveja"},{"id":"rep","x":215,"y":304,"w":170,"h":40,"rot":"Reparação","termo":"Reparação"}],"arestas":[{"de":"fant","para":"ep","d":"M160 54 L128 110"},{"de":"fant","para":"d","d":"M240 54 L272 110"},{"de":"ep","para":"d","d":"M186 206 L212 206"},{"de":"d","para":"ep","d":"M214 222 L188 222"},{"de":"ep","para":"ip","d":"M100 288 L100 302"},{"de":"d","para":"rep","d":"M300 288 L300 302"}],"passos":[{"nos":["fant"],"txt":"Para Klein, desde o início a vida psíquica é feita de fantasias inconscientes: a expressão mental das pulsões, que dá forma a toda relação com os objetos."},{"nos":["ep","cisao"],"txt":"Nos primeiros meses predomina a posição esquizoparanoide. Para se defender da angústia de aniquilamento, o bebê cinde o objeto em bom e mau, como um seio bom que gratifica e um seio mau que persegue. A angústia é persecutória."},{"nos":["ep","ip"],"txt":"Na identificação projetiva, partes do self e afetos insuportáveis são fantasiados como colocados dentro do objeto, que passa a ser sentido como contendo-os. Bion vai ler esse mecanismo também como forma de comunicação."},{"nos":["d","total"],"txt":"Por volta do meio do primeiro ano, o bebê percebe que a mãe amada e a odiada são a mesma pessoa. Surge o objeto total e, com ele, a angústia depressiva: o medo de ter danificado quem se ama."},{"nos":["d","rep"],"txt":"A culpa mobiliza o desejo de reparar o objeto danificado na fantasia. Para Klein, a reparação está na base do amor maduro e da criatividade."},{"nos":["ep","d"],"txt":"As posições não são etapas vencidas: ao longo da vida oscilamos entre elas. Bion escreveu essa oscilação como Ps↔D."},{"nos":["inveja","ep"],"txt":"Em Inveja e gratidão (1957), Klein descreve a inveja como ataque ao próprio objeto bom, justamente por ser bom. Ela atrapalha a cisão estruturante e a gratidão."}]},"winnicott":{"titulo":"Winnicott: o bebê, o ambiente e o espaço entre eles","w":400,"h":410,"sub":"O amadurecimento depende de um ambiente que se adapta às necessidades do bebê e depois, aos poucos, falha na medida certa.","extra":"<text x=\"200\" y=\"128\" text-anchor=\"middle\" class=\"dg-cab\">espaço</text><text x=\"200\" y=\"143\" text-anchor=\"middle\" class=\"dg-cab\">potencial</text>","nos":[{"id":"bebe","forma":"circ","x":150,"y":140,"r":88,"tx":112,"ty":140,"rot":"bebê"},{"id":"amb","forma":"circ","x":250,"y":140,"r":88,"tx":290,"ty":140,"rot":"ambiente\n(mãe)"},{"id":"esp","forma":"txt","x":200,"y":168,"rot":"◉","p":1,"termo":"Espaço potencial"},{"id":"self","x":4,"y":4,"w":156,"h":38,"rot":"Verdadeiro e falso self","p":1,"termo":"Verdadeiro e falso self"},{"id":"msb","x":236,"y":4,"w":160,"h":38,"rot":"Mãe suficientemente boa","p":1,"termo":"Mãe suficientemente boa"},{"id":"trans","x":130,"y":238,"w":140,"h":40,"rot":"Objeto transicional","termo":"Objeto transicional"},{"id":"st1","x":6,"y":296,"w":122,"h":46,"rot":"Dependência\nabsoluta","p":1},{"id":"st2","x":139,"y":296,"w":122,"h":46,"rot":"Dependência\nrelativa","p":1},{"id":"st3","x":272,"y":296,"w":122,"h":46,"rot":"Rumo à\nindependência","p":1},{"id":"holding","x":6,"y":356,"w":122,"h":46,"rot":"Holding\n(sustentação)","p":1,"termo":"Holding (sustentação)"},{"id":"anti","x":139,"y":356,"w":122,"h":46,"rot":"Tendência\nantissocial","p":1,"termo":"Tendência antissocial"},{"id":"cultura","x":272,"y":356,"w":122,"h":46,"rot":"Brincar e\ncultura","p":1,"termo":"Espaço potencial"}],"arestas":[{"de":"esp","para":"trans","d":"M200 180 L200 236"},{"de":"st1","para":"st2","d":"M128 319 L137 319"},{"de":"st2","para":"st3","d":"M261 319 L270 319"},{"de":"st1","para":"holding","d":"M67 342 L67 354"},{"de":"st2","para":"anti","d":"M200 342 L200 354"},{"de":"st3","para":"cultura","d":"M333 342 L333 354"}],"passos":[{"nos":["bebe","amb"],"txt":"Winnicott insiste que um bebê sozinho não existe: existe sempre um bebê com alguém que cuida dele. Por isso o esquema começa com dois círculos que se sobrepõem."},{"nos":["amb","msb","st1","holding"],"txt":"No início, na dependência absoluta, a mãe suficientemente boa se adapta quase totalmente às necessidades do bebê e o sustenta, física e psiquicamente. Isso é o holding."},{"nos":["st1","st2","amb"],"txt":"Essa adaptação dá ao bebê a ilusão de criar o que encontra. Aos poucos, falhas toleráveis da mãe apresentam a realidade: é a desilusão gradual da dependência relativa."},{"nos":["esp","trans","bebe","amb"],"txt":"O objeto transicional, como um ursinho ou a ponta de um cobertor, não é nem só do bebê nem só do mundo. Não se pergunta ao bebê se ele o criou ou o encontrou."},{"nos":["esp","cultura","st3"],"txt":"Essa área intermediária vira o espaço potencial: o lugar do brincar, da cultura e também da análise, onde paciente e analista brincam juntos."},{"nos":["self","bebe"],"txt":"Quando o ambiente falha demais e cedo, o bebê se adapta a ele em vez de ser atendido: forma-se um falso self que protege o verdadeiro, e a pessoa pode viver sem se sentir real."},{"nos":["anti","st2"],"txt":"Quando a criança perde um ambiente bom que já teve, uma privação, pode surgir a tendência antissocial. Winnicott via nela um pedido de volta ao que foi perdido, um sinal de esperança."}]},"lacan":{"titulo":"Lacan: do espelho aos três registros","w":400,"h":430,"sub":"Acima, a cena do estádio do espelho; abaixo, um esquema dos três registros amarrados.","extra":"<line x1=\"200\" y1=\"8\" x2=\"200\" y2=\"132\" class=\"dg-espelho\"/><text x=\"200\" y=\"146\" text-anchor=\"middle\" class=\"dg-cab\">espelho</text>","nos":[{"id":"I","forma":"circ","x":142,"y":268,"r":70,"tx":104,"ty":250,"rot":"Imaginário","p":1,"termo":"Imaginário, Simbólico e Real"},{"id":"S","forma":"circ","x":258,"y":268,"r":70,"tx":296,"ty":250,"rot":"Simbólico","p":1,"termo":"Imaginário, Simbólico e Real"},{"id":"R","forma":"circ","x":200,"y":350,"r":70,"tx":200,"ty":392,"rot":"Real","p":1,"termo":"Imaginário, Simbólico e Real"},{"id":"a","forma":"circ","x":200,"y":296,"r":15,"tx":200,"ty":296,"rot":"a","termo":"Objeto a"},{"id":"sig","forma":"txt","x":292,"y":284,"rot":"significante\nNome-do-Pai","p":1,"termo":"Significante"},{"id":"crianca","x":8,"y":14,"w":120,"h":48,"rot":"Criança\n6 a 18 meses","p":1,"termo":"Estádio do espelho"},{"id":"outro","x":8,"y":80,"w":120,"h":48,"rot":"Outro: o adulto\nque diz “é você”","p":1,"termo":"Grande Outro"},{"id":"imagem","x":272,"y":14,"w":120,"h":48,"rot":"Imagem\nunificada","p":1,"termo":"Estádio do espelho"},{"id":"eu","x":272,"y":80,"w":120,"h":48,"rot":"Eu (moi)\nimaginário","p":1,"termo":"Estádio do espelho"}],"arestas":[{"de":"crianca","para":"imagem","d":"M128 38 L270 38"},{"de":"imagem","para":"eu","d":"M332 62 L332 78"},{"de":"outro","para":"crianca","d":"M68 80 L68 64"}],"passos":[{"nos":["crianca","imagem"],"txt":"Entre os 6 e os 18 meses, a criança, que ainda não coordena bem o próprio corpo, reconhece-se com júbilo na imagem do espelho."},{"nos":["imagem","eu","I"],"txt":"A imagem unificada antecipa uma unidade que o corpo ainda não tem. O eu nasce como imagem, vindo de fora, e por isso é alienado: é o registro Imaginário, das identificações e rivalidades."},{"nos":["outro","crianca","S"],"txt":"A criança se volta para o adulto que a segura, como quem pede confirmação. O reconhecimento vem do Outro, lugar da linguagem: é o registro Simbólico."},{"nos":["S","sig"],"txt":"No Simbólico, um significante representa o sujeito para outro significante. O Nome-do-Pai é o significante que ordena essa cadeia e a lei do desejo."},{"nos":["R"],"txt":"O Real é o que resiste à simbolização: o que não se deixa dizer nem imaginar por inteiro, e volta sempre ao mesmo lugar."},{"nos":["I","S","R","a"],"txt":"Nos anos 1970, Lacan amarra os três registros num nó borromeano: se um anel se solta, os três se soltam. No centro ele situa o objeto a, causa do desejo. O desenho aqui é só um esquema do nó."}]},"bion":{"titulo":"Bion: como nasce o pensar","w":400,"h":420,"sub":"À esquerda, o que acontece com o bebê; à direita, o que a mãe, ou o analista, faz com o que recebe.","nos":[{"id":"beta","x":14,"y":10,"w":176,"h":56,"rot":"Elementos β\nemoções brutas, não pensadas","p":1},{"id":"rev","x":210,"y":10,"w":176,"h":56,"rot":"Mãe em rêverie\nrecebe e contém","p":1,"termo":"Rêverie"},{"id":"alfa","x":210,"y":100,"w":176,"h":56,"rot":"Função α\ntransforma","termo":"Função alfa"},{"id":"elalfa","x":14,"y":100,"w":176,"h":56,"rot":"Elementos α\nsuportáveis","p":1},{"id":"pens","x":14,"y":190,"w":176,"h":56,"rot":"Sonhar, pensar\ne lembrar","p":1},{"id":"barreira","x":210,"y":190,"w":176,"h":56,"rot":"Barreira de contato\nconsciente | inconsciente","p":1},{"id":"cc","x":100,"y":272,"w":200,"h":48,"rot":"Continente ♀ · contido ♂","termo":"Continente-contido"},{"id":"falha","x":14,"y":350,"w":176,"h":56,"rot":"Se falha: terror sem\nnome, evacuação, atuação","p":1},{"id":"sess","x":210,"y":350,"w":176,"h":56,"rot":"Na sessão: sem\nmemória e sem desejo","p":1,"termo":"Sem memória e sem desejo"}],"arestas":[{"de":"beta","para":"rev","d":"M190 38 L208 38"},{"de":"rev","para":"alfa","d":"M298 66 L298 98"},{"de":"alfa","para":"elalfa","d":"M210 128 L192 128"},{"de":"elalfa","para":"pens","d":"M102 156 L102 188"},{"de":"pens","para":"barreira","d":"M190 218 L208 218"},{"de":"beta","para":"falha","d":"M8 66 L4 66 L4 376 L12 376","tracejada":1}],"passos":[{"nos":["beta"],"txt":"Bion pergunta como nasce a capacidade de pensar. As experiências emocionais brutas chegam como elementos beta: impressões não digeridas, que não podem ser pensadas, só evacuadas."},{"nos":["beta","rev"],"txt":"O bebê projeta esse excesso na mãe, por identificação projetiva. Aqui ela não é só defesa: é uma forma de comunicação."},{"nos":["rev","alfa","cc"],"txt":"A mãe em rêverie recebe, contém e transforma o que o bebê não suporta: ela empresta sua função alfa. Ela é o continente; a angústia do bebê, o contido."},{"nos":["alfa","elalfa","pens","barreira"],"txt":"Devolvido de forma suportável, o material vira elementos alfa, que podem ser sonhados, pensados e lembrados. Eles formam a barreira de contato entre consciente e inconsciente."},{"nos":["cc","pens"],"txt":"Com o tempo, o bebê introjeta a própria relação continente-contido e ganha um aparelho para pensar os pensamentos."},{"nos":["falha","beta"],"txt":"Quando não há continente, a angústia volta sem forma: Bion fala em terror sem nome. O que não pode ser pensado tende a ser evacuado no corpo ou no ato."},{"nos":["sess","rev"],"txt":"Na sessão, o analista oferece essa função. Por isso Bion pede que ele escute sem memória e sem desejo, aberto ao que ainda não tem forma."}]}},"MANUAL":[{"id":"inicio","titulo":"Comece aqui","view":"biblioteca","tour":"inicio","resumo":"O Divã de Cinco Escutas é um ambiente de estudo e treino em psicanálise: você escuta uma fala com cinco escolas (Freud, Klein, Winnicott, Lacan e Bion), treina com pacientes simulados, organiza seus atendimentos e estuda os autores.","passos":["Use as abas do alto para trocar de área: Biblioteca, Escutar, Mesa clínica, Pacientes, Treino, Supervisor, Financeiro e Estudo.","Se é a primeira vez, comece pela Biblioteca: escolha um caso clássico e leve-o para Escutar.","O botão Ouvir, no alto, lê a tela em voz alta. O botão Ajuda abre este manual e os vídeos do tour.","O que você cria fica guardado de forma privada na sua conta. Faça backup de vez em quando, em Pacientes."],"dicas":["Use só iniciais ou códigos
