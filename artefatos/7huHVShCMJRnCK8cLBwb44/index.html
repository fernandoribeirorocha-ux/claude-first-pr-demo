intermediário","ed":{"editora":"Companhia das Letras","local":"São Paulo","ano":"2010","volume":"Obras completas, v. 10 (1911-1913)","tradutor":"Paulo César de Souza","isbn":"978-85-359-1614-0"},"verif":{"status":"conferida","fonte":"https://www.companhiadasletras.com.br/livro/9788535916140/freud-1911-1913-obras-completas-volume-10 ; sumário: https://www.caaspshop.com.br/sigmund-freud-1911-1913---obras-completas-v10-52953/p","nota":"Correção: volume definido (v. 10, 2010), antes 'a confirmar'. Na Autêntica o título é 'Lembrar, repetir e perlaborar'."},"porque_nivel":"Curto, mas introduz compulsão à repetição e elaboração, que pedem base em transferência.","autentica":{"titulo":"Fundamentos da clínica psicanalítica","ano":"2017","fonte":"https://www.grupoautentica.com.br/produto/fundamentos-da-clinica-psicanalitica-641 ; sumário (DNB): https://d-nb.info/1240906714/04"},"tecnica":true,"original":{"titulo":"Erinnern, Wiederholen und Durcharbeiten","url":"https://projekt-gutenberg.org/authors/sigmund-freud/books/kleine-schriften-i/chapter/18"}},{"titulo":"Observações sobre o amor de transferência","ano":"1915","edicao":"Companhia das Letras, Obras completas, trad. Paulo César de Souza (volume a confirmar)","nivel":"intermediário","ed":{"editora":"Companhia das Letras","local":"São Paulo","ano":"2010","volume":"Obras completas, v. 10 (1911-1913)","tradutor":"Paulo César de Souza","isbn":"978-85-359-1614-0"},"verif":{"status":"conferida","fonte":"https://www.companhiadasletras.com.br/livro/9788535916140/freud-1911-1913-obras-completas-volume-10 ; sumário: https://www.caaspshop.com.br/sigmund-freud-1911-1913---obras-completas-v10-52953/p","nota":"Correção: volume definido (v. 10, 2010), antes 'a confirmar'. Na Autêntica o título é 'Observações sobre o amor transferencial'."},"porque_nivel":"Texto clínico acessível, mas cujo alcance depende de entender transferência e abstinência.","autentica":{"titulo":"Fundamentos da clínica psicanalítica","ano":"2017","fonte":"https://ww ntos da clínica psicanalítica","ano":"2017","fonte":"https://www.grupoautentica.com.br/produto/fundamentos-da-clinica-psicanalitica-641 ; sumário (DNB): https://d-nb.info/1240906714/04"},"tecnica":true,"original":{"titulo":"Konstruktionen in der Analyse","url":"https://projekt-gutenberg.org/authors/sigmund-freud/books/kleine-schriften-i/chapter/36"}},{"titulo":"Cinco lições de psicanálise","ano":1910,"edicao":"","ed":{"editora":"Companhia das Letras","local":"São Paulo","ano":"2013","volume":"Obras completas, v. 9 (1909-1910)","tradutor":"Paulo César de Souza","isbn":"978-85-359-2239-4"},"verif":{"status":"conferida","fonte":"https://www.companhiadasletras.com.br/livro/9788535922394/freud-1909-1910-obras-completas-volume-9","nota":"Volume: Observações sobre um caso de neurose obsessiva [\"O homem dos ratos\"] e outros textos. Sem volume equivalente localizado na Autêntica."},"nivel":"introdutório","porque_nivel":"Conferências de divulgação, curtas e claras, feitas para leigos.","original":{"titulo":"Über Psychoanalyse","url":"https://projekt-gutenberg.org/authors/sigmund-freud/books/ueber-psychoanalyse"}}],"dicionarios":[{"titulo":"Vocabulário da psicanálise","autor":"Jean Laplanche e Jean-Bertrand Pontalis","edicao":"Martins Fontes, 4ª ed., 2001, trad. Pedro Tamen","ed":{"editora":"Martins Fontes (selo Martins)","ano":"2022","volume":"5ª ed.","tradutor":"Pedro Tamen","isbn":"9786555540147"},"verif":{"status":"conferida","fonte":"https://www.martinsfontespaulista.com.br/vocabulario-da-psicanalise-986530/p","nota":"Edição em catálogo hoje: 5ª ed., 2022, 576 p. (livraria da editora). O app cita a 4ª ed. (2001), já substituída. Cidade não aparece na página do produto."}},{"titulo":"Dicionário de psicanálise","autor":"Elisabeth Roudinesco e Michel Plon","edicao":"Zahar, 1998, trad. Vera Ribeiro e Lucy Magalhães","ed":{"editora":"Zahar","ano":"1998","isbn":"978-85-7110-444-0"},"verif":{"status":"conferida","fonte":"https://www.companhiadasletras.com.br/livro/9788571104440/dicionario-de-psicanalise","nota":"Página da editora (Zahar/Companhia das Letras): lançamento 05/11/1998, 892 p. Tradutores (Vera Ribeiro e Lucy Magalhães, segundo o app) e cidade não aparecem na página."}}],"artigos":[{"titulo":"A constituição do conceito de eu na metapsicologia freudiana","autores":"Thiago Henrique Bomfim","revista":"Psicologia USP, v. 25, n. 2","ano":2014,"url":"https://revistas.usp.br/psicousp/article/view/85478"},{"titulo":"A histeria nas revisões do caso Emmy von N.: contribuições para a história da psicanálise","autores":"Glaucia V. P. de Brida e Gustavo A. R. Mello Neto","revista":"Memorandum (UFMG), n. 28","ano":2015,"url":"https://periodicos.ufmg.br/index.php/memorandum/article/view/6456"}],"instituicao":{"nome":"Freud Museum London","url":"https://www.freud.org.uk/"}},"klein":{"bio":"Melanie Klein nasceu em 30 de março de 1882 em Viena e morreu em 22 de setembro de 1960 em Londres. Não fez curso universitário; formou-se psicanalista em análise com Sándor Ferenczi, em Budapeste, e depois com Karl Abraham, em Berlim, e mudou-se para Londres em 1926. Criou a técnica do brincar na análise de crianças e a teoria das relações de objeto precoces, das fantasias inconscientes e das posições esquizoparanoide e depressiva.","conceitos":[{"termo":"Fantasia inconsciente","def":"Expressão psíquica das pulsões, ativa desde o início da vida, que está por trás de todos os processos mentais.","onde_ler":"A psicanálise de crianças (1932); Algumas conclusões teóricas sobre a vida emocional do bebê (1952)","clinica":"Uma criança que bate repetidamente num boneco e depois o esconde encena, em uma leitura corrente kleiniana, a fantasia de ter danificado o objeto e o medo da retaliação.","nao_confundir":"Não é devaneio consciente nem imaginação diurna: é atividade inconsciente e permanente, que a escola kleiniana grafa phantasy para marcar a diferença.","outras_escolas":"Lacan, na leitura do fantasma, prefere pensar a fantasia como estrutura que articula sujeito e objeto a, e não como expressão direta da pulsão.","original":"unconscious phantasy"},{"termo":"Posição esquizoparanoide","def":"Modo de funcionamento inicial com objetos parciais, cisão entre bom e mau e angústia persecutória.","onde_ler":"Notas sobre alguns mecanismos esquizoides (1946); Inveja e gratidão (1957)","clinica":"Um paciente que vê o analista como perfeito numa semana e como perseguidor na seguinte oscila entre objeto idealizado e objeto mau, típico dessa posição.","nao_confundir":"Não é diagnóstico de esquizofrenia ou paranoia: é um modo de organização presente em todos, ao qual se retorna ao longo da vida.","outras_escolas":"Winnicott critica a atribuição precoce de fantasias tão elaboradas ao bebê e enfatiza o papel do ambiente nas falhas de integração.","original":"paranoid-schizoid position"},{"termo":"Posição depressiva","def":"Integração do objeto total, amado e odiado, que traz ambivalência, culpa e desejo de reparar.","onde_ler":"Uma contribuição à psicogênese dos estados maníaco-depressivos (1935); O luto e sua relação com os estados maníaco-depressivos (1940)","clinica":"Depois de atacar o analista, um paciente chega à sessão seguinte preocupado com o efeito do que disse, sinal de que pode reconhecer que ama e odeia a mesma pessoa.","nao_confundir":"Não é depressão clínica: é uma conquista do desenvolvimento, ligada à capacidade de preocupação e de luto.","outras_escolas":"Winnicott relê a posição depressiva como estágio da preocupação (concern), dependente de uma mãe que sobrevive aos ataques do bebê.","original":"depressive position"},{"termo":"Identificação projetiva","def":"Fantasia de expelir partes do self para dentro do objeto para controlá-lo, livrar-se delas ou comunicá-las.","onde_ler":"Notas sobre alguns mecanismos esquizoides (1946); Sobre a identificação (1955)","clinica":"O analista se sente incompetente e desvalorizado diante de um paciente que se descreve como fracassado, como se tivesse recebido dentro de si o que o paciente não suporta sentir.","nao_confundir":"Não é o mesmo que projeção simples: na identificação projetiva a parte expelida é sentida dentro do objeto, que passa a ser controlado e confundido com o self.","outras_escolas":"Bion amplia o conceito para incluir uma forma realista de comunicação primitiva, base do modelo continente-contido.","original":"projective identification"},{"termo":"Inveja","def":"Impulso destrutivo dirigido ao objeto bom por ele possuir o que é desejado, que ataca a própria fonte de vida.","onde_ler":"Inveja e gratidão (1957)","clinica":"Um paciente desqualifica toda interpretação que o ajuda, justamente porque ela vem de outro, e a melhora é seguida de ataque ao trabalho analítico.","nao_confundir":"Inveja não é ciúme: o ciúme envolve três pessoas e o medo de perder o amor, a inveja é uma relação a dois que quer estragar o bom do outro.","outras_escolas":"Em uma leitura corrente, autores independentes britânicos, como Winnicott, tendem a ver na inveja menos um dado constitucional e mais efeito de falhas ambientais.","original":"envy"},{"termo":"Reparação","def":"Movimento de restaurar o objeto amado que se sente danificado pelos próprios ataques, central na posição depressiva e na criatividade.","onde_ler":"Amor, culpa e reparação (1937); Situações infantis de ansiedade refletidas em uma obra de arte e no impulso criativo (1929)","clinica":"Uma criança que rasgou um desenho na sessão anterior pede para colá-lo e terminá-lo, expressando o desejo de consertar o que estragou.","nao_confundir":"Reparação não é reparação maníaca, que nega a dependência e o dano com triunfo e onipotência, nem simples formação reativa.","outras_escolas":"Winnicott fala em contribuição e capacidade de preocupação, dando mais peso à oportunidade que o ambiente oferece para o gesto reparador.","original":"reparation"},{"termo":"Objeto interno","def":"Representação inconsciente de pessoas ou partes delas, sentida como presença viva dentro do self, com intenções próprias, boas ou más, formada por introjeção e projeção.","onde_ler":"Uma contribuição à psicogênese dos estados maníaco-depressivos (1935); O luto e sua relação com os estados maníaco-depressivos (1940)","clinica":"Uma paciente sozinha em casa se sente vigiada e criticada por uma voz que soa como a da avó, figura interna que segue agindo nas escolhas dela.","nao_confundir":"Não é a lembrança da pessoa real: o objeto interno é construído pela fantasia e pode ser muito diferente do pai ou da mãe concretos.","outras_escolas":"Fairbairn constrói uma teoria própria de objetos internos a partir da experiência de frustração real, enquanto Lacan desloca a questão para o objeto a, que não é representação.","original":"internal object"},{"termo":"Ansiedade persecutória e ansiedade depressiva","def":"Duas formas centrais de ansiedade: a persecutória teme a destruição do self pelo objeto mau; a depressiva teme ter danificado ou perdido o objeto amado.","onde_ler":"Uma contribuição à psicogênese dos estados maníaco-depressivos (1935); Sobre a teoria da ansiedade e da culpa (1948)","clinica":"Diante das férias do analista, um paciente pode sentir que está sendo descartado (persecutória) ou temer que seus ataques tenham afastado o analista (depressiva).","nao_confundir":"Não são sintomas de um transtorno de ansiedade: são ansiedades estruturais de cada posição e indicam qual relação de objeto está em jogo.","outras_escolas":"Freud pensava a angústia sobretudo como sinal do eu diante do perigo, enquanto Klein a vincula diretamente à pulsão de morte e às fantasias de ataque.","original":"persecutory anxiety and depressive anxiety"},{"termo":"Cisão","def":"Defesa primitiva que separa objeto e self em partes boas e más mantidas à distância, protegendo o bom do mau e organizando a posição esquizoparanoide.","onde_ler":"Notas sobre alguns mecanismos esquizoides (1946); Inveja e gratidão (1957)","clinica":"Um paciente idealiza o analista e despeja toda a raiva na esposa, e a interpretação procura mostrar que ambas as figuras carregam aspectos da mesma relação.","nao_confundir":"Não é a clivagem do eu descrita por Freud no fetichismo, nem a dissociação da histeria, embora as três tratem de divisões psíquicas.","outras_escolas":"Kernberg articula a cisão kleiniana à psicologia do ego para descrever a organização borderline de personalidade.","original":"splitting"},{"termo":"Onipotência e idealização","def":"Defesas da posição esquizoparanoide: a onipotência nega a dependência e o limite; a idealização exagera a bondade do objeto para protegê-lo do ódio e da perseguição.","onde_ler":"Notas sobre alguns mecanismos esquizoides (1946); Inveja e gratidão (1957)","clinica":"No início da análise, uma paciente descreve o analista como o único que a entende, e em uma leitura corrente kleiniana isso protege contra a desconfiança e a inveja.","nao_confundir":"Idealização não é admiração realista nem amor maduro: ela depende da cisão e costuma virar decepção ou perseguição.","outras_escolas":"Kohut vê a idealização do terapeuta como necessidade normal de um objeto do self, e não primariamente como defesa.","original":"omnipotence and idealization"},{"termo":"Gratidão","def":"Capacidade de reconhecer e desfrutar o objeto bom recebido, base da confiança e da generosidade; para Klein, oposta à inveja e ligada à introjeção estável do seio bom.","onde_ler":"Inveja e gratidão (1957)","clinica":"Um paciente que antes desqualificava tudo passa a dizer que guardou uma interpretação da sessão anterior e pensou nela, sinal de que pôde receber algo.","nao_confundir":"Gratidão não é obrigação moral, polidez nem submissão ao analista: é experiência de prazer genuíno com o que foi recebido.","outras_escolas":"Em uma leitura corrente winnicottiana, a experiência de receber depende menos do equilíbrio pulsional e mais de um ambiente que sustenta e sobrevive.","original":"gratitude"},{"termo":"Técnica do brincar","def":"Método de análise de crianças em que o brincar com pequenos brinquedos é tratado como equivalente da associação livre e interpretado, inclusive na transferência.","onde_ler":"A psicanálise de crianças (1932); A técnica psicanalítica através do brincar: sua história e significado (1955)","clinica":"Uma criança derruba repetidamente um carrinho pequeno com um grande, e a analista interpreta a cena como expressão do medo e da raiva diante de figuras poderosas.","nao_confundir":"Não é ludoterapia recreativa nem brincadeira pedagógica: o brincar é material inconsciente a ser escutado e interpretado.","outras_escolas":"Anna Freud defendia uma fase preparatória e educativa com a criança, e Winnicott valoriza o brincar em si como experiência terapêutica, sem precisar interpretá-lo sempre.","original":"play technique"}],"obras":[{"titulo":"Amor, culpa e reparação e outros trabalhos (1921-1945)","ano":"1921–1945","edicao":"Coletânea de 1975. Imago, 1996, trad. André Cardoso (Obras completas, v. 1)","nivel":"avançado","ed":{"editora":"Ubu Editora (coedição Imago)","local":"São Paulo","ano":"2023","volume":"Obras completas de Melanie Klein","tradutor":"André Cardoso","isbn":"978-85-7126-133-4"},"verif":{"status":"conferida","fonte":"https://www.ubueditora.com.br/amor-klein.html","nota":"Na Ubu o título é 'Amor, culpa e reparação e outros ensaios' (528 p.). Ano 2023 vem da caixa (Loja UnB). A edição Imago 1996 citada no app não foi localizada online."},"porque_nivel":"Coletânea técnica de artigos clínicos e teóricos, pede base prévia em Freud."},{"titulo":"Notas sobre alguns mecanismos esquizoides","ano":1946,"edicao":"Em Inveja e gratidão e outros trabalhos, Imago, 1996, trad. Liana Pinto Chaves","nivel":"avançado","ed":{"editora":"Ubu Editora (coedição Imago)","local":"São Paulo","ano":"2023","volume":"Inveja e gratidão e outros ensaios (1º texto do volume)","tradutor":"","isbn":"978-85-7126-134-1"},"verif":{"status":"conferida","fonte":"https://www.ubueditora.com.br/inveja-klein.html","nota":"A Ubu informa que é o 1º artigo do volume. Na Imago, o volume 'Inveja e gratidão' aparece citado como Rio de Janeiro, Imago, 1991 (Dicionário Enciclopédico da IPA), não 1996. O app credita Liana Pinto Chaves, mas a Ubu credita a ela 'A psicanálise de crianças'; o tradutor deste ensaio não foi confirmado."},"porque_nivel":"Texto denso que introduz a posição esquizoparanoide e a identificação projetiva."},{"titulo":"Inveja e gratidão e outros trabalhos (1946-1963)","ano":"1946–1963","edicao":"Coletânea de 1975. Imago; há também edição Ubu, 2023, Inveja e gratidão e outros ensaios","nivel":"avançado","ed":{"editora":"Ubu Editora (coedição Imago)","local":"São Paulo","ano":"2023","volume":"Obras completas de Melanie Klein (caixa com 2 volumes de ensaios)","tradutor":"Belinda H. Mandelbaum, Maria Elena Salles de Brito, Octávio L. de Barros Salles, Maria Tereza B. Marcondes Godoy, Viviana S. S. Starzynski, Wellington Marcos de Melo Dantas","isbn":"978-85-7126-134-1"},"verif":{"status":"conferida","fonte":"https://www.ubueditora.com.br/inveja-klein.html","nota":"Título Ubu confirmado: 'Inveja e gratidão e outros ensaios' (416 p.). 'Obras reunidas' é só o nome da caixa na Loja UnB; a Ubu chama a série de 'Obras completas de Melanie Klein' e vende os 2 volumes de ensaios na 'Caixa Melanie Klein' (ISBN 978-85-7126-135-8, 2023). Imago: citada como 1991 (IPA)."},"porque_nivel":"Reúne os textos da maturidade, com conceitos que exigem leitura acompanhada."},{"titulo":"A psicanálise de crianças","ano":1932,"edicao":"Imago, 1997","nivel":"avançado","ed":{"editora":"Ubu Editora (coedição Imago)","local":"São Paulo","ano":"2025","volume":"Obras completas de Melanie Klein","tradutor":"Liana Pinto Chaves","isbn":"978-85-7126-199-0"},"verif":{"status":"conferida","fonte":"https://www.ubueditora.com.br/psicanalise-criancas.html","nota":"Nova edição Ubu anunciada para setembro de 2025 (368 p.). A edição Imago 1997 do app não foi localizada online."},"porque_nivel":"Livro clínico longo sobre a técnica do brincar, melhor depois de uma introdução."},{"titulo":"Introdução à obra de Melanie Klein (Hanna Segal, obra de apoio)","ano":1964,"edicao":"Imago, 1975","nivel":"introdutório","ed":{"editora":"Ubu Editora","local":"São Paulo","ano":"2025","volume":"","tradutor":"Júlio Castañon Guimarães","isbn":"978-85-7126-179-2"},"verif":{"status":"conferida","fonte":"https://www.loja.editora.unb.br/psicologia/introducao-a-obra-de-melanie-klein-9326/p","nota":"Edição Imago 1975 confirmada no Open Library (ISBN 978-85-312-0832-4). Ubu 2025 (160 p.) é a edição atual; a Ubu também lista e-book com ISBN 978-85-7126-233-1."},"porque_nivel":"Escrita para ensinar, organiza os conceitos kleinianos em ordem didática.","autor_abnt":"SEGAL, Hanna","tipo":"comentador"},{"titulo":"As origens da transferência","ano":1952,"edicao":"","ed":{"editora":"Imago","local":"Rio de Janeiro","ano":"1991","volume":"Inveja e gratidão","tradutor":"","isbn":""},"verif":{"status":"conferida","fonte":"https://online.flippingbook.com/view/3456/441/","nota":"Referência do Dicionário Enciclopédico de Psicanálise da IPA: 'In: Klein, M. Inveja e Gratidão. Rio de Janeiro, Imago, 1991'. Pelo período (1946-1963), deve estar também no volume Ubu, mas a página da Ubu não lista o sumário."},"nivel":"intermediário","porque_nivel":"Artigo curto que liga transferência e relações de objeto precoces.","tecnica":true},{"titulo":"Sobre a identificação","ano":1955,"edicao":"","verif":{"status":"conferida","fonte":"https://archivum.grupomarista.org.br/pergamumweb/vinculos//000070/0000704d.pdf","nota":"Ensaio (1955), não livro. Visto na bibliografia de dissertação PUCPR (2018): 'Sobre a Identificação. In: Inveja e gratidão e outros trabalhos. Rio de Janeiro: Imago, 1955/1991, p. 311'. Reedição atual: Ubu/Imago, 'Inveja e gratidão e outros ensaios', ISBN 9788571261341 (ubueditora.com.br/inveja-klein.html); ano e tradutor da Ubu e presença do ensaio no sumário não vistos."},"nivel":"avançado","porque_nivel":"Estudo da identificação projetiva a partir de um romance, pressupõe os conceitos de 1946.","ed":{"editora":"Imago","local":"Rio de Janeiro","ano":"1991","volume":"In: Inveja e gratidão e outros trabalhos (Obras completas de Melanie Klein)"}}],"dicionarios":[{"titulo":"Dicionário do pensamento kleiniano","autor":"R. D. Hinshelwood","edicao":"Artes Médicas, 1992","verif":{"status":"conferida","fonte":"https://revista.sppa.org.br/RPdaSPPA/article/view/1301","nota":"Referência em artigo da Revista de Psicanálise da SPPA: 'Porto Alegre, Artes Médicas, 1992'. Tradutor e ISBN não vistos em página aberta. Buscas citam reedição Artmed 2009, não aberta."},"nivel":"intermediário","porque_nivel":"Verbetes extensos, bons para consulta ao longo da formação.","autor_abnt":"HINSHELWOOD, R. D.","ed":{"editora":"Artes Médicas","local":"Porto Alegre","ano":"1992"}}],"artigos":[{"titulo":"Um estudo comparativo entre as teorias de Klein e Winnicott: analisando o conceito de fantasia","autores":"Alexandre P. de Almeida e Alfredo Naffah Neto","revista":"Revista Latinoamericana de Psicopatologia Fundamental (SciELO)","ano":2024,"url":"https://www.scielo.br/j/rlpf/a/RyBhLpsyhW8gTHbzsWtpsyD/"},{"titulo":"Do instinto de morte à inveja inata: um estudo comparativo entre Freud e Melanie Klein","autores":"Alexandre Patricio Almeida","revista":"Psicologia Revista (PUC-SP), v. 35","ano":2026,"url":"https://revistas.pucsp.br/index.php/psicorevista/article/view/68724"}],"instituicao":{"nome":"Melanie Klein Trust","url":"https://melanie-klein-trust.org.uk/"}},"winnicott":{"bio":"Donald Woods Winnicott nasceu em 7 de abril de 1896 em Plymouth, na Inglaterra, e morreu em 25 de janeiro de 1971 em Londres. Formou-se em medicina, foi pediatra por décadas no Paddington Green Children's Hospital e se tornou psicanalista pela Sociedade Britânica. Pôs no centro de sua teoria a relação mãe-bebê e o papel do ambiente no amadurecimento emocional, com conceitos como objeto transicional e falso self.","conceitos":[{"termo":"Mãe suficientemente boa","def":"Mãe que no início se adapta quase totalmente às necessidades do bebê e depois falha aos poucos, na medida em que ele consegue tolerar.","onde_ler":"Objetos transicionais e fenômenos transicionais (1951); Distorção do ego em termos de falso e verdadeiro self (1960)","clinica":"O analista não precisa ser perfeito: uma falha pequena, como esquecer um detalhe, reconhecida e trabalhada na sessão, pode ajudar o paciente a tolerar a realidade do outro.","nao_confundir":"Não é a mãe perfeita nem uma mãe mediana ou negligente: é aquela cujas falhas são graduais e suportáveis para o bebê.","outras_escolas":"Em uma leitura corrente kleiniana, o peso maior recai sobre as fantasias e a constituição do bebê, e não tanto sobre a adaptação real do ambiente.","original":"good-enough mother"},{"termo":"Holding (sustentação)","def":"Conjunto de cuidados físicos e psíquicos que dão ao bebê, na dependência absoluta, a experiência de continuidade de ser.","onde_ler":"Teoria do relacionamento paterno-infantil (1960); O ambiente e os processos de maturação (1965)","clinica":"Com pacientes muito regredidos, a constância do horário, da sala e da presença do analista sustenta a sessão mais do que qualquer interpretação.","nao_confundir":"Holding não é segurar fisicamente o paciente nem apoio afetivo genérico: é a sustentação confiável que permite integrar a experiência.","outras_escolas":"Bion propõe o modelo continente-contido, que enfatiza a transformação de conteúdos emocionais pela mente do outro, mais do que a sustentação ambiental.","original":"holding"},{"termo":"Objeto transicional","def":"Primeira posse não-eu (como a ponta de um cobertor), situada entre o subjetivo e o objetivamente percebido.","onde_ler":"Objetos transicionais e fenômenos transicionais (1951); O brincar e a realidade (1971)","clinica":"Um paciente adulto leva sempre um caderno à sessão e o segura sem abrir, e a pergunta sobre de quem é esse objeto não precisa ser respondida.","nao_confundir":"Não é o objeto interno kleiniano nem um mero substituto do seio: seu valor está no paradoxo de ser criado e encontrado ao mesmo tempo.","outras_escolas":"Em uma leitura corrente lacaniana, o objeto transicional é aproximado do objeto a, como objeto que ocupa o lugar de uma falta.","original":"transitional object"},{"termo":"Espaço potencial","def":"Área intermediária de experiência entre o mundo interno e a realidade externa, onde acontecem o brincar, a cultura e a criatividade.","onde_ler":"A localização da experiência cultural (1967); O brincar e a realidade (1971)","clinica":"Quando analista e paciente conseguem brincar com uma ideia, rindo juntos de uma imagem do sonho, a sessão se torna esse espaço em que algo novo pode surgir.","nao_confundir":"Não é um lugar físico nem a fantasia interna: é uma área de sobreposição que depende da confiança entre duas pessoas.","outras_escolas":"Ogden retoma o espaço potencial para pensar o terceiro analítico, criado em conjunto por analista e paciente.","original":"potential space"},{"termo":"Verdadeiro e falso self","def":"O verdadeiro self é o gesto espontâneo e o sentimento de existir; o falso self é a organização defensiva de submissão a um ambiente que falhou.","onde_ler":"Distorção do ego em termos de falso e verdadeiro self (1960)","clinica":"Uma paciente bem-sucedida e adaptada diz sentir-se uma fraude e não real, e o trabalho procura dar lugar ao que nela nunca pôde se expressar.","nao_confundir":"Falso self não é mentira nem hipocrisia: é uma proteção, que em grau moderado é saudável e permite a vida social.","outras_escolas":"Lacan considera todo eu uma construção imaginária, alienada na imagem do outro, o que torna problemática a ideia de um self verdadeiro.","original":"true self and false self"},{"termo":"Tendência antissocial","def":"Reação a uma privação real de um ambiente que antes era bom, e que expressa a esperança de recuperar o que se perdeu.","onde_ler":"A tendência antissocial (1956); Privação e delinquência (1984, coletânea póstuma)","clinica":"Um adolescente que furta objetos de casa pode ser escutado não só como transgressor, mas como alguém que reivindica algo que lhe foi tirado.","nao_confundir":"Não é diagnóstico de psicopatia nem de transtorno de personalidade antissocial: é um sinal de esperança, não de ausência de vínculo.","outras_escolas":"Em uma leitura corrente kleiniana, o ato antissocial é mais associado à inveja e à destrutividade interna do que a uma privação ambiental real.","original":"antisocial tendency"},{"termo":"Preocupação materna primária","def":"Estado de sensibilidade aumentada da mãe no fim da gravidez e nas primeiras semanas, que lhe permite identificar-se com o bebê e adaptar-se às suas necessidades.","onde_ler":"Preocupação materna primária (1956)","clinica":"Uma mãe que relata ter sentido o mundo desaparecer nos primeiros meses do filho pode estar descrevendo esse estado, e não uma loucura a ser temida.","nao_confundir":"Não é preocupação ansiosa nem depressão pós-parto: é um estado transitório e saudável, comparado por Winnicott a uma doença normal.","outras_escolas":"Bion descreve uma função próxima pelo conceito de rêverie, centrado na capacidade materna de pensar as emoções do bebê.","original":"primary maternal preoccupation"},{"termo":"Capacidade de estar só","def":"Conquista do amadurecimento em que a pessoa pode ficar só sem angústia, construída a partir da experiência de estar só na presença de alguém confiável.","onde_ler":"A capacidade de estar só (1958)","clinica":"Um silêncio tranquilo na sessão, em que o paciente parece à vontade com o analista presente, pode ser sinal dessa capacidade em formação.","nao_confundir":"Não é isolamento nem retraimento defensivo: é solidão sustentada por um ambiente interno confiável.","outras_escolas":"Em uma leitura corrente kleiniana, essa capacidade depende da introjeção de um objeto bom, e Bion a relaciona à tolerância à ausência do objeto.","original":"capacity to be alone"},{"termo":"Uso do objeto","def":"Passagem do relacionar-se com um objeto subjetivo para usar um objeto real e externo, que só ocorre quando o objeto sobrevive à destrutividade sem retaliar.","onde_ler":"O uso de um objeto e relacionamento por meio de identificações (1969); O brincar e a realidade (1971)","clinica":"Um paciente ataca o analista por semanas, e o fato de o analista continuar presente, sem se vingar nem desabar, permite que ele o reconheça como alguém separado.","nao_confundir":"Uso não é exploração ou utilitarismo: usar o objeto significa reconhecê-lo como real, fora do controle onipotente.","outras_escolas":"Em uma leitura corrente kleiniana, a destrutividade é pensada como fantasia de ataque seguida de culpa, e não como movimento que cria a externalidade do objeto.","original":"use of an object"},{"termo":"Ilusão e desilusão","def":"A mãe adaptada permite ao bebê a ilusão de criar o que encontra; depois, a desilusão gradual o introduz na realidade compartilhada sem ruptura traumática.","onde_ler":"Desenvolvimento emocional primitivo (1945); Objetos transicionais e fenômenos transicionais (1951)","clinica":"No começo do tratamento o analista pode acolher a sensação do paciente de que a análise foi feita para ele, e só aos poucos apontar seus limites.","nao_confundir":"Ilusão aqui não é engano a ser corrigido: é experiência necessária para a criatividade e para o sentimento de que a vida vale a pena.","outras_escolas":"Freud, em O futuro de uma ilusão, trata a ilusão sobretudo como realização de desejo que desvia da realidade, sentido bem diferente do winnicottiano.","original":"illusion and disillusionment"},{"termo":"Integração e personalização","def":"Processos iniciais do amadurecimento: a integração reúne a experiência num eu unitário no tempo e no espaço; a personalização instala a psique no corpo.","onde_ler":"Desenvolvimento emocional primitivo (1945); Natureza humana (1988, póstumo)","clinica":"Um paciente que se sente fora do próprio corpo em momentos de tensão revela falhas de personalização, e o cuidado com o ritmo da sessão ajuda a integrá-lo.","nao_confundir":"Integração não é síntese intelectual nem autoconhecimento: é uma conquista do desenvolvimento que depende do holding e do manejo do corpo.","outras_escolas":"Klein também fala de integração, mas a liga à superação da cisão na posição depressiva, e não ao cuidado ambiental do corpo.","original":"integration and personalization"},{"termo":"Medo do colapso","def":"Medo de um colapso futuro que, na verdade, já ocorreu numa época em que não havia eu para vivê-lo e registrá-lo como experiência.","onde_ler":"O medo do colapso (1974, póstumo)","clinica":"Uma paciente teme enlouquecer a qualquer momento, e a análise permite que ela viva na transferência, pela primeira vez com alguém presente, uma agonia antiga.","nao_confundir":"Não é ataque de pânico nem simples medo do futuro: é a angústia de um acontecimento passado que não pôde ser experienciado.","outras_escolas":"A ideia dialoga com o a posteriori freudiano e, em uma leitura corrente, com a noção de mudança catastrófica em Bion.","original":"fear of breakdown"}],"obras":[{"titulo":"O brincar e a realidade","ano":1971,"edicao":"Ubu, 2019 (edição anterior: Imago, 1975, trad. José Octávio de Aguiar Abreu e Vanede Nobre)","nivel":"introdutório","ed":{"editora":"Ubu Editora","local":"São Paulo","ano":"2019","volume":"","tradutor":"Breno Longhi","isbn":"978-85-7126-036-8"},"verif":{"status":"conferida","fonte":"https://www.ubueditora.com.br/brincar-a-realidade.html","nota":"Tradutor Ubu não constava no app. Os tradutores da edição Imago 1975 citados no app não foram verificados."},"porque_nivel":"Linguagem acessível e conceitos centrais (objeto transicional, brincar, criatividade)."},{"titulo":"Bebês e suas mães","ano":1987,"edicao":"Ubu, 2020","nivel":"introdutório","ed":{"editora":"Ubu Editora","local":"São Paulo","ano":"2020","volume":"","tradutor":"Breno Longhi","isbn":"978-85-7126-055-9"},"verif":{"status":"conferida","fonte":"https://www.ubueditora.com.br/bebes-maes.html","nota":""},"porque_nivel":"Textos curtos, vindos de palestras, sobre a relação mãe-bebê."},{"titulo":"Da pediatria à psicanálise (inclui Desenvolvimento emocional primitivo, 1945)","ano":1958,"edicao":"Ubu, 2021, trad. Davy Bogomoletz","nivel":"avançado","ed":{"editora":"Ubu Editora","local":"São Paulo","ano":"2021","volume":"","tradutor":"Davy Bogomoletz","isbn":"978-85-7126-221-8"},"verif":{"status":"conferida","fonte":"https://www.ubueditora.com.br/pub/media/productattachment/u/b/ubu-pediatria_psicanalise-trecho.pdf","nota":"'Desenvolvimento emocional primitivo' é o cap. 12 (p. 281). O ISBN é da 2ª edição (560 p.), cujo ano não foi confirmado; a 1ª é de 2021 (© Ubu 2021). A edição brasileira suprime 'Objetos transicionais e fenômenos transicionais', que está em O brincar e a realidade."},"porque_nivel":"Artigos escritos para psicanalistas; o próprio autor avisa que não é introdução."},{"titulo":"Tudo começa em casa (inclui O conceito de falso self, 1964)","ano":1986,"edicao":"Ubu, 2021","nivel":"introdutório","ed":{"editora":"Ubu Editora / WMF Martins Fontes","local":"São Paulo","ano":"2021","volume":"","tradutor":"Paulo César Sandler","isbn":"978-65-86497-48-9"},"verif":{"status":"conferida","fonte":"https://www.ubueditora.com.br/tudo-comeca-casa.html","nota":"Sumário confirma 'O conceito de falso self' na parte I. Tradutor não constava no app."},"porque_nivel":"Ensaios e conferências para público amplo."},{"titulo":"Natureza humana","ano":1988,"edicao":"Imago, 1990; Ubu, com tradução revisada","nivel":"avançado","ed":{"editora":"Ubu Editora","local":"São Paulo","ano":"2024","volume":"","tradutor":"Davy Bogomoletz","isbn":"978-85-7126-158-7"},"verif":{"status":"conferida","fonte":"https://www.ubueditora.com.br/natureza-humana.html","nota":"Ano Ubu 2024 vem da Loja UnB. Edição anterior: Imago, Rio de Janeiro, 1990, trad. Davi Litman Bogomoletz (bibliografia da Ubu)."},"porque_nivel":"Síntese teórica do autor, inacabada, que supõe familiaridade com a obra."},{"titulo":"O ódio na contratransferência (em Da pediatria à psicanálise)","ano":"1947","edicao":"Ubu, Da pediatria à psicanálise, trad. Davy Bogomoletz","nivel":"intermediário","ed":{"editora":"Ubu Editora","local":"São Paulo","ano":"2021","volume":"Da pediatria à psicanálise, cap. 15 (p. 356)","tradutor":"Davy Bogomoletz","isbn":"978-85-7126-221-8"},"verif":{"status":"conferida","fonte":"https://www.ubueditora.com.br/pub/media/productattachment/u/b/ubu-pediatria_psicanalise-trecho.pdf","nota":"Capítulo confirmado no sumário da Ubu. ISBN da 2ª edição."},"porque_nivel":"Texto curto e claro, mas sobre contratransferência, tema clínico que pede alguma base.","tecnica":true},{"titulo":"Processos de amadurecimento e ambiente facilitador: estudos sobre a teoria do desenvolvimento emocional","ano":1965,"edicao":"","ed":{"editora":"Ubu Editora","local":"São Paulo","ano":"","volume":"","tradutor":"Irineo Constantino Schuch Ortiz","isbn":"978-85-7126-071-9"},"verif":{"status":"conferida","fonte":"https://www.ubueditora.com.br/amadurecimento.html","nota":"É o antigo 'O ambiente e os processos de maturação' (Porto Alegre: Artes Médicas, 1983, mesmo tradutor, segundo a bibliografia da Ubu). Ano da edição Ubu a confirmar (um catálogo de e-book indica 2022, não verificado)."},"nivel":"avançado","porque_nivel":"Artigos teóricos de 1958 a 1963 sobre o amadurecimento, escritos para analistas."},{"titulo":"A capacidade para estar só","ano":1958,"edicao":"","ed":{"editora":"Artes Médicas","local":"Porto Alegre","ano":"1983","volume":"O ambiente e os processos de maturação, p. 31-37","tradutor":"Irineo Constantino Schuch Ortiz","isbn":""},"verif":{"status":"conferida","fonte":"https://ojs.uel.br/revistas/uel/index.php/eip/article/view/41042","nota":"O título usado na edição é 'A capacidade para estar só'. Artigo da UEL data a edição de 1982; a bibliografia da Ubu dá 1983. Na Ubu, está em 'Processos de amadurecimento e ambiente facilitador', possivelmente com o título 'A capacidade de ficar sozinho' (não verificado)."},"nivel":"intermediário","porque_nivel":"Artigo curto e legível, mas apoiado em conceitos do desenvolvimento emocional."},{"titulo":"A face estética do self: teoria e clínica","ano":1999,"edicao":"","ed":{"editora":"Idéias & Letras / Unimarco","local":"São Paulo","ano":"2005","volume":"","tradutor":"","isbn":"9788598239422"},"verif":{"status":"conferida","fonte":"https://www.maxwell.vrac.puc-rio.br/31438/31438_6.PDF","nota":"ERRO DE AUTORIA: o livro é de Gilberto Safra, não de Winnicott (é obra sobre Winnicott; deve sair da lista de obras de Winnicott). Bibliografia de tese PUC-Rio: 'Ed. Idéias e Letras, S.P. & Ed. Unimarco, S.P. (2005)'. ISBN visto em buscape.com.br. A 1ª ed. (Unimarco, 1999) não foi vista em página aberta."},"nivel":"intermediário","porque_nivel":"Comentador brasileiro claro, mas com vocabulário filosófico e clínico.","autor_abnt":"SAFRA, Gilberto","tipo":"comentador"}],"dicionarios":[{"titulo":"A linguagem de Winnicott","autor":"Jan Abram","edicao":"Revinter, 2000, trad. Marcelo Del Grande da Silva","ed":{"editora":"Revinter","local":"Rio de Janeiro","ano":"2000","volume":"","tradutor":"Marcelo Del Grande da Silva","isbn":""},"verif":{"status":"conferida","fonte":"https://www.maxwell.vrac.puc-rio.br/8477/8477_7.PDF","nota":"Fonte secundária: bibliografias de teses da PUC-Rio. ISBN brasileiro não localizado. Dados do app corretos."},"nivel":"introdutório","porque_nivel":"Verbetes com citações do próprio Winnicott, fáceis de consultar.","autor_abnt":"ABRAM, Jan"}],"artigos":[{"titulo":"Um estudo comparativo entre as teorias de Klein e Winnicott: analisando o conceito de fantasia","autores":"Alexandre P. de Almeida e Alfredo Naffah Neto","revista":"Revista Latinoamericana de Psicopatologia Fundamental (SciELO)","ano":2024,"url":"https://www.scielo.br/j/rlpf/a/RyBhLpsyhW8gTHbzsWtpsyD/"},{"titulo":"As experiências emocionais e o intelecto: os aportes de Bion e Winnicott","autores":"Eliane T. Rennó e Alfredo Naffah Neto","revista":"Psicologia em Pesquisa (UFJF), v. 14, n. 2","ano":2020,"url":"https://periodicos.ufjf.br/index.php/psicologiaempesquisa/article/view/29223/21141"}],"instituicao":{"nome":"British Psychoanalytical Society: Donald Woods Winnicott","url":"https://psychoanalysis.org.uk/donald-woods-winnicott"}},"lacan":{"bio":"Jacques Lacan nasceu em 13 de abril de 1901 em Paris e morreu na mesma cidade em 9 de setembro de 1981. Formou-se em medicina e psiquiatria, defendeu em 1932 uma tese sobre a paranoia e fez formação psicanalítica na Sociedade Psicanalítica de Paris. Propôs um retorno a Freud apoiado na linguística e na antropologia estrutural, com a tese de que o inconsciente é estruturado como uma linguagem e com os registros Real, Simbólico e Imaginário.","conceitos":[{"termo":"Estádio do espelho","def":"Momento em que o bebê, ainda imaturo no plano motor, se identifica com a imagem unificada do próprio corpo, e que funda o eu como instância imaginária.","onde_ler":"O estádio do espelho como formador da função do eu (1949)","clinica":"Um paciente que só se sente existir quando é olhado e aprovado mostra a dependência do eu em relação à imagem e ao olhar do outro.","nao_confundir":"Não é uma fase cronológica que se supera nem depende de um espelho real: é uma estrutura permanente de identificação imaginária.","outras_escolas":"Winnicott, em O papel de espelho da mãe e da família (1967), põe o rosto materno no lugar do espelho, com acento na resposta do ambiente.","original":"stade du miroir"},{"termo":"Imaginário, Simbólico e Real","def":"Três registros da experiência humana: o da imagem e do eu (Imaginário), o da linguagem e da lei (Simbólico) e o do que resiste a toda simbolização (Real).","onde_ler":"O simbólico, o imaginário e o real (1953); O seminário, livro 22: RSI (1974-1975)","clinica":"Uma rivalidade com um colega é imaginária; a posição de filho e herdeiro, simbólica; e um luto súbito que deixa o paciente sem palavras toca o real.","nao_confundir":"Real não é a realidade: a realidade é construída pelo simbólico e pelo imaginário, o Real é o que fica fora dessa construção.","outras_escolas":"Os pós-freudianos anglo-saxões não adotam os três registros e pensam a experiência em termos de mundo interno, relações de objeto e realidade externa.","original":"Imaginaire, Symbolique et Réel"},{"termo":"Significante","def":"Elemento da linguagem que vale pela diferença em relação a outros significantes e que representa o sujeito para outro significante.","onde_ler":"A instância da letra no inconsciente ou a razão desde Freud (1957); Subversão do sujeito e dialética do desejo no inconsciente freudiano (1960)","clinica":"Uma palavra que retorna em vários contextos do discurso, como pesado, pode ligar o corpo, a herança familiar e a culpa, e o analista a destaca.","nao_confundir":"Significante não é palavra com significado fixo nem símbolo universal: seu efeito de sentido depende da posição na cadeia.","outras_escolas":"Em uma leitura corrente pós-kleiniana, o acento recai sobre o afeto e a fantasia, e a centralidade da linguagem é vista como intelectualização.","original":"signifiant"},{"termo":"Grande Outro","def":"Lugar da linguagem e da lei simbólica que antecede o sujeito e do qual ele recebe a própria mensagem.","onde_ler":"O seminário, livro 2: O eu na teoria de Freud e na técnica da psicanálise (1954-1955); Subversão do sujeito e dialética do desejo no inconsciente freudiano (1960)","clinica":"Um paciente se pergunta o que querem dele os pais, a empresa ou Deus, e essa pergunta pelo desejo do Outro organiza o sintoma.","nao_confundir":"O grande Outro não é uma pessoa específica nem o semelhante, que Lacan chama de pequeno outro, mas um lugar estrutural.","outras_escolas":"Na tradição das relações de objeto, o outro é sobretudo o objeto real ou interno de amor e ódio, sem essa distinção entre semelhante e lugar simbólico.","original":"grand Autre"},{"termo":"Nome-do-Pai","def":"Significante que inscreve a lei simbólica e a função paterna; sua foraclusão está ligada à psicose.","onde_ler":"De uma questão preliminar a todo tratamento possível da psicose (1958); O seminário, livro 3: As psicoses (1955-1956)","clinica":"Em um desencadeamento psicótico, a convocação a ocupar um lugar paterno, como assumir uma chefia, pode encontrar um furo onde deveria haver esse significante.","nao_confundir":"Não é o pai real nem um pai presente e autoritário: é uma função simbólica que pode ser exercida por diferentes figuras ou discursos.","outras_escolas":"Críticas feministas e de estudos de gênero questionam o caráter normativo do conceito, e o próprio Lacan passa a falar dos Nomes-do-Pai, no plural.","original":"Nom-du-Père"},{"termo":"Objeto a","def":"Objeto causa do desejo, resto que escapa à simbolização e mantém o desejo em movimento.","onde_ler":"O seminário, livro 10: A angústia (1962-1963); O seminário, livro 11: Os quatro conceitos fundamentais da psicanálise (1964)","clinica":"Um paciente busca sempre um olhar específico nas parceiras e nunca se satisfaz com o que encontra, o que indica um objeto que causa o desejo sem poder ser alcançado.","nao_confundir":"Objeto a não é o objeto desejado concreto nem o objeto interno kleiniano: ele está antes do desejo, como causa, e não diante dele, como alvo.","outras_escolas":"Em uma leitura corrente, o objeto transicional de Winnicott é comparado ao objeto a, embora para Winnicott ele seja uma experiência de criação e não um resto.","original":"objet a"},{"termo":"Desejo, demanda e necessidade","def":"A necessidade é biológica; ao passar pela linguagem vira demanda, sempre demanda de amor; o desejo é o resto que a demanda não esgota.","onde_ler":"A significação do falo (1958); A direção do tratamento e os princípios de seu poder (1958)","clinica":"Uma paciente pede ao analista conselhos sobre o casamento; em vez de responder à demanda, ele a escuta como via para o desejo que ali se esconde.","nao_confundir":"Desejo não é vontade consciente nem necessidade: não se satisfaz com objetos, porque é estruturalmente falta.","outras_escolas":"Winnicott valoriza a distinção entre necessidades e desejos do paciente regredido e defende que algumas necessidades sejam atendidas no setting, o que a técnica lacaniana não adota.","original":"désir, demande et besoin"},{"termo":"Gozo","def":"Satisfação paradoxal, além do princípio do prazer, que inclui sofrimento e se liga à pulsão de morte, à repetição e ao sintoma.","onde_ler":"O seminário, livro 7: A ética da psicanálise (1959-1960); O seminário, livro 20: Mais, ainda (1972-1973)","clinica":"Um paciente se queixa de um sintoma que o faz sofrer, mas volta a ele sempre que pode deixá-lo, o que aponta para uma satisfação que ele não reconhece.","nao_confundir":"Gozo não é prazer nem orgasmo: é uma satisfação que excede o prazer e pode ser vivida como dor.","outras_escolas":"As escolas anglo-saxãs não usam o termo e tratam fenômenos próximos como masoquismo, reação terapêutica negativa ou ataque destrutivo ao vínculo.","original":"jouissance"},{"termo":"Sujeito dividido","def":"Sujeito do inconsciente, efeito da linguagem, dividido entre o que diz e o que se diz nele, e grafado com S barrado.","onde_ler":"Subversão do sujeito e dialética do desejo no inconsciente freudiano (1960); A ciência e a verdade (1965)","clinica":"Um paciente diz não ter raiva do irmão e, na mesma frase, comete um lapso que o desmente, revelando a divisão entre o enunciado e a enunciação.","nao_confundir":"O sujeito dividido não é o eu, nem a pessoa, nem a consciência: é aquilo que aparece e desaparece nas falhas do discurso.","outras_escolas":"Winnicott e a psicologia do self falam de um self que pode se integrar e se sentir real, ideia que o sujeito lacaniano, constitutivamente dividido, recusa.","original":"sujet divisé"},{"termo":"Sujeito suposto saber","def":"Lugar em que o paciente coloca o analista ao supor que ele detém o saber sobre seu sofrimento; é o pivô da transferência.","onde_ler":"O seminário, livro 11: Os quatro conceitos fundamentais da psicanálise (1964); Proposição de 9 de outubro de 1967 sobre o psicanalista da Escola (1967)","clinica":"Uma paciente diz que o analista já sabe o que ela vai dizer; o analista sustenta essa suposição sem acreditar nela, para que o saber seja produzido pela própria paciente.","nao_confundir":"Não significa que o analista sabe de fato nem que deve agir como especialista: o saber é suposto, e está no inconsciente do analisante.","outras_escolas":"Em uma leitura corrente kleiniana, essa posição seria interpretada como idealização transferencial do analista, ligada à cisão e à inveja.","original":"sujet supposé savoir"},{"termo":"Foraclusão","def":"Mecanismo próprio da psicose em que um significante fundamental, o Nome-do-Pai, não é inscrito no simbólico e retorna no real, por exemplo como alucinação.","onde_ler":"De uma questão preliminar a todo tratamento possível da psicose (1958); O seminário, livro 3: As psicoses (1955-1956)","clinica":"Um paciente afirma ouvir vozes que o chamam de impostor, e a escuta busca o ponto em que algo que não foi simbolizado reaparece de fora.","nao_confundir":"Foraclusão não é recalque intenso: o recalcado retorna no simbólico, como sintoma; o foracluído retorna no real.","outras_escolas":"Bion pensa a psicose pela predominância da parte psicótica da personalidade e pelos ataques ao vínculo, e não pela falta de um significante.","original":"forclusion"},{"termo":"Fantasia fundamental","def":"Cena inconsciente, escrita por Lacan como S barrado punção a, que fixa a relação do sujeito com o objeto a e enquadra sua maneira de desejar e gozar.","onde_ler":"Subversão do sujeito e dialética do desejo no inconsciente freudiano (1960); O seminário, livro 14: A lógica da fantasia (1966-1967)","clinica":"Em vários relatos, um paciente sempre aparece como quem é deixado de lado, e essa cena repetida pode indicar a fantasia que organiza seu desejo.","nao_confundir":"Não é um devaneio consciente nem uma fantasia sexual específica: é uma estrutura que só se constrói ao longo da análise, não se interpreta de saída.","outras_escolas":"Para Klein, as fantasias inconscientes são múltiplas e contínuas desde o nascimento, e não uma fórmula única a ser atravessada no fim da análise.","original":"fantasme fondamental"}],"obras":[{"titulo":"O estádio do espelho como formador da função do eu","ano":1949,"edicao":"Em Escritos, Zahar, 1998","nivel":"intermediário","ed":{"editora":"Jorge Zahar","local":"Rio de Janeiro","ano":"1998","volume":"Escritos","tradutor":"Vera Ribeiro","isbn":"978-85-7110-443-3"},"verif":{"status":"conferida","fonte":"https://www.companhiadasletras.com.br/livro/9788571104433/escritos","nota":"Escritos: lançamento 16/03/1998, 944 p. Tradutora confirmada por referência acadêmica."},"porque_nivel":"Texto curto e central, mas de escrita difícil; melhor com comentador."},{"titulo":"Função e campo da fala e da linguagem em psicanálise","ano":1953,"edicao":"Em Escritos, Zahar, 1998","nivel":"avançado","ed":{"editora":"Jorge Zahar","local":"Rio de Janeiro","ano":"1998","volume":"Escritos","tradutor":"Vera Ribeiro","isbn":"978-85-7110-443-3"},"verif":{"status":"conferida","fonte":"https://www.companhiadasletras.com.br/livro/9788571104433/escritos","nota":""},"porque_nivel":"Manifesto teórico longo, com referências à linguística e à filosofia."},{"titulo":"Escritos","ano":1966,"edicao":"Zahar, 1998","nivel":"avançado","ed":{"editora":"Jorge Zahar","local":"Rio de Janeiro","ano":"1998","volume":"","tradutor":"Vera Ribeiro","isbn":"978-85-7110-443-3"},"verif":{"status":"conferida","fonte":"https://www.companhiadasletras.com.br/livro/9788571104433/escritos","nota":""},"porque_nivel":"Coletânea de textos densos, lida por partes e com apoio."},{"titulo":"O Seminário, livro 1: Os escritos técnicos de Freud","ano":"1953–1954","edicao":"Seminário dado em 1953–1954, publicado em 1975. Zahar, 1986","nivel":"intermediário","ed":{"editora":"Jorge Zahar","local":"Rio de Janeiro","ano":"1986","volume":"","tradutor":"","isbn":"978-85-7110-367-2"},"verif":{"status":"conferida","fonte":"https://www.companhiadasletras.com.br/livro/9788571103672/o-seminario-livro-1","nota":"Lançamento 01/05/1986, 384 p. Dados do app corretos. Tradutor não informado na ficha da editora."},"porque_nivel":"Aula oral, mais acessível que os Escritos, mas pressupõe os textos técnicos de Freud.","tecnica":true},{"titulo":"O Seminário, livro 11: Os quatro conceitos fundamentais da psicanálise","ano":"1964","edicao":"Seminário dado em 1964, publicado em 1973. Seminário dado em 1953–1954, publicado em 1975. Zahar, 1985","nivel":"avançado","ed":{"editora":"Jorge Zahar","local":"Rio de Janeiro","ano":"1985","volume":"","tradutor":"M. D. Magno","isbn":"978-85-7110-317-7"},"verif":{"status":"conferida","fonte":"https://www.companhiadasletras.com.br/livro/9788571103177/o-seminario-livro-11","nota":"Corrige o campo edicao do app, que repetia o texto do Seminário 1. Lançamento 01/10/1985, 280 p. Tradutor M. D. Magno por referência acadêmica (a ficha da editora não informa). O Open Library registra 2ª ed. de 1998."},"porque_nivel":"Apresenta conceitos fundamentais, mas com elaboração teórica exigente."},{"titulo":"A direção do tratamento e os princípios de seu poder","ano":1958,"edicao":"","ed":{"editora":"Jorge Zahar","local":"Rio de Janeiro","ano":"1998","volume":"Escritos, p. 591-652","tradutor":"Vera Ribeiro","isbn":"978-85-7110-443-3"},"verif":{"status":"conferida","fonte":"https://stylus.emnuvens.com.br/cs/article/view/772","nota":""},"nivel":"avançado","porque_nivel":"Texto clínico-polêmico central, mas exige domínio de transferência e desejo.","tecnica":true},{"titulo":"Introdução clínica à psicanálise lacaniana: teoria e técnica","ano":1997,"edicao":"","ed":{"editora":"Zahar","local":"Rio de Janeiro","ano":"2018","volume":"","tradutor":"Vera Ribeiro","isbn":"978-85-378-1735-3"},"verif":{"status":"conferida","fonte":"https://www.companhiadasletras.com.br/livro/9788537817353/introducao-clinica-a-psicanalise-lacaniana","nota":"Lançamento 05/04/2018, 328 p. A editora indica o livro para alunos de graduação."},"nivel":"introdutório","porque_nivel":"Escrito para clínicos e estudantes, com exemplos e linguagem direta.","autor_abnt":"FINK, Bruce","tipo":"comentador","tecnica":true},{"titulo":"Introdução à leitura de Lacan: o inconsciente estruturado como linguagem","ano":1985,"edicao":"","ed":{"editora":"Artmed","local":"Porto Alegre","ano":"2003","volume":"","tradutor":"","isbn":"978-85-363-0134-1"},"verif":{"status":"conferida","fonte":"https://openlibrary.org/books/OL13404458M","nota":"Registro do Open Library (Artmed, 2003). Há um vol. 2 (Artmed, 1995, ISBN 978-85-7307-054-5, OL13408692M). Tradutor e 1ª edição brasileira (Artes Médicas) a confirmar; subtítulo segundo o título original, não conferido na ficha brasileira."},"nivel":"intermediário","porque_nivel":"Didático, mas percorre a teoria do significante com detalhe.","autor_abnt":"DOR, Joël","tipo":"comentador"}],"dicionarios":[{"titulo":"Dicionário de psicanálise","autor":"Roland Chemama (org.)","edicao":"Artes Médicas Sul, 1995","ed":{"editora":"Artes Médicas Sul","local":"Porto Alegre","ano":"1995","volume":"","tradutor":"","isbn":""},"verif":{"status":"conferida","fonte":"https://www.maxwell.vrac.puc-rio.br/4638/4638_7.PDF","nota":"Fonte secundária: bibliografia acadêmica da PUC-Rio ('CHEMAMA, R. (1995). Dicionário de Psicanálise. Porto Alegre: Artes Médicas Sul'). Original Larousse. Tradutor a confirmar."},"nivel":"intermediário","porque_nivel":"Verbetes curtos, mas com terminologia lacaniana técnica.","autor_abnt":"CHEMAMA, Roland (org.)"}],"artigos":[{"titulo":"O legado walloniano em Lacan: o estágio do espelho e a prematuração","autores":"C. G. L. Corrêa e R. T. Simanke","revista":"Psicologia: Ciência e Profissão, v. 40 (SciELO)","ano":2020,"url":"https://www.scielo.br/j/pcp/a/Wg97SrTYskt38z5cVY7TGzN/"},{"titulo":"Lugar do imaginário do ver: diálogos a partir do espelho lacaniano","autores":"Danilo Saretta Verissimo","revista":"Memorandum (UFMG/USP), n. 24","ano":2013,"url":"https://periodicos.ufmg.br/index.php/memorandum/article/download/6547/4129/21773"}],"instituicao":{"nome":"École de la Cause freudienne","url":"https://www.causefreudienne.org/"}},"bion":{"bio":"Wilfred Ruprecht Bion nasceu em 8 de setembro de 1897 em Mathura, na Índia, e morreu em novembro de 1979 em Oxford, na Inglaterra, pouco depois de voltar da Califórnia. Serviu nas duas guerras mundiais, estudou história em Oxford e medicina em Londres, trabalhou na Tavistock Clinic, fez análise com Melanie Klein e presidiu a Sociedade Britânica de Psicanálise de 1962 a 1965. Criou uma teoria do pensar e da experiência emocional e a teoria dos grupos por supostos básicos, e esteve no Brasil várias vezes nos anos 1970.","conceitos":[{"termo":"Função alfa","def":"Função que transforma impressões sensoriais e emoções brutas (elementos beta) em elementos alfa, que podem ser usados para sonhar, lembrar e pensar.","onde_ler":"O aprender com a experiência (1962); Uma teoria do pensar (1962)","clinica":"Um paciente chega dizendo apenas que está péssimo, sem saber por quê, e o analista ajuda a dar forma a esse mal-estar, transformando-o em algo que pode ser pensado.","nao_confundir":"Não é uma estrutura anatômica nem um conteúdo: é uma incógnita, um nome vazio para uma função a ser investigada.","outras_escolas":"Em uma leitura corrente, a função alfa aproxima-se do holding de Winnicott, mas com acento na transformação mental e não no cuidado ambiental.","original":"alpha-function"},{"termo":"Continente-contido","def":"Modelo em que uma mente (continente) recebe e transforma conteúdos emocionais projetados (contido), dando-lhes sentido.","onde_ler":"O aprender com a experiência (1962); Elementos de psicanálise (1963)","clinica":"O analista recebe a angústia caótica do paciente, tolera senti-la sem reagir de imediato e devolve uma formulação que o paciente consegue suportar.","nao_confundir":"Não é simplesmente acolher ou conter o paciente no sentido de acalmar: a relação é dinâmica, e o continente também é transformado.","outras_escolas":"Winnicott, com o holding, enfatiza a sustentação ambiental, enquanto Bion enfatiza a digestão mental das projeções.","original":"container-contained"},{"termo":"Rêverie","def":"Estado de receptividade da mãe ou do analista que acolhe e dá sentido às identificações projetivas do bebê ou do paciente.","onde_ler":"Uma teoria do pensar (1962); O aprender com a experiência (1962)","clinica":"Enquanto escuta, o analista se surpreende pensando numa imagem aparentemente solta, e depois percebe que ela dá forma ao que o paciente não conseguia dizer.","nao_confundir":"Rêverie não é distração nem devaneio pessoal do analista: é uma receptividade a serviço da escuta.","outras_escolas":"Ogden e os pós-bionianos ampliam a rêverie como produção conjunta da dupla, enquanto Lacan desconfia do uso das imagens do analista na escuta.","original":"reverie"},{"termo":"Supostos básicos","def":"Estados emocionais inconscientes compartilhados pelo grupo (dependência, luta e fuga, acasalamento) que interferem no grupo de trabalho.","onde_ler":"Experiências com grupos (1961)","clinica":"Numa equipe, todos esperam que o coordenador resolva tudo e ninguém produz, o que mostra o grupo funcionando sob o suposto básico de dependência.","nao_confundir":"Não são regras nem combinados conscientes do grupo: são crenças inconscientes que agem como se fossem verdadeiras.","outras_escolas":"Pichon-Rivière, com os grupos operativos, pensa o grupo pela tarefa e pelos vínculos, com outra leitura do que impede o trabalho.","original":"basic assumptions"},{"termo":"Vínculos L, H e K","def":"Vínculos emocionais de amor, ódio e conhecimento entre sujeito e objeto.","onde_ler":"O aprender com a experiência (1962); Elementos de psicanálise (1963)","clinica":"Um paciente que quer saber tudo sobre o analista sem querer conhecer a si mesmo pode estar em menos K, atacando o vínculo de conhecimento.","nao_confundir":"K não é acúmulo de informação: é o vínculo de vir a conhecer, que envolve tolerar a dúvida e a frustração.","outras_escolas":"Freud pensa sobretudo em termos de pulsões de vida e de morte, sem destacar o conhecimento como vínculo emocional próprio.","original":"L, H and K links"},{"termo":"Sem memória e sem desejo","def":"Recomendação técnica de o analista suspender memória, desejo e compreensão prévia para ficar aberto à experiência da sessão.","onde_ler":"Notas sobre memória e desejo (1967); Atenção e interpretação (1970)","clinica":"O analista evita começar a sessão pensando no que o paciente disse na semana anterior ou no desejo de vê-lo melhorar, para escutar o que surge naquele momento.","nao_confundir":"Não é esquecer o paciente nem abandonar a teoria: é uma disciplina de atenção para não saturar a escuta.","outras_escolas":"Retoma a atenção flutuante de Freud, e Lacan, por outro caminho, também fala em não compreender depressa demais.","original":"without memory and desire"},{"termo":"Elementos beta","def":"Impressões sensoriais e emoções brutas, não transformadas pela função alfa, que não servem para pensar e tendem a ser evacuadas por identificação projetiva ou ação.","onde_ler":"O aprender com a experiência (1962)","clinica":"Um paciente que sai da sessão e bate o carro, ou somatiza no dia seguinte, pode estar descarregando experiências que não puderam ser pensadas.","nao_confundir":"Não são lembranças reprimidas: os elementos beta nunca chegaram a ter forma psíquica para serem esquecidos.","outras_escolas":"Em uma leitura corrente, aproximam-se do que a escola psicossomática de Paris chama de falhas de mentalização.","original":"beta-elements"},{"termo":"Barreira de contato","def":"Membrana formada por elementos alfa que separa e ao mesmo tempo liga consciente e inconsciente, permitindo distinguir vigília e sono, realidade e fantasia.","onde_ler":"O aprender com a experiência (1962)","clinica":"Quando um paciente não distingue o que sonhou do que aconteceu, ou se sente invadido por tudo o que ouve, a barreira de contato pode estar falhando.","nao_confundir":"Não é o recalque nem uma muralha que isola: é permeável e seletiva, e sua falha produz uma tela de elementos beta.","outras_escolas":"Bion retoma o termo do Projeto de Freud (1895), onde designava as barreiras entre neurônios, e o transforma em conceito psicológico.","original":"contact-barrier"},{"termo":"Identificação projetiva realista","def":"Forma normal de identificação projetiva em que o bebê ou o paciente comunica emoções insuportáveis fazendo o outro senti-las, para que possam ser transformadas.","onde_ler":"Ataques ao vínculo (1959); Uma teoria do pensar (1962)","clinica":"O analista sente uma angústia intensa que não reconhece como sua; em vez de rejeitá-la, a toma como mensagem do paciente que ainda não tem palavras.","nao_confundir":"Não é a identificação projetiva excessiva e evacuativa, que visa controlar ou destruir o objeto, embora ambas sejam inconscientes.","outras_escolas":"Em Klein, a identificação projetiva é sobretudo uma fantasia defensiva; Bion acrescenta sua dimensão comunicativa e interpessoal.","original":"realistic projective identification"},{"termo":"Transformações e O","def":"O designa a realidade última e incognoscível da experiência emocional; o analista só tem acesso às transformações de O, e pode apenas tornar-se O, não conhecê-lo.","onde_ler":"Transformações (1965); Atenção e interpretação (1970)","clinica":"Diante de uma sessão confusa, o analista não busca uma explicação pronta, mas observa como a mesma experiência aparece transformada em sonho, queixa e ato.","nao_confundir":"O não é um conteúdo oculto que a interpretação revelaria, nem uma entidade mística a ser acreditada.","outras_escolas":"Em uma leitura corrente, O é aproximado do Real lacaniano, como aquilo que escapa à representação.","original":"transformations and O"},{"termo":"Mudança catastrófica","def":"Transformação súbita de uma estrutura mental quando uma ideia nova irrompe, vivida como desorganização, dor e ameaça antes de permitir crescimento.","onde_ler":"Atenção e interpretação (1970)","clinica":"Após uma interpretação que toca o núcleo do problema, um paciente pode piorar por algum tempo, sentir-se perdido e até pensar em interromper a análise.","nao_confundir":"Não é desastre nem retrocesso: é a turbulência que acompanha uma mudança verdadeira.","outras_escolas":"Em uma leitura corrente, dialoga com o medo do colapso de Winnicott e com a ideia freudiana de resistência à cura.","original":"catastrophic change"},{"termo":"Pensamentos e aparelho de pensar","def":"Para Bion, os pensamentos vêm antes do pensar: o aparelho de pensar se desenvolve para lidar com pensamentos surgidos da frustração e da ausência do objeto.","onde_ler":"Uma teoria do pensar (1962); O aprender com a experiência (1962)","clinica":"Um paciente que não suporta esperar e age de imediato diante de qualquer frustração mostra dificuldade de transformar a ausência em pensamento.","nao_confundir":"Pensar aqui não é raciocínio lógico ou inteligência: é a capacidade de suportar a frustração e dar forma à experiência emocional.","outras_escolas":"Freud, em Formulações sobre os dois princípios do funcionamento mental (1911), já ligava o pensar ao adiamento da descarga, base que Bion amplia.","original":"apparatus for thinking thoughts"}],"obras":[{"titulo":"Experiências com grupos","ano":1961,"edicao":"Edição brasileira a confirmar","nivel":"introdutório","ed":{"editora":"Imago","local":"Rio de Janeiro","ano":"1975","volume":"","tradutor":"","isbn":""},"verif":{"status":"conferida","fonte":"https://sppa.emnuvens.com.br/RPdaSPPA/article/view/1166","nota":"Fonte secundária: referência bibliográfica em artigo da Revista de Psicanálise da SPPA ('Experiências com grupos. Rio de Janeiro: Imago, 1975'). Tradutor a confirmar."},"porque_nivel":"Relato de experiências com grupos, mais concreto que os textos epistemológicos."},{"titulo":"Aprender da experiência","ano":1962,"edicao":"Edição brasileira a confirmar","nivel":"avançado","ed":{"editora":"Blucher","local":"São Paulo","ano":"2021","volume":"","tradutor":"Ester Hadassa Sandler (revisão técnica: Paulo Cesar Sandler)","isbn":"978-65-5506-203-8"},"verif":{"status":"conferida","fonte":"https://storage.blucher.com.br/book/pdf_preview/9786555062038-amostra.pdf","nota":"Ficha catalográfica da Blucher: 164 p.; e-book ISBN 978-65-5506-204-5. Existe edição anterior Imago (1991, 'O aprender com a experiência', segundo artigo da SPPA)."},"porque_nivel":"Introduz função alfa e continente-contido em linguagem abstrata."},{"titulo":"Estudos psicanalíticos revisados (inclui Uma teoria sobre o processo de pensar, 1962)","ano":1967,"edicao":"Imago, 1988, trad. Wellington M. de Melo Dantas","nivel":"avançado","ed":{"editora":"Imago","local":"Rio de Janeiro","ano":"1988","volume":"","tradutor":"Wellington M. de Melo Dantas","isbn":""},"verif":{"status":"conferida","fonte":"https://online.flippingbook.com/view/544664/1172/","nota":"Fonte secundária: Dicionário Enciclopédico da IPA cita 'Uma teoria sobre o processo de pensar' em Estudos psicanalíticos revisados, Imago, 1988, p. 101-109, trad. Wellington M. de Melo Dantas. Dados do app corretos. A Blucher lançou nova tradução de Second Thoughts em 2022 ('No entanto... pensando melhor', trad. Paulo Cesar Sandler)."},"porque_nivel":"Artigos clínicos sobre psicose e pensamento, de leitura difícil."},{"titulo":"Atenção e interpretação","ano":1970,"edicao":"Imago, 1973","nivel":"avançado","ed":{"editora":"Imago","local":"Rio de Janeiro","ano":"2006","volume":"2ª ed.","tradutor":"Paulo Cesar Sandler","isbn":""},"verif":{"status":"conferida","fonte":"https://revista.sppa.org.br/RPdaSPPA/article/view/83","nota":"Referência em artigo da SPPA: 'Tradução de Paulo Cesar Sandler (2ª ed.). Rio de Janeiro: Imago, 2006'. Imago 1973 (1ª ed., app) e 1991 (provável reimpressão) não vistos em página aberta. ISBN não localizado."},"porque_nivel":"Obra madura e abstrata sobre a posição do analista.","tecnica":true},{"titulo":"Seminários italianos","ano":1985,"edicao":"Blucher, 2017, trad. André G. Growald","nivel":"introdutório","ed":{"editora":"Blucher","local":"São Paulo","ano":"2017","volume":"","tradutor":"André G. Growald (revisão técnica: Paulo Cesar Sandler e Vasco Moscovici da Cruz)","isbn":"978-85-212-1098-6"},"verif":{"status":"conferida","fonte":"https://storage.blucher.com.br/book/pdf_preview/9788521210986-amostra.pdf","nota":"Ficha catalográfica confirma os dados do app (160 p.)."},"porque_nivel":"Transcrição de seminários orais em Roma (1977), em tom de conversa."},{"titulo":"Notas sobre memória e desejo","ano":1967,"edicao":"","verif":{"status":"a confirmar","fonte":"","nota":"Artigo publicado em Melanie Klein hoje, v. 2 (Imago, 1990, trad. Belinda P. Haber), segundo cópia não oficial; conferir em catálogo de biblioteca."},"confirmado":false,"nivel":"intermediário","porque_nivel":"Texto de poucas páginas, mas com recomendação técnica que exige contexto clínico.","tecnica":true,"ed":{"editora":"Imago","local":"Rio de Janeiro","ano":"1990","volume":"In: E. B. Spillius (org.), Melanie Klein hoje: desenvolvimento da teoria e da técnica, v. 2","tradutor":"Belinda P. Haber"}},{"titulo":"Elementos em psicanálise","ano":1963,"edicao":"","ed":{"editora":"Imago","local":"Rio de Janeiro","ano":"1991","volume":"","tradutor":"","isbn":""},"verif":{"status":"conferida","fonte":"https://sppa.emnuvens.com.br/RPdaSPPA/article/view/1166","nota":"Fonte secundária: referência em artigo da SPPA, com o título 'Elementos em Psicanálise'. Tradutor e ano da 1ª edição brasileira a confirmar."},"nivel":"avançado","porque_nivel":"Apresenta a grade e notações abstratas."},{"titulo":"Introdução às ideias de Bion","ano":1972,"edicao":"","verif":{"status":"conferida","fonte":"https://sebocapricho.com.br/produto/introducao-as-ideias-de-bion-leon-grinberg-dario-sor-elizabeth-tabak-de-bianchedi/28214119","nota":"ERRO DE AUTORIA: o livro é de León Grinberg, Darío Sor e Elizabeth Tabak de Bianchedi (comentadores), não de Bion. Existe edição brasileira: Imago, 1973 (anúncio de sebo). Cidade, tradutor, coleção e ISBN não vistos."},"nivel":"intermediário","porque_nivel":"Manual sistemático, útil depois de um primeiro contato com Klein.","autor_abnt":"GRINBERG, León; SOR, Darío; BIANCHEDI, Elizabeth Tabak de","tipo":"comentador","ed":{"editora":"Imago","ano":"1973"}}],"dicionarios":[{"titulo":"A linguagem de Bion: um dicionário de conceitos","autor":"Paulo Cesar Sandler","edicao":"Karnac, edição em português, 2017","ed":{"editora":"Blucher","local":"São Paulo","ano":"2021","volume":"","tradutor":"Daniela Sandler e Giovana Del Grande","isbn":"978-65-5506-235-9"},"verif":{"status":"conferida","fonte":"https://www.blucher.com.br/a-linguagem-de-bion_9786555062359","nota":"Corrige o app (Karnac, 2017): a edição em português é da Blucher, 2021, 1ª ed., 1.312 p., subtítulo 'Um dicionário enciclopédico de conceitos'. Tradutoras segundo a apresentação da editora (busca); não constam na página do produto."},"nivel":"intermediário","porque_nivel":"Obra de consulta extensa, útil para esclarecer termos de Bion.","autor_abnt":"SANDLER, Paulo Cesar"}],"artigos":[{"titulo":"Uma ampliação da aplicação, na prática psicanalítica, da noção de continente em Bion","autores":"David Zimerman","revista":"Interações (ISMT), v. 7, n. 13","ano":2007,"url":"https://www.interacoes-ismt.com/index.php/revista/article/view/239"},{"titulo":"As experiências emocionais e o intelecto: os aportes de Bion e Winnicott","autores":"Eliane T. Rennó e Alfredo Naffah Neto","revista":"Psicologia em Pesquisa (UFJF), v. 14, n. 2","ano":2020,"url":"https://periodicos.ufjf.br/index.php/psicologiaempesquisa/article/view/29223/21141"}],"instituicao":{"nome":"British Psychoanalytical Society: Wilfred Bion","url":"https://psychoanalysis.org.uk/wilfred-bion"}},"ferenczi":{"bio":"Sándor Ferenczi nasceu em 7 de julho de 1873 em Miskolc, na Hungria, e morreu em 22 de maio de 1933 em Budapeste. Formou-se em medicina em Viena, foi neurologista e psiquiatra em Budapeste, tornou-se colaborador próximo de Freud a partir de 1908 e fundou a Associação Psicanalítica Húngara em 1913. Renovou a técnica e a teoria do trauma, destacando o papel real do adulto e o desmentido, e influenciou Klein, Balint e a psicanálise relacional.","conceitos":[{"termo":"Introjeção","def":"Processo pelo qual o eu amplia seus interesses incluindo em si objetos do mundo externo, e que serve de base à transferência."},{"termo":"Confusão de línguas","def":"Desencontro entre a língua da ternura da criança e a língua da paixão do adulto, que está na raiz do trauma sexual."},{"termo":"Desmentido","def":"Recusa, por um adulto de confiança, a reconhecer o sofrimento da criança, o que torna o choque traumático patogênico."},{"termo":"Identificação com o agressor","def":"Defesa da criança traumatizada que se submete ao agressor e incorpora sua culpa, para sobreviver psiquicamente."},{"termo":"Elasticidade da técnica","def":"Postura do analista que combina tato e flexibilidade, cedendo e resistindo conforme o paciente."},{"termo":"Técnica ativa","def":"Intervenções com proibições e injunções para mobilizar material reprimido; o próprio Ferenczi depois a revisou."}],"obras":[{"titulo":"Transferência e introjeção","ano":1909,"edicao":"Em Obras completas: Psicanálise I, Martins Fontes, 1991","nivel":"intermediário","ed":{"editora":"WMF Martins Fontes","local":"São Paulo","ano":"2011","volume":"Obras completas: Psicanálise I","tradutor":"Álvaro Cabral","isbn":""},"verif":{"status":"conferida","fonte":"https://www.maxwell.vrac.puc-rio.br/26495/26495_8.PDF ; tradutor: https://ojs.uel.br/revistas/uel/index.php/eip/article/view/38317","nota":"Fontes citam a 2ª ed. (WMF Martins Fontes, 2011). O ano de 1991 do arquivo (1ª ed.) não foi confirmado em fonte; ISBN não localizado."},"porque_nivel":"Texto teórico de base, mais longo, que dialoga com conceitos freudianos."},{"titulo":"O desenvolvimento do sentido de realidade e seus estágios","ano":1913,"edicao":"Em Obras completas: Psicanálise II, Martins Fontes","nivel":"intermediário","ed":{"editora":"WMF Martins Fontes","local":"São Paulo","ano":"2011","volume":"Obras completas: Psicanálise II","tradutor":"","isbn":""},"verif":{"status":"conferida","fonte":"https://www.maxwell.vrac.puc-rio.br/26495/26495_8.PDF","nota":"Volume confirmado (Psicanálise II). Tradutor do vol. II não confirmado em fonte (Álvaro Cabral consta para os vols. I, III e IV); ISBN não localizado."},"porque_nivel":"Ensaio curto e claro sobre onipotência e teste de realidade, mas que supõe noções freudianas."},{"titulo":"Elasticidade da técnica psicanalítica","ano":1928,"edicao":"Em Obras completas: Psicanálise IV, Martins Fontes, 1992, trad. Álvaro Cabral","nivel":"introdutório","ed":{"editora":"WMF Martins Fontes","local":"São Paulo","ano":"2011","volume":"Obras completas: Psicanálise IV, pp. 29-42","tradutor":"Álvaro Cabral","isbn":""},"verif":{"status":"conferida","fonte":"https://ojs.uel.br/revistas/uel/index.php/eip/article/view/38317","nota":"Fonte cita a 2ª ed. (WMF Martins Fontes, 2011). O ano de 1992 do arquivo (1ª ed.) não foi confirmado; ISBN não localizado."},"porque_nivel":"Conferência curta e acessível sobre tato e postura do analista.","tecnica":true},{"titulo":"Confusão de língua entre os adultos e a criança","ano":1933,"edicao":"Em Obras completas: Psicanálise IV, Martins Fontes, 1992, trad. Álvaro Cabral","nivel":"introdutório","ed":{"editora":"WMF Martins Fontes","local":"São Paulo","ano":"2011","volume":"Obras completas: Psicanálise IV, pp. 111-121","tradutor":"Álvaro Cabral","isbn":""},"verif":{"status":"conferida","fonte":"https://ojs.uel.br/revistas/uel/index.php/eip/article/view/38317","nota":"Correção: a fonte grafa 'Confusão de línguas entre os adultos e a criança' (plural). Apresentado em 1932, publica clopédico de psicanálise: o legado de Freud e Lacan","autor":"Pierre Kaufmann (org.)","edicao":"Zahar, 1996","ed":{"editora":"Zahar","local":"Rio de Janeiro","ano":"1996","volume":"","tradutor":"Vera Ribeiro; Maria Luiza X. de A. Borges","isbn":"9788571103603"},"verif":{"status":"conferida","fonte":"https://www.travessa.com.br/dicionario-enciclopedico-de-psicanalise/artigo/4bb6b169-dc64-480b-88ca-360718a73b32","nota":"Travessa: 1ª ed. 1996, 790 p. Estava marcado como não confirmado no arquivo."},"autor_abnt":"KAUFMANN, Pierre (org.)"},{"titulo":"Dicionário comentado do alemão de Freud","ano":"","edicao":"","autor":"Luiz Alberto Hanns","ed":{"editora":"Imago","local":"Rio de Janeiro","ano":"1996","volume":"","tradutor":"","isbn":""},"verif":{"status":"conferida","fonte":"https://pep-web.org/browse/document/PSYCHE.058F.0575A","nota":"NOVO. Resenha na Psyche: Rio de Janeiro, Imago, 1996, 505 p. (a resenha de Mezan no IJP, 1999, cita 1997 e 506 p.). ISBN-13 calculado do ISBN-10 8531205212 da URL Amazon https://www.amazon.com.br/dp/8531205212 (vista via busca): conferir. ISBN omitido: calculado, não lido em registro."},"autor_abnt":"HANNS, Luiz Alberto"}],"annafreud":{"bio":"Anna Freud nasceu em Viena em 3 de dezembro de 1895 e morreu em Londres em 9 de outubro de 1982. Filha caçula de Sigmund Freud, foi professora primária antes de se formar psicanalista em Viena e emigrou para Londres em 1938, onde fundou a Hampstead Child Therapy Clinic, hoje Anna Freud Centre. É uma das fundadoras da psicanálise de crianças e da psicologia do ego, com uma obra centrada nos mecanismos de defesa e nas linhas de desenvolvimento.","conceitos":[{"termo":"Mecanismos de defesa","def":"Operações inconscientes do ego que protegem o sujeito da angústia ligada às pulsões, ao superego ou à realidade."},{"termo":"Identificação com o agressor","def":"Defesa em que o sujeito, diante de uma ameaça, assume os traços ou a agressividade de quem o ameaça."},{"termo":"Altruísmo (renúncia altruísta)","def":"Defesa em que o sujeito realiza os próprios desejos de forma indireta, satisfazendo-os em outra pessoa."},{"termo":"Linhas de desenvolvimento","def":"Sequências evolutivas, como a que vai da dependência à autonomia emocional, usadas para avaliar a maturação da criança."},{"termo":"Ascetismo e intelectualização na adolescência","def":"Defesas típicas da puberdade contra o aumento pulsional: recusa dos prazeres corporais e elaboração abstrata dos conflitos."},{"termo":"Perfil diagnóstico (metapsicológico)","def":"Instrumento que organiza a avaliação da criança por pulsões, ego, superego e fase de desenvolvimento."}],"obras":[{"titulo":"O ego e os mecanismos de defesa","ano":1936,"edicao":"","edicao_br":true,"nivel":"introdutório","ed":{"editora":"Artmed","local":"Porto Alegre","ano":"2005","volume":"","isbn":"9788536305882"},"verif":{"status":"conferida","fonte":"https://books.google.com.br/books?vid=ISBN8536305886&redir_esc=y","nota":"Google Books: Artmed, 29/08/2005, 124 p., ISBN 8536305886 / 9788536305882. É a edição atual; troca a Civilização Brasileira do app. Local (Porto Alegre) e tradutor (Francisco Settineri, segundo busca) não aparecem na página. Edições antigas da Civilização Brasileira (1974/1978/1986) continuam sem conferência. Tradutor (Francisco Settineri, segundo resultados de busca) a confirmar."}},{"titulo":"Tratamento psicanalítico de crianças","ano":1927,"edicao":"Rio de Janeiro: Imago, 1971; tradutor não confirmado","edicao_br":true,"nivel":"introdutório","ed":{"editora":"Imago","local":"Rio de Janeiro","ano":"1971","volume":"","tradutor":"","isbn":""},"verif":{"status":"conferida","fonte":"https://www.maxwell.vrac.puc-rio.br/20759/20759_8.PDF ; https://revistas.usp.br/estic/article/download/49646/53749/61004","nota":"Duas referências acadêmicas confirmam Imago, 1971 (título com artigo: 'O tratamento psicanalítico de crianças'). Tradutor não informado em nenhuma fonte."}},{"titulo":"Infância normal e patológica: determinantes do desenvolvimento ,"ano":2026,"url":"https://www.scielo.br/scielo.php?script=sci_arttext&pid=S1415-47142026000103807&tlng=pt"},{"titulo":"A invenção da criança da psicanálise: de Sigmund Freud a Melanie Klein","autores":"Diana Myriam Lichtenstein Corso","revista":"Estilos da Clínica","ano":1998,"url":"https://www.revistas.usp.br/estic/article/view/60739"}],"instituicao":{"nome":"Anna Freud (Anna Freud National Centre for Children and Families), Londres","url":"https://www.annafreud.org"}},"erikson":{"bio":"Erik Homburger Erikson nasceu em Frankfurt am Main em 15 de junho de 1902 e morreu em Harwich, Massachusetts, em 12 de maio de 1994. Sem diploma universitário, formou-se no Instituto Psicanalítico de Viena, onde fez análise com Anna Freud, e emigrou para os Estados Unidos em 1933, onde lecionou em Harvard, Yale e Berkeley. Criou a teoria psicossocial do desenvolvimento em oito estágios ao longo da vida e popularizou a noção de crise de identidade.","conceitos":[{"termo":"Desenvolvimento psicossocial","def":"Modelo em que a personalidade se forma ao longo da vida inteira, na interação entre maturação, ego e cultura."},{"termo":"Oito idades do homem","def":"Sequência de oito estágios, da confiança básica versus desconfiança à integridade versus desespero, cada um com uma crise típica."},{"termo":"Crise psicossocial","def":"Ponto de virada de cada estágio, em que se resolve uma tensão entre duas polaridades e surge uma virtude do ego."},{"termo":"Identidade versus confusão de papéis","def":"Crise da adolescência, em que o jovem integra experiências e papéis numa noção de si contínua e reconhecida socialmente."},{"termo":"Moratória psicossocial","def":"Período concedido pela sociedade ao adolescente para experimentar papéis antes de assumir compromissos adultos."},{"termo":"Princípio epigenético","def":"Ideia de que cada aspecto do desenvolvimento tem seu momento próprio de ascendência, dentro de um plano de fundo comum."}],"obras":[{"titulo":"Infância e sociedade","ano":1950,"edicao":
