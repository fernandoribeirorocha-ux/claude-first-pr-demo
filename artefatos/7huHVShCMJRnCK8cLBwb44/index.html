e":"Otto Kernberg","ini":"OK","sub":"Organização borderline","pais":"Áustria / EUA","origem":"Nascido em Viena (1928), formado no Chile, radicado nos Estados Unidos; integra psicologia do ego e relações objetais"},{"id":"roussillon","nome":"René Roussillon","ini":"RR","sub":"Sofrimento narcísico-identitário","pais":"França","origem":"Francês (Lyon); simbolização e situações-limite"},{"id":"fonagy","nome":"Peter Fonagy","ini":"PF","sub":"Mentalização","pais":"Inglaterra","origem":"Nascido em Budapeste, radicado em Londres (UCL, Anna Freud Centre); apego e mentalização"},{"id":"steiner","nome":"John Steiner","ini":"JS","sub":"Refúgios psíquicos","pais":"Inglaterra","origem":"Kleiniano contemporâneo de Londres; organizações patológicas"}],"INI":{"freud":"F","klein":"K","winnicott":"W","lacan":"L","bion":"B","ferenczi":"Fe","annafreud":"AF","kohut":"Ko","green":"AG","ogden":"Og","dolto":"D","rogers":"CR","beck":"AB","sistemica":"Si","mediacao":"·"},"BIB":[{"id":"anna-o","num":"BC-01","titulo":"Anna O.","paciente":"Bertha Pappenheim","autores":"Josef Breuer e Sigmund Freud","ano":1895,"escola":"freud","area":"Psicanálise","tema":"Histeria · a cura pela fala","resumo":"Jovem de 21 anos que adoeceu enquanto cuidava do pai, gravemente doente. Tinha paralisias, perturbações da visão, estados de ausência e, em certas fases, só conseguia falar inglês ou outras línguas, embora entendesse o alemão. Com Breuer, percebeu que contar a origem de cada sintoma o aliviava, e chamou o método de talking cure, a cura pela fala.","fatos":["Atendida por Breuer entre 1880 e 1882; o caso abre os Estudos sobre a histeria.","Por semanas não conseguiu beber água, e o sintoma cedeu quando ela lembrou, com nojo, de um cachorro bebendo de um copo.","Mais tarde, Bertha Pappenheim tornou-se pioneira do serviço social e do feminismo judeu na Alemanha."],"fala":"Faz semanas que não consigo beber água; seguro o copo e algo me impede. Desde que papai adoeceu, passo as noites ao lado da cama dele. Às vezes as palavras em alemão somem e só consigo falar inglês. Quando conto ao doutor como cada coisa começou, ela vai embora por um tempo. Ontem lembrei da governanta e do cachorrinho dela bebendo do copo. Senti nojo e não disse nada, por educação.","ficha":{"idade":"21 anos","genero":"Mulher","contexto":"Família judia de Viena; cuidava do pai doente à noite","queixa":"Paralisias, perda da fala em alemão, não consegue beber água","momento":"Meio do tratamento","setting":"Atendimento domiciliar (Viena, 1880–1882)"},"conceitos":["Histeria","Catarse","Cura pela fala","Conversão"],"ref":"FREUD, Sigmund; BREUER, Josef. Estudos sobre a histeria (1893-1895). Tradução de Laura Barreto; revisão de Paulo César de Souza. São Paulo: Companhia das Letras, 2016. (Obras completas, v. 2).","links":[{"rotulo":"Edição brasileira (Companhia das Letras)","url":"https://www.companhiadasletras.com.br/livro/9788535926804/freud-1893-1895-obras-completas-volume-2"},{"rotulo":"Bertha Pappenheim (Wikipédia, em inglês)","url":"https://en.wikipedia.org/wiki/Bertha_Pappenheim"}]},{"id":"dora","num":"BC-02","titulo":"Dora","paciente":"Ida Bauer","autores":"Sigmund Freud","ano":1905,"escola":"freud","area":"Psicanálise","tema":"Histeria · transferência","resumo":"Jovem de 18 anos levada pelo pai a Freud, com tosse nervosa, afonia e um bilhete de despedida encontrado pelos pais. Contou que o Sr. K., amigo da família, a assediou, e que o pai mantinha um caso com a Sra. K. Freud analisou dois sonhos dela; Dora interrompeu a análise depois de cerca de três meses, e Freud reconheceu mais tarde que não percebeu a transferência a tempo.","fatos":["Análise no fim de 1900, publicada em 1905.","Dois sonhos centrais: a casa em chamas com a caixa de joias, e o sonho da estação.","Freud passou a ver a transferência como motor e obstáculo do tratamento."],"fala":"Meu pai me trouxe porque diz que eu ando impossível. A tosse voltou, às vezes perco a voz por semanas. Ninguém acredita em mim. Aquele homem, o Sr. K., me agarrou perto do lago e meu pai acha que eu inventei. Eu sei por quê: ele precisa que eu fique quieta para continuar visitando a Sra. K. É como se eu tivesse sido oferecida em troca. O engraçado é que eu gostava dela, dormíamos no mesmo quarto, ela me contava tudo. As crises de tosse duram semanas. O Sr. K. também vive viajando. Eu não queria falar disso hoje.","ficha":{"idade":"18 anos","genero":"Mulher","contexto":"Mora com os pais em Viena; o pai mantém relação com a Sra. K.","queixa":"Tosse nervosa, afonia, desmaios, humor deprimido","momento":"Início do tratamento","setting":"Consultório particular (Viena, 1900)","sonhos":"A casa em chamas e a caixa de joias; o sonho da estação","riscos":"Bilhete de despedida encontrado pelos pais"},"conceitos":["Histeria","Transferência","Sintoma","Sonho"],"ref":"FREUD, Sigmund. Análise fragmentária de uma histeria (\"O caso Dora\"). In: Três ensaios sobre a teoria da sexualidade, Análise fragmentária de uma histeria (\"O caso Dora\") e outros textos (1901-1905). Tradução de Paulo César de Souza. São Paulo: Companhia das Letras, 2016. (Obras completas, v. 6).","links":[{"rotulo":"Edição brasileira (Companhia das Letras)","url":"https://www.companhiadasletras.com.br/livro/9788535927832/freud-1901-1905-obras-completas-volume-6"},{"rotulo":"Dora, estudo de caso (Wikipédia)","url":"https://pt.wikipedia.org/wiki/Dora_(estudo_de_caso)"}]},{"id":"hans","num":"BC-03","titulo":"Pequeno Hans","paciente":"Herbert Graf","autores":"Sigmund Freud","ano":1909,"escola":"freud","area":"Psicanálise","tema":"Fobia infantil · Édipo","resumo":"Menino de 5 anos com medo intenso de cavalos: temia ser mordido e que um cavalo caísse na rua. O tratamento foi conduzido pelo pai, que relatava a Freud as conversas com o filho; Freud viu o menino uma única vez. Foi a primeira análise de uma criança publicada e ilustrou o complexo de Édipo e a angústia de castração.","fatos":["A fobia começou depois que ele viu cair na rua um cavalo que puxava um ônibus.","Hans tinha medo sobretudo dos cavalos com algo preto na boca, que Freud ligou ao bigode do pai.","No pós-escrito de 1922, Freud conta que Hans, aos 19 anos, estava bem; mais tarde Herbert Graf se tornou diretor de ópera."],"fala":"Não quero sair na rua. O cavalo pode cair e fazer barulho com as pernas. Os que têm uma coisa preta na boca são os piores. Quando a mamãe me dá banho na banheira grande, fico com medo de que ela me solte. Hoje de manhã eu pensei que tinha duas girafas no quarto, uma grande e uma amassada, e eu sentei em cima da amassada.","ficha":{"idade":"5 anos","genero":"Menino","contexto":"Vive com os pais e a irmã mais nova, nascida quando ele tinha três anos e meio","queixa":"Medo de cavalos e de sair à rua","momento":"Meio do tratamento","setting":"Tratamento conduzido pelo pai, supervisionado por Freud (Viena, 1908)","sonhos":"A fantasia das duas girafas, a grande e a amassada"},"conceitos":["Fobia","Complexo de Édipo","Angústia de castração","Deslocamento"],"ref":"FREUD, Sigmund. Análise da fobia de um garoto de cinco anos (\"O pequeno Hans\"). In: O delírio e os sonhos na Gradiva, Análise da fobia de um garoto de cinco anos e outros textos (1906-1909). Tradução de Paulo César de Souza. São Paulo: Companhia das Letras, 2015. (Obras completas, v. 8).","links":[{"rotulo":"Edição brasileira (Companhia das Letras)","url":"https://www.companhiadasletras.com.br/livro/9788535925869/freud-1906-1909-obras-completas-volume-8"},{"rotulo":"Herbert Graf (Wikipédia, em inglês)","url":"https://en.wikipedia.org/wiki/Herbert_Graf"}]},{"id":"ratos","num":"BC-04","titulo":"Homem dos Ratos","paciente":"Ernst Lanzer","autores":"Sigmund Freud","ano":1909,"escola":"freud","area":"Psicanálise","tema":"Neurose obsessiva","resumo":"Advogado de 29 anos tomado por pensamentos obsessivos: temia que algo terrível acontecesse ao pai, já falecido, e à mulher que amava. A crise começou quando um capitão descreveu um castigo em que ratos roíam o ânus do condenado. Depois, ele se enredou num ritual impossível para pagar uma pequena dívida pelos óculos.","fatos":["Análise iniciada em 1907; Freud deixou anotações diárias do caso, publicadas depois.","O pai havia morrido anos antes, e mesmo assim o paciente temia por ele.","Freud destacou a ambivalência entre amor e ódio e o pensamento onipotente."],"fala":"Desde que o capitão descreveu aquele castigo, com o vaso de ratos, a ideia não sai da minha cabeça: e se fizessem isso com meu pai, ou com a dama que eu amo? Sei que meu pai morreu há anos, mas o medo continua. Agora preciso devolver o dinheiro dos óculos ao tenente A., e cada plano que faço tem uma condição que o torna impossível. Peço desculpas por contar isso; o senhor deve me achar um criminoso.","ficha":{"idade":"29 anos","genero":"Homem","contexto":"Solteiro; pai falecido; ama uma mulher que a família não aprova","queixa":"Pensamentos obsessivos, compulsões e dúvidas","momento":"Início do tratamento","setting":"Consultório particular (Viena, 1907)"},"conceitos":["Neurose obsessiva","Ambivalência","Onipotência do pensamento","Deslocamento"],"ref":"FREUD, Sigmund. Observações sobre um caso de neurose obsessiva (\"O homem dos ratos\"). In: Observações sobre um caso de neurose obsessiva (\"O homem dos ratos\"), Uma recordação de infância de Leonardo da Vinci e outros textos (1909-1910). Tradução de Paulo César de Souza. São Paulo: Companhia das Letras, 2013. (Obras completas, v. 9).","links":[{"rotulo":"O homem dos ratos (Wikipédia)","url":"https://pt.wikipedia.org/wiki/O_homem_dos_ratos"}]},{"id":"lobos","num":"BC-05","titulo":"Homem dos Lobos","paciente":"Sergei Pankejeff","autores":"Sigmund Freud","ano":1918,"escola":"freud","area":"Psicanálise","tema":"Neurose infantil · cena primária","resumo":"Aristocrata russo que procurou Freud aos 23 anos, deprimido e muito dependente dos outros. A análise girou em torno de um sonho dos 4 anos: lobos brancos, imóveis, sentados numa nogueira diante da janela, olhando para ele. Freud ligou o sonho a uma cena primária observada muito cedo.","fatos":["Análise com Freud de 1910 a 1914, com retornos posteriores.","No sonho eram seis ou sete lobos brancos na árvore.","O próprio paciente desenhou o sonho, e o desenho se tornou célebre."],"fala":"Sonhei, quando tinha quatro anos, que era noite e eu estava na cama. A janela se abriu sozinha e vi seis ou sete lobos brancos sentados numa grande nogueira. Estavam imóveis e me olhavam. Acordei gritando, com medo de ser devorado. Até hoje, quando alguém me olha fixamente, sinto o mesmo frio.","ficha":{"idade":"23 anos no início da análise","genero":"Homem","contexto":"Família aristocrata russa; a irmã mais velha já tinha falecido","queixa":"Depressão, apatia, dependência dos outros","momento":"Meio do tratamento","setting":"Consultório particular (Viena, 1910–1914)","sonhos":"O sonho dos lobos na nogueira, aos 4 anos"},"conceitos":["Cena primária","Neurose infantil","Só-depois (Nachträglichkeit)","Sonho"],"ref":"FREUD, Sigmund. História de uma neurose infantil (\"O homem dos lobos\"). In: História de uma neurose infantil (\"O homem dos lobos\"), Além do princípio do prazer e outros textos (1917-1920). Tradução de Paulo César de Souza. São Paulo: Companhia das Letras, 2010. (Obras completas, v. 14).","links":[{"rotulo":"Edição brasileira (Companhia das Letras)","url":"https://www.companhiadasletras.com.br/livro/9788535916133/freud-1917-1920-obras-completas-volume-14"},{"rotulo":"O homem dos lobos (Wikipédia)","url":"https://pt.wikipedia.org/wiki/O_homem_dos_lobos"}]},{"id":"schreber","num":"BC-06","titulo":"Presidente Schreber","paciente":"Daniel Paul Schreber","autores":"Sigmund Freud","ano":1911,"escola":"freud","area":"Psicanálise","tema":"Paranoia · delírio","resumo":"Juiz alemão que adoeceu aos 51 anos, logo depois de ser nomeado presidente de uma corte de apelação. Desenvolveu um delírio em que Deus o transformaria em mulher para gerar uma nova humanidade. Freud nunca o atendeu: analisou o livro de memórias que o próprio Schreber publicou em 1903.","fatos":["Freud leu o delírio como tentativa de cura, de reconstrução do mundo.","Schreber acusava seu médico, Flechsig, de um assassinato da alma.","Lacan voltou ao caso no Seminário 3, sobre as psicoses."],"fala":"Certa manhã, entre o sono e a vigília, pensei que deveria ser muito bom ser uma mulher submetida ao coito. A ideia me revoltou. Depois compreendi que era parte da Ordem do Mundo: Deus fala comigo por raios e vozes, e devo ser transformado em mulher para dar origem a uma nova raça. O professor Flechsig tentou cometer contra mim um assassinato da alma.","ficha":{"idade":"51 anos","genero":"Homem","contexto":"Casado, sem filhos; recém-nomeado presidente da Corte de Apelação","queixa":"Insônia e hipocondria que evoluíram para delírio","setting":"Relato publicado (Memórias, 1903)"},"conceitos":["Paranoia","Delírio como cura","Projeção","Foraclusão (Lacan)"],"ref":"FREUD, Sigmund. Observações psicanalíticas sobre um caso de paranoia relatado em autobiografia (\"O caso Schreber\"). In: Observações psicanalíticas sobre um caso de paranoia relatado em autobiografia (\"O caso Schreber\"), artigos sobre técnica e outros textos (1911-1913). Tradução de Paulo César de Souza. São Paulo: Companhia das Letras, 2010. (Obras completas, v. 10). SCHREBER, Daniel Paul. Memórias de um doente dos nervos. Tradução de Marilene Carone. São Paulo: Todavia, 2021.","links":[{"rotulo":"Edição brasileira de Freud (Companhia das Letras)","url":"https://www.companhiadasletras.com.br/livro/9788535916140/freud-1911-1913-obras-completas-volume-10"},{"rotulo":"Daniel Paul Schreber (Wikipédia, em inglês)","url":"https://en.wikipedia.org/wiki/Daniel_Paul_Schreber"}]},{"id":"dick","num":"BC-07","titulo":"Dick","paciente":"Menino não identificado","autores":"Melanie Klein","ano":1930,"escola":"klein","area":"Psicanálise","tema":"Formação de símbolos","resumo":"Menino de 4 anos com vocabulário e afeto muito pobres: quase não brincava, não procurava a mãe nem mostrava angústia. Klein partiu dos poucos interesses dele, trens e estações, para interpretar fantasias sobre o corpo da mãe. Aos poucos, Dick começou a brincar, a sentir angústia e a se vincular.","fatos":["Klein ligou a falta de símbolos a uma defesa excessiva contra o sadismo e a angústia.","Ela nomeou os trens como 'trem papai' e 'trem Dick'.","Klein o descreveu como um quadro de esquizofrenia; hoje o caso costuma ser relido como autismo, termo que só surgiria com Kanner, em 1943. Lacan, no Seminário 1, criticou a intervenção de Klein como imposição de um simbolismo."],"fala":"Dick entra na sala sem olhar para mim nem para a babá, como se fôssemos móveis. Corre de um lado para o outro, sem brincar. Pego um trem grande e um pequeno e digo: trem papai, trem Dick. Ele empurra o pequeno até a janela e diz: estação. Digo: a estação é a mamãe; Dick está entrando na mamãe. Ele larga o trem, corre para o espaço entre as duas portas, se fecha ali e diz: escuro.","ficha":{"idade":"4 anos","genero":"Menino","contexto":"Pouco afeto recebido nos primeiros cuidados, segundo Klein","queixa":"Quase não fala nem brinca; indiferente às pessoas","momento":"Início do tratamento","setting":"Consultório (Londres, por volta de 1929)"},"conceitos":["Formação de símbolos","Sadismo oral","Angústia","Fantasia inconsciente"],"ref":"KLEIN, Melanie. A importância da formação de símbolos no desenvolvimento do ego (1930). In: Amor, culpa e reparação e outros trabalhos (1921-1945). Tradução de André Cardoso. Rio de Janeiro: Imago, 1996. p. 249-264.","links":[{"rotulo":"Revisitando o caso Dick (Estilos da Clínica, USP)","url":"https://revistas.usp.br/estic/article/view/169734"}]},{"id":"richard","num":"BC-08","titulo":"Richard","paciente":"Menino não identificado","autores":"Melanie Klein","ano":1961,"escola":"klein","area":"Psicanálise","tema":"Análise de criança · guerra","resumo":"Menino de 10 anos atendido por Klein em 1941, durante a Segunda Guerra, numa pequena cidade da Escócia. Tinha medo de outras crianças, não saía sozinho e não ia à escola, e acompanhava de perto as notícias da guerra. Nos mapas e nas frotas de navios que desenhava, Klein leu o conflito entre o amor e o ódio pela mãe e o medo de destruí-la.","fatos":["Foram 93 sessões em Pitlochry, na Escócia, registradas uma a uma.","Klein preparou o relato completo, com os desenhos, nos últimos anos de vida; o livro saiu em 1961, pouco depois de sua morte.","O caso mostra a passagem para a posição depressiva e a reparação."],"fala":"Richard chega preocupado com as notícias: Hitler pode invadir. Abre o mapa e mostra os países que já caíram, depois desenha uma frota. Um navio grande é cercado por submarinos pequenos. Diz que tem medo dos meninos da rua e que só se sente seguro perto da mãe. No fim, pergunta se eu também tenho medo da guerra e se vou continuar vindo.","ficha":{"idade":"10 anos","genero":"Menino","contexto":"Família afastada de Londres durante a guerra; tem um irmão mais velho","queixa":"Medo de outras crianças, não sai sozinho, não vai à escola","momento":"Meio do tratamento","setting":"Sala alugada numa cidade da Escócia (1941)"},"conceitos":["Posição depressiva","Reparação","Objeto combinado","Transferência infantil"],"ref":"KLEIN, Melanie. Narrative of a child analysis: the conduct of the psycho-analysis of children as seen in the treatment of a ten year old boy. London: Hogarth Press; Institute of Psycho-Analysis, 1961. Em português: Narrativa da análise de uma criança (Imago).","links":[]},{"id":"piggle","num":"BC-09","titulo":"The Piggle","paciente":"Gabrielle","autores":"D. W. Winnicott","ano":1977,"escola":"winnicott","area":"Psicanálise","tema":"Consultas sob demanda","resumo":"Menina de 2 anos e 4 meses levada pelos pais depois do nascimento da irmã. Passou a ter pesadelos com a 'mamãe preta' e o 'babacar' e a perguntar quem era. Winnicott a atendeu sob demanda, em 16 consultas ao longo de cerca de dois anos e meio, em estreita parceria com os pais, cujas cartas fazem parte do livro.","fatos":["As consultas aconteciam quando a família pedia, não em frequência fixa.","O livro reúne as notas de Winnicott e as cartas dos pais.","Publicado depois da morte de Winnicott (1971)."],"fala":"Os pais escrevem que, desde que a irmã nasceu, Gabrielle não é mais a mesma. Ela, que se chamava de Piggle, agora acorda de noite falando da mamãe preta e do babacar, e pede: me conta do babacar. Às vezes diz que é o bebê. Na primeira consulta, fica um tempo junto do pai, depois se aproxima dos brinquedos e examina cada um com cuidado.","ficha":{"idade":"2 anos e 4 meses","genero":"Menina","contexto":"Irmã nascida há poucos meses; pais atentos e próximos","queixa":"Pesadelos, irritação, perguntas sobre quem ela é","momento":"Entrevistas iniciais","setting":"Consultas sob demanda (Londres, 1964–1966)"},"conceitos":["Holding","Objeto transicional","Psicanálise sob demanda","Ambiente"],"ref":"WINNICOTT, Donald W. The Piggle: an account of the psychoanalytic treatment of a little girl. Organização de Ishak Ramzy. New York: International Universities Press, 1977.","links":[{"rotulo":"Collected Works of D. W. Winnicott, v. 11 (Oxford Academic)","url":"https://academic.oup.com/book/1316"}]},{"id":"aimee","num":"BC-10","titulo":"Aimée","paciente":"Marguerite Anzieu","autores":"Jacques Lacan","ano":1932,"escola":"lacan","area":"Psicanálise","tema":"Paranoia de autopunição","resumo":"Em 1931, Marguerite Anzieu, funcionária dos correios, atacou com uma faca a atriz Huguette Duflos na entrada de um teatro em Paris. Acreditava que a atriz e outras figuras famosas ameaçavam seu filho. Lacan, que a acompanhou no hospital Sainte-Anne, deu-lhe o nome de Aimée e propôs a noção de paranoia de autopunição em sua tese de doutorado.","fatos":["O delírio cedeu semanas depois da prisão, como se o ato tivesse cumprido uma punição.","Ela havia escrito romances e os enviado à corte inglesa.","O filho, Didier Anzieu, tornou-se psicanalista."],"fala":"Fiz o que fiz para proteger meu filho. Aquela atriz zombava de mim nos jornais e no palco, e tramava com escritores contra nós. Escrevi romances e mandei para a corte da Inglaterra, mas ninguém respondeu. Depois que fui presa, chorei por dias e o medo passou. É estranho: parece que, ao atacá-la, eu é que fui castigada.","ficha":{"idade":"Adulta, perto dos 40 anos","genero":"Mulher","contexto":"Casada, separada do convívio com o filho; trabalhava nos correios","queixa":"Delírio de perseguição contra pessoas célebres","momento":"Início do tratamento","setting":"Hospital Sainte-Anne (Paris, 1931)","riscos":"Passagem ao ato violento contra outra pessoa"},"conceitos":["Paranoia de autopunição","Identificação","Ideal do eu","Passagem ao ato"],"ref":"LACAN, Jacques. Da psicose paranoica em suas relações com a personalidade. Rio de Janeiro: Forense Universitária, 2011. (Original: De la psychose paranoïaque dans ses rapports avec la personnalité. Paris: Le François, 1932.)","links":[{"rotulo":"Case of Aimée (Wikipédia, em inglês)","url":"https://en.wikipedia.org/wiki/Case_of_Aim%C3%A9e"}]},{"id":"bion-elo","num":"BC-11","titulo":"Ataques ao elo","paciente":"Pacientes não identificados","autores":"Wilfred R. Bion","ano":1959,"escola":"bion","area":"Psicanálise","tema":"Partes psicóticas da personalidade","resumo":"No artigo, Bion descreve pacientes com funcionamento psicótico que atacam os elos entre objetos e entre ideias, inclusive o vínculo com o analista. Um dos exemplos é um paciente cuja gagueira parecia impedir a própria comunicação. Bion relacionou esses ataques a fatores inatos, como ódio e inveja intensos, e a uma mãe que não pôde receber e conter as angústias do bebê.","fatos":["O texto reúne vinhetas breves, sem um paciente único.","Bion fala da identificação projetiva como forma de comunicação.","Base para as noções posteriores de continente-contido."],"fala":"O paciente começa: tenho pensado que eu… que talvez… A frase não termina. Ele ri, desvia o olhar e diz que esqueceu o que ia dizer. Quando faço um comentário sobre a interrupção, ele responde que ouviu um barulho na rua e que agora a cabeça está vazia. Depois, em silêncio, aperta as mãos.","ficha":{"idade":"Adulto","queixa":"Funcionamento psicótico; dificuldade de pensar e de se comunicar","setting":"Vinhetas de artigo publicado","transferencia":"A comunicação com o analista é interrompida pelo próprio paciente"},"conceitos":["Ataque ao vínculo","Identificação projetiva","Continente-contido","Parte psicótica"],"ref":"BION, Wilfred R. Attacks on linking. International Journal of Psycho-Analysis, London, v. 40, p. 308-315, 1959. Republicado em: Second thoughts. London: Heinemann, 1967.","links":[]},{"id":"albert","num":"BC-12","titulo":"Pequeno Albert","paciente":"Bebê identificado como Albert B.","autores":"John B. Watson e Rosalie Rayner","ano":1920,"escola":"psicologia","area":"Psicologia","tema":"Behaviorismo · condicionamento do medo","resumo":"Bebê de cerca de 9 meses que, no início, não tinha medo de um rato branco. Aos 11 meses, os pesquisadores passaram a bater numa barra de ferro sempre que ele tocava o rato. Albert passou a temer o rato e generalizou o medo para um coelho, um cachorro, um casaco de pele e uma máscara de Papai Noel. O estudo é um marco e também um exemplo clássico de problema ético.","fatos":["O medo não foi descondicionado antes de o bebê deixar o hospital.","Hoje o experimento seria proibido pelos comitês de ética.","É base do estudo das fobias como aprendizagem."],"fala":"Albert, 11 meses, estende a mão para o rato branco. No instante em que toca o pelo, uma barra de ferro é golpeada atrás da cabeça dele. Ele cai para a frente e choraminga. Depois de algumas repetições, basta o rato aparecer para ele chorar e engatinhar para longe. Dias depois, chora também diante de um coelho e de um casaco de pele.","ficha":{"idade":"11 meses","genero":"Menino","contexto":"Filho de uma ama de leite de um hospital universitário","queixa":"Experimento de condicionamento de medo","setting":"Relato publicado (laboratório, 1920)"},"conceitos":["Condicionamento clássico","Generalização","Fobia aprendida","Ética em pesquisa"],"ref":"WATSON, John B.; RAYNER, Rosalie. Conditioned emotional reactions. Journal of Experimental Psychology, v. 3, n. 1, p. 1-14, 1920.","links":[{"rotulo":"Texto original (Classics in the History of Psychology, York University)","url":"https://psychclassics.yorku.ca/Watson/emotion.htm"}]},{"id":"gage","num":"BC-13","titulo":"Phineas Gage","paciente":"Phineas Gage","autores":"John M. Harlow","ano":1868,"escola":"psicologia","area":"Psicologia","tema":"Neuropsicologia · personalidade","resumo":"Capataz de obras de ferrovia, de 25 anos, que em 1848 teve o crânio atravessado por uma barra de ferro numa explosão. Sobreviveu, mas os amigos diziam que ele não era mais o mesmo: ficou impaciente, irreverente e incapaz de levar adiante os próprios planos. O caso tornou-se marco da relação entre o lobo frontal e a personalidade.","fatos":["A barra entrou abaixo do olho esquerdo e saiu pelo alto da cabeça.","Harlow publicou o relato da recuperação em 1848 e o das mudanças de caráter em 1868.","Estudos posteriores sugerem que Gage readquiriu parte da adaptação social."],"fala":"O médico anota que Phineas recuperou a força e a memória. Mas o empregador não o quer de volta: antes tão eficiente e equilibrado, agora fala palavrões, muda de planos a toda hora e não aceita conselhos que contrariem seus desejos. Os amigos dizem que ele não é mais o Gage.","ficha":{"idade":"25 anos","genero":"Homem","contexto":"Capataz de obras de ferrovia em Vermont (EUA)","queixa":"Mudança de personalidade após lesão cerebral","setting":"Relato publicado (relato médico, 1848–1868)"},"conceitos":["Lobo frontal","Funções executivas","Localização cerebral","Personalidade"],"ref":"HARLOW, John M. Passage of an iron rod through the head. Boston Medical and Surgical Journal, 1848. HARLOW, John M. Recovery from the passage of an iron bar through the head. Publications of the Massachusetts Medical Society, 1868.","links":[{"rotulo":"Relato de 1850 no Buffalo Medical Journal (PubMed Central)","url":"https://pmc.ncbi.nlm.nih.gov/articles/PMC8439863/"},{"rotulo":"Phineas Gage (Wikipédia, em inglês)","url":"https://en.wikipedia.org/wiki/Phineas_Gage"}]},{"id":"hm","num":"BC-14","titulo":"H.M.","paciente":"Henry Molaison","autores":"William Scoville e Brenda Milner","ano":1957,"escola":"psicologia","area":"Psicologia","tema":"Memória · amnésia","resumo":"Homem de 27 anos com epilepsia grave que, em 1953, teve partes dos lobos temporais mediais, incluindo os hipocampos, removidas. As crises diminuíram, mas ele perdeu a capacidade de formar novas memórias duradouras. Ainda assim, aprendia tarefas motoras, como desenhar olhando num espelho, sem lembrar de tê-las praticado.","fatos":["Foi estudado por mais de 50 anos e identificado só depois de sua morte, em 2008.","O caso separou a memória declarativa da memória de procedimentos.","Lembrava-se bem de boa parte da infância."],"fala":"Cada vez que a pesquisadora entra na sala, ele a cumprimenta com educação, como se fosse a primeira vez. Conta histórias da infância com detalhes. Há dias pratica desenhar uma estrela olhando num espelho e está cada vez melhor, mas diz que nunca fez aquilo antes. Comenta que cada dia é sozinho em si mesmo, seja qual for a alegria ou a tristeza que teve.","ficha":{"idade":"27 anos na cirurgia","genero":"Homem","contexto":"Vivia com os pais em Connecticut (EUA)","queixa":"Amnésia anterógrada após cirurgia para epilepsia","setting":"Relato publicado (pesquisa, 1953–2008)"},"conceitos":["Memória declarativa","Memória procedural","Hipocampo","Amnésia anterógrada"],"ref":"SCOVILLE, William Beecher; MILNER, Brenda. Loss of recent memory after bilateral hippocampal lesions. Journal of Neurology, Neurosurgery, and Psychiatry, London, v. 20, n. 1, p. 11-21, 1957. DOI: 10.1136/jnnp.20.1.11.","links":[{"rotulo":"Artigo original (PubMed Central)","url":"https://pmc.ncbi.nlm.nih.gov/articles/PMC497229"},{"rotulo":"Henry Molaison (Wikipédia, em inglês)","url":"https://en.wikipedia.org/wiki/Henry_Molaison"}]},{"id":"emmy","num":"BC-15","titulo":"Emmy von N.","paciente":"Fanny Moser","autores":"Sigmund Freud","ano":1895,"escola":"freud","area":"Psicanálise","tema":"Histeria · do método catártico à associação livre","resumo":"Viúva de cerca de 40 anos, atendida por Freud a partir de 1889, com alucinações de animais, tiques, um estalo de língua no meio da fala, dores e estados de confusão. Foi o primeiro caso em que Freud usou em larga escala o método catártico de Breuer, sob hipnose. Ao deixar que ela contasse o que tinha a dizer sem interrompê-la, Freud deu um passo em direção à associação livre.","fatos":["Freud ligou o estalo de língua a uma ideia antitética: não fazer barulho para não acordar a filha doente.","Foi o primeiro uso amplo do método catártico de Breuer, sob hipnose.","O nome real da paciente era Fanny Moser (1848–1925)."],"fala":"Fique quieto, não diga nada, não me toque! Desculpe, doutor, isso me escapa. Quando vejo bichos rastejando, a voz some e vem esse estalo na língua. Começou à cabeceira da minha filha doente: eu precisava ficar em silêncio para ela dormir, e foi justamente aí que o barulho saiu. Deixe-me contar o que tenho a dizer, sem me perguntar de onde vem cada coisa.","ficha":{"idade":"Cerca de 40 anos","genero":"Mulher","contexto":"Viúva, mãe de duas filhas","queixa":"Alucinações com animais, tiques, estalo de língua, dores","momento":"Meio do tratamento","setting":"Relato publicado (Viena, 1889)"},"conceitos":["Método catártico","Hipnose e sugestão","Ideia antitética","Associação livre"],"ref":"FREUD, Sigmund; BREUER, Josef. Estudos sobre a histeria (1893-1895). Tradução de Laura Barreto; revisão de Paulo César de Souza. São Paulo: Companhia das Letras, 2016. (Obras completas, v. 2).","links":[{"rotulo":"Revisões do caso Emmy von N. (Memorandum, UFMG)","url":"https://periodicos.ufmg.br/index.php/memorandum/article/download/6456/4043/21501"},{"rotulo":"Fanny Moser (Wikipédia, em inglês)","url":"https://en.wikipedia.org/wiki/Fanny_Moser_(baroness)"}]},{"id":"elisabeth","num":"BC-16","titulo":"Elisabeth von R.","paciente":"Ilona Weiss","autores":"Sigmund Freud","ano":1895,"escola":"freud","area":"Psicanálise","tema":"Histeria · a descoberta da resistência","resumo":"Jovem de 24 anos que chegou a Freud no outono de 1892 com dores nas pernas e dificuldade para andar havia mais de dois anos, sem causa orgânica. Como não respondia à hipnose, Freud usou a pressão da mão na testa, pedindo que ela contasse tudo o que lhe ocorresse; nesse trabalho, encontrou a resistência. Os sintomas foram ligados ao desejo recalcado pelo cunhado, marido da irmã que havia morrido.","fatos":["Freud chamou o caso de primeira análise integral de uma histeria.","Sem resposta à hipnose, ele recorreu à técnica da pressão na testa, inspirada em Bernheim.","Freud considerou a paciente curada ao final do tratamento."],"fala":"As dores começam sempre no mesmo ponto da perna, eu conheço bem. Cuidei de papai até ele morrer, depois minha irmã adoeceu e também se foi. Quando o senhor aperta minha testa, às vezes não vem nada. Ou vem, e eu acho que não vale a pena dizer. Hoje veio a imagem do meu cunhado, mas isso não tem importância.","ficha":{"idade":"24 anos","genero":"Mulher","contexto":"Cuidou do pai doente até a morte dele; a irmã morreu pouco depois","queixa":"Dores nas pernas e dificuldade para andar","momento":"Meio do tratamento","setting":"Relato publicado (Viena, 1892–1893)"},"conceitos":["Conversão","Recalque","Resistência","Técnica da pressão"],"ref":"FREUD, Sigmund; BREUER, Josef. Estudos sobre a histeria (1893-1895). Tradução de Laura Barreto; revisão de Paulo César de Souza. São Paulo: Companhia das Letras, 2016. (Obras completas, v. 2).","links":[{"rotulo":"Os casos Elisabeth von R. e Dora (monografia, UFMG)","url":"https://repositorio.ufmg.br/bitstream/1843/54442/1/Rosangela%20-%20Monografia.pdf"}]},{"id":"katharina","num":"BC-17","titulo":"Katharina","paciente":"Aurelia Kronich","autores":"Sigmund Freud","ano":1895,"escola":"freud","area":"Psicanálise","tema":"Angústia · trauma e só-depois","resumo":"Moça de cerca de 18 anos que abordou Freud durante umas férias nos Alpes ao saber que ele era médico. Tinha crises de falta de ar, aperto no peito, marteladas na cabeça e a visão de uma cabeça de homem. Numa única conversa, ligou as crises à cena em que surpreendeu o homem da casa com a prima e às investidas que ele mesmo tinha feito contra ela. Em 1924, Freud revelou que esse homem era o pai dela, não o tio.","fatos":["O tratamento foi uma única conversa, em 1893.","Numa nota de 1924, Freud corrigiu o texto: o agressor era o pai, não o tio.","O nome real era Aurelia Kronich (1875–1929)."],"fala":"O senhor é médico? Eu tenho uma coisa nos nervos. Às vezes falta o ar, parece que vou sufocar, a cabeça martela e eu vejo um rosto horrível me olhando. Não sei de quem é. Começou quando eu vi pela janela o tio com a minha prima Franziska. Fiquei mal por dias. Depois me lembrei de coisas que ele tinha feito comigo antes, e que eu nem entendia.","ficha":{"idade":"Cerca de 18 anos","genero":"Mulher","contexto":"Trabalhava no abrigo de montanha da família","queixa":"Crises de falta de ar e angústia","momento":"Supervisão pontual","setting":"Consulta única durante férias (Alpes, 1893)","riscos":"Relato de abuso sexual por um adulto da família"},"conceitos":["Trauma e só-depois","Neurose de angústia","Teoria da sedução","Consulta única"],"ref":"FREUD, Sigmund; BREUER, Josef. Estudos sobre a histeria (1893-1895). Tradução de Laura Barreto; revisão de Paulo César de Souza. São Paulo: Companhia das Letras, 2016. (Obras completas, v. 2).","links":[{"rotulo":"Katharina e a passagem ao ato (Clínica & Cultura, UFS)","url":"https://periodicos.ufs.br/clinicaecultura/article/download/6811/7295/26619"}]},{"id":"rita","num":"BC-18","titulo":"Rita","paciente":"Menina não identificada","autores":"Melanie Klein","ano":1932,"escola":"klein","area":"Psicanálise","tema":"Neurose obsessiva infantil · Édipo precoce","resumo":"Menina de 2 anos e 9 meses, uma das primeiras crianças analisadas por Klein. Tinha terrores noturnos e medo de animais desde os 18 meses, agravados depois do nascimento de um irmão, além de um ritual demorado para dormir, crises depressivas e forte inibição para brincar. Klein ligou o quadro a um conflito edipiano precoce e a um superego severo. Em 83 sessões, interrompidas por uma mudança da família, a angústia diminuiu e os rituais desapareceram.","fatos":["No ritual da noite, ela e a boneca precisavam ser enroladas bem apertadas nas cobertas.","Klein descreveu uma mãe introjetada mais cruel que a mãe real.","Anos depois, Klein constatou que Rita tinha entrado bem na latência."],"fala":"Na hora de dormir, Rita exige ser enrolada bem apertada no cobertor, senão chora. A boneca também precisa ser enrolada. Hoje, na sessão, ela pegou a boneca, embrulhou-a com força e disse que era o bebê. Depois parou de brincar, ficou triste sem motivo aparente e perguntou se eu gostava dela.","ficha":{"idade":"2 anos e 9 meses","genero":"Menina","contexto":"Um irmão nasceu quando ela tinha 2 anos","queixa":"Terrores noturnos, medo de animais, ritual para dormir, inibição para brincar","momento":"Início do tratamento","setting":"Relato publicado (década de 1920)"},"conceitos":["Édipo precoce","Superego arcaico","Técnica do brincar","Neurose obsessiva infantil"],"ref":"KLEIN, Melanie. A psicanálise de crianças. Tradução de André Cardoso. Rio de Janeiro: Imago, 1997. (Obras completas de Melanie Klein, v. 2). Original de 1932.","links":[{"rotulo":"A psicanálise de crianças em debate (Estilos da Clínica, USP)","url":"https://periodicos.usp.br/estic/article/download/143644/152431/345076"},{"rotulo":"The Psycho-Analysis of Children (Internet Archive, em inglês)","url":"https://archive.org/details/psychoanalysisof007950mbp"}]},{"id":"iiro","num":"BC-19","titulo":"Iiro","paciente":"Menino não identificado","autores":"D. W. Winnicott","ano":1971,"escola":"winnicott","area":"Psicanálise","tema":"Jogo do rabisco · consulta terapêutica","resumo":"Menino finlandês de 9 anos e 9 meses, o primeiro caso das Consultas terapêuticas em psiquiatria infantil. Winnicott o atendeu num hospital ortopédico e propôs o jogo do rabisco: um faz um traço ao acaso, o outro o transforma em algo, e os papéis se alternam. Iiro logo usou o jogo para falar dos próprios dedos unidos (sindactilia), ao ver um pé de pato num dos rabiscos.","fatos":["É o Caso 1 do livro Consultas terapêuticas (1971).","O jogo do rabisco permitiu uma comunicação significativa já no primeiro encontro.","Iiro desenhou a perna e a membrana entre os dedos do pé de pato."],"fala":"Winnicott fecha os olhos e faz um traço ao acaso. Iiro olha, gira o papel e diz que é um pé de pato. Desenha a perna e a membrana entre os dedos. Depois é a vez dele de rabiscar, e ele ri quando Winnicott transforma o traço num bicho. Pede para jogar de novo e, num dos desenhos, fala do próprio pé.","ficha":{"idade":"9 anos e 9 meses","genero":"Menino","contexto":"Em tratamento num hospital ortopédico","queixa":"Sindactilia congênita (dedos unidos); consulta durante o tratamento ortopédico","momento":"Entrevistas iniciais","setting":"Relato publicado (consulta terapêutica)"},"conceitos":["Jogo do rabisco","Consulta terapêutica","Espaço potencial e brincar","Comunicação significativa"],"ref":"WINNICOTT, Donald W. Consultas terapêuticas em psiquiatria infantil. Rio de Janeiro: Imago, 1984. Original de 1971.","links":[{"rotulo":"O jogo do rabisco e o caso Iiro (Imaginário, USP)","url":"https://periodicos.usp.br/ima/article/download/42459/46128/50681"}]},{"id":"papin","num":"BC-20","titulo":"As irmãs Papin","paciente":"Christine e Léa Papin","autores":"Jacques Lacan","ano":1933,"escola":"lacan","area":"Psicanálise","tema":"Paranoia a dois · passagem ao ato","resumo":"Em 2 de fevereiro de 1933, em Le Mans, as empregadas Christine (27 anos) e Léa Papin (21) mataram a patroa e a filha dela, arrancando-lhes os olhos, e depois foram se deitar juntas. Lacan não as atendeu: leu o crime como paranoia, à semelhança do caso Aimée, um delírio a dois sustentado pela identificação especular, em que a outra mulher é ao mesmo tempo ideal e objeto de ódio.","fatos":["Christine teve a pena de morte trocada por prisão perpétua e morreu em 1937 num hospital psiquiátrico.","Léa recebeu 10 anos de prisão e saiu em 1941.","Na prisão, Christine tentou arrancar os próprios olhos."],"fala":"Christine conta ao juiz que, naquela noite, o ferro de passar queimou e a luz apagou. A patroa a repreendeu, e ela sentiu que as duas irmãs iam ser atacadas. Diz que não odiava ninguém. Na prisão, separada de Léa, para de comer e pede para vê-la.","ficha":{"idade":"27 e 21 anos","genero":"Mulheres","contexto":"Irmãs, empregadas domésticas na mesma casa havia anos","queixa":"Crime cometido numa passagem ao ato","setting":"Relato publicado (Le Mans, 1933)","riscos":"Violência grave contra outras pessoas; autolesão na prisão"},"conceitos":["Paranoia de autopunição","Delírio a dois","Identificação especular e agressividade","Passagem ao ato"],"ref":"LACAN, Jacques. Motivos do crime paranoico: o crime das irmãs Papin. In: Da psicose paranoica em suas relações com a personalidade. Rio de Janeiro: Forense Universitária, 1987. Original: Minotaure, Paris, n. 3/4, 1933.","links":[{"rotulo":"Aimée e as irmãs Papin (dissertação, PUC-Rio)","url":"https://www.maxwell.vrac.puc-rio.br/19662/19662_4.PDF"},{"rotulo":"Christine e Léa Papin (Wikipédia, em inglês)","url":"https://en.wikipedia.org/wiki/Christine_and_L%C3%A9a_Papin"}]},{"id":"mrz","num":"BC-21","titulo":"Sr. Z","paciente":"Paciente não identificado","autores":"Heinz Kohut","ano":1979,"escola":"outros","area":"Psicanálise","tema":"Psicologia do self · duas análises","resumo":"Kohut relatou duas análises do mesmo paciente, cada uma com cerca de quatro anos e cinco sessões por semana, separadas por uns cinco anos e meio. Na primeira, de orientação clássica, leu Z como um narcisista que não tinha se separado da mãe; na segunda, já com a psicologia do self, viu nas mesmas dificuldades necessidades narcísicas legítimas que não tinham sido atendidas.","fatos":["As duas análises tiveram cerca de quatro anos cada, com cinco sessões por semana.","O texto mostra a passagem da teoria clássica à psicologia do self.","Costuma ser lido como autobiográfico, mas Kohut nunca o confirmou."],"fala":"Na segunda análise, Z volta a falar da mãe: ela o queria perto, dizia que ele era tudo para ela e, ao mesmo tempo, nunca o via de verdade. Ele conta que se sentia uma extensão dela. Diz que da primeira vez ouviu que estava preso aos próprios desejos infantis e se esforçou para aceitar isso, mas a sensação de vazio continuou.","ficha":{"idade":"Jovem adulto","genero":"Homem","queixa":"Isolamento e dificuldades afetivas","momento":"Meio do tratamento","setting":"Relato publicado (duas análises)"},"conceitos":["Psicologia do self","Objetos do self","Empatia e introspecção","Transferência especular e idealizadora"],"ref":"KOHUT, Heinz. The two analyses of Mr. Z. International Journal of Psycho-Analysis, London, v. 60, p. 3-27, 1979.","links":[{"rotulo":"Heinz Kohut e o caso Sr. Z (Wikipédia, em inglês)","url":"https://en.wikipedia.org/wiki/Heinz_Kohut"}]},{"id":"peter","num":"BC-22","titulo":"Pequeno Peter","paciente":"Menino identificado como Peter","autores":"Mary Cover Jones","ano":1924,"escola":"psicologia","area":"Psicologia","tema":"Descondicionamento do medo","resumo":"Menino de 2 anos e 10 meses com medo de um rato branco, que se estendia a coelho, casaco de pele, penas e algodão. Mary Cover Jones combinou a imitação de outras crianças calmas diante do coelho com a aproximação gradual do animal enquanto Peter comia algo de que gostava, numa escala de 17 passos. No fim, ele acariciava o coelho, e os outros medos tinham desaparecido.","fatos":["O coelho provocava a reação mais forte.","O medo voltou depois de uma escarlatina e de um susto com um cachorro, e foi trabalhado de novo.","O estudo é considerado precursor da dessensibilização sistemática."],"fala":"Peter, 2 anos e 10 meses, grita quando o coelho aparece na gaiola do outro lado da sala. Nos dias seguintes, brinca perto de outras crianças que fazem carinho no coelho, e a gaiola chega um pouco mais perto enquanto ele come um lanche de que gosta. Semanas depois, ele pega o coelho no colo e faz carinho.","ficha":{"idade":"2 anos e 10 meses","genero":"Menino","queixa":"Medo de coelho, rato, casaco de pele, penas e algodão","setting":"Relato publicado (laboratório, 1924)"},"conceitos":["Descondicionamento","Generalização do estímulo","Modelação social","Dessensibilização sistemática"],"ref":"JONES, Mary Cover. A laboratory study of fear: the case of Peter. Pedagogical Seminary, v. 31, p. 308-315, 1924.","links":[{"rotulo":"Texto original (Classics in the History of Psychology, York University)","url":"https://psychclassics.yorku.ca/Jones/"}]},{"id":"genie","num":"BC-23","titulo":"Genie","paciente":"Menina identificada como Genie","autores":"Susan Curtiss","ano":1977,"escola":"psicologia","area":"Psicologia","tema":"Privação extrema · período crítico da linguagem","resumo":"Menina encontrada em novembro de 1970, aos 13 anos e 7 meses, em Los Angeles. Desde cerca dos 20 meses vivia isolada num quarto escuro, presa a uma cadeira ou num berço, e apanhava quando fazia barulho. Quase não tinha linguagem; o vocabulário cresceu bastante, mas a gramática quase não se desenvolveu. O caso é central no debate sobre o período crítico e sobre a ética da pesquisa.","fatos":["O vocabulário cresceu muito, mas ela nunca adquiriu plenamente a gramática de uma primeira língua.","Passou por lares adotivos e instituições; em 1978 a mãe proibiu as pesquisas.","O caso levanta questões éticas sobre pesquisa e cuidado ao mesmo tempo."],"fala":"Genie, 13 anos, anda curvada, com passos curtos, e quase não faz som: aprendeu que barulho era castigado. Em poucos meses junta muitas palavras e aponta os objetos com avidez. Mas as frases não se organizam: quer contar que foram à loja comprar purê de maçã e diz algo como 'maçã comprar loja'.","ficha":{"idade":"13 anos e 7 meses","genero":"Menina","contexto":"Isolada num quarto escuro desde cerca dos 20 meses","queixa":"Ausência de linguagem e privação extrema","setting":"Relato publicado (Los Angeles, 1970–1978)","riscos":"Vítima de maus-tratos graves"},"conceitos":["Período crítico da linguagem","Privação social extrema","Vocabulário e gramática","Ética em pesquisa"],"ref":"CURTISS, Susan. Genie: a psycholinguistic study of a modern-day \"wild child\". New York: Academic Press, 1977.","links":[{"rotulo":"Genie (Wikipédia)","url":"https://pt.wikipedia.org/wiki/Genie_(crian%C3%A7a_selvagem)"},{"rotulo":"Genie (Wikipédia, em inglês, mais completa)","url":"https://en.wikipedia.org/wiki/Genie_(feral_child)"}]},{"id":"victor","num":"BC-24","titulo":"Victor de Aveyron","paciente":"Victor","autores":"Jean Itard","ano":1806,"escola":"psicologia","area":"Psicologia","tema":"Criança selvagem · origens da educação especial","resumo":"Menino de cerca de 12 anos que saiu dos bosques do Aveyron, no sul da França, em janeiro de 1800. O médico Jean Itard o educou por anos, com o apoio da governanta Madame Guérin, e publicou relatórios em 1801 e 1806. Victor aprendeu a reconhecer palavras escritas, mas nunca adquiriu a linguagem falada, e o caso se tornou marco do debate entre natureza e cultura.","fatos":["Victor aprendeu a montar palavras como 'lait' com letras e chegou a pronunciar umas poucas, como 'lait' e 'oh Dieu', mas nunca adquiriu a linguagem falada.","Madame Guérin cuidou dele por toda a vida.","Morreu de pneumonia em Paris, em 1828."],"fala":"Victor corre de um lado para o outro e balança o corpo. Não se vira quando o chamam, mas vira a cabeça ao estalo de uma noz. Itard escreve LAIT com letras de metal; depois de muitas semanas, Victor junta as letras quando quer o leite. Chega a dizer algo parecido com \"lait\", mas a linguagem falada não vem.","ficha":{"idade":"Cerca de 12 anos","genero":"Menino","contexto":"Encontrado vivendo sozinho nos bosques do Aveyron","queixa":"Ausência de linguagem e de convívio social","setting":"Relato publicado (Paris, 1800–1806)"},"conceitos":["Criança selvagem","Natureza e cultura","Período crítico","Origens da educação especial"],"ref":"BANKS-LEITE, Luci; GALVÃO, Izabel (org.). A educação de um selvagem: as experiências pedagógicas de Jean Itard. São Paulo: Cortez, 2000.","links":[{"rotulo":"O garoto selvagem e a educação (Perspectiva, UFSC)","url":"https://periodicos.ufsc.br/index.php/perspectiva/article/view/2175-795X.2012v30n2p553"},{"rotulo":"Victor de Aveyron (Wikipédia)","url":"https://pt.wikipedia.org/wiki/Victor_de_Aveyron"}]},{"id":"wearing","num":"BC-25","titulo":"Clive Wearing","paciente":"Clive Wearing","autores":"Barbara Wilson, Alan Baddeley e Narinder Kapur","ano":1995,"escola":"psicologia","area":"Psicologia","tema":"Amnésia profunda · memória e identidade","resumo":"Músico, maestro e tenor britânico, nascido em 1938, que em março de 1985 teve uma encefalite por herpes que lesou o hipocampo. Ficou com amnésia anterógrada e retrógrada graves, com memória de segundos, e acredita o tempo todo que acabou de acordar. A memória de procedimento ficou preservada: ele ainda toca piano e rege um coro.","fatos":["A memória dele dura de cerca de 7 a 30 segundos.","No diário, registra repetidamente que acabou de acordar.","Wilson, Baddeley e Kapur descreveram também perdas na memória semântica."],"fala":"No diário, Clive escreve a mesma frase várias vezes, riscando a anterior: agora estou totalmente acordado, pela primeira vez. Quando a esposa entra na sala, ele a abraça como se não a visse há anos, embora ela tenha saído há minutos. Ao piano, toca uma peça inteira sem errar.","ficha":{"idade":"46 anos na doença","genero":"Homem","contexto":"Músico e maestro britânico, casado","queixa":"Amnésia anterógrada e retrógrada após encefalite","setting":"Relato publicado (pesquisa, desde 1985)"},"conceitos":["Amnésia anterógrada e retrógrada","Memória episódica e semântica","Memória de procedimento","Hipocampo"],"ref":"WILSON, Barbara A.; BADDELEY, Alan D.; KAPUR, Narinder. Dense amnesia in a professional musician following herpes simplex virus encephalitis. Journal of Clinical and Experimental Neuropsychology, v. 17, n. 5, p. 668-681, 1995.","links":[{"rotulo":"Resumo do artigo (PubMed)","url":"https://pubmed.ncbi.nlm.nih.gov/8557808/"},{"rotulo":"Clive Wearing (Wikipédia, em inglês)","url":"https://en.wikipedia.org/wiki/Clive_Wearing"}]},{"id":"genovese","num":"BC-26","titulo":"Kitty Genovese","paciente":"Catherine Genovese","autores":"John Darley e Bibb Latané","ano":1968,"escola":"psicologia","area":"Psicologia","tema":"Efeito espectador · o mito e a revisão","resumo":"Kitty Genovese foi assassinada em março de 1964, no Queens, em Nova York, e o New York Times publicou que 38 testemunhas viram o crime sem chamar a polícia. O caso inspirou os experimentos de Darley e Latané sobre a difusão de responsabilidade. Em 2007, uma revisão mostrou que a história das 38 testemunhas passivas não se sustenta, e o próprio jornal reconheceu a falha em 2016.","fatos":["Darley e Latané mostraram que, quanto mais pessoas presentes, menor a chance de alguém ajudar.","Cerca de uma dúzia ouviu ou viu partes do ataque, e duas pessoas chamaram a polícia.","A vizinha Sophia Farrar desceu para amparar a vítima."],"fala":"A manchete diz que 38 pessoas viram o crime e ninguém chamou a polícia. Anos depois, a revisão dos documentos mostra outra cena: cerca de uma dúzia ouviu ou viu partes do ataque, duas pessoas chamaram a polícia e uma vizinha desceu para amparar a vítima. O caso virou parábola nos manuais antes de ser conferido.","ficha":{"contexto":"Nova York, 1964","queixa":"Estudo do comportamento de ajuda em emergências","setting":"Relato publicado (imprensa e pesquisa)"},"conceitos":["Efeito espectador","Difusão de responsabilidade","Ignorância pluralística","Mito nos manuais de psicologia"],"ref":"DARLEY, John M.; LATANÉ, Bibb. Bystander intervention in emergencies: diffusion of responsibility. Journal of Personality and Social Psychology, v. 8, n. 4, p. 377-383, 1968. Revisão crítica: MANNING, Rachel; LEVINE, Mark; COLLINS, Alan. The Kitty Genovese murder and the social psychology of helping. American Psychologist, v. 62, n. 6, p. 555-562, 2007.","links":[{"rotulo":"Kitty Genovese (Wikipédia)","url":"https://pt.wikipedia.org/wiki/Kitty_Genovese"},{"rotulo":"Revisão crítica de Manning e colegas, 2007 (PubMed)","url":"https://pubmed.ncbi.nlm.nih.gov/17874896/"}]}],"FONTES":{"anna-o":{"ref":"FREUD, Sigmund; BREUER, Josef. Estudos sobre a histeria (1893-1895). Tradução de Laura Barreto; revisão de Paulo César de Souza. São Paulo: Companhia das Letras, 2016. (Obras completas, v. 2).","links":[["Edição brasileira (Companhia das Letras)","https://www.companhiadasletras.com.br/livro/9788535926804/freud-1893-1895-obras-completas-volume-2"],["Bertha Pappenheim (Wikipédia, em inglês)","https://en.wikipedia.org/wiki/Bertha_Pappenheim"]]},"dora":{"ref":"FREUD, Sigmund. Análise fragmentária de uma histeria (\"O caso Dora\"). In: Três ensaios sobre a teoria da sexualidade, Análise fragmentária de uma histeria (\"O caso Dora\") e outros textos (1901-1905). Tradução de Paulo César de Souza. São Paulo: Companhia das Letras, 2016. (Obras completas, v. 6).","links":[["Edição brasileira (Companhia das Letras)","https://www.companhiadasletras.com.br/livro/9788535927832/freud-1901-1905-obras-completas-volume-6"],["Dora, estudo de caso (Wikipédia)","https://pt.wikipedia.org/wiki/Dora_(estudo_de_caso)"]]},"hans":{"ref":"FREUD, Sigmund. Análise da fobia de um garoto de cinco anos (\"O pequeno Hans\"). In: O delírio e os sonhos na Gradiva, Análise da fobia de um garoto de cinco anos e outros textos (1906-1909). Tradução de Paulo César de Souza. São Paulo: Companhia das Letras, 2015. (Obras completas, v. 8).","links":[["Edição brasileira (Companhia das Letras)","https://www.companhiadasletras.com.br/livro/9788535925869/freud-1906-1909-obras-completas-volume-8"],["Herbert Graf (Wikipédia, em inglês)","https://en.wikipedia.org/wiki/Herbert_Graf"]]},"ratos":{"ref":"FREUD, Sigmund. Observações sobre um caso de neurose obsessiva (\"O homem dos ratos\"). In: Observações sobre um caso de neurose obsessiva (\"O homem dos ratos\"), Uma recordação de infância de Leonardo da Vinci e outros textos (1909-1910). Tradução de Paulo César de Souza. São Paulo: Companhia das Letras, 2013. (Obras completas, v. 9).","links":[["O homem dos ratos (Wikipédia)","https://pt.wikipedia.org/wiki/O_homem_dos_ratos"]]},"lobos":{"ref":"FREUD, Sigmund. História de uma neurose infantil (\"O homem dos lobos\"). In: História de uma neurose infantil (\"O homem dos lobos\"), Além do princípio do prazer e outros textos (1917-1920). Tradução de Paulo César de Souza. São Paulo: Companhia das Letras, 2010. (Obras completas, v. 14).","links":[["Edição brasileira (Companhia das Letras)","https://www.companhiadasletras.com.br/livro/9788535916133/freud-1917-1920-obras-completas-volume-14"],["O homem dos lobos (Wikipédia)","https://pt.wikipedia.org/wiki/O_homem_dos_lobos"]]},"schreber":{"ref":"FREUD, Sigmund. Observações psicanalíticas sobre um caso de paranoia relatado em autobiografia (\"O caso Schreber\"). In: Observações psicanalíticas sobre um caso de paranoia relatado em autobiografia (\"O caso Schreber\"), artigos sobre técnica e outros textos (1911-1913). Tradução de Paulo César de Souza. São Paulo: Companhia das Letras, 2010. (Obras completas, v. 10). SCHREBER, Daniel Paul. Memórias de um doente dos nervos. Tradução de Marilene Carone. São Paulo: Todavia, 2021.","links":[["Edição brasileira de Freud (Companhia das Letras)","https://www.companhiadasletras.com.br/livro/9788535916140/freud-1911-1913-obras-completas-volume-10"],["Daniel Paul Schreber (Wikipédia, em inglês)","https://en.wikipedia.org/wiki/Daniel_Paul_Schreber"]]},"dick":{"ref":"KLEIN, Melanie. A importância da formação de símbolos no desenvolvimento do ego (1930). In: Amor, culpa e reparação e outros trabalhos (1921-1945). Tradução de André Cardoso. Rio de Janeiro: Imago, 1996. p. 249-264.","links":[["Revisitando o caso Dick (Estilos da Clínica, USP)","https://revistas.usp.br/estic/article/view/169734"]]},"richard":{"ref":"KLEIN, Melanie. Narrative of a child analysis: the conduct of the psycho-analysis of children as seen in the treatment of a ten year old boy. London: Hogarth Press; Institute of Psycho-Analysis, 1961. Em português: Narrativa da análise de uma criança (Imago).","links":[]},"piggle":{"ref":"WINNICOTT, Donald W. The Piggle: an account of the psychoanalytic treatment of a little girl. Organização de Ishak Ramzy. New York: International Universities Press, 1977.","links":[["Collected Works of D. W. Winnicott, v. 11 (Oxford Academic)","https://academic.oup.com/book/1316"]]},"aimee":{"ref":"LACAN, Jacques. Da psicose paranoica em suas relações com a personalidade. Rio de Janeiro: Forense Universitária, 2011. (Original: De la psychose paranoïaque dans ses rapports avec la personnalité. Paris: Le François, 1932.)","links":[["Case of Aimée (Wikipédia, em inglês)","https://en.wikipedia.org/wiki/Case_of_Aim%C3%A9e"]]},"bion-elo":{"ref":"BION, Wilfred R. Attacks on linking. International Journal of Psycho-Analysis, London, v. 40, p. 308-315, 1959. Republicado em: Second thoughts. London: Heinemann, 1967.","links":[]},"albert":{"ref":"WATSON, John B.; RAYNER, Rosalie. Conditioned emotional reactions. Journal of Experimental Psychology, v. 3, n. 1, p. 1-14, 1920.","links":[["Texto original (Classics in the History of Psychology, York University)","https://psychclassics.yorku.ca/Watson/emotion.htm"]]},"gage":{"ref":"HARLOW, John M. Passage of an iron rod through the head. Boston Medical and Surgical Journal, 1848. HARLOW, John M. Recovery from the passage of an iron bar through the head. Publications of the Massachusetts Medical Society, 1868.","links":[["Relato de 1850 no Buffalo Medical Journal (PubMed Central)","https://pmc.ncbi.nlm.nih.gov/articles/PMC8439863/"],["Phineas Gage (Wikipédia, em inglês)","https://en.wikipedia.org/wiki/Phineas_Gage"]]},"hm":{"ref":"SCOVILLE, William Beecher; MILNER, Brenda. Loss of recent memory after bilateral hippocampal lesions. Journal of Neurology, Neurosurgery, and Psychiatry, London, v. 20, n. 1, p. 11-21, 1957. DOI: 10.1136/jnnp.20.1.11.","links":[["Artigo original (PubMed Central)","https://pmc.ncbi.nlm.nih.gov/articles/PMC497229"],["Henry Molaison (Wikipédia, em inglês)","https://en.wikipedia.org/wiki/Henry_Molaison"]]}},"VINHETAS":[{"id":"v-atraso","titulo":"O atraso","tipo":"Vinheta fictícia · transferência","texto":"Desculpa o atraso, de novo. O ônibus... na verdade eu fiquei parada na esquina olhando o prédio. Não sei por quê. Na semana passada você falou da minha irmã e eu fiquei com raiva, mas não de você. Ou de você também."},{"id":"v-ralo","titulo":"O menino e o ralo","tipo":"Vinheta fictícia · criança","texto":"A mãe conta que P., 6 anos, não deixa ninguém tomar banho antes dele e grita quando a água escoa pelo ralo. Desde que a irmã nasceu, voltou a fazer xixi na cama. Na sessão, ele desenha um navio que afunda e diz: \"esse é o bebê, mas é de mentira\"."},{"id":"v-promocao","titulo":"A promoção","tipo":"Vinheta fictícia · trabalho","texto":"Fui promovido e desde então não durmo. Meu pai nunca passou de auxiliar. Na reunião, quando o diretor elogiou meu relatório, senti vontade de sair correndo. Fico achando que vão descobrir que eu não sei nada."},{"id":"anna-o","titulo":"Anna O.","tipo":"Josef Breuer, 1895","texto":"Faz semanas que não consigo beber água; seguro o copo e algo me impede. Desde que papai adoeceu, passo as noites ao lado da cama dele. Às vezes as palavras em alemão somem e só consigo falar inglês. Quando conto ao doutor como cada coisa começou, ela vai embora por um tempo. Ontem lembrei da governanta e do cachorrinho dela bebendo do copo. Senti nojo e não disse nada, por educação.","bib":true},{"id":"dora","titulo":"Dora","tipo":"Sigmund Freud, 1905","texto":"Meu pai me trouxe porque diz que eu ando impossível. A tosse voltou, às vezes perco a voz por semanas. Ninguém acredita em mim. Aquele homem, o Sr. K., me agarrou perto do lago e meu pai acha que eu inventei. Eu sei por quê: ele precisa que eu fique quieta para continuar visitando a Sra. K. É como se eu tivesse sido oferecida em troca. O engraçado é que eu gostava dela, dormíamos no mesmo quarto, ela me contava tudo. As crises de tosse duram semanas. O Sr. K. também vive viajando. Eu não queria falar disso hoje.","bib":true},{"id":"hans","titulo":"Pequeno Hans","tipo":"Sigmund Freud, 1909","texto":"Não quero sair na rua. O cavalo pode cair e fazer barulho com as pernas. Os que têm uma coisa preta na boca são os piores. Quando a mamãe me dá banho na banheira grande, fico com medo de que ela me solte. Hoje de manhã eu pensei que tinha duas girafas no quarto, uma grande e uma amassada, e eu sentei em cima da amassada.","bib":true},{"id":"ratos","titulo":"Homem dos Ratos","tipo":"Sigmund Freud, 1909","texto":"Desde que o capitão descreveu aquele castigo, com o vaso de ratos, a ideia não sai da minha cabeça: e se fizessem isso com meu pai, ou com a dama que eu amo? Sei que meu pai morreu há anos, mas o medo continua. Agora preciso devolver o dinheiro dos óculos ao tenente A., e cada plano que faço tem uma condição que o torna impossível. Peço desculpas por contar isso; o senhor deve me achar um criminoso.","bib":true},{"id":"lobos","titulo":"Homem dos Lobos","tipo":"Sigmund Freud, 1918","texto":"Sonhei, quando tinha quatro anos, que era noite e eu estava na cama. A janela se abriu sozinha e vi seis ou sete lobos brancos sentados numa grande nogueira. Estavam imóveis e me olhavam. Acordei gritando, com medo de ser devorado. Até hoje, quando alguém me olha fixamente, sinto o mesmo frio.","bib":true},{"id":"schreber","titulo":"Presidente Schreber","tipo":"Sigmund Freud, 1911","texto":"Certa manhã, entre o sono e a vigília, pensei que deveria ser muito bom ser uma mulher submetida ao coito. A ideia me revoltou. Depois compreendi que era parte da Ordem do Mundo: Deus fala comigo por raios e vozes, e devo ser transformado em mulher para dar origem a uma nova raça. O professor Flechsig tentou cometer contra mim um assassinato da alma.","bib":true},{"id":"dick","titulo":"Dick","tipo":"Melanie Klein, 1930","texto":"Dick entra na sala sem olhar para mim nem para a babá, como se fôssemos móveis. Corre de um lado para o outro, sem brincar. Pego um trem grande e um pequeno e digo: trem papai, trem Dick. Ele empurra o pequeno até a janela e diz: estação. Digo: a estação é a mamãe; Dick está entrando na mamãe. Ele larga o trem, corre para o espaço entre as duas portas, se fecha ali e diz: escuro.","bib":true},{"id":"richard","titulo":"Richard","tipo":"Melanie Klein, 1961","texto":"Richard chega preocupado com as notícias: Hitler pode invadir. Abre o mapa e mostra os países que já caíram, depois desenha uma frota. Um navio grande é cercado por submarinos pequenos. Diz que tem medo dos meninos da rua e que só se sente seguro perto da mãe. No fim, pergunta se eu também tenho medo da guerra e se vou continuar vindo.","bib":true},{"id":"piggle","titulo":"The Piggle","tipo":"D. W. Winnicott, 1977","texto":"Os pais escrevem que, desde que a irmã nasceu, Gabrielle não é mais a mesma. Ela, que se chamava de Piggle, agora acorda de noite falando da mamãe preta e do babacar, e pede: me conta do babacar. Às vezes diz que é o bebê. Na primeira consulta, fica um tempo junto do pai, depois se aproxima dos brinquedos e examina cada um com cuidado.","bib":true},{"id":"aimee","titulo":"Aimée","tipo":"Jacques Lacan, 1932","texto":"Fiz o que fiz para proteger meu filho. Aquela atriz zombava de mim nos jornais e no palco, e tramava com escritores contra nós. Escrevi romances e mandei para a corte da Inglaterra, mas ninguém respondeu. Depois que fui presa, chorei por dias e o medo passou. É estranho: parece que, ao atacá-la, eu é que fui castigada.","bib":true},{"id":"bion-elo","titulo":"Ataques ao elo","tipo":"Wilfred R. Bion, 1959","texto":"O paciente começa: tenho pensado que eu… que talvez… A frase não termina. Ele ri, desvia o olhar e diz que esqueceu o que ia dizer. Quando faço um comentário sobre a interrupção, ele responde que ouviu um barulho na rua e que agora a cabeça está vazia. Depois, em silêncio, aperta as mãos.","bib":true},{"id":"emmy","titulo":"Emmy von N.","tipo":"Sigmund Freud, 1895","texto":"Fique quieto, não diga nada, não me toque! Desculpe, doutor, isso me escapa. Quando vejo bichos rastejando, a voz some e vem esse estalo na língua. Começou à cabeceira da minha filha doente: eu precisava ficar em silêncio para ela dormir, e foi justamente aí que o barulho saiu. Deixe-me contar o que tenho a dizer, sem me perguntar de onde vem cada coisa.","bib":true},{"id":"elisabeth","titulo":"Elisabeth von R.","tipo":"Sigmund Freud, 1895","texto":"As dores começam sempre no mesmo ponto da perna, eu conheço bem. Cuidei de papai até ele morrer, depois minha irmã adoeceu e também se foi. Quando o senhor aperta minha testa, às vezes não vem nada. Ou vem, e eu acho que não vale a pena dizer. Hoje veio a imagem do meu cunhado, mas isso não tem importância.","bib":true},{"id":"katharina","titulo":"Katharina","tipo":"Sigmund Freud, 1895","texto":"O senhor é médico? Eu tenho uma coisa nos nervos. Às vezes falta o ar, parece que vou sufocar, a cabeça martela e eu vejo um rosto horrível me olhando. Não sei de quem é. Começou quando eu vi pela janela o tio com a minha prima Franziska. Fiquei mal por dias. Depois me lembrei de coisas que ele tinha feito comigo antes, e que eu nem entendia.","bib":true},{"id":"rita","titulo":"Rita","tipo":"Melanie Klein, 1932","texto":"Na hora de dormir, Rita exige ser enrolada bem apertada no cobertor, senão chora. A boneca também precisa ser enrolada. Hoje, na sessão, ela pegou a boneca, embrulhou-a com força e disse que era o bebê. Depois parou de brincar, ficou triste sem motivo aparente e perguntou se eu gostava dela.","bib":true},{"id":"iiro","titulo":"Iiro","tipo":"D. W. Winnicott, 1971","texto":"Winnicott fecha os olhos e faz um traço ao acaso. Iiro olha, gira o papel e diz que é um pé de pato. Desenha a perna e a membrana entre os dedos. Depois é a vez dele de rabiscar, e ele ri quando Winnicott transforma o traço num bicho. Pede para jogar de novo e, num dos desenhos, fala do próprio pé.","bib":true},{"id":"papin","titulo":"As irmãs Papin","tipo":"Jacques Lacan, 1933","texto":"Christine conta ao juiz que, naquela noite, o ferro de passar queimou e a luz apagou. A patroa a repreendeu, e ela sentiu que as duas irmãs iam ser atacadas. Diz que não odiava ninguém. Na prisão, separada de Léa, para de comer e pede para vê-la.","bib":true},{"id":"mrz","titulo":"Sr. Z","tipo":"Heinz Kohut, 1979","texto":"Na segunda análise, Z volta a falar da mãe: ela o queria perto, dizia que ele era tudo para ela e, ao mesmo tempo, nunca o via de verdade. Ele conta que se sentia uma extensão dela. Diz que da primeira vez ouviu que estava preso aos próprios desejos infantis e se esforçou para aceitar isso, mas a sensação de vazio continuou.","bib":true}],"ESTUDO":{"freud":{"bio":"Sigmund Freud nasceu em 6 de maio de 1856 em Freiberg (hoje Příbor, na Morávia) e morreu em 23 de setembro de 1939 em Londres, onde se exilou fugindo do nazismo. Formou-se em medicina pela Universidade de Viena, onde trabalhou com neurologia, e estagiou com Charcot em Paris. Criou a psicanálise como teoria do inconsciente, método de investigação e técnica de tratamento pela associação livre e pela interpretação.","conceitos":[{"termo":"Inconsciente","def":"Sistema psíquico regido por leis próprias (deslocamento, condensação, ausência de contradição), cujos conteúdos, sobretudo recalcados, não chegam à consciência, mas retornam em sonhos, sintomas, atos falhos e chistes.","onde_ler":"A interpretação dos sonhos (1900); O inconsciente (1915)","clinica":"O inconsciente aparece nas brechas do discurso: um paciente que diz querer o divórcio troca o nome da esposa pelo da mãe, e a sessão passa a girar em torno desse lapso.","nao_confundir":"Não é o mesmo que o simplesmente não pensado no momento, que Freud chama de pré-consciente e que pode voltar à consciência sem resistência.","outras_escolas":"Lacan relê o inconsciente como estruturado como uma linguagem, deslocando o acento das representações recalcadas para a cadeia de significantes.","original":"das Unbewusste"},{"termo":"Pulsão (Trieb)","def":"Conceito-limite entre o psíquico e o somático: uma força constante de origem corporal que exige trabalho psíquico e busca satisfação por objetos variáveis.","onde_ler":"Três ensaios sobre a teoria da sexualidade (1905); As pulsões e seus destinos (1915)","clinica":"Na sessão, a pulsão não aparece diretamente, mas pelos seus representantes: uma paciente que fala de comer compulsivamente quando se sente só revela um objeto que substitui outro.","nao_confundir":"Pulsão não é instinto: o instinto tem objeto fixo e comportamento hereditário, enquanto a pulsão tem objeto contingente e destinos variáveis.","outras_escolas":"Em uma leitura corrente da escola das relações de objeto, como em Fairbairn, a libido busca o objeto antes do prazer, o que relativiza o primado pulsional freudiano.","original":"Trieb"},{"termo":"Recalque","def":"Mecanismo de defesa que mantém fora da consciência representações ligadas a pulsões cuja satisfação geraria desprazer.","onde_ler":"O recalque (1915); O inconsciente (1915)","clinica":"O recalcado retorna no sintoma: um paciente que não lembra nada de um período da infância passa a ter crises de angústia sempre que vai à casa onde morou nessa época.","nao_confundir":"Recalque não é repressão consciente nem supressão voluntária de um pensamento: é um processo inconsciente que o sujeito não percebe realizar.","outras_escolas":"Lacan distingue o recalque, próprio da neurose, da foraclusão, própria da psicose, em que o significante nunca chega a ser inscrito.","original":"Verdrängung"},{"termo":"Complexo de Édipo","def":"Conjunto de desejos amorosos e hostis da criança em relação aos pais, que organiza a sexualidade, a identificação e a formação do supereu.","onde_ler":"A interpretação dos sonhos (1900); A dissolução do complexo de Édipo (1924)","clinica":"Um homem que sempre se apaixona por mulheres comprometidas e se sabota diante de chefes pode estar repetindo uma rivalidade edípica não elaborada.","nao_confundir":"O Édipo não é um acontecimento real de desejo literal pelos pais, mas uma estrutura de desejos e interdições que organiza o sujeito.","outras_escolas":"Klein antecipa o Édipo para o primeiro ano de vida, ligado à posição depressiva, e Lacan o relê como operação simbólica da metáfora paterna.","original":"Ödipuskomplex"},{"termo":"Transferência","def":"Repetição, na relação com o analista, de desejos e protótipos afetivos infantis, que se torna motor e obstáculo do tratamento.","onde_ler":"A dinâmica da transferência (1912); Observações sobre o amor transferencial (1915)","clinica":"Uma paciente passa a esperar que o analista a critique a cada atraso, como fazia o pai, e esse temor, tomado como material, abre o acesso à história dela.","nao_confundir":"Transferência não é só sentir afeto pelo analista: ela inclui hostilidade, desconfiança e indiferença, e está presente em toda relação, não apenas na análise.","outras_escolas":"Klein amplia a transferência para a situação total, que inclui as fantasias e defesas atuais com o analista, e Lacan a articula ao sujeito suposto saber.","original":"Übertragung"},{"termo":"Id, eu e supereu","def":"Segunda tópica (1923): o id é o polo pulsional, o eu media entre as exigências internas e a realidade, e o supereu é a instância crítica herdada do Édipo.","onde_ler":"O eu e o id (1923); Novas conferências introdutórias à psicanálise (1933)","clinica":"Um paciente que se pune com fracassos logo após conquistas mostra um supereu severo, e a escuta procura em nome de quem ele se condena.","nao_confundir":"As três instâncias não são partes do cérebro nem equivalem a inconsciente, pré-consciente e consciente: o eu e o supereu também são em parte inconscientes.","outras_escolas":"A psicologia do ego norte-americana, com Hartmann, valorizou um eu autônomo e adaptativo, leitura que Lacan contestou ao definir o eu como instância imaginária.","original":"Es, Ich, Über-Ich"},{"termo":"Angústia","def":"Afeto de desprazer diante de um perigo; primeiro vista como libido recalcada transformada, depois, em 1926, como sinal que o eu emite e que põe o recalque em marcha.","onde_ler":"Inibição, sintoma e angústia (1926); Conferência XXXII: Angústia e vida pulsional (1933)","clinica":"Um paciente relata aperto no peito antes de toda viagem, e a análise liga esse sinal a uma ameaça de separação que ele não consegue nomear.","nao_confundir":"Angústia não é o mesmo que medo: o medo tem objeto definido, a angústia diz respeito a um perigo indeterminado ou interno.","outras_escolas":"Lacan afirma no seminário sobre a angústia que ela não é sem objeto, ligando-a à aproximação do objeto a.","original":"Angst"},{"termo":"Narcisismo","def":"Investimento libidinal do próprio eu; Freud distingue o narcisismo primário, anterior aos objetos, do secundário, em que a libido retirada dos objetos retorna ao eu.","onde_ler":"Introdução ao narcisismo (1914); Luto e melancolia (1917)","clinica":"Uma paciente que se desorganiza diante de qualquer crítica e precisa ser admirada pelo analista revela a fragilidade do investimento narcísico do eu.","nao_confundir":"Narcisismo na psicanálise não é sinônimo de vaidade ou de transtorno de personalidade: é uma etapa e uma dimensão estrutural de todo sujeito.","outras_escolas":"Kohut, na psicologia do self, trata o narcisismo como linha de desenvolvimento própria e saudável, e não apenas como retração da libido objetal.","original":"Narzissmus"},{"termo":"Pulsão de morte","def":"Tendência à redução das tensões a zero e ao retorno ao inorgânico, oposta a Eros (1920); manifesta-se na compulsão à repetição, no masoquismo e na agressividade.","onde_ler":"Além do princípio do prazer (1920); O mal-estar na civilização (1930)","clinica":"Um paciente que destrói sistematicamente cada melhora, como se o bem-estar fosse insuportável, leva o analista a pensar numa reação terapêutica negativa.","nao_confundir":"Pulsão de morte não é desejo consciente de morrer nem se reduz à agressividade: é um princípio que atua silenciosamente, em geral fundido a Eros.","outras_escolas":"Klein faz da pulsão de morte a fonte da angústia primária e da inveja, enquanto Winnicott recusa a noção e pensa a agressividade como parte da motilidade e da vitalidade.","original":"Todestrieb"},{"termo":"Compulsão à repetição","def":"Tendência a repetir experiências penosas em vez de recordá-las; na transferência, o paciente repete em ato o que não pode lembrar (Recordar, repetir e elaborar, 1914).","onde_ler":"Recordar, repetir e elaborar (1914); Além do princípio do prazer (1920)","clinica":"Uma paciente encerra todos os vínculos no mesmo ponto em que foi abandonada na infância e, na análise, começa a faltar justamente quando a relação se aprofunda.","nao_confundir":"Não é hábito nem simples costume: a repetição insiste além do princípio do prazer e reproduz justamente o que fez sofrer.","outras_escolas":"Lacan distingue a repetição como automatismo da cadeia significante e como encontro faltoso com o real, retomando as noções aristotélicas de automaton e tiquê.","original":"Wiederholungszwang"},{"termo":"A posteriori (Nachträglichkeit)","def":"Experiências e marcas antigas são remanejadas depois, ganhando sentido e eficácia psíquica a partir de vivências posteriores; por isso o trauma se constitui em dois tempos.","onde_ler":"Projeto para uma psicologia científica (1895); História de uma neurose infantil (1918)","clinica":"Uma cena infantil que não teve peso na época torna-se traumática quando, na adolescência, uma nova experiência lhe dá significação sexual.","nao_confundir":"Não é uma simples lembrança tardia nem uma causalidade linear do passado sobre o presente: o depois também reescreve o antes.","outras_escolas":"Lacan resgatou o termo, esquecido em leituras anglo-saxãs, e Laplanche fez dele peça central da teoria da sedução generalizada.","original":"Nachträglichkeit"},{"termo":"Contratransferência","def":"Reações inconscientes do analista ao paciente e à transferência; para Freud, obstáculo a trabalhar na própria análise; após Paula Heimann (1950), também instrumento de compreensão.","onde_ler":"As perspectivas futuras da terapêutica psicanalítica (1910); Recomendações ao médico que pratica a psicanálise (1912)","clinica":"O analista percebe que sente sono sempre que certo paciente fala da mãe e, em vez de agir, registra o fenômeno como pista do que ali está sendo evitado.","nao_confundir":"Contratransferência não é qualquer opinião ou simpatia do analista, nem autoriza que ele relate ao paciente seus próprios sentimentos.","outras_escolas":"Lacan critica o uso da contratransferência como instrumento e prefere falar no desejo do analista, situando o problema no lugar que ele ocupa, não nos seus afetos.","original":"Gegenübertragung"}],"obras":[{"titulo":"A interpretação dos sonhos","ano":1900,"edicao":"Companhia das Letras, Obras completas, v. 4, 2019, trad. Paulo César de Souza","nivel":"avançado","ed":{"editora":"Companhia das Letras","local":"São Paulo","ano":"2019","volume":"Obras completas, v. 4 (1900)","tradutor":"Paulo César de Souza","isbn":"978-85-359-3221-8"},"verif":{"status":"conferida","fonte":"https://www.companhiadasletras.com.br/livro/9788535932218/freud-1900-obras-completas-volume-4","nota":""},"porque_nivel":"Obra longa e técnica, com a teoria do aparelho psíquico no cap. 7.","autentica":{"titulo":"A interpretação do sonho (Capa Dura)","ano":"2025","fonte":"https://www.grupoautentica.com.br/produto/a-interpretacao-do-sonho-capa-dura-1795"},"original":{"titulo":"Die Traumdeutung","url":"https://projekt-gutenberg.org/authors/sigmund-freud/books/sigmund-freud-die-traumdeutung"}},{"titulo":"Três ensaios sobre a teoria da sexualidade","ano":1905,"edicao":"Companhia das Letras, Obras completas, v. 6 (1901-1905), 2016, trad. Paulo César de Souza","nivel":"intermediário","ed":{"editora":"Companhia das Letras","local":"São Paulo","ano":"2016","volume":"Obras completas, v. 6 (1901-1905)","tradutor":"Paulo César de Souza","isbn":"978-85-359-2783-2"},"verif":{"status":"conferida","fonte":"https://www.companhiadasletras.com.br/livro/9788535927832/freud-1901-1905-obras-completas-volume-6","nota":"Volume: Três ensaios sobre a teoria da sexualidade, análise fragmentária de uma histeria (\"O caso Dora\") e outros textos. Sem volume equivalente localizado na Autêntica."},"porque_nivel":"Texto denso e muito revisto, que pede noções prévias de pulsão e desenvolvimento libidinal.","original":{"titulo":"Drei Abhandlungen zur Sexualtheorie","url":"https://projekt-gutenberg.org/authors/sigmund-freud/books/sigmund-freud-drei-abhandlungen-zur-sexualtheorie"}},{"titulo":"Conferências introdutórias à psicanálise","ano":1917,"edicao":"Companhia das Letras, Obras completas, v. 13 (1916-1917), trad. Paulo César de Souza","nivel":"intermediário","ed":{"editora":"Companhia das Letras","local":"São Paulo","ano":"2014","volume":"Obras completas, v. 13 (1916-1917)","tradutor":"Sergio Tellaroli","isbn":"978-85-359-2419-0"},"verif":{"status":"conferida","fonte":"https://www.companhiadasletras.com.br/livro/9788535924190/freud-1916-1917-obras-completas-volume-13","nota":"Correção: o tradutor deste volume é Sergio Tellaroli, não Paulo César de Souza. Ano da edição: 2014."},"porque_nivel":"Didático, mas extenso (28 conferências); bom para ler por partes após uma primeira introdução.","original":{"titulo":"Vorlesungen zur Einführung in die Psychoanalyse","url":"https://projekt-gutenberg.org/authors/sigmund-freud/books/sigmund-freud-vorlesungen-zur-einfuehrung-in-die-psychoanalyse"}},{"titulo":"Introdução ao narcisismo e ensaios de metapsicologia","ano":1914,"edicao":"Companhia das Letras, Obras completas, v. 12 (1914-1916), 2010, trad. Paulo César de Souza","nivel":"avançado","ed":{"editora":"Companhia das Letras","local":"São Paulo","ano":"2010","volume":"Obras completas, v. 12 (1914-1916)","tradutor":"Paulo César de Souza","isbn":"978-85-359-1606-5"},"verif":{"status":"conferida","fonte":"https://www.companhiadasletras.com.br/livro/9788535916065/freud-1914-1916-obras-completas-volume-12","nota":"Autêntica: só 'As pulsões e seus destinos' (um dos ensaios de metapsicologia) saiu na coleção, em volume bilíngue; não há volume com o conjunto."},"porque_nivel":"Textos metapsicológicos abstratos, que supõem domínio da primeira tópica.","autentica":{"titulo":"As pulsões e seus destinos Edição bilíngue","ano":"2013","fonte":"https://www.grupoautentica.com.br/produto/as-pulsoes-e-seus-destinos-edicao-bilingue-1248"},"original":{"titulo":"Zur Einführung des Narzißmus","url":"https://projekt-gutenberg.org/authors/sigmund-freud/books/kleine-schriften-ii/chapter/9"}},{"titulo":"O mal-estar na civilização","ano":1930,"edicao":"Companhia das Letras, Obras completas, v. 18 (1930-1936), 2010, trad. Paulo César de Souza","nivel":"intermediário","ed":{"editora":"Companhia das Letras","local":"São Paulo","ano":"2010","volume":"Obras completas, v. 18 (1930-1936)","tradutor":"Paulo César de Souza","isbn":"978-85-359-1743-7"},"verif":{"status":"conferida","fonte":"https://www.companhiadasletras.com.br/livro/9788535917437/freud-1930-1936-obras-completas-volume-18","nota":"Subtítulo do volume na editora: O mal-estar na civilização e outros textos."},"porque_nivel":
