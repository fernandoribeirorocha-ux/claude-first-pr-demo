<style>
/* Layout: cabeçalho fino, abas de modo, área central de estudo com figura ou cartão grande */
:root{--bg:#f7faf9;--panel:#ffffff;--ink:#12263a;--mute:#5b6b7a;--line:#d5dee6;--acc:#0b7a5e;--acc2:#08bd8a;--ok:#0b7a5e;--bad:#d64933;--warn:#e9a23b;--chip:#e6f1ee;
--serif:'Source Serif 4',Cambria,Georgia,serif;--sans:'Source Sans 3',Calibri,system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1b27;--panel:#162637;--ink:#e8eff5;--mute:#9db0c0;--line:#2a3f54;--acc:#3ddbb0;--acc2:#08bd8a;--ok:#3ddbb0;--bad:#ff7a64;--warn:#f0b35a;--chip:#1c3347;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1b27;--panel:#162637;--ink:#e8eff5;--mute:#9db0c0;--line:#2a3f54;--acc:#3ddbb0;--acc2:#08bd8a;--ok:#3ddbb0;--bad:#ff7a64;--warn:#f0b35a;--chip:#1c3347;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:17px/1.5 var(--sans);padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px}
main{max-width:860px;margin:0 auto}
header{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:6px 16px;margin-bottom:14px}
h1{font:700 30px/1.15 var(--serif);margin:0;text-wrap:balance}
.sub{color:var(--mute);font-size:14px}
nav{display:flex;gap:6px;margin:14px 0 18px;border-bottom:1px solid var(--line)}
nav button{font:600 16px var(--sans);background:none;border:0;border-bottom:3px solid transparent;color:var(--mute);padding:10px 14px;cursor:pointer;min-height:44px}
nav button[aria-selected=true]{color:var(--ink);border-bottom-color:var(--acc2)}
button:focus-visible{outline:3px solid var(--acc2);outline-offset:2px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:22px}
.meta{display:flex;justify-content:space-between;gap:10px;color:var(--mute);font-size:14px;margin-bottom:12px;flex-wrap:wrap}
.q{font:600 24px/1.3 var(--serif);margin:0 0 16px;text-wrap:balance}
.ans{border-top:1px solid var(--line);padding-top:14px;margin-top:6px;font-size:18px}
.src{color:var(--mute);font-size:13px;margin-top:8px}
.btn{font:600 16px var(--sans);border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:10px 16px;border-radius:8px;cursor:pointer;min-height:44px}
.btn.p{background:var(--acc);color:#fff;border-color:var(--acc)}
:root[data-theme="dark"] .btn.p{color:#0f1b27}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.p{color:#0f1b27}}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.opt{display:block;width:100%;text-align:left;font:17px var(--sans);background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin-top:8px;cursor:pointer;min-height:44px}
.opt:hover:not(:disabled){border-color:var(--acc2)}
.opt.ok{border-color:var(--ok);background:var(--chip);font-weight:600}
.opt.bad{border-color:var(--bad)}
.opt .why{display:block;font-size:15px;color:var(--mute);margin-top:6px;font-weight:400}
.opt .mk{display:inline-block;min-width:1.4em;font-weight:700}
.opt.ok .mk{color:var(--ok)}.opt.bad .mk{color:var(--bad)}
.opt.pick{outline:2px solid var(--ink);outline-offset:1px}
.opt:disabled{cursor:default;color:var(--ink)}
.fb{margin-top:14px;padding:12px 14px;border-left:4px solid var(--acc2);background:var(--chip);border-radius:0 8px 8px 0}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:14px}
.bar i{display:block;height:100%;background:var(--acc2);width:0;transition:width .25s}
.fig{display:block;margin:0 auto 14px;max-width:100%;max-height:420px;border-radius:6px;background:#fff}
.lv{display:inline-block;background:var(--chip);border-radius:20px;padding:2px 10px;font-size:13px}
.score{font:700 44px var(--serif)}
.flt{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.flt button{font:600 14px var(--sans);border:1px solid var(--line);background:var(--panel);color:var(--mute);padding:6px 12px;border-radius:20px;cursor:pointer;min-height:36px}
.flt button[aria-pressed=true]{background:var(--acc);color:#fff;border-color:var(--acc)}
:root[data-theme="dark"] .flt button[aria-pressed=true]{color:#0f1b27}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .flt button[aria-pressed=true]{color:#0f1b27}}
.note{font-size:13px;color:var(--mute);margin-top:18px}
@media (max-width:520px){h1{font-size:25px}.q{font-size:21px}nav button{padding:10px 8px;font-size:15px}.card{padding:16px}}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}

<header><h1>Anatomia Interativa</h1><span class="sub">Aula de Thais Catan, Uni Ítalo · material de estudo pessoal</span></header>
<nav role="tablist"><button role="tab" id="t-fc" aria-selected="true">Cartões</button><button role="tab" id="t-qz" aria-selected="false">Simulado</button><button role="tab" id="t-at" aria-selected="false">Atlas</button></nav>

<p class="note">Cartões, questões e comentários foram elaborados a partir do conteúdo da aula; as figuras são as do deck original. Itens marcados "a confirmar" dependem de checagem com a professora.</p>

<script>
const D={"cards": [{"f": "O que significa a palavra anatomia, segundo a aula?", "v": "Do grego anatome: ana = em partes, tomein = cortar. Em latim, dissecare (dis = separadamente, secare = cortar). Etimologia conforme o material, a confirmar.", "s": "Aula Anatomia básica (Catan), slide 2", "n": "Nível 1 - lembrar"}, {"f": "Como a aula define Anatomia?", "v": "Ciência que estuda a estrutura e a forma do corpo.", "s": "Aula Anatomia básica (Catan), slide 2", "n": "Nível 1 - lembrar"}, {"f": "Qual abreviação indica o plural de nervo?", "v": "Nn. (N. = nervo).", "s": "Aula Anatomia básica (Catan), slide 3", "n": "Nível 1 - lembrar"}, {"f": "Quais abreviações a aula lista, e para quê servem?", "v": "A./Aa. artéria(s); Lig./Ligg. ligamento(s); M./Mm. músculo(s); N./Nn. nervo(s); R./Rr. ramo(s); V./Vv. veia(s). Uniformizam a nomenclatura.", "s": "Aula Anatomia básica (Catan), slide 3", "n": "Nível 1 - lembrar"}, {"f": "Quais são os fatores de variação listados?", "v": "Idade, sexo, etnia, biotipo e evolução.", "s": "Aula Anatomia básica (Catan), slide 4", "n": "Nível 1 - lembrar"}, {"f": "Como a aula descreve o brevilíneo?", "v": "Indivíduo baixo e forte, com o tronco prevalecendo sobre os membros.", "s": "Aula Anatomia básica (Catan), slide 6", "n": "Nível 1 - lembrar"}, {"f": "Como a aula descreve o longilíneo?", "v": "Indivíduo alto e magro, com os membros prevalecendo sobre o tronco.", "s": "Aula Anatomia básica (Catan), slide 6", "n": "Nível 1 - lembrar"}, {"f": "Como a aula descreve o normolíneo?", "v": "Indivíduo atlético, com proporções intermediárias entre o brevilíneo e o longilíneo.", "s": "Aula Anatomia básica (Catan), slide 6", "n": "Nível 1 - lembrar"}, {"f": "Quais são os seis elementos da posição anatômica?", "v": "Ereta; face para a frente; olhar no horizonte; membros superiores pendentes ao longo do corpo; palma da mão para a frente; membros inferiores unidos, pontas dos pés para a frente.", "s": "Aula Anatomia básica (Catan), slide 9", "n": "Nível 1 - lembrar"}, {"f": "Quais são os três planos de secção?", "v": "Sagital/mediano, frontal/coronal e transversal.", "s": "Aula Anatomia básica (Catan), slide 12", "n": "Nível 1 - lembrar"}, {"f": "Quais são os três decúbitos?", "v": "Ventral, dorsal e lateral.", "s": "Aula Anatomia básica (Catan), slide 15", "n": "Nível 1 - lembrar"}, {"f": "Quais são os três cortes dos membros?", "v": "Longitudinal, transverso e oblíquo.", "s": "Aula Anatomia básica (Catan), slide 14", "n": "Nível 1 - lembrar"}, {"f": "Quais são os termos de profundidade?", "v": "Superficial, intermédio e profundo.", "s": "Aula Anatomia básica (Catan), slide 16", "n": "Nível 1 - lembrar"}, {"f": "O que a cavidade dorsal contém?", "v": "Cavidade craniana (encéfalo) e canal vertebral (medula espinal).", "s": "Aula Anatomia básica (Catan), slide 23", "n": "Nível 1 - lembrar"}, {"f": "O que o plano sagital/mediano divide, e qual eixo se associa a ele?", "v": "Divide o corpo em direita e esquerda. Eixo látero-lateral.", "s": "Aula Anatomia básica (Catan), slide 12, 13", "n": "Nível 2 - compreender"}, {"f": "O que o plano frontal/coronal divide, e qual eixo se associa a ele?", "v": "Divide em anterior (frontal) e posterior (dorsal). Eixo ântero-posterior.", "s": "Aula Anatomia básica (Catan), slide 12, 13", "n": "Nível 2 - compreender"}, {"f": "O que o plano transversal divide, e qual eixo se associa a ele?", "v": "Divide em superior e inferior. Eixo longitudinal (crânio-caudal).", "s": "Aula Anatomia básica (Catan), slide 12, 13", "n": "Nível 2 - compreender"}, {"f": "Defina proximal e distal.", "v": "Proximal: estrutura mais próxima do cíngulo do membro ou do tronco. Distal: mais distante dele.", "s": "Aula Anatomia básica (Catan), slide 20", "n": "Nível 2 - compreender"}, {"f": "Defina medial e lateral.", "v": "Medial: mais próxima do plano mediano. Lateral: mais distante do plano mediano (definição do slide 20).", "s": "Aula Anatomia básica (Catan), slide 20", "n": "Nível 2 - compreender"}, {"f": "Defina ipsilateral e contralateral.", "v": "Ipsilateral: mesmo lado. Contralateral: lado contrário.", "s": "Aula Anatomia básica (Catan), slide 17", "n": "Nível 2 - compreender"}, {"f": "Qual a diferença entre unilateral e bilateral?", "v": "Unilateral: direito ou esquerdo. Bilateral: direito e esquerdo.", "s": "Aula Anatomia básica (Catan), slide 17", "n": "Nível 2 - compreender"}, {"f": "Defina cranial e caudal.", "v": "Cranial (superior): estrutura mais próxima do crânio. Caudal (inferior): mais próxima dos pés.", "s": "Aula Anatomia básica (Catan), slide 18", "n": "Nível 2 - compreender"}, {"f": "Para que servem as cavidades do corpo?", "v": "São espaços internos, separados por ossos, músculos ou ligamentos, que auxiliam na proteção, separação e sustentação dos órgãos internos.", "s": "Aula Anatomia básica (Catan), slide 22", "n": "Nível 2 - compreender"}, {"f": "Qual é o papel do diafragma na cavidade torácica e na abdominopélvica?", "v": "Na torácica, é o assoalho (limite inferior). Na abdominopélvica, é o limite superior.", "s": "Aula Anatomia básica (Catan), slide 24, 25", "n": "Nível 2 - compreender"}, {"f": "O que o corpo real tem em comum com os livros de anatomia, e onde difere?", "v": "Os livros padronizam o corpo. Na prática há variação em ossos, músculos, veias, artérias e nervos.", "s": "Aula Anatomia básica (Catan), slide 5", "n": "Nível 2 - compreender"}, {"f": "Quais segmentos compõem o tronco?", "v": "Tórax, abdome e região pélvica (com o períneo).", "s": "Aula Anatomia básica (Catan), slide 11", "n": "Nível 2 - compreender"}, {"f": "Por que a variação individual importa na prática clínica, segundo a aula?", "v": "Precisa ser levada em conta no exame físico, no diagnóstico e no tratamento.", "s": "Aula Anatomia básica (Catan), slide 5", "n": "Nível 3 - aplicar e criticar"}, {"f": "Diferencie variação anatômica, anomalia e monstruosidade.", "v": "Variação: padrão de forma ou disposição, os mais comuns. Anomalia: variação morfológica com perturbação funcional (ex.: fenda labial e palatina). Monstruosidade: alteração de estrutura e função, em geral incompatível com a vida (ex.: anencefalia). Termo 'monstruosidade' a confirmar.", "s": "Aula Anatomia básica (Catan), slide 8", "n": "Nível 3 - aplicar e criticar"}, {"f": "Um corte passa pelo meio do corpo e separa as costas da frente. Qual plano é, e qual eixo o atravessa?", "v": "Plano frontal (coronal). Eixo ântero-posterior.", "s": "Aula Anatomia básica (Catan), slide 12, 13", "n": "Nível 3 - aplicar e criticar"}, {"f": "O joelho direito e o quadril direito estão em que relação de lateralidade? E joelho direito e ombro esquerdo?", "v": "Ipsilateral (mesmo lado). Contralateral (lados contrários).", "s": "Aula Anatomia básica (Catan), slide 17", "n": "Nível 3 - aplicar e criticar"}, {"f": "O cotovelo é proximal ou distal em relação ao punho?", "v": "Proximal: está mais perto do cíngulo do membro superior (ombro). Aplicação dos conceitos do slide 20.", "s": "Aula Anatomia básica (Catan), slide 20", "n": "Nível 3 - aplicar e criticar"}, {"f": "Uma pessoa deitada com a barriga para cima está em qual decúbito?", "v": "Decúbito dorsal (costas para baixo). Derivação a partir do nome; confirmar a figura do slide 15.", "s": "Aula Anatomia básica (Catan), slide 15", "n": "Nível 3 - aplicar e criticar"}, {"f": "Por que o material define 'lateral' de duas formas, nos slides 18 e 20?", "v": "No slide 18, lateral = direita e esquerda (lado). No slide 20, lateral = mais distante do plano mediano (posição relativa). Use a do slide 20 para relação de posição. Tensão do próprio material.", "s": "Aula Anatomia básica (Catan), slide 18, 20", "n": "Nível 3 - aplicar e criticar"}, {"f": "O slide 5 rotula 'variação genética' como (Anomalias). Isso é coerente com o slide 8?", "v": "Não totalmente: o slide 8 separa variação anatômica, anomalia e monstruosidade. Usar as definições do slide 8.", "s": "Aula Anatomia básica (Catan), slide 5, 8", "n": "Nível 3 - aplicar e criticar"}, {"f": "Dos cinco fatores de variação do slide 4, quantos a aula desenvolve? Qual?", "v": "Apenas um: o biotipo (slide 6). Idade, sexo, etnia e evolução ficam sem desenvolvimento.", "s": "Aula Anatomia básica (Catan), slide 4, 6", "n": "Nível 3 - aplicar e criticar"}, {"f": "Compare os três planos: o que divide cada um e qual eixo se associa.", "v": "Sagital: D/E, látero-lateral. Frontal: A/P, ântero-posterior. Transversal: S/I, longitudinal.", "s": "Aula Anatomia básica (Catan), slide 12, 13", "n": "Comparação"}, {"f": "Compare proximal/distal com medial/lateral: qual a referência de cada par?", "v": "Proximal/distal: o cíngulo do membro ou o tronco. Medial/lateral: o plano mediano.", "s": "Aula Anatomia básica (Catan), slide 20", "n": "Comparação"}, {"f": "Compare ipsilateral e contralateral com unilateral e bilateral.", "v": "Unilateral/bilateral dizem quantos lados (um, ou os dois). Ipsilateral/contralateral comparam dois pontos: mesmo lado ou lados opostos.", "s": "Aula Anatomia básica (Catan), slide 17", "n": "Comparação"}, {"f": "Compare a cavidade torácica e a abdominopélvica.", "v": "Separadas pelo diafragma: ele é o assoalho da torácica e o limite superior da abdominopélvica. A abdominopélvica tem porção abdominal e porção pélvica.", "s": "Aula Anatomia básica (Catan), slide 24, 25", "n": "Comparação"}], "mc": [{"q": "A palavra anatomia vem do grego anatome. Segundo a aula, tomein significa:", "o": ["unir", "cortar", "medir", "descrever"], "c": 1, "e": "ana = em partes; tomein = cortar. Etimologia conforme o material, ainda a confirmar em dicionário etimológico.", "x": ["Errada. Na aula, tomein é cortar. Unir iria no sentido contrário ao da origem do nome, que remete ao ato de cortar para ver.", "Correta. ana = em partes e tomein = cortar; em latim, dissecare (dis = separadamente, secare = cortar). Etimologia conforme o material, ainda a confirmar.", "Errada. Medir não faz parte da origem do termo apresentada na aula.", "Errada. Descrever é o que a anatomia faz depois de abrir e separar as partes; não é o sentido de tomein."]}, {"q": "Qual é a abreviação do plural de músculo?", "o": ["M.", "Mm.", "Mus.", "Ms."], "c": 1, "e": "Inicial com ponto no singular (M.), letra dobrada no plural (Mm.). Vale igual para A./Aa., N./Nn., R./Rr., V./Vv. e Lig./Ligg.", "x": ["Errada. M. é a abreviação do singular (músculo). O plural dobra a letra.", "Correta. Inicial com ponto no singular (M.) e letra dobrada no plural (Mm.). Mesma regra de A./Aa., N./Nn., R./Rr., V./Vv. e Lig./Ligg.", "Errada. Essa forma não é a usada na aula; a padronização é pela inicial.", "Errada. Não é a abreviação padronizada na aula."]}, {"q": "Dos cinco fatores de variação (idade, sexo, etnia, biotipo, evolução), qual é desenvolvido em detalhe na aula?", "o": ["Idade", "Etnia", "Biotipo", "Evolução"], "c": 2, "e": "Só o biotipo é desenvolvido. Os outros quatro são apenas listados, lacuna do original.", "x": ["Errada. Idade aparece só na lista dos cinco fatores, sem desenvolvimento (lacuna do original).", "Errada. Etnia também só aparece na lista, sem desenvolvimento.", "Correta. É o único fator desenvolvido: os três biotipos (brevilíneo, longilíneo, normolíneo).", "Errada. Evolução é apenas listada, sem desenvolvimento."]}, {"q": "O biotipo em que o tronco prevalece sobre os membros é o:", "o": ["longilíneo", "brevilíneo", "normolíneo", "atlético"], "c": 1, "e": "Brevilíneo: baixo e forte, tronco sobre membros. Longilíneo: alto e magro, membros sobre tronco. Normolíneo (atlético): proporções intermediárias.", "x": ["Errada. Longilíneo é o inverso: alto e magro, com os membros prevalecendo sobre o tronco.", "Correta. Brevilíneo: baixo e forte, tronco prevalecendo sobre os membros.", "Errada. Normolíneo tem proporções intermediárias entre os dois extremos.", "Errada. Atlético é o outro nome do normolíneo na aula, portanto também intermediário."]}, {"q": "Variação morfológica acompanhada de perturbação funcional, como a fenda labial e palatina, chama-se:", "o": ["variação anatômica", "anomalia", "monstruosidade", "biotipo"], "c": 1, "e": "Variação anatômica = padrão de forma ou disposição, os mais comuns. Anomalia = com perturbação funcional. Monstruosidade = em geral incompatível com a vida (termo da aula, a confirmar com a professora).", "x": ["Errada. Variação anatômica é padrão de forma ou disposição, entre os mais comuns, sem perturbação funcional.", "Correta. Anomalia é variação morfológica com perturbação funcional; o exemplo da aula é a fenda labial e palatina.", "Errada. Monstruosidade (termo da aula, a confirmar) é alteração de estrutura e função em geral incompatível com a vida, como a anencefalia. É mais grave que anomalia.", "Errada. Biotipo descreve proporções do corpo (tronco e membros), não desvio funcional."]}, {"q": "Na posição anatômica:", "o": ["a palma da mão fica voltada para trás", "o olhar se dirige ao horizonte e a palma da mão fica voltada para a frente", "os membros superiores ficam elevados", "os pés ficam voltados para fora"], "c": 1, "e": "Ereto, face e olhar à frente (horizonte), membros superiores pendentes, palma para a frente, membros inferiores unidos com pontas dos pés para a frente.", "x": ["Errada. A palma fica voltada para a frente, não para trás.", "Correta. Olhar ao horizonte e palma da mão para a frente, em posição ereta.", "Errada. Os membros superiores ficam pendentes ao longo do corpo, não elevados.", "Errada. Os pés ficam juntos, com as pontas voltadas para a frente."]}, {"q": "O tronco é formado por:", "o": ["pescoço e tórax", "cabeça e abdome", "tórax, abdome e região pélvica (com o períneo)", "tórax e membros"], "c": 2, "e": "Os quatro segmentos: cabeça, pescoço (região cervical), tronco e membros.", "x": ["Errada. O pescoço (região cervical) é um segmento à parte, entre a cabeça e o tronco.", "Errada. A cabeça é outro segmento. O tronco não a inclui.", "Correta. O tronco é formado por tórax, abdome e região pélvica, com o períneo.", "Errada. Os membros são um segmento próprio, ligado ao tronco."]}, {"q": "O plano que divide o corpo em direita e esquerda é o:", "o": ["frontal", "transversal", "sagital (mediano)", "oblíquo"], "c": 2, "e": "Sagital: direita e esquerda. Frontal (coronal): anterior e posterior. Transversal: superior e inferior.", "x": ["Errada. Frontal (coronal) divide em anterior e posterior.", "Errada. Transversal divide em superior e inferior.", "Correta. Sagital (mediano) divide em direita e esquerda.", "Errada. Oblíquo não é um dos três planos da aula; aparece como tipo de corte de membro."]}, {"q": "O eixo associado ao plano transversal é o:", "o": ["látero-lateral", "ântero-posterior", "longitudinal (crânio-caudal)", "oblíquo"], "c": 2, "e": "Sagital: látero-lateral. Frontal: ântero-posterior. Transversal: longitudinal.", "x": ["Errada. Látero-lateral é o eixo associado ao plano sagital.", "Errada. Ântero-posterior é o eixo associado ao plano frontal.", "Correta. O plano transversal se associa ao eixo longitudinal (crânio-caudal).", "Errada. Oblíquo não é eixo da tabela de planos e eixos."]}, {"q": "Qual destes NÃO é um corte de membro mostrado na aula?", "o": ["longitudinal", "transverso", "oblíquo", "sagital"], "c": 3, "e": "A aula mostra cortes longitudinal, transverso e oblíquo. Sagital é plano do corpo, não corte de membro.", "x": ["Errada. Longitudinal é um dos cortes de membro mostrados.", "Errada. Transverso é um dos cortes mostrados.", "Errada. Oblíquo é um dos cortes mostrados.", "Correta. Sagital é um plano do corpo (direita e esquerda), não um corte de membro da aula."]}, {"q": "Para dizer quão perto da superfície do corpo está uma estrutura, usam-se os termos:", "o": ["superficial, intermédio e profundo", "proximal e distal", "medial e lateral", "cranial e caudal"], "c": 0, "e": "Profundidade: superficial, intermédio, profundo.", "x": ["Correta. Superficial, intermédio e profundo medem a distância da superfície do corpo.", "Errada. Proximal e distal medem a distância em relação ao cíngulo do membro ou ao tronco.", "Errada. Medial e lateral se referem ao plano mediano.", "Errada. Cranial e caudal se referem ao crânio e aos pés."]}, {"q": "Ipsilateral significa:", "o": ["dos dois lados", "de um lado só", "do mesmo lado", "do lado contrário"], "c": 2, "e": "Unilateral: um lado. Bilateral: os dois. Ipsilateral: mesmo lado. Contralateral: lado contrário.", "x": ["Errada. Dos dois lados é bilateral.", "Errada. De um lado só é unilateral.", "Correta. Ipsilateral é o mesmo lado.", "Errada. Lado contrário é contralateral."]}, {"q": "Proximal é a estrutura:", "o": ["mais distante do tronco", "mais próxima do cíngulo do membro ou do tronco", "mais próxima do plano mediano", "mais próxima dos pés"], "c": 1, "e": "Proximal x distal em relação ao cíngulo do membro ou ao tronco. Medial x lateral em relação ao plano mediano.", "x": ["Errada. Mais distante é distal, o oposto de proximal.", "Correta. Proximal: mais próxima do cíngulo do membro ou do tronco.", "Errada. Mais próxima do plano mediano é medial.", "Errada. Mais próxima dos pés é inferior ou caudal."]}, {"q": "Medial é o que está:", "o": ["mais próximo do plano mediano", "mais distante do plano mediano", "mais próximo do crânio", "mais profundo"], "c": 0, "e": "Medial: mais perto do plano sagital/mediano. Lateral: mais longe.", "x": ["Correta. Medial: mais próximo do plano sagital ou mediano.", "Errada. Mais distante do plano mediano é lateral.", "Errada. Mais próximo do crânio é cranial (superior).", "Errada. Profundidade é outro eixo de referência (superficial, intermédio, profundo)."]}, {"q": "A cavidade dorsal compreende:", "o": ["cavidade torácica e abdominal", "cavidade craniana e canal vertebral", "cavidade pélvica e abdominal", "somente o crânio"], "c": 1, "e": "Craniana (encéfalo) e canal vertebral (medula espinal).", "x": ["Errada. Torácica e abdominal pertencem à cavidade ventral.", "Correta. A cavidade dorsal tem a craniana (encéfalo) e o canal vertebral (medula espinal).", "Errada. Pélvica e abdominal pertencem à cavidade ventral.", "Errada. Falta o canal vertebral, que também compõe a dorsal."]}, {"q": "O diafragma é:", "o": ["o limite entre as cavidades craniana e vertebral", "o assoalho da cavidade torácica e limite superior da abdominopélvica", "parte da cavidade pélvica", "um órgão da cavidade dorsal"], "c": 1, "e": "Assoalho (limite inferior) da torácica; limite superior da abdominopélvica.", "x": ["Errada. Craniana e vertebral são da cavidade dorsal; o diafragma separa partes da ventral.", "Correta. Assoalho (limite inferior) da cavidade torácica e limite superior da abdominopélvica.", "Errada. Ele separa o tórax da região abdominopélvica; não é parte da pélvica.", "Errada. É estrutura da cavidade ventral, não da dorsal."]}, {"q": "Bilateral refere-se aos dois lados, direito e esquerdo.", "o": ["Verdadeiro", "Falso"], "c": 0, "e": "Bilateral: D e E.", "x": ["Correta. Bilateral são os dois lados, direito e esquerdo.", "Errada. A afirmação é verdadeira; bilateral é mesmo os dois lados."]}, {"q": "Superior ou cranial designa a estrutura mais próxima dos pés.", "o": ["Verdadeiro", "Falso"], "c": 1, "e": "Superior/cranial: mais próxima do crânio. Inferior/caudal: dos pés.", "x": ["Errada. Superior ou cranial é o que fica mais perto do crânio; o inverso é inferior ou caudal, perto dos pés.", "Correta. A frase troca a definição: perto dos pés é inferior ou caudal."]}, {"q": "Na posição anatômica, os membros superiores ficam pendentes ao longo do corpo.", "o": ["Verdadeiro", "Falso"], "c": 0, "e": "Também com a palma da mão para a frente.", "x": ["Correta. Membros superiores pendentes ao longo do corpo, com palma para a frente.", "Errada. A afirmação é verdadeira."]}, {"q": "O plano frontal divide o corpo em superior e inferior.", "o": ["Verdadeiro", "Falso"], "c": 1, "e": "Frontal (coronal): anterior e posterior. Superior e inferior é o transversal.", "x": ["Errada. Frontal divide em anterior e posterior, não em superior e inferior.", "Correta. Superior e inferior é o transversal."]} function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const tabs=['fc','qz','at'];
function show(k){tabs.forEach(t=>{$('#v-'+t).hidden=t!==k;$('#t-'+t).setAttribute('aria-selected',t===k)});try{location.hash=k}catch(e){}}
tabs.forEach(t=>$('#t-'+t).onclick=()=>show(t));
/* ---- Cartões ---- */
let fcLevel='Todos',fcDeck=[],fcI=0,fcShow=false;
const levels=['Todos',...[...new Set(D.cards.map(c=>c.n))]];
function fcBuild(){fcDeck=shuffle(D.cards.filter(c=>fcLevel==='Todos'||c.n===fcLevel));fcI=0;fcShow=false;fcRender()}
function fcRender(){
 const c=fcDeck[fcI];
 let h='<div class="flt">'+levels.map(l=>`<button aria-pressed="${l===fcLevel}" data-l="${esc(l)}">${esc(l.replace(' - ',': '))}</button>`).join('')+'</div>';
 h+=`<div class="bar"><i style="width:${(fcI+1)/fcDeck.length*100}%"></i></div><div class="card"><div class="meta"><span class="lv">${esc(c.n)}</span><span>${fcI+1} de ${fcDeck.length}</span></div><p class="q">${esc(c.f)}</p>`;
 if(fcShow)h+=`<div class="ans">${esc(c.v)}<div class="src">${esc(c.s)}</div></div>`;
 h+='<div class="row">'+(fcShow?'<button class="btn" id="fc-prev">Anterior</button><button class="btn p" id="fc-next">Próximo</button>':'<button class="btn p" id="fc-rev">Mostrar resposta</button>')+'<button class="btn" id="fc-shuf">Embaralhar</button></div></div>';
 $('#v-fc').innerHTML=h;
 document.querySelectorAll('#v-fc .flt button').forEach(b=>b.onclick=()=>{fcLevel=b.dataset.l;fcBuild()});
 const r=$('#fc-rev');if(r)r.onclick=()=>{fcShow=true;fcRender()};
 const n=$('#fc-next');if(n)n.onclick=()=>{fcI=(fcI+1)%fcDeck.length;fcShow=false;fcRender()};
 const p=$('#fc-prev');if(p)p.onclick=()=>{fcI=(fcI-1+fcDeck.length)%fcDeck.length;fcShow=false;fcRender()};
 $('#fc-shuf').onclick=fcBuild;
}
/* ---- Simulado ---- */
let qz=[],qi=0,hits=0,answered=false;
function qzStart(){qz=shuffle(D.mc);qi=0;hits=0;answered=false;qzRender()}
function qzRender(){
 if(qi>=qz.length){const pc=Math.round(hits/qz.length*100);
  $('#v-qz').innerHTML=`<div class="card"><p class="sub">Resultado</p><div class="score">${hits} de ${qz.length}</div><p>${pc>=80?'Bom domínio. Revise só os erros.':pc>=60?'Base razoável. Volte aos cartões dos temas que errou.':'Releia o roteiro e refaça os cartões de nível 1 antes de tentar de novo.'}</p><div class="row"><button class="btn p" id="qz-re">Refazer</button></div></div>`;
  $('#qz-re').onclick=qzStart;return}
 const q=qz[qi];const order=shuffle(q.o.map((t,i)=>i));const tf=q.o.length===2&&q.o[0]==='Verdadeiro';
 const ord=tf?[0,1]:order;
 let h=`<div class="bar"><i style="width:${qi/qz.length*100}%"></i></div><div class="card"><div class="meta"><span>Questão ${qi+1} de ${qz.length}</span><span>Acertos: ${hits}</span></div><p class="q">${esc(q.q)}</p>`;
 h+=ord.map(i=>`<button class="opt" data-i="${i}">${esc(q.o[i])}</button>`).join('')+'<div id="fb"></div><div class="row" id="qn"></div></div>';
 $('#v-qz').innerHTML=h;answered=false;
 document.querySelectorAll('#v-qz .opt').forEach(b=>b.onclick=()=>{
  if(answered)return;answered=true;const i=+b.dataset.i;const okk=i===q.c;if(okk)hits++;
  document.querySelectorAll('#v-qz .opt').forEach(x=>{const k=+x.dataset.i;x.disabled=true;const right=k===q.c;
   x.classList.add(right?'ok':'bad');if(k===i)x.classList.add('pick');
   x.innerHTML=`<span class="mk">${right?'✓':'✗'}</span>${esc(q.o[k])}${k===i?' <i>(sua resposta)</i>':''}<span class="why">${esc((q.x&&q.x[k])||'')}</span>`});
  $('#fb').innerHTML=`<div class="fb"><b>${okk?'Você acertou.':'Você errou.'}</b> ${esc(q.e)}</div>`;
  $('#qn').innerHTML=`<button class="btn p" id="qnext">${qi+1<qz.length?'Próxima':'Ver resultado'}</button>`;
  $('#qnext').onclick=()=>{qi++;qzRender();window.scrollTo(0,0)};$('#qnext').focus();
 });
}
/* ---- Atlas ---- */
function atRender(){
 $('#v-at').innerHTML='<p class="sub" style="margin:0 0 12px">Olhe a figura, responda de cabeça e abra a resposta.</p>'+D.atlas.map((a,i)=>`<div class="card" style="margin-bottom:16px"><div class="meta"><span class="lv">${esc(a.t)}</span></div><img class="fig" src="${a.img}" alt="${esc(a.t)}"><p class="q" style="font-size:20px">${esc(a.q)}</p><div id="aa${i}" hidden class="ans">${esc(a.a)}</div><div class="row"><button class="btn" data-i="${i}">Mostrar resposta</button></div></div>`).join('');
 document.querySelectorAll('#v-at .btn').forEach(b=>b.onclick=()=>{const e=$('#aa'+b.dataset.i);e.hidden=!e.hidden;b.textContent=e.hidden?'Mostrar resposta':'Ocultar resposta'});
}
fcBuild();qzStart();atRender();
try{const h=location.hash.slice(1);if(tabs.includes(h))show(h)}catch(e){}
</script>

</body></html>
