<style>
/* Layout: demonstração guiada do Divã. Cabeçalho com idioma, quatro seções em abas, coluna da fala à esquerda e leituras à direita. Identidade do app. */
:root{
  --bg:#ECEFEA; --surface:#F8F9F5; --sunk:#E2E6E0; --ink:#1A201E; --muted:#56615B; --line:#CBD2CA; --line-forte:#7C8781;
  --accent:#1E4C46; --accent-ink:#F3F7F3; --warn:#7A5000; --warn-bg:#F5EACB; --ok:#00796B; --danger:#C2261F;
  --freud:#8C2F2B; --klein:#9A5F0C; --winnicott:#3B6E31; --lacan:#33449A; --bion:#6A4A8C; --ferenczi:#9B3F68; --mediacao:#56615B; --blend:multiply;
  --f-display:"Bodoni Moda","Didot",Georgia,serif; --f-read:"Source Serif 4",Georgia,serif;
  --f-body:"Source Sans 3",system-ui,-apple-system,"Segoe UI",sans-serif; --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111614; --surface:#18201D; --sunk:#0D1210; --ink:#E4EAE5; --muted:#97A39C; --line:#2A3430; --line-forte:#66736C;
  --accent:#86C8BC; --accent-ink:#0C1412; --warn:#E9C26A; --warn-bg:#2E2614; --ok:#34D399; --danger:#FF5A5F;
  --freud:#E5847B; --klein:#E2A84E; --winnicott:#93C482; --lacan:#97A5F2; --bion:#BE9DE4; --ferenczi:#EB8DB6; --mediacao:#97A39C; --blend:screen; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111614; --surface:#18201D; --sunk:#0D1210; --ink:#E4EAE5; --muted:#97A39C; --line:#2A3430; --line-forte:#66736C;
  --accent:#86C8BC; --accent-ink:#0C1412; --warn:#E9C26A; --warn-bg:#2E2614; --ok:#34D399; --danger:#FF5A5F;
  --freud:#E5847B; --klein:#E2A84E; --winnicott:#93C482; --lacan:#97A5F2; --bion:#BE9DE4; --ferenczi:#EB8DB6; --mediacao:#97A39C; --blend:screen; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:1160px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{margin:0;text-wrap:balance;font-family:var(--f-display);font-weight:500}
p{margin:0}
button,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:8px 14px;padding-block:8px;flex-wrap:wrap}
.marca{width:52px;height:32px;flex:none}
.marca circle{mix-blend-mode:var(--blend);opacity:.78}
.brand{font-family:var(--f-display);font-style:italic;font-size:1.3rem;white-space:nowrap}
.linguas{margin-left:auto;display:flex;gap:4px}
.linguas button{font-family:var(--f-mono);font-size:.8rem;background:none;border:1px solid var(--line);color:var(--muted);border-radius:8px;padding:6px 10px;cursor:pointer;min-height:36px}
.linguas button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.faixa{margin:14px 0 0;background:var(--warn-bg);border-radius:10px;padding:10px 14px;font-size:.95rem}
.faixa b{color:var(--warn)}
.abas{display:flex;flex-wrap:wrap;gap:0 22px;border-bottom:1px solid var(--line);margin-top:14px}
.abas button{background:none;border:0;border-bottom:2px solid transparent;padding:10px 2px;margin-bottom:-1px;font-weight:600;color:var(--muted);cursor:pointer;min-height:44px}
.abas button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink)}
.hero{padding-block:26px 18px;display:grid;gap:10px;max-width:56rem}
.eyebrow,.label{font-family:var(--f-mono);font-size:.8125rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.hero h1{font-size:clamp(1.9rem,3vw + 1rem,3rem);line-height:1.06}
.hero h1 em{color:var(--accent)}
.lede{color:var(--muted);font-size:1.05rem;max-width:64ch}
.grid{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:20px;align-items:start;padding-bottom:36px}
@media (max-width:900px){.grid{grid-template-columns:1fr}}
.stack{display:grid;gap:16px;min-width:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px 20px;display:grid;gap:12px;min-width:0}
.caso b{font-family:var(--f-display);font-style:italic;font-weight:500;font-size:1.3rem}
.hint{color:var(--muted);font-size:.92rem}
.fala{font-family:var(--f-read);font-size:1.12rem;line-height:1.8}
.fala mark{background:color-mix(in srgb,var(--c) 16%,transparent);color:inherit;border-bottom:2px solid var(--c);border-radius:2px;padding:1px}
textarea{width:100%;background:var(--bg);border:1px solid var(--line-forte);border-radius:10px;padding:11px 14px;min-height:96px;resize:vertical}
label{font-weight:600}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 18px;cursor:pointer;font-weight:600;min-height:44px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.link{background:none;border:0;padding:0;color:var(--accent);cursor:pointer;font-weight:600;text-decoration:underline;text-underline-offset:3px;min-height:44px}
.row{display:flex;gap:10px 16px;flex-wrap:wrap;align-items:center}
.lentes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
@media (max-width:420px){.lentes{grid-template-columns:repeat(2,minmax(0,1fr))}}
.lente{--c:var(--ink);border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px;text-align:left;cursor:pointer;display:flex;align-items:center;gap:8px;font-weight:700;min-height:44px;min-width:0}
.lente i{width:10px;height:10px;border-radius:50%;background:var(--c);flex:none}
.lente[aria-pressed="true"]{border-color:var(--c);background:color-mix(in srgb,var(--c) 10%,var(--surface))}
.det{--c:var(--ink)}
.det h2{font-size:1.8rem;color:var(--c)}
.leitura{display:grid;gap:10px;max-width:65ch;font-family:var(--f-read);font-size:1.05rem}
.pergunta{font-family:var(--f-read);font-style:italic;font-size:1.1rem;padding:12px 16px;background:color-mix(in srgb,var(--c) 8%,var(--bg));border-radius:10px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips span{font-size:.8125rem;border:1px solid color-mix(in srgb,var(--c) 45%,transparent);color:var(--c);border-radius:999px;padding:2px 10px}
.hip{font-family:var(--f-display);font-size:clamp(1.25rem,1.2vw + 1rem,1.6rem);line-height:1.3}
dl{margin:0;display:grid;gap:10px}
dt{font-family:var(--f-mono);font-size:.8125rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
dd{margin:2px 0 0}
.cuidado{background:var(--warn-bg);border-radius:10px;padding:12px 14px;display:grid;gap:4px}
.cuidado .label{color:var(--warn)}
ul.lista{margin:0;padding-left:20px;display:grid;gap:6px}
.chat{display:grid;gap:12px}
.msg{--c:var(--ink);display:grid;grid-template-columns:36px minmax(0,1fr);gap:10px}
.av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-mono);font-size:.8rem;border:1.5px solid var(--c);color:var(--c)}
.bub{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 16px;display:grid;gap:4px;font-family:var(--f-read);font-size:1.04rem}
.bub b{font-family:var(--f-body);color:var(--c)}
.msg.voce .bub{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.msg.med .bub{border-style:dashed}
.bars{display:grid;gap:8px}
.bar{--c:var(--ink);display:grid;grid-template-columns:96px 1fr 28px;gap:10px;align-items:center;font-size:.95rem}
.bar .tr{height:10px;border-radius:5px;background:var(--sunk);overflow:hidden}
.bar .tr i{display:block;height:100%;background:var(--c);border-radius:5px}
.bar span:last-child{font-family:var(--f-mono);color:var(--muted);text-align:right}
figure{margin:0;display:grid;gap:8px}
figure img{width:100%;max-width:520px;height:auto;border:1px solid var(--line-forte);border-radius:10px;display:block}
.tag{font-size:.8125rem;border-radius:999px;padding:2px 10px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.pos.concordo{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
.pos.ressalva{background:var(--warn-bg);color:var(--warn)}
.pos.discordo{background:color-mix(in srgb,var(--danger) 12%,transparent);color:var(--danger)}
.votos{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.votos li{--c:var(--ink);border-left:3px solid var(--c);padding-left:10px;display:grid;gap:3px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;cursor:pointer;font-weight:600;min-height:40px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.dgwrap{display:flex;justify-content:center}
svg.dg{width:100%;max-width:480px;height:auto;overflow:visible}
.dg .lig line{stroke:var(--muted)}
.dg .miolo{fill:color-mix(in srgb,var(--accent) 12%,transparent);stroke:var(--accent);stroke-width:2.4}
.dg .shape{fill:none;stroke:var(--c);stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}
.dg .fundo{fill:var(--surface);stroke:none}
.dg text{fill:var(--ink);font-family:var(--f-display);font-size:21px;text-anchor:middle}
.voz{--c:var(--ink);border-left:4px solid var(--c)}
.voz h3{color:var(--c);font-size:1.4rem}
details.dobra{border:1px solid var(--line);border-radius:12px;background:var(--bg)}
details.dobra>summary{cursor:pointer;padding:12px 14px;font-weight:600;min-height:44px}
details.dobra>div{padding:0 14px 14px;display:grid;gap:12px}
footer{border-top:1px solid var(--line);padding-block:22px 48px;color:var(--muted);font-size:.92rem;display:grid;gap:8px}
footer p{max-width:72ch}
footer a{color:var(--accent)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
<header class="top"><div class="wrap">
  <svg class="marca" viewBox="0 0 64 36" aria-hidden="true"><circle cx="12" cy="18" r="11" fill="var(--freud)"/><circle cx="22" cy="18" r="11" fill="var(--klein)"/><circle cx="32" cy="18" r="11" fill="var(--winnicott)"/><circle cx="42" cy="18" r="11" fill="var(--lacan)"/><circle cx="52" cy="18" r="11" fill="var(--bion)"/></svg>
  <span class="brand">Divã Psicanalítico</span>

</div></header>

<script>
/* Dados da demonstração guiada. PT vem do app; EN e ES são traduções feitas para a demonstração. */
const D = { pt: {"dora": {"titulo": "Dora", "meta": "Sigmund Freud, 1905 · Histeria · transferência", "resumo": "Jovem de 18 anos levada pelo pai a Freud, com tosse nervosa, afonia e um bilhete de despedida encontrado pelos pais. Contou que o Sr. K., amigo da família, a assediou, e que o pai mantinha um caso com a Sra. K. Freud analisou dois sonhos dela; Dora interrompeu a análise depois de cerca de três meses, e Freud reconheceu mais tarde que não percebeu a transferência a tempo.", "fala": "Meu pai me trouxe porque diz que eu ando impossível. A tosse voltou, às vezes perco a voz por semanas. Ninguém acredita em mim. Aquele homem, o Sr. K., me agarrou perto do lago e meu pai acha que eu inventei. Eu sei por quê: ele precisa que eu fique quieta para continuar visitando a Sra. K. É como se eu tivesse sido oferecida em troca. O engraçado é que eu gostava dela, dormíamos no mesmo quarto, ela me contava tudo. As crises de tosse duram semanas. O Sr. K. também vive viajando. Eu não queria falar disso hoje.", "escolas": [{"id": "freud", "foco": "O sintoma fala o que o desejo recalcado não pode dizer.", "leitura": "A tosse e a perda da voz podem ser lidas como conversão: o corpo encena um conflito que não chega à palavra. Chama atenção que as crises durem semanas, como as viagens do Sr. K., o que sugere um laço entre o sintoma e a ausência dele.\n\nPode-se pensar numa ambivalência: repulsa declarada e um desejo que precisa ficar fora da consciência. Para Freud, o amor pelo pai pode ser reavivado como defesa contra o desejo pelo Sr. K.; e há uma corrente de amor pela Sra. K. que ele só reconheceu depois.", "trechos": ["A tosse voltou, às vezes perco a voz por semanas", "O Sr. K. também vive viajando", "meu pai acha que eu inventei"], "pergunta": "O que essa voz perdida não pode dizer?", "conceitos": ["Conversão histérica", "Recalque", "Complexo de Édipo", "Ambivalência"]}, {"id": "klein", "foco": "Objetos bons e maus dividem o mundo da paciente.", "leitura": "A Sra. K. aparece idealizada (\"eu gostava dela\"), enquanto o Sr. K. e o pai ocupam o lugar de objetos persecutórios. Essa cisão protege o objeto bom, mas deixa a paciente cercada de ameaças: ninguém acredita, todos tramam.\n\nA fantasia de ter sido \"oferecida em troca\" pode expressar a exclusão de um casal que se une sem ela, com a inveja e o ataque que isso desperta.", "trechos": ["Ninguém acredita em mim", "eu gostava dela", "oferecida em troca"], "pergunta": "Como ela lida com a raiva de ficar de fora do casal?", "conceitos": ["Cisão", "Posição esquizoparanoide", "Inveja", "Cena primária"]}, {"id": "winnicott", "foco": "Um ambiente que não sustentou a adolescente.", "leitura": "Antes de qualquer conteúdo inconsciente, há uma falha ambiental: o pai traz a filha como problema (\"impossível\") e não acredita no que ela conta. Falta holding num momento em que ela precisava ser levada a sério.\n\nO sintoma pode ser um gesto que pede para ser visto. E o \"não queria falar disso hoje\" merece respeito: o ritmo dela é parte do tratamento.", "trechos": ["Meu pai me trouxe porque diz que eu ando impossível", "meu pai acha que eu inventei", "Eu não queria falar disso hoje"], "pergunta": "O que seria, para ela, ser acreditada aqui?", "conceitos": ["Holding", "Ambiente suficientemente bom", "Falso self", "Tendência antissocial"]}, {"id": "lacan", "foco": "Os significantes que insistem e a pergunta da histérica.", "leitura": "Escutam-se palavras que retornam: acreditar, voz, troca. Ser \"oferecida em troca\" coloca a mulher como objeto que circula entre homens, e ela pergunta pelo seu lugar nesse circuito.\n\nA Sra. K. pode encarnar o enigma \"o que é uma mulher?\", que a paciente interroga através de outra. Perder a voz é também perder o lugar de quem fala.", "trechos": ["perco a voz", "oferecida em troca", "Ninguém acredita em mim"], "pergunta": "O que retorna quando ela diz \"troca\" e \"acredita\"?", "conceitos": ["Significante", "Discurso da histérica", "Desejo do Outro", "Objeto voz"]}, {"id": "bion", "foco": "Experiências emocionais que ainda não podem ser pensadas.", "leitura": "A tosse pode ser entendida como evacuação no corpo de elementos que não encontraram uma mente para recebê-los. O pai, que desacredita, falhou como continente.\n\nO trabalho do analista seria acolher em rêverie, sem interpretar cedo demais. O \"não queria falar disso hoje\" pode ser proteção do vínculo ou ataque a ele, e só o tempo da sessão dirá.", "trechos": ["A tosse voltou", "Ninguém acredita em mim", "Eu não queria falar disso hoje"], "pergunta": "Que emoção está aqui sem ainda ter nome?", "conceitos": ["Continente-contido", "Elementos beta", "Função alfa", "Rêverie"]}, {"id": "ferenczi", "foco": "Quando o adulto confunde ternura com paixão, e depois não acredita.", "leitura": "Ferenczi escutaria primeiro a cena do lago como uma confusão de línguas: a jovem esperava ternura de um amigo da família e recebeu a linguagem da paixão adulta. O trauma se completa quando os adultos negam o que aconteceu.\n\nO sintoma pode ser o modo de manter viva uma verdade que ninguém confirmou. Ao analista caberia acreditar, reconhecer o dano e evitar a hipocrisia profissional de quem sabe mais do que o paciente.", "trechos": ["me agarrou perto do lago", "meu pai acha que eu inventei"], "pergunta": "Estou repetindo, sem perceber, a descrença dos adultos?", "conceitos": ["Confusão de línguas", "Desmentido", "Trauma", "Hipocrisia profissional"]}], "conclusao": {"hipotese": "Uma jovem usa o corpo para dizer o que não encontra escuta: a tosse e a afonia condensam desejo, raiva e a denúncia de ter sido tratada como moeda de troca entre adultos.", "pontes": "Freud e Lacan escutam o desejo que circula nas palavras; Klein mostra como ela divide os adultos em bons e maus; Winnicott, Bion e Ferenczi lembram que, antes de interpretar, alguém precisa acreditar nela.", "tensoes": "Interpretar cedo o desejo pelo Sr. K. pode soar como mais uma descrença. Freud reconheceu depois que não percebeu a transferência a tempo, e Dora interrompeu a análise.", "manejo": "Validar a experiência relatada, respeitar o 'não queria falar disso hoje' e acompanhar, sessão a sessão, os significantes troca, voz e acreditar.", "cuidados": "Há relato de assédio sexual de um adulto contra uma jovem. Hoje isso pede atenção à proteção, à rede de cuidado e discussão em supervisão, além da leitura clínica. O bilhete de despedida exige avaliar risco.", "estudo": ["Freud, Análise fragmentária de uma histeria (1905)", "Ferenczi, Confusão de línguas entre os adultos e a criança (1933)", "Lacan, Intervenção sobre a transferência (1951)"]}}, "mesa": [{"quem": "voce", "texto": "Freud errou ao interpretar o desejo de Dora pelo Sr. K.?"}, {"quem": "freud", "texto": "Reconheço que me apressei. Eu tinha razão em escutar o desejo escondido no sintoma, mas não percebi a tempo que ela repetia comigo o que vivia com o Sr. K. e com o pai. Quando me deixou, avisou como uma governanta que se despede com duas semanas de antecedência: a transferência agiu antes que eu a interpretasse."}, {"quem": "winnicott", "texto": "Eu diria que, antes de interpretar o desejo, ela precisava de alguém que acreditasse nela. Uma jovem desacreditada pelo pai não pode brincar com hipóteses sobre o próprio desejo. O setting precisava ser, primeiro, o lugar onde a experiência dela fosse sustentada."}, {"quem": "lacan", "texto": "A questão não é se Freud errou, mas onde se colocou. Ele fez bem a primeira inversão dialética, ao devolver a Dora a parte que lhe cabe na desordem de que se queixa. Mas, identificado ao Sr. K., não fez a terceira: reconhecer que a Sra. K. valia para ela como enigma da própria feminilidade. O que é uma mulher?"}, {"quem": "mediacao", "texto": "A mesa concorda que a transferência decidiu o caso. Fica em aberto o que vem primeiro: sustentar a experiência, como propõe Winnicott, ou devolver a pergunta, como propõe Lacan."}], "treino": {"titulo": "O atraso", "tipo": "Vinheta fictícia · transferência", "texto": "Desculpa o atraso, de novo. O ônibus... na verdade eu fiquei parada na esquina olhando o prédio. Não sei por quê. Na semana passada você falou da minha irmã e eu fiquei com raiva, mas não de você. Ou de você também.", "minha": "Ela parece com raiva da analista mas desloca para a irmã. O atraso pode ser uma forma de dizer isso sem palavras.", "mais_proxima": "freud", "sintonia": {"freud": 3, "klein": 2, "winnicott": 1, "lacan": 2, "bion": 1}, "escutou": ["O deslocamento da raiva da irmã para a analista", "O atraso como ato que comunica"], "ficou_de_fora": ["O tempo parada na esquina: uma hesitação antes de entrar, que Winnicott e Bion escutariam como pedido de espaço", "O \"ou de você também\" como retificação que só a fala permite, central para Lacan"], "um_passo": "Releia o trecho procurando o que ela faz com o tempo e com o espaço antes da sessão, e não só com o afeto."}, "ate": {"ctx": "Exemplo fictício. Desenho livre feito por uma mulher adulta ao fim de uma sessão, com a consigna: desenhe o que quiser.", "assoc": "É a casa da minha avó. Não tem ninguém, todo mundo já saiu. A porta eu não consegui fazer.", "desc": "Folha em posição horizontal, quase toda em branco. No canto inferior esquerdo há uma casa pequena, de traço firme: um quadrado com telhado em triângulo e uma janela com cruzeta. A casa não tem porta e não há figuras humanas. Do lado direito inferior partem duas linhas paralelas, como um caminho, que seguem em direção à casa e param antes de alcançá-la. No canto superior direito aparece parte de um sol, cortado pela borda da folha, com três raios curtos. Não há chão, céu, árvores nem cor. O espaço vazio ocupa mais de quatro quintos da folha.", "leituras": {"freud": {"observacao": "A casa não tem porta, e isso veio dito: \"a porta eu não consegui fazer\".", "leitura": "O que não pôde ser desenhado pede mais atenção do que o que foi. Pode-se pensar a porta ausente como uma formação de compromisso: de um lado o desejo de voltar à casa da infância, de outro a defesa contra o que se encontraria lá dentro.\n\nA casa da avó talvez esteja no lugar de outra cena, por deslocamento. \"Não consegui\" funciona como uma negação que conserva aquilo que afasta.", "pergunta": "O que lhe ocorre quando pensa na porta dessa casa?", "limites": "Diz pouco sobre a qualidade do ambiente que sustentou, ou não, quem morou ali."}, "klein": {"observacao": "Uma casa pequena, encostada no canto, sob um vazio muito maior do que ela.", "leitura": "A casa pode figurar o objeto interno. Esvaziada, sugere angústia depressiva: o objeto bom sentido como perdido ou danificado, e a dúvida sobre a própria parte nessa perda.\n\nA falta da porta talvez proteja o objeto dos ataques de quem desenha, e ao mesmo tempo impeça a reparação: não se entra para consertar.", "pergunta": "Quando todo mundo saiu, o que ficou dentro da casa?", "limites": "Tende a ler o vazio como conteúdo de fantasia e pode passar ao largo do que de fato faltou no ambiente."}, "winnicott": {"observacao": "O desenho foi feito no fim da sessão, por iniciativa dela, e entregue.", "leitura": "Antes do conteúdo conta o gesto. Desenhar na presença de alguém é brincar, e isso supõe alguma confiança no ambiente.\n\nA casa da avó pode ser a lembrança de um lugar que sustentava; vazia, talvez fale de um holding que existiu e se interrompeu. A porta que não pôde ser feita seria menos uma defesa e mais algo ainda não vivido: entrar e sair sem que a casa desapareça.", "pergunta": "Como era estar nessa casa quando tinha gente?", "limites": "Ao privilegiar o que o ambiente deu ou deixou de dar, pode suavizar o conflito e o desejo em jogo."}, "lacan": {"observacao": "Há uma frase dita junto do desenho, e nela um tropeço: \"a porta eu não consegui fazer\".", "leitura": "O desenho interessa menos como imagem a decifrar do que pelo que se diz a propósito dele. \"Não consegui fazer\" deixa o sentido em suspenso: não consegui desenhar, ou não consegui abrir uma saída?\n\n\"Todo mundo já saiu\" situa quem fala como aquela que fica, diante de um Outro que se ausentou. A porta que falta pode ser tomada como o ponto em que algo não se inscreve, e convém não o preencher com sentido.", "pergunta": "Não conseguiu fazer?", "limites": "Ao se ater à fala, deixa de lado a experiência sensível de desenhar e o que ela comunica sem palavras."}, "bion": {"observacao": "Uma grande área em branco e poucos elementos, que não se ligam: o caminho não chega, o sol está cortado.", "leitura": "Pode-se pensar o desenho como tentativa de dar forma a uma experiência emocional ainda sem nome. O branco talvez não seja falta de conteúdo, e sim algo que ainda não pôde ser pensado; a casa sem porta, um continente em que não se entra.\n\nQue ela tenha desenhado e falado sugere a função alfa em trabalho: algo bruto começa a virar imagem e frase. Cabe ao analista tolerar não saber o que é esse vazio, sem saturá-lo com explicação.", "pergunta": "Há muito espaço em volta dessa casa.", "limites": "Fala pouco da história e do desejo singulares e corre o risco da abstração."}}, "rodadas": [{"nucleo": "O desenho mostra uma casa pequena, no canto, sem porta e sem figuras, cercada de muito espaço vazio, e veio acompanhado de uma fala sobre ausência.\n\nA porta que não pôde ser feita expressa o desejo de voltar a essa casa e a defesa contra isso. Nenhuma leitura se sustenta sem as associações de quem desenhou.", "pontos": ["A casa é pequena, está no canto e não tem porta nem pessoas.", "A porta ausente expressa desejo de retorno e defesa.", "A fala que acompanha o desenho importa tanto quanto a imagem.", "Nenhum elemento deve ser interpretado isoladamente."], "votos": [{"id": "freud", "posicao": "concordo", "objecao": "", "reformulacao": ""}, {"id": "klein", "posicao": "ressalva", "objecao": "A defesa protege também o objeto, e não só quem desenha.", "reformulacao": "Dizer que a falta da porta protege e ao mesmo tempo impede o acesso."}, {"id": "winnicott", "posicao": "ressalva", "objecao": "A porta pode ser algo ainda não vivido, e não uma defesa.", "reformulacao": "Não fixar a porta como defesa."}, {"id": "lacan", "posicao": "discordo", "objecao": "O segundo ponto dá um sentido à falta. Não subscrevo que a porta \"expressa\" algo: ela é o que não se inscreve.", "reformulacao": "A porta ausente é o ponto em que desenho e fala tropeçam; seu sentido fica em aberto."}, {"id": "bion", "posicao": "ressalva", "objecao": "Nomear desejo e defesa tão cedo satura o que ainda não se sabe.", "reformulacao": "Deixar o sentido da porta em aberto."}]}, {"nucleo": "O desenho mostra uma casa pequena, no canto, sem porta e sem figuras, cercada de muito espaço vazio, e veio acompanhado de uma fala sobre ausência.\n\nA porta que não pôde ser feita é o ponto em que o desenho e a fala tropeçam. É ali que a escuta deve se deter, sem decidir de antemão o que ela significa. Nenhuma leitura se sustenta sem as associações de quem desenhou.", "pontos": ["A casa é pequena, está no canto e não tem porta nem pessoas.", "A porta ausente é o ponto em que desenho e fala tropeçam; seu sentido fica em aberto.", "A fala que acompanha o desenho importa tanto quanto a imagem.", "Nenhum elemento deve ser interpretado isoladamente."], "votos": [{"id": "freud", "posicao": "concordo", "objecao": "", "reformulacao": ""}, {"id": "klein", "posicao": "concordo", "objecao": "", "reformulacao": ""}, {"id": "winnicott", "posicao": "concordo", "objecao": "", "reformulacao": ""}, {"id": "lacan", "posicao": "concordo", "objecao": "", "reformulacao": ""}, {"id": "bion", "posicao": "ressalva", "objecao": "Deter-se não deve virar insistência em perguntar; às vezes é esperar.", "reformulacao": "Acrescentar que deter-se inclui tolerar o silêncio."}]}], "divergencia": "O que é a porta ausente: defesa, para Freud e Klein; algo ainda não vivido, para Winnicott; falta que não se preenche, para Lacan; o que ainda não pôde ser pensado, para Bion.", "abertas": ["O que lhe ocorre sobre a porta?", "Como era essa casa quando havia gente?"], "resumo": {"freud": ["Retorno", "ponte", "O desejo de voltar à casa da infância e a defesa que interrompe o caminho."], "klein": ["Reparação", "semente", "O objeto bom sentido como perdido e a dúvida sobre poder consertá-lo."], "winnicott": ["Abrigo", "janela", "Um lugar que sustentava e que deixou de estar disponível."], "lacan": ["Falta", "vazio", "A porta como ponto que não se inscreve e que não deve ser preenchido."], "bion": ["Continente", "circulo", "Um espaço que ainda não pôde receber o que precisa ser pensado."]}}},
en: {
 dora: { titulo: "Dora", meta: "Sigmund Freud, 1905 · Hysteria · transference",
  resumo: "An 18-year-old brought to Freud by her father, with a nervous cough, loss of voice and a farewell note found by her parents. She said that Herr K., a family friend, had made advances to her, and that her father was having an affair with Frau K. Freud analysed two of her dreams; Dora broke off the analysis after about three months, and Freud later acknowledged that he had not noticed the transference in time.",
  fala: "My father brought me because he says I've become impossible. The cough is back, and sometimes I lose my voice for weeks. Nobody believes me. That man, Herr K., grabbed me by the lake and my father thinks I made it up. I know why: he needs me to keep quiet so he can go on visiting Frau K. It's as if I had been offered in exchange. The funny thing is that I liked her; we slept in the same room, she told me everything. The coughing fits last for weeks. Herr K. is always away travelling too. I didn't want to talk about this today.",
  escolas: [
   { id: "freud", foco: "The symptom says what the repressed wish cannot.", leitura: "The cough and the loss of voice can be read as conversion: the body stages a conflict that does not reach speech. It is striking that the attacks last for weeks, like Herr K.'s journeys, which suggests a link between the symptom and his absence.\n\nOne may think of an ambivalence: a declared repulsion and a wish that has to stay out of consciousness. For Freud, the love for the father may be revived as a defence against the wish for Herr K.; and there is a current of love for Frau K. that he only recognised later.", trechos: ["The cough is back, and sometimes I lose my voice for weeks", "Herr K. is always away travelling too", "my father thinks I made it up"], pergunta: "What is it that this lost voice cannot say?", conceitos: ["Conversion hysteria", "Repression", "Oedipus complex", "Ambivalence"] },
   { id: "klein", foco: "Good and bad objects divide the patient's world.", leitura: "Frau K. appears idealised (\"I liked her\"), while Herr K. and the father take the place of persecutory objects. This splitting protects the good object but leaves the patient surrounded by threats: nobody believes her, everyone is plotting.\n\nThe phantasy of having been \"offered in exchange\" may express her exclusion from a couple that comes together without her, with the envy and the attack this arouses.", trechos: ["Nobody believes me", "I liked her", "offered in exchange"], pergunta: "How does she deal with the anger of being left out of the couple?", conceitos: ["Splitting", "Paranoid-schizoid position", "Envy", "Primal scene"] },
   { id: "winnicott", foco: "An environment that failed to hold the adolescent.", leitura: "Before any unconscious content, there is an environmental failure: the father brings his daughter as a problem (\"impossible\") and does not believe what she tells him. Holding is missing at a moment when she needed to be taken seriously.\n\nThe symptom may be a gesture asking to be seen. And \"I didn't want to talk about this today\" deserves respect: her pace is part of the treatment.", trechos: ["My father brought me because he says I've become impossible", "my father thinks I made it up", "I didn't want to talk about this today"], pergunta: "What would it mean, for her, to be believed here?", conceitos: ["Holding", "Good-enough environment", "False self", "Antisocial tendency"] },
   { id: "lacan", foco: "The signifiers that insist, and the hysteric's question.", leitura: "One hears words that return: believe, voice, exchange. Being \"offered in exchange\" places the woman as an object circulating between men, and she asks about her place in that circuit.\n\nFrau K. may embody the enigma \"what is a woman?\", which the patient questions through another woman. To lose one's voice is also to lose the place of the one who speaks.", trechos: ["I lose my voice", "offered in exchange", "Nobody believes me"], pergunta: "What returns when she says \"exchange\" and \"believes\"?", conceitos: ["Signifier", "Hysteric's discourse", "Desire of the Other", "Voice as object"] },
   { id: "bion", foco: "Emotional experiences that cannot yet be thought.", leitura: "The cough can be understood as the evacuation into the body of elements that found no mind to receive them. The father, who disbelieves her, failed as a container.\n\nThe analyst's work would be to receive this in reverie, without interpreting too soon. \"I didn't want to talk about this today\" may be a protection of the link or an attack on it, and only the time of the session will tell.", trechos: ["The cough is back", "Nobody believes me", "I didn't want to talk about this today"], pergunta: "What emotion is here that does not yet have a name?", conceitos: ["Container-contained", "Beta elements", "Alpha function", "Reverie"] },
   { id: "ferenczi", foco: "When the adult confuses tenderness with passion, and then does not believe.", leitura: "Ferenczi would first hear the scene by the lake as a confusion of tongues: the young woman expected tenderness from a family friend and received the language of adult passion. The trauma is completed when the adults deny what happened.\n\nThe symptom may be a way of keeping alive a truth that nobody confirmed. It would fall to the analyst to believe her, to acknowledge the harm and to avoid the professional hypocrisy of one who knows better than the patient.", trechos: ["grabbed me by the lake", "my father thinks I made it up"], pergunta: "Am I repeating, without noticing, the adults' disbelief?", conceitos: ["Confusion of tongues", "Disavowal", "Trauma", "Professional hypocrisy"] }
  ],
  conclusao: { hipotese: "A young woman uses her body to say what finds no one to listen: the cough and the aphonia condense desire, anger and the accusation of having been treated as a bargaining chip between adults.", pontes: "Freud and Lacan listen to the desire circulating in the words; Klein shows how she divides the adults into good and bad; Winnicott, Bion and Ferenczi recall that, before interpreting, someone needs to believe her.", tensoes: "Interpreting the wish for Herr K. early may sound like one more disbelief. Freud later acknowledged that he did not notice the transference in time, and Dora broke off the analysis.", manejo: "Validate the experience she reports, respect \"I didn't want to talk about this today\" and follow, session by session, the signifiers exchange, voice and believe.", cuidados: "There is an account of sexual harassment of a young woman by an adult. Today this calls for attention to protection, to the network of care and for discussion in supervision, alongside the clinical reading. The farewell note requires an assessment of risk.", estudo: ["Freud, Fragment of an Analysis of a Case of Hysteria (1905)", "Ferenczi, Confusion of Tongues between Adults and the Child (1933)", "Lacan, Intervention on Transference (1951)"] }
 },
 mesa: [
  { quem: "voce", texto: "Was Freud wrong to interpret Dora's desire for Herr K.?" },
  { quem: "freud", texto: "I acknowledge that I was hasty. I was right to listen for the wish hidden in the symptom, but I did not notice in time that she was repeating with me what she lived with Herr K. and with her father. When she left me, she gave notice like a governess, two weeks in advance: the transference acted before I interpreted it." },
  { quem: "winnicott", texto: "I would say that, before her desire could be interpreted, she needed someone who believed her. A young woman disbelieved by her father cannot play with hypotheses about her own desire. The setting needed to be, first of all, the place where her experience was held." },
  { quem: "lacan", texto: "The question is not whether Freud was wrong, but where he placed himself. He carried out the first dialectical reversal well, returning to Dora her own part in the disorder she complains of. But, identified with Herr K., he did not make the third: recognising that Frau K. stood for her as the enigma of her own femininity. What is a woman?" },
  { quem: "mediacao", texto: "The table agrees that the transference decided the case. What remains open is what comes first: holding the experience, as Winnicott proposes, or returning the question, as Lacan proposes." }
 ],
 treino: { titulo: "The late arrival", tipo: "Fictional vignette · transference",
  texto: "Sorry I'm late, again. The bus... actually I stood on the corner looking at the building. I don't know why. Last week you talked about my sister and I got angry, but not at you. Or at you too.",
  minha: "She seems angry with the analyst but displaces it onto her sister. Being late may be a way of saying that without words.",
  mais_proxima: "freud", sintonia: { freud: 3, klein: 2, winnicott: 1, lacan: 2, bion: 1 },
  escutou: ["The displacement of the anger from the sister to the analyst", "The lateness as an act that communicates"],
  ficou_de_fora: ["The time spent standing on the corner: a hesitation before coming in, which Winnicott and Bion would hear as a request for space", "\"Or at you too\" as a correction that only speech allows, central for Lacan"],
  um_passo: "Reread the passage looking for what she does with time and space before the session, and not only with the affect." },
 ate: { ctx: "Fictional example. A free drawing made by an adult woman at the end of a session, with the instruction: draw whatever you like.",
  assoc: "It's my grandmother's house. There's nobody there, everyone has already left. I couldn't manage to do the door.",
  desc: "A sheet in landscape position, almost entirely blank. In the lower left corner there is a small house, drawn with a firm line: a square with a triangular roof and a window with crossbars. The house has no door and there are no human figures. From the lower right two parallel lines set out, like a path, heading towards the house and stopping before they reach it. In the upper right corner part of a sun appears, cut off by the edge of the sheet, with three short rays. There is no ground, sky, trees or colour. The empty space takes up more than four fifths of the sheet.",
  leituras: {
   freud: { observacao: "The house has no door, and this came in words: \"I couldn't manage to do the door\".", leitura: "What could not be drawn calls for more attention than what was. One may think of the missing door as a compromise formation: on one side the wish to return to the childhood house, on the other the defence against what would be found inside.\n\nThe grandmother's house may stand in for another scene, by displacement. \"I couldn't manage\" works as a negation that preserves what it pushes away.", pergunta: "What comes to mind when you think about the door of that house?", limites: "It says little about the quality of the environment that did, or did not, hold whoever lived there." },
   klein: { observacao: "A small house, pushed into the corner, under an emptiness much larger than itself.", leitura: "The house may represent the internal object. Emptied, it suggests depressive anxiety: the good object felt as lost or damaged, and the doubt about one's own part in that loss.\n\nThe missing door may protect the object from the attacks of the one who draws, and at the same time prevent reparation: there is no way in to mend it.", pergunta: "When everyone left, what stayed inside the house?", limites: "It tends to read the emptiness as phantasy content and may pass over what was actually missing in the environment." },
   winnicott: { observacao: "The drawing was made at the end of the session, on her own initiative, and handed over.", leitura: "Before the content, the gesture counts. To draw in someone's presence is to play, and that presupposes some trust in the environment.\n\nThe grandmother's house may be the memory of a place that held; empty, it may speak of a holding that existed and was interrupted. The door that could not be made would be less a defence than something not yet lived: going in and out without the house disappearing.", pergunta: "What was it like to be in that house when there were people in it?", limites: "By favouring what the environment gave or failed to give, it may soften the conflict and the desire at stake." },
   lacan: { observacao: "There is a sentence spoken alongside the drawing, and in it a stumble: \"I couldn't manage to do the door\".", leitura: "The drawing matters less as an image to decipher than for what is said about it. \"I couldn't manage\" leaves the meaning suspended: could not draw it, or could not open a way out?\n\n\"Everyone has already left\" places the speaker as the one who stays, facing an Other who has gone. The missing door can be taken as the point where something is not inscribed, and it is better not to fill it with meaning.", pergunta: "You couldn't manage?", limites: "By keeping to speech, it sets aside the sensory experience of drawing and what it communicates without words." },
   bion: { observacao: "A large blank area and few elements, which do not connect: the path does not arrive, the sun is cut off.", leitura: "One may think of the drawing as an attempt to give form to an emotional experience that still has no name. The blank may not be a lack of content but something that could not yet be thought; the house without a door, a container that cannot be entered.\n\nThat she drew and spoke suggests alpha function at work: something raw begins to turn into image and sentence. It falls to the analyst to tolerate not knowing what this emptiness is, without saturating it with explanation.", pergunta: "There is a lot of space around that house.", limites: "It says little about the singular history and desire, and risks abstraction." }
  },
  rodadas: [
   { nucleo: "The drawing shows a small house, in the corner, with no door and no figures, surrounded by a great deal of empty space, and it came with words about absence.\n\nThe door that could not be made expresses the wish to return to that house and the defence against it. No reading holds without the associations of the person who drew.", pontos: ["The house is small, in the corner, with no door and no people.", "The missing door expresses a wish to return and a defence.", "The words that accompany the drawing matter as much as the image.", "No element should be interpreted in isolation."],
     votos: [ { id: "freud", posicao: "concordo" }, { id: "klein", posicao: "ressalva", objecao: "The defence also protects the object, and not only the one who draws.", reformulacao: "Say that the missing door protects and at the same time bars access." }, { id: "winnicott", posicao: "ressalva", objecao: "The door may be something not yet lived, and not a defence.", reformulacao: "Do not fix the door as a defence." }, { id: "lacan", posicao: "discordo", objecao: "The second point gives the lack a meaning. I do not endorse that the door \"expresses\" something: it is what is not inscribed.", reformulacao: "The missing door is the point where drawing and speech stumble; its meaning stays open." }, { id: "bion", posicao: "ressalva", objecao: "Naming wish and defence so early saturates what is not yet known.", reformulacao: "Leave the meaning of the door open." } ] },
   { nucleo: "The drawing shows a small house, in the corner, with no door and no figures, surrounded by a great deal of empty space, and it came with words about absence.\n\nThe door that could not be made is the point where the drawing and the speech stumble. That is where listening should pause, without deciding in advance what it means. No reading holds without the associations of the person who drew.", pontos: ["The house is small, in the corner, with no door and no people.", "The missing door is the point where drawing and speech stumble; its meaning stays open.", "The words that accompany the drawing matter as much as the image.", "No element should be interpreted in isolation."],
     votos: [ { id: "freud", posicao: "concordo" }, { id: "klein", posicao: "concordo" }, { id: "winnicott", posicao: "concordo" }, { id: "lacan", posicao: "concordo" }, { id: "bion", posicao: "ressalva", objecao: "Pausing should not turn into insisting on questions; sometimes it means waiting.", reformulacao: "Add that pausing includes tolerating silence." } ] }

es: {
 dora: { titulo: "Dora", meta: "Sigmund Freud, 1905 · Histeria · transferencia",
  resumo: "Joven de 18 años llevada por su padre a Freud, con tos nerviosa, afonía y una nota de despedida que encontraron sus padres. Contó que el Sr. K., amigo de la familia, la había acosado, y que su padre mantenía una relación con la Sra. K. Freud analizó dos sueños de ella; Dora interrumpió el análisis después de unos tres meses, y Freud reconoció más tarde que no había advertido la transferencia a tiempo.",
  fala: "Mi padre me trajo porque dice que estoy imposible. La tos volvió, a veces pierdo la voz durante semanas. Nadie me cree. Ese hombre, el Sr. K., me agarró cerca del lago y mi padre cree que lo inventé. Yo sé por qué: necesita que me quede callada para seguir visitando a la Sra. K. Es como si me hubieran ofrecido a cambio. Lo curioso es que ella me gustaba, dormíamos en la misma habitación, me lo contaba todo. Las crisis de tos duran semanas. El Sr. K. también vive viajando. Yo no quería hablar de esto hoy.",
  escolas: [
   { id: "freud", foco: "El síntoma dice lo que el deseo reprimido no puede decir.", leitura: "La tos y la pérdida de la voz pueden leerse como conversión: el cuerpo pone en escena un conflicto que no llega a la palabra. Llama la atención que las crisis duren semanas, como los viajes del Sr. K., lo que sugiere un lazo entre el síntoma y su ausencia.\n\nPuede pensarse en una ambivalencia: una repulsión declarada y un deseo que tiene que quedar fuera de la conciencia. Para Freud, el amor por el padre puede reavivarse como defensa contra el deseo por el Sr. K.; y hay una corriente de amor por la Sra. K. que él solo reconoció después.", trechos: ["La tos volvió, a veces pierdo la voz durante semanas", "El Sr. K. también vive viajando", "mi padre cree que lo inventé"], pergunta: "¿Qué es lo que esa voz perdida no puede decir?", conceitos: ["Conversión histérica", "Represión", "Complejo de Edipo", "Ambivalencia"] },
   { id: "klein", foco: "Objetos buenos y malos dividen el mundo de la paciente.", leitura: "La Sra. K. aparece idealizada (\"ella me gustaba\"), mientras que el Sr. K. y el padre ocupan el lugar de objetos persecutorios. Esa escisión protege al objeto bueno, pero deja a la paciente rodeada de amenazas: nadie le cree, todos traman.\n\nLa fantasía de haber sido \"ofrecida a cambio\" puede expresar la exclusión de una pareja que se une sin ella, con la envidia y el ataque que eso despierta.", trechos: ["Nadie me cree", "ella me gustaba", "ofrecido a cambio"], pergunta: "¿Cómo se las arregla con la rabia de quedar fuera de la pareja?", conceitos: ["Escisión", "Posición esquizoparanoide", "Envidia", "Escena primaria"] },
   { id: "winnicott", foco: "Un ambiente que no sostuvo a la adolescente.", leitura: "Antes de cualquier contenido inconsciente, hay una falla ambiental: el padre trae a su hija como un problema (\"imposible\") y no cree lo que ella cuenta. Falta holding en un momento en que necesitaba ser tomada en serio.\n\nEl síntoma puede ser un gesto que pide ser visto. Y el \"no quería hablar de esto hoy\" merece respeto: su ritmo es parte del tratamiento.", trechos: ["Mi padre me trajo porque dice que estoy imposible", "mi padre cree que lo inventé", "Yo no quería hablar de esto hoy"], pergunta: "¿Qué sería, para ella, que aquí le crean?", conceitos: ["Holding", "Ambiente suficientemente bueno", "Falso self", "Tendencia antisocial"] },
   { id: "lacan", foco: "Los significantes que insisten y la pregunta de la histérica.", leitura: "Se escuchan palabras que retornan: creer, voz, cambio. Ser \"ofrecida a cambio\" ubica a la mujer como objeto que circula entre hombres, y ella pregunta por su lugar en ese circuito.\n\nLa Sra. K. puede encarnar el enigma \"¿qué es una mujer?\", que la paciente interroga a través de otra. Perder la voz es también perder el lugar de quien habla.", trechos: ["pierdo la voz", "ofrecido a cambio", "Nadie me cree"], pergunta: "¿Qué retorna cuando ella dice \"cambio\" y \"cree\"?", conceitos: ["Significante", "Discurso de la histérica", "Deseo del Otro", "Objeto voz"] },
   { id: "bion", foco: "Experiencias emocionales que todavía no pueden ser pensadas.", leitura: "La tos puede entenderse como la evacuación en el cuerpo de elementos que no encontraron una mente que los recibiera. El padre, que no le cree, falló como continente.\n\nEl trabajo del analista sería recibir esto en rêverie, sin interpretar demasiado pronto. El \"no quería hablar de esto hoy\" puede ser protección del vínculo o ataque a él, y solo el tiempo de la sesión lo dirá.", trechos: ["La tos volvió", "Nadie me cree", "Yo no quería hablar de esto hoy"], pergunta: "¿Qué emoción está aquí sin tener todavía nombre?", conceitos: ["Continente-contenido", "Elementos beta", "Función alfa", "Rêverie"] },
   { id: "ferenczi", foco: "Cuando el adulto confunde ternura con pasión, y después no cree.", leitura: "Ferenczi escucharía primero la escena del lago como una confusión de lenguas: la joven esperaba ternura de un amigo de la familia y recibió el lenguaje de la pasión adulta. El trauma se completa cuando los adultos niegan lo ocurrido.\n\nEl síntoma puede ser el modo de mantener viva una verdad que nadie confirmó. Al analista le correspondería creerle, reconocer el daño y evitar la hipocresía profesional de quien sabe más que el paciente.", trechos: ["me agarró cerca del lago", "mi padre cree que lo inventé"], pergunta: "¿Estoy repitiendo, sin darme cuenta, la incredulidad de los adultos?", conceitos: ["Confusión de lenguas", "Desmentida", "Trauma", "Hipocresía profesional"] }
  ],
  conclusao: { hipotese: "Una joven usa el cuerpo para decir lo que no encuentra escucha: la tos y la afonía condensan deseo, rabia y la denuncia de haber sido tratada como moneda de cambio entre adultos.", pontes: "Freud y Lacan escuchan el deseo que circula en las palabras; Klein muestra cómo ella divide a los adultos en buenos y malos; Winnicott, Bion y Ferenczi recuerdan que, antes de interpretar, alguien tiene que creerle.", tensoes: "Interpretar pronto el deseo por el Sr. K. puede sonar como una incredulidad más. Freud reconoció después que no advirtió la transferencia a tiempo, y Dora interrumpió el análisis.", manejo: "Validar la experiencia relatada, respetar el \"no quería hablar de esto hoy\" y seguir, sesión a sesión, los significantes cambio, voz y creer.", cuidados: "Hay un relato de acoso sexual de un adulto a una joven. Hoy eso pide atención a la protección, a la red de cuidado y discusión en supervisión, además de la lectura clínica. La nota de despedida exige evaluar el riesgo.", estudo: ["Freud, Fragmento de análisis de un caso de histeria (1905)", "Ferenczi, Confusión de lengua entre los adultos y el niño (1933)", "Lacan, Intervención sobre la transferencia (1951)"] }

 mesa: [
  { quem: "voce", texto: "¿Se equivocó Freud al interpretar el deseo de Dora por el Sr. K.?" },
  { quem: "freud", texto: "Reconozco que me apresuré. Tenía razón en escuchar el deseo escondido en el síntoma, pero no advertí a tiempo que ella repetía conmigo lo que vivía con el Sr. K. y con su padre. Cuando me dejó, avisó como una institutriz que se despide con dos semanas de antelación: la transferencia actuó antes de que yo la interpretara." },
  { quem: "winnicott", texto: "Yo diría que, antes de interpretar el deseo, ella necesitaba a alguien que le creyera. Una joven a quien su padre no le cree no puede jugar con hipótesis sobre su propio deseo. El encuadre tenía que ser, primero, el lugar donde su experiencia fuera sostenida." },
  { quem: "lacan", texto: "La cuestión no es si Freud se equivocó, sino dónde se ubicó. Hizo bien la primera inversión dialéctica, al devolverle a Dora la parte que le toca en el desorden del que se queja. Pero, identificado con el Sr. K., no hizo la tercera: reconocer que la Sra. K. valía para ella como enigma de su propia feminidad. ¿Qué es una mujer?" },
  { quem: "mediacao", texto: "La mesa coincide en que la transferencia decidió el caso. Queda abierto qué viene primero: sostener la experiencia, como propone Winnicott, o devolver la pregunta, como propone Lacan." }

 treino: { titulo: "El retraso", tipo: "Viñeta ficticia · transferencia",
  texto: "Perdón por el retraso, otra vez. El autobús... en realidad me quedé parada en la esquina mirando el edificio. No sé por qué. La semana pasada usted habló de mi hermana y me dio rabia, pero no con usted. O con usted también.",
  minha: "Parece tener rabia con la analista pero la desplaza hacia la hermana. El retraso puede ser una forma de decirlo sin palabras.",
  mais_proxima: "freud", sintonia: { freud: 3, klein: 2, winnicott: 1, lacan: 2, bion: 1 },
  escutou: ["El desplazamiento de la rabia de la hermana a la analista", "El retraso como acto que comunica"],
  ficou_de_fora: ["El tiempo parada en la esquina: una vacilación antes de entrar, que Winnicott y Bion escucharían como pedido de espacio", "El \"o con usted también\" como rectificación que solo la palabra permite, central para Lacan"],
  um_passo: "Relea el fragmento buscando lo que ella hace con el tiempo y con el espacio antes de la sesión, y no solo con el afecto." },
 ate: { ctx: "Ejemplo ficticio. Dibujo libre hecho por una mujer adulta al final de una sesión, con la consigna: dibuje lo que quiera.",
  assoc: "Es la casa de mi abuela. No hay nadie, todos ya se fueron. La puerta no pude hacerla.",
  desc: "Hoja en posición horizontal, casi toda en blanco. En el ángulo inferior izquierdo hay una casa pequeña, de trazo firme: un cuadrado con techo en triángulo y una ventana con cruceta. La casa no tiene puerta y no hay figuras humanas. Desde el lado inferior derecho parten dos líneas paralelas, como un camino, que van hacia la casa y se detienen antes de alcanzarla. En el ángulo superior derecho aparece parte de un sol, cortado por el borde de la hoja, con tres rayos cortos. No hay suelo, cielo, árboles ni color. El espacio vacío ocupa más de cuatro quintos de la hoja.",
  leituras: {
   freud: { observacao: "La casa no tiene puerta, y eso vino dicho: \"la puerta no pude hacerla\".", leitura: "Lo que no pudo dibujarse pide más atención que lo que sí. Puede pensarse la puerta ausente como una formación de compromiso: de un lado el deseo de volver a la casa de la infancia, del otro la defensa contra lo que se encontraría adentro.\n\nLa casa de la abuela quizá esté en lugar de otra escena, por desplazamiento. \"No pude\" funciona como una negación que conserva aquello que aparta.", pergunta: "¿Qué se le ocurre cuando piensa en la puerta de esa casa?", limites: "Dice poco sobre la calidad del ambiente que sostuvo, o no, a quien vivió allí." },
   klein: { observacao: "Una casa pequeña, arrimada al rincón, bajo un vacío mucho mayor que ella.", leitura: "La casa puede figurar el objeto interno. Vaciada, sugiere angustia depresiva: el objeto bueno sentido como perdido o dañado, y la duda sobre la propia parte en esa pérdida.\n\nLa falta de la puerta quizá proteja al objeto de los ataques de quien dibuja, y al mismo tiempo impida la reparación: no se entra a arreglarlo.", pergunta: "Cuando todos se fueron, ¿qué quedó dentro de la casa?", limites: "Tiende a leer el vacío como contenido de fantasía y puede pasar por alto lo que de hecho faltó en el ambiente." },
   winnicott: { observacao: "El dibujo fue hecho al final de la sesión, por iniciativa de ella, y entregado.", leitura: "Antes que el contenido cuenta el gesto. Dibujar en presencia de alguien es jugar, y eso supone alguna confianza en el ambiente.\n\nLa casa de la abuela puede ser el recuerdo de un lugar que sostenía; vacía, quizá hable de un holding que existió y se interrumpió. La puerta que no pudo hacerse sería menos una defensa que algo todavía no vivido: entrar y salir sin que la casa desaparezca.", pergunta: "¿Cómo era estar en esa casa cuando había gente?", limites: "Al privilegiar lo que el ambiente dio o dejó de dar, puede suavizar el conflicto y el deseo en juego." },
   lacan: { observacao: "Hay una frase dicha junto al dibujo, y en ella un tropiezo: \"la puerta no pude hacerla\".", leitura: "El dibujo interesa menos como imagen a descifrar que por lo que se dice a propósito de él. \"No pude\" deja el sentido en suspenso: ¿no pude dibujarla, o no pude abrir una salida?\n\n\"Todos ya se fueron\" sitúa a quien habla como la que se queda, ante un Otro que se ausentó. La puerta que falta puede tomarse como el punto donde algo no se inscribe, y conviene no llenarlo de sentido.", pergunta: "¿No pudo hacerla?", limites: "Al atenerse a la palabra, deja de lado la experiencia sensible de dibujar y lo que comunica sin palabras." },
   bion: { observacao: "Una gran área en blanco y pocos elementos, que no se conectan: el camino no llega, el sol está cortado.", leitura: "Puede pensarse el dibujo como un intento de dar forma a una experiencia emocional todavía sin nombre. El blanco quizá no sea falta de contenido, sino algo que aún no pudo ser pensado; la casa sin puerta, un continente al que no se entra.\n\nQue ella haya dibujado y hablado sugiere la función alfa en trabajo: algo en bruto empieza a volverse imagen y frase. Al analista le corresponde tolerar no saber qué es ese vacío, sin saturarlo de explicación.", pergunta: "Hay mucho espacio alrededor de esa casa.", limites: "Dice poco de la historia y del deseo singulares y corre el riesgo de la abstracción." }
  },
  rodadas: [
   { nucleo: "El dibujo muestra una casa pequeña, en el rincón, sin puerta y sin figuras, rodeada de mucho espacio vacío, y vino acompañado de palabras sobre la ausencia.\n\nLa puerta que no pudo hacerse expresa el deseo de volver a esa casa y la defensa contra eso. Ninguna lectura se sostiene sin las asociaciones de quien dibujó.", pontos: ["La casa es pequeña, está en el rincón y no tiene puerta ni personas.", "La puerta ausente expresa deseo de retorno y defensa.", "Las palabras que acompañan el dibujo importan tanto como la imagen.", "Ningún elemento debe interpretarse de forma aislada."],
     votos: [ { id: "freud", posicao: "concordo" }, { id: "klein", posicao: "ressalva", objecao: "La defensa protege también al objeto, y no solo a quien dibuja.", reformulacao: "Decir que la falta de la puerta protege y al mismo tiempo impide el acceso." }, { id: "winnicott", posicao: "ressalva", objecao: "La puerta puede ser algo todavía no vivido, y no una defensa.", reformulacao: "No fijar la puerta como defensa." }, { id: "lacan", posicao: "discordo", objecao: "El segundo punto le da un sentido a la falta. No suscribo que la puerta \"exprese\" algo: es lo que no se inscribe.", reformulacao: "La puerta ausente es el punto donde el dibujo y la palabra tropiezan; su sentido queda abierto." }, { id: "bion", posicao: "ressalva", objecao: "Nombrar deseo y defensa tan pronto satura lo que todavía no se sabe.", reformulacao: "Dejar abierto el sentido de la puerta." } ] },
   { nucleo: "El dibujo muestra una casa pequeña, en el rincón, sin puerta y sin figuras, rodeada de mucho espacio vacío, y vino acompañado de palabras sobre la ausencia.\n\nLa puerta que no pudo hacerse es el punto donde el dibujo y la palabra tropiezan. Es ahí donde la escucha debe detenerse, sin decidir de antemano qué significa. Ninguna lectura se sostiene sin las asociaciones de quien dibujó.", pontos: ["La casa es pequeña, está en el rincón y no tiene puerta ni personas.", "La puerta ausente es el punto donde dibujo y palabra tropiezan; su sentido queda abierto.", "Las palabras que acompañan el dibujo importan tanto como la imagen.", "Ningún elemento debe interpretarse de forma aislada."],
     votos: [ { id: "freud", posicao: "concordo" }, { id: "klein", posicao: "concordo" }, { id: "winnicott", posicao: "concordo" }, { id: "lacan", posicao: "concordo" }, { id: "bion", posicao: "ressalva", objecao: "Detenerse no debe volverse insistencia en preguntar; a veces es esperar.", reformulacao: "Agregar que detenerse incluye tolerar el silencio." } ] }

  divergencia: "Qué es la puerta ausente: una defensa, para Freud y Klein; algo todavía no vivido, para Winnicott; una falta que no se llena, para Lacan; lo que aún no pudo ser pensado, para Bion.",
  abertas: ["¿Qué se le ocurre sobre la puerta?", "¿Cómo era esa casa cuando había gente?"],
